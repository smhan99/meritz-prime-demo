  function twapSchedule() {
    const duration=state.twapDuration;
    const totalMinutes=duration.days*1440+duration.hours*60+duration.minutes;
    const autoSliceMinutes=totalMinutes<=30?5:totalMinutes<=120?10:totalMinutes<=480?15:totalMinutes<=1440?30:60;
    const requested=state.twapSliceMinutes==null?autoSliceMinutes:state.twapSliceMinutes;
    const sliceMinutes=Math.max(1,Math.min(totalMinutes||1,requested));
    if(state.twapSliceMinutes!=null)state.twapSliceMinutes=sliceMinutes;
    return {totalMinutes,sliceMinutes,childCount:Math.max(2,Math.ceil(totalMinutes/sliceMinutes))};
  }

  /* 인덱스마다 고정된 대칭 오프셋을 써 재렌더에도 같은 수량을 유지한다.
     마지막 주문은 앞 주문의 편차를 상쇄해 전체 합을 총 수량에 맞춘다. */
  function twapChildSizes(pair) {
    const {childCount}=twapSchedule();
    const total=quantityBase(pair);
    const basic=total/childCount;
    if(!state.twapRandomize)return Array(childCount).fill(basic);
    const offsets=[-.2,.2,-.12,.12,-.04,.04,-.16,.16,-.08,.08,0];
    const sizes=[];
    for(let index=0;index<childCount-1;index+=1)sizes.push(basic*(1+offsets[index%offsets.length]));
    sizes.push(total-sizes.reduce((sum,value)=>sum+value,0));
    return sizes;
  }

  function twapPreviewText(pair) {
    const {childCount}=twapSchedule();
    const basic=quantityBase(pair)/childCount;
    const basicText=MP.fixedNumber(basic,Math.max(4,pair.sizeDigits));
    if(!state.twapRandomize)return `자식 주문 ${childCount}회, 기본 ${basicText} ${pair.base}`;
    const sizes=twapChildSizes(pair);
    const minimum=MP.fixedNumber(Math.min(...sizes),Math.max(3,pair.sizeDigits));
    const maximum=MP.fixedNumber(Math.max(...sizes),Math.max(3,pair.sizeDigits));
    return `자식 주문 ${childCount}회, 기본 ${basicText} ${pair.base}, 무작위 ${minimum} to ${maximum} ${pair.base}`;
  }

  function syncTwapPreview() {
    const pair=MP.currentPair();
    const schedule=twapSchedule();
    document.querySelectorAll("[data-twap-slice]").forEach(node=>{node.value=String(schedule.sliceMinutes);});
    document.querySelectorAll("[data-twap-child-count]").forEach(node=>{node.textContent=`${schedule.childCount}회`;});
    document.querySelectorAll("[data-twap-preview]").forEach(node=>{node.textContent=twapPreviewText(pair);});
  }

  function twapBody(pair) {
    const duration=state.twapDuration;
    const schedule=twapSchedule();
    const advanced=state.twapAdvanced?`<div class="field-grid twap-advanced"><div class="field"><label>Trigger Price</label><div class="input-suffix"><input class="num" inputmode="decimal" value="${state.twapTriggerPrice??""}" placeholder="비워 두면 즉시 시작" data-twap-price="triggerPrice"><span>${pair.quote}</span></div></div><div class="field"><label>Max Price</label><div class="input-suffix"><input class="num" inputmode="decimal" value="${state.twapMaxPrice??""}" placeholder="${state.tradeSide==="buy"?"매수 상한가":"매도 하한가"}" data-twap-price="maxPrice"><span>${pair.quote}</span></div></div></div>`:"";
    return `${orderAccountField()}${sideButtons()}${commonBalances(pair)}${amountField(pair,"총 수량")}<div class="field"><label>실행 시간 <small>5분 to 7일</small></label><div class="twap-duration"><label>일<input class="num" type="number" min="0" max="7" value="${duration.days}" data-twap-duration="days"></label><label>시간<input class="num" type="number" min="0" max="23" value="${duration.hours}" data-twap-duration="hours"></label><label>분<input class="num" type="number" min="0" max="59" value="${duration.minutes}" data-twap-duration="minutes"></label></div></div><div class="field"><label>슬라이스 간격 <small class="num" data-twap-child-count>${schedule.childCount}회</small></label><div class="input-suffix"><input class="num" type="number" min="1" step="1" value="${schedule.sliceMinutes}" data-twap-slice><span>분</span></div></div><div class="twap-options"><label><input type="checkbox" data-twap-randomize${state.twapRandomize?" checked":""}>무작위화</label><label><input type="checkbox" data-twap-advanced${state.twapAdvanced?" checked":""}>고급 설정</label></div>${advanced}<div class="twap-preview" data-twap-preview>${twapPreviewText(pair)}</div>${submitButton(pair,"submit-trade-order")}${orderSummary(pair)}`;
  }

  function requestedTradeVendors() {
    /* D-0915: 데스크도 자기 RFQ 화이트리스트를 읽는다. Risk 에서 추가한 벤더가 곧바로 목록에 뜬다. */
    const deskWhitelist=(MP.deskCompany()?.rfqVendors||[]).map(row=>row.id);
    const allowed=clientScope()?MP.clientScopeVendorIds():(deskWhitelist.length?deskWhitelist:state.vendorQuotes.filter(item=>!item.excluded).map(item=>item.id));
    return state.vendorQuotes.filter(item=>allowed.includes(item.id));
  }

  /* 코인과 ETF 가 같이 쓰는 요청 카드. 벤더 한 줄씩 수락 또는 거절로 정착하고, BEST 는 최우선 수락이다. */
  function rfqRequestCard(request,options={}) {
    const {pair=null,priceText=null,acceptAction="accept-trade-rfq",cancelAction="cancel-trade-rfq",extraAttrs=""}=options;
    const format=priceText||(value=>MP.formatPairPrice(pair,value));
    const buySide=String(request.side).toLowerCase()==="buy";
    const settled=request.responses.filter(item=>item.status!=="대기");
    const accepted=request.responses.filter(item=>item.status==="수락");
    const best=accepted.slice().sort((a,b)=>buySide?a.price-b.price:b.price-a.price)[0]||null;
    if(best&&!accepted.some(item=>item.vendorId===state.rfqSelectedVendor))state.rfqSelectedVendor=best.vendorId;
    const rows=request.responses.map(item=>{const vendor=state.vendorQuotes.find(row=>row.id===item.vendorId);const selected=state.rfqSelectedVendor===item.vendorId;return `<button type="button" class="rfq-response-row${selected?" selected":""}${best&&best.vendorId===item.vendorId?" best":""}" data-action="select-rfq-vendor" data-vendor="${item.vendorId}"${item.status!=="수락"?" disabled":""}><span>${vendor?MP.vendorDisplayName(vendor):item.vendorId}${best&&best.vendorId===item.vendorId?chip("BEST","positive"):""}</span><b>${item.status}</b><span class="num">${item.price?format(item.price):"-"}</span><time>${item.at||"-"}</time></button>`;}).join("");
    const acceptDisabled=!best||!quoteAcceptEditable();
    const countdown=options.countdown||`<time class="num" data-trade-rfq-countdown>${Math.max(0,Math.ceil((request.expiresAt-Date.now())/1000))}s</time>`;
    return `<div class="rfq-request-card"><header><strong>RFQ 요청, ${request.responses.length}개 벤더, TTL ${request.ttlLabel}</strong>${countdown}</header><div class="rfq-response-head"><span>벤더</span><span>상태</span><span>제시가</span><span>수신 시각</span></div>${rows}<div class="rfq-card-actions"><button class="button ghost" type="button" data-action="${cancelAction}"${extraAttrs}>취소</button><button class="button primary" type="button" data-action="${acceptAction}" data-vendor="${state.rfqSelectedVendor||""}"${extraAttrs}${acceptDisabled?` disabled title="${QUOTE_ACCEPT_REASON}"`:""}>수락</button></div><small>${settled.length}/${request.responses.length} 응답</small></div>`;
  }

  function rfqBody(pair) {
    if(state.rfqFillSummary)return `<div class="accepted-quote filled"><strong>RFQ 체결 완료</strong><span class="num">${MP.formatPairPrice(pair,state.rfqFillSummary.price)}</span><small>${state.rfqFillSummary.vendor}, ${state.rfqFillSummary.quantity} ${pair.base}</small>${btn("새 요청","reset-rfq-ticket","ghost","",'data-target="coin"')}</div>`;
    if(state.tradeRfq)return rfqRequestCard(state.tradeRfq,{pair});
    const vendors=requestedTradeVendors();
    const selected=new Set(state.apOrderDraft.vendorIds);
    return `${orderAccountField()}${sideButtons()}${amountField(pair,"수량",{slider:false})}<div class="field"><label>벤더</label>${vendorPickList(vendors,[...selected],"trade-rfq-vendor")}</div><div class="field-grid rfq-basis-row"><div class="field"><label>기준</label><select data-rfq-basis><option>BRRNY</option><option${state.rfqBasis==="현재가"?" selected":""}>현재가</option></select></div><div class="field"><label>TTL</label><select data-rfq-ttl><option value="30">30s</option><option value="60"${state.rfqTtl===60?" selected":""}>1m</option></select></div></div>${submitButton(pair,"request-trade-rfq","요청")}`;
  }

  function renderOrderCard() {
    const pair=MP.currentPair();
    const mode=state.orderCardMode;
    const content=mode==="etf"&&!clientScope()?etfTicketSection():mode==="rfq"?rfqBody(pair):mode==="twap"?twapBody(pair):marketLimitBody(pair);
    const readonly=state.role==="client-accounting"?'<p class="order-readonly-note">관리회계는 열람 전용, 주문 접수 불가</p>':"";
    return panel(MP.pairLabel(pair),`<div class="order-card hyper-order-card">${orderCardTabs()}<div class="order-card-content">${content}</div>${readonly}</div>`,{flush:true,className:"trade-order-panel"});
  }

  Object.assign(MP,{renderOrderCard,renderClientOrderCard,renderPdfPanel,renderEtfTicket:etfTicketSection,
    orderAccountId,orderAccountOptions,syncOrderAccountRows,
    orderAvailableBalance,orderTradeCap,orderSizeFromPercent,orderPercentFromSize,syncOrderSlider,syncOrderSizeInput,twapSchedule,twapChildSizes,syncTwapPreview,syncVendorPick,updateApOrderQuantity,canCreateRfq,scheduleRfqAcceptances,fixingSummaryText,vendorSummaryText,bestAcceptedEntry,clientQuotePriceUsd:clientPriceUsd,
    clientBlockTarget:clientTarget,clientBlockTicketBody,clientBlockQuoteBody,clientBlockPriceBasisLabel:priceBasisLabel});
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/portfolio.js">
(function (MP) {
  "use strict";

  const {state,panel,chip,formatMoneyFromKrw,formatMoneyFromUsd,formatTradePrice,getLpPnlSummary,dualValue} = MP;

  const NO_MARK = "기준가 없음";

  function marketLabel(symbol) {
    const pair=state.pairs.find(item=>item.symbol===symbol);
    return pair?MP.pairLabel(pair):symbol;
  }

  function toneOf(value) {
    return value===null||value===undefined?"":value>=0?"positive-text":"negative-text";
  }

  function money(value,options) {
    return value===null||value===undefined?NO_MARK:formatMoneyFromKrw(value,options);
  }

  /* D-0915: 손익 분해 탭은 명세표로 단순화했다. 근거 문장과 각주, 원장 표를 걷어내고
     여섯 계열을 실현, 평가, 합계 열로만 보여준다. */
  function statementCell(value) {
    if(value===null||value===undefined)return `<td class="align-right num muted-text">${NO_MARK}</td>`;
    return `<td class="align-right num ${toneOf(value)}">${money(value,{showPlus:true})}</td>`;
  }

  function statementRows(model) {
    const realisedKeys=["fee","funding","transfer"];
    return model.attribution.map(line=>{
      const total=line.totalKrw;
      let realised=0;
      if(realisedKeys.includes(line.key))realised=total;
      else if((line.key==="etf"||line.key==="hedge")&&model.mark.ticketsRealised)realised=line.cells.reduce((sum,value,index)=>sum+(model.legs[index]&&model.legs[index].ticketRealised?(value||0):0),0);
      return {label:line.label,realised,valued:total===null?null:total-realised,total};
    });
  }

  function statementTable(model) {
    const rows=statementRows(model);
    if(!rows.length)return '<div class="empty-note">선택 ETF 북에 해당하는 행 없음</div>';
    const body=rows.map(row=>`<tr><td class="main-cell">${row.label}</td>${statementCell(row.realised)}${statementCell(row.valued)}${statementCell(row.total)}</tr>`).join("");
    const sum=key=>rows.some(row=>row[key]===null)?null:rows.reduce((total,row)=>total+row[key],0);
    return `<div class="table-scroll"><table class="data-table pnl-statement-table"><thead><tr><th>항목</th><th class="align-right">실현</th><th class="align-right">평가</th><th class="align-right">합계</th></tr></thead><tbody>${body}</tbody><tfoot><tr><td>합계</td>${statementCell(sum("realised"))}${statementCell(sum("valued"))}${statementCell(sum("total"))}</tr></tfoot></table></div>`;
  }

  function bookSummaryTable(model) {
    const cuFor=(bookId,side)=>model.ledger.filter(ticket=>ticket.bookId===bookId&&ticket.side===side).reduce((sum,ticket)=>sum+ticket.cu,0);
    const sharesFor=bookId=>model.legs.filter(leg=>leg.bookId===bookId).reduce((sum,leg)=>sum+leg.shares,0);
    const entries=model.periodBooks.map(book=>({id:book.id,create:cuFor(book.id,"설정"),redeem:cuFor(book.id,"환매"),shares:sharesFor(book.id),netKrw:book.netKrw}));
    const bookRow=entry=>`<tr><td class="main-cell">${entry.id}</td><td class="align-right num">${entry.create} CU</td><td class="align-right num">${entry.redeem} CU</td><td class="align-right num">${entry.shares.toLocaleString("ko-KR")}주</td>${statementCell(entry.netKrw)}</tr>`;
    const body=entries.map(entry=>bookRow(entry)).join("")||'<tr><td colspan="5"><div class="empty-note">선택 ETF 북에 해당하는 행 없음</div></td></tr>';
    const totals={id:"합계",create:entries.reduce((sum,entry)=>sum+entry.create,0),redeem:entries.reduce((sum,entry)=>sum+entry.redeem,0),shares:entries.reduce((sum,entry)=>sum+entry.shares,0),netKrw:model.periodTotals.netKrw};
    return `<div class="table-scroll"><table class="data-table pnl-book-table"><thead><tr><th>북</th><th class="align-right">설정</th><th class="align-right">환매</th><th class="align-right">재고</th><th class="align-right">손익</th></tr></thead><tbody>${body}</tbody><tfoot>${bookRow(totals)}</tfoot></table></div>`;
  }

  function apBookSection(model,visible) {
    return `<div class="pnl-book-section" data-strategy-section="ap" ${visible?"":"hidden"}>${panel("손익 명세",statementTable(model),{flush:true})}${panel("북 요약",bookSummaryTable(model),{flush:true})}</div>`;
  }

  /* D-0910-08: 화면에는 북 단위 요약만 둔다. 페어 단위 행은 state.pairingRows에 그대로 남아
     증빙 팩과 LP 체결 창이 소비한다. */
  function pairingSummaryRows(rows) {
    const groups=state.etfBooks
      .map(book=>({book,items:rows.filter(row=>row.bookId===book.id)}))
      .filter(entry=>entry.items.length);
    const unassigned=rows.filter(row=>!state.etfBooks.some(book=>book.id===row.bookId));
    if(unassigned.length)groups.push({book:{id:"미배정",name:"미배정"},items:unassigned});
    return groups.map(entry=>summariseGroup(entry.book.id,entry.book.name,entry.items));
  }

  function summariseGroup(id,name,items) {
    const shares=items.reduce((sum,row)=>sum+row.shares,0);
    const weighted=pick=>shares?items.reduce((sum,row)=>sum+pick(row)*row.shares,0)/shares:0;
    const marginBps=weighted(row=>row.margin);
    const dragBps=weighted(row=>row.drag);
    return {
      id,name,
      count:items.length,
      shares,
      notionalKrw:Math.round(shares*state.constants.ownInavKrw),
      marginBps,
      dragBps,
      netBps:marginBps-dragBps,
      captureKrw:items.reduce((sum,row)=>sum+row.capture,0)
    };
  }

  /* D-0915: 페어링 요약도 선택 기간을 따른다. 건수와 주수, 명목은 거래일 배수를,
     순캡처는 LP 기간 비율을 쓰므로 당일에는 실측값 그대로다. */
  function pairingSummaryTable(model) {
    const notionalScale=model.period.notionalScale;
    const captureScale=model.lpPeriod.ratio;
    const scale=row=>({...row,count:Math.round(row.count*notionalScale),shares:Math.round(row.shares*notionalScale),notionalKrw:Math.round(row.notionalKrw*notionalScale),captureKrw:Math.round(row.captureKrw*captureScale)});
    const cells=row=>`<td class="align-right num">${row.count}건</td><td class="align-right num">${row.shares.toLocaleString("ko-KR")}주</td><td class="align-right num">${formatMoneyFromKrw(row.notionalKrw)}</td><td class="align-right num positive-text">${row.marginBps.toFixed(0)}bp</td><td class="align-right num negative-text">-${row.dragBps.toFixed(0)}bp</td><td class="align-right num positive-text">${row.netBps.toFixed(0)}bp</td><td class="align-right num positive-text">${formatMoneyFromKrw(row.captureKrw)}</td>`;
    const rows=model.lpSummary.rows;
    const books=pairingSummaryRows(rows).map(scale);
    const body=books.map(row=>`<tr data-pairing-book="${row.id}"><td class="main-cell">${row.name}</td>${cells(row)}</tr>`).join("")
      ||'<tr><td colspan="8"><div class="empty-note">페어링 없음</div></td></tr>';
    const totals=scale(summariseGroup("total","합계",rows));
    return `<div class="table-scroll"><table class="data-table pnl-pairing-table"><thead><tr><th>ETF 북</th><th class="align-right">건수</th><th class="align-right">주수</th><th class="align-right">명목</th><th class="align-right">호가 마진</th><th class="align-right">헤지 드래그</th><th class="align-right">순마진 bp</th><th class="align-right">순캡처</th></tr></thead><tbody>${body}</tbody><tfoot><tr data-pairing-book="total"><td class="main-cell">합계</td>${cells(totals)}</tr></tfoot></table></div>`;
  }

  function lpBookSection(model,visible) {
    return `<div class="pnl-book-section" data-strategy-section="lp" ${visible?"":"hidden"}>${panel("페어링 요약",pairingSummaryTable(model),{flush:true})}</div>`;
  }

  function clientOrderPnlRow(order) {
    const progress=Math.max(0,Math.min(100,Number(order.progressPercent)||0))/100;
    const notional=Number(order.notionalKrw)||0;
    const executedNotional=Math.round(notional*progress);
    const feePaid=Math.round(executedNotional*(Number(order.feeBps)||0)/10000);
    const quantity=Number(order.quantityBtc)||notional/(state.constants.btcFixingUsd*state.constants.usdKrw);
    const sideSign=order.side==="매도"?-1:1;
    const totalMarkPnl=Math.round((state.tradePrice-state.constants.btcFixingUsd)*quantity*state.constants.usdKrw*sideSign);
    const realisedKrw=Math.round(totalMarkPnl*progress)-feePaid;
    const unrealisedKrw=totalMarkPnl-Math.round(totalMarkPnl*progress);
    let tca=null;
    if(typeof MP.evidenceKindForOrder==="function"&&MP.evidenceKindForOrder(order)==="algo"){
      const metrics=MP.executionMonitorMetrics(state.executionWindowState);
      tca={fixingUsd:metrics.fixingUsd,averagePriceUsd:metrics.averagePriceUsd,driftBps:state.executionWindowState==="print"?metrics.confirmedBps:metrics.weightedBps};
    }
    return {order,progress,executedNotional,feePaid,realisedKrw,unrealisedKrw,tca};
  }

  function clientPnlRows() {
    return MP.clientScopeOrders().map(clientOrderPnlRow);
  }

  function clientPnlStatement() {
    const company=MP.clientScopeCompany();
    const rows=clientPnlRows();
    const columns="ORDER_ID,MODE,EXECUTED_NOTIONAL_KRW,FEE_PAID_KRW,TCA_FIXING_USD,TCA_AVERAGE_USD,TCA_DRIFT_BPS,REALISED_KRW,UNREALISED_KRW";
    const body=rows.map(row=>[row.order.id,row.order.mode,row.executedNotional,row.feePaid,row.tca?.fixingUsd??"",row.tca?.averagePriceUsd??"",row.tca?.driftBps??"",row.realisedKrw,row.unrealisedKrw].join(",")).join("\r\n");
    return {name:`MP_${company?.id||"CLIENT"}_PNL_20260908.csv`,content:`\uFEFF${columns}\r\n${body}${body?"\r\n":""}`,rowCount:rows.length};
  }

  function clientPnlTable(rows) {
    const tableRows=rows.map(row=>{
      const tca=row.tca
        ?`${Number.isFinite(row.tca.fixingUsd)?formatTradePrice(row.tca.fixingUsd):"산출 전"}<small class="subcell">평균 ${Number.isFinite(row.tca.averagePriceUsd)?formatTradePrice(row.tca.averagePriceUsd):"산출 전"}, 이탈 ${Number.isFinite(row.tca.driftBps)?`${row.tca.driftBps>=0?"+":""}${row.tca.driftBps.toFixed(2)}bp`:"산출 전"}</small>`
        :'<span class="muted-text">해당 없음, RFQ 단일가</span>';
      return `<tr><td class="main-cell num">${row.order.id}<small class="subcell">${row.order.summary}</small></td><td>${chip(row.order.mode,row.order.mode==="알고"?"violet":"info")}</td><td class="align-right num">${formatMoneyFromKrw(row.executedNotional)}<small class="subcell">${(row.progress*100).toFixed(1)}% 체결</small></td><td class="align-right num negative-text">${formatMoneyFromKrw(row.feePaid)}</td><td class="align-right num">${tca}</td><td class="align-right num ${toneOf(row.realisedKrw)}">${money(row.realisedKrw,{showPlus:true})}</td><td class="align-right num ${toneOf(row.unrealisedKrw)}">${money(row.unrealisedKrw,{showPlus:true})}</td></tr>`;
    }).join("")||'<tr><td colspan="7"><div class="empty-note">자사 주문 없음</div></td></tr>';
    const totals=rows.reduce((sum,row)=>({executed:sum.executed+row.executedNotional,fee:sum.fee+row.feePaid,realised:sum.realised+row.realisedKrw,unrealised:sum.unrealised+row.unrealisedKrw}),{executed:0,fee:0,realised:0,unrealised:0});
    return `<div class="table-scroll"><table class="data-table client-pnl-table"><thead><tr><th>주문</th><th>모드</th><th class="align-right">체결 명목</th><th class="align-right">지급 수수료</th><th class="align-right">주문별 TCA</th><th class="align-right">실현손익</th><th class="align-right">평가손익</th></tr></thead><tbody>${tableRows}</tbody><tfoot><tr><td colspan="2">당일 합계 ${rows.length}건</td><td class="align-right num">${formatMoneyFromKrw(totals.executed)}</td><td class="align-right num negative-text">${formatMoneyFromKrw(totals.fee)}</td><td class="align-right">주문별 결과</td><td class="align-right num ${toneOf(totals.realised)}">${money(totals.realised,{showPlus:true})}</td><td class="align-right num ${toneOf(totals.unrealised)}">${money(totals.unrealised,{showPlus:true})}</td></tr></tfoot></table></div>`;
  }

  function ksdDelta(move) {
    const sign=move.delta>0?"+":"-";
    const absolute=Math.abs(move.delta);
    return move.unit==="주"?`${sign}${absolute.toLocaleString("ko-KR")}주`:`${sign}${absolute.toFixed(4)}`;
  }

  function renderKsdDrillIn(selected) {
    if(!["ETF 설정","ETF 환매"].includes(selected?.type))return "";
    const instruction=state.ksdInstructions.find(item=>item.id===selected.id);
    if(!instruction)return "";
    const pdf=state.pdfUploads[instruction.etfId];
    const underlyingValueKrw=instruction.underlyingQty*state.constants.btcFixingUsd*state.constants.usdKrw;
    const cashKrw=instruction.cu*pdf.cashPerCuKrw;
    const totalKrw=underlyingValueKrw+cashKrw;
    const isRedemption=instruction.kind==="환매";
    const sourceOrder=state.primeOrders.find(item=>item.id===instruction.linkedPrimeOrderId);
    const btcNet=instruction.moves.filter(move=>move.unit==="BTC").reduce((sum,move)=>sum+move.delta,0);
    const unpaid=Math.max(0,-btcNet);
    const evidenceButton=MP.btn("KSD 지시 증빙","download-evidence","small","download",MP.canControl("exec","securities")?"":'disabled title="KSD 지시 증빙은 증권 데스크 소관"');
    const ownershipNote=instruction.owner==="프라임"?'<div class="note box ksd-note">본 지시는 고객 주문의 충족 레그이며 소유는 프라임. Quantizer 조건은 프라임 주문에서 결정됨.</div>':"";
    const recordBody=`<div class="kv-grid ksd-kv"><div class="kv"><label>지시번호</label><strong class="num">${instruction.id}</strong></div><div class="kv"><label>청구 구분</label><strong>${instruction.kind} (in-kind)</strong></div><div class="kv"><label>${instruction.kind} 단위</label><strong class="num">${instruction.cu} CU, ${instruction.shares.toLocaleString("ko-KR")}주</strong></div><div class="kv"><label>기초자산 ${isRedemption?"수취":"인도"}</label><strong class="num">BTC ${instruction.underlyingQty.toFixed(4)}</strong></div><div class="kv"><label>현금 정산분</label><strong class="num">${formatMoneyFromKrw(cashKrw)}</strong></div><div class="kv"><label>청구 총액</label><strong class="num">${formatMoneyFromKrw(totalKrw)}</strong></div><div class="kv"><label>접수 시각</label><strong class="num">2026-09-08 ${instruction.receivedAt}</strong></div><div class="kv"><label>결제 예정</label><strong class="num">${instruction.settlementDate} (T+1)</strong></div></div>${ownershipNote}`;
    const chainLabel=instruction.owner==="프라임"?`고객 체인 ${instruction.linkedOrderId}`:sourceOrder?`코인 레그 ${sourceOrder.id}`:"연계 프라임 주문 없음";
    const settlementFlow=`<div class="table-scroll"><div class="state-flow ksd-state-flow"><div class="state-step complete">지시 생성<span class="subcell">${instruction.receivedAt}</span></div><div class="state-step complete">KSD 접수<span class="subcell">${instruction.receivedAt}</span></div><div class="state-step complete">청구 총액 확정<span class="subcell">${instruction.claimConfirmedAt}</span></div><div class="state-step current">결제 예정<span class="subcell">${instruction.settlementDate} (T+1)</span></div></div></div>`;
    const moveRows=instruction.moves.map(move=>`<tr><td class="main-cell num">${move.accountId}</td><td>${move.asset}</td><td>${move.reason}</td><td class="align-right num ${move.delta>0?"up":"down"}">${ksdDelta(move)}</td></tr>`).join("");
    let ledgerNote;
    if(isRedemption)ledgerNote=`환매 인도한 ${instruction.shares.toLocaleString("ko-KR")}주는 자기 재고에서 차감되고 기초자산 ${instruction.underlyingQty.toFixed(0)} BTC를 수취함.`;
    else if(instruction.owner==="프라임")ledgerNote=`인도한 ${instruction.underlyingQty.toFixed(0)} BTC는 프라임 주문 ${sourceOrder.id} 체결분으로 상환되며 현재 미상환 ${unpaid.toFixed(4)} BTC. ETF는 고객에게 인도됨.`;
    else ledgerNote=`ETF 좌수는 자기 재고로 보유하며 인도한 BTC 중 현재 미상환 ${unpaid.toFixed(4)} BTC. 소싱 완료 시 데스크 BTC 순변동은 0.`;
    const recordPanel=panel(`KSD ${instruction.kind} 지시`,recordBody,{actions:`${chip("접수 완료","positive")}${evidenceButton}`,flush:true});
    const flowPanel=panel("접수에서 결제까지",settlementFlow,{actions:chip(chainLabel,instruction.owner==="프라임"?"violet":"muted"),flush:true});
    const ledgerBody=`<div class="table-scroll"><table class="data-table ksd-ledger"><thead><tr><th>지갑 또는 계좌</th><th>자산</th><th>사유</th><th class="align-right">변동</th></tr></thead><tbody>${moveRows}</tbody></table></div><div class="note box ksd-note">${ledgerNote}</div>`;
    return `<div class="grid ksd-drill-grid"><div class="stack">${recordPanel}${flowPanel}</div>${panel("재고와 인도",ledgerBody,{actions:chip("잔고 정본은 커스터디/정산","muted"),flush:true})}</div>`;
  }

  const portfolioTabs=[["balances","잔고"],["positions","포지션"],["open","미체결 주문"],["fills","체결 내역"],["orders","주문 내역"],["breakdown","손익 분해"]];

  function ensurePortfolioDefaults() {
    const roleType=MP.clientScopeActive()?"client":"desk";
    if(!state.portfolioTab||state.portfolioTabRole!==roleType){state.portfolioTab=roleType==="client"?"orders":"positions";state.portfolioTabRole=roleType;}
    if(!portfolioTabs.some(([id])=>id===state.portfolioTab))state.portfolioTab="positions";
  }

  /* D-0915: 잔고 탭의 계정 범위는 행위 주체(데스크 또는 고객사)가 가진 Prime 서브계정 전체다.
     ETF 북 필터가 아니라 탭 표시줄의 계정 필터가 이 목록을 좁힌다. */
  function scopeAccounts() {
    if(MP.clientScopeActive())return MP.clientVisibleAccountIds().map(id=>state.primeAccounts.find(account=>account.id===id)).filter(Boolean);
    const holder=scopeHolderId();
    return state.primeAccounts.filter(account=>account.clientId===holder);
  }

  /* 기준가는 계정 화면이 쓰는 목록과 같은 곳에서 온다. BTC 와 ETH 는 실시간 마크,
     나머지는 등록 기준가이며 목록에 없는 자산만 1 USD 로 둔다. */
  function assetMarkUsd(asset) {
    if(asset==="BTC")return state.tradePrice;
    if(asset==="ETH")return state.ethPrice;
    if(asset==="KRW")return 1/state.constants.usdKrw;
    const meta=(state.custodyBalances||[]).find(item=>item.ticker===asset);
    return meta?Number(meta.priceUsd)||1:1;
  }

  function balanceRow(asset,total,accountId,accountText,pooled,custodian="-") {
    return {asset,total,available:total,usd:total*assetMarkUsd(asset),
      pnl:asset==="BTC"?(state.tradePrice-state.constants.btcFixingUsd)*total:0,
      accountId,account:accountText,pooled,custodian};
  }

  /* D-0921: 수탁 행도 서브계정에 귀속된다. 계정 열은 거래 잔고든 수탁이든 그 서브계정
     라벨이고, 어느 수탁사에 있는지는 커스터디 열이 말한다. 그래서 계정 필터가 수탁 행에도
     걸리고 합계가 계정 화면과 선택마다 같아진다. */
  function balanceRows() {
    const trading=scopeAccounts().flatMap(account=>(account.liveBalances||[]).map(row=>
      balanceRow(row.asset,Number(row.quantity)||0,account.id,MP.accountLabel(account.id),false)));
    const accountIds=scopeAccounts().map(account=>account.id);
    const pooled=new Map();
    MP.custodyHoldingsForAccounts(scopeHolderId(),accountIds).forEach(row=>{
      const quantity=Number(row.quantity)||0;
      if(quantity<=0)return;
      const key=`${row.accountId}|${row.custodian}|${row.asset}`;
      const entry=pooled.get(key);
      if(entry)entry.quantity+=quantity;
      else pooled.set(key,{accountId:row.accountId,custodian:row.custodian,asset:row.asset,quantity});
    });
    const custody=[...pooled.values()].map(row=>
      balanceRow(row.asset,row.quantity,row.accountId,MP.accountLabel(row.accountId),true,row.custodian));
    return [...trading,...custody];
  }

  /* D-0915: 모든 탭 행은 accountId를 들고 다닌다. 주문 시드는 계정 id를 primeAccountId, noteRef,
     noteReason 중 하나에 담거나 ETF 북 id만 갖고 있으므로 이 순서로 해석한다. */
  function rowAccountId(row) {
    if(!row)return null;
    const direct=[row.primeAccountId,row.accountId,row.noteRef,row.noteReason].find(value=>typeof value==="string"&&value.includes("/"));
    if(direct)return direct;
    const bookId=[row.noteRef,row.bookId].find(value=>typeof value==="string"&&state.etfBooks.some(item=>item.id===value));
    return bookId?MP.primeAccountIdForBook(bookId):null;
  }

  function withAccount(row) {
    const accountId=rowAccountId(row);
    return {...row,accountId,account:accountId?MP.accountLabel(accountId):"-"};
  }

  function scopeHolderId() {
    if(MP.clientScopeActive())return MP.clientScopeCompany()?.id||null;
    return MP.internalClient()?.id||"AP-DESK-INT";
  }

  function accountFilterOptions() {
    const holder=scopeHolderId();
    const visible=MP.clientScopeActive()?new Set(MP.clientVisibleAccountIds()):null;
    return state.primeAccounts
      .filter(account=>account.clientId===holder&&(!visible||visible.has(account.id)))
      .map(account=>[account.id,MP.accountLabel(account.id)]);
  }

  function defaultAccountId() {
    return accountFilterOptions()[0]?.[0]||null;
  }

  function deskOrderRows() {return state.orderRecords.map(withAccount);}
  function clientOrderRows() {
    return MP.clientScopeOrders().map(order=>({id:order.id,time:order.time||order.statusTime||"09:52:30",type:order.kind?.includes("ETF")?"ETF 설정":order.mode==="RFQ"?"RFQ":"TWAP",symbol:order.summaryNote?.split(",")[0]||"BTC/USD",side:order.side==="매도"?"SELL":"BUY",sideLabel:order.side||"매수",quantity:order.quantityBtc||order.btc||0,price:order.lockedPricing?.clientPriceUsd||null,status:order.stage||order.status||"집행 중",progressPercent:order.progressPercent||0,notionalKrw:order.notionalKrw||0,owner:"고객사",primeAccountId:order.primeAccountId})).map(withAccount);
  }
  function orderRows() {return MP.clientScopeActive()?clientOrderRows():deskOrderRows();}

  function normalType(value) {
    const text=String(value||"").toUpperCase();
    if(text.includes("TWAP"))return "TWAP";
    if(text.includes("RFQ"))return "RFQ";
    if(text.includes("MARKET"))return "Market";
    if(text.includes("LIMIT"))return "Limit";
    return value||"Limit";
  }

  function filterRows(rows) {
    const f=state.portfolioFilters;
    return rows.filter(row=>(f.side==="all"||row.side===f.side)
      &&(f.market==="all"||row.market===f.market)
      &&(f.type==="all"||row.type===f.type)
      /* D-0921: 계정 필터는 거래 잔고 행과 수탁 행에 똑같이 걸린다. 수탁도 서브계정 귀속이다. */
      &&(f.account==="all"||row.accountId===f.account));
  }

  function table(headers,rows,empty,colspan=headers.length) {
    return `<div class="table-scroll"><table class="data-table"><thead><tr>${headers.map(header=>`<th>${header}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${colspan}"><div class="empty-note">${empty}</div></td></tr>`}</tbody></table></div>`;
  }

  /* D-0915: 잔고 탭은 모든 열 머리글이 정렬 토글이다. 첫 클릭은 내림차순, 다시 누르면 오름차순이고
     활성 열에만 화살표 글리프가 붙는다. */
  function sortedRows(rows,columns) {
    const sort=state.portfolioSort;
    const column=columns.find(item=>item.key===sort.key);
    if(!column)return rows;
    const direction=sort.direction==="asc"?1:-1;
    return [...rows].sort((a,b)=>{
      const left=a[column.key],right=b[column.key];
      if(column.text)return String(left??"").localeCompare(String(right??""),"ko-KR")*direction;
      return ((Number(left)||0)-(Number(right)||0))*direction;
    });
  }

  function sortableHead(columns) {
    const sort=state.portfolioSort;
    return `<thead><tr>${columns.map(column=>{
      const active=sort.key===column.key;
      const glyph=active?`<span class="sort-glyph">${sort.direction==="asc"?"▲":"▼"}</span>`:"";
      return `<th class="${active?"sorted":""}"><button type="button" class="table-sort" data-action="portfolio-sort" data-key="${column.key}" aria-label="${column.label} 정렬">${column.label}${glyph}</button></th>`;
    }).join("")}</tr></thead>`;
  }

  const balanceColumns=[
    {key:"asset",label:"자산",text:true},
    {key:"total",label:"총 잔고"},
    {key:"available",label:"가용 잔고"},
    {key:"usd",label:"가치"},
    {key:"pnl",label:"손익"},
    {key:"account",label:"계정",text:true},
    {key:"custodian",label:"커스터디",text:true}
  ];

  /* D-0921: 잔고 탭 합계는 계정 화면 헤드라인과 같은 값이라야 한다. 표에 찍힌 행만 더하며
     거래 잔고 합(서브계정 행)과 수탁 잔고 합(수탁 행)을 따로 내고 둘을 더한 값이 총 잔고다.
     계정 필터가 걸리면 그 서브계정에 귀속된 행만 남으므로 합계는 그 계정의
     계정 화면 총 잔고와 같아진다. */
  function balanceTotals(rows) {
    const trading=rows.filter(row=>!row.pooled).reduce((sum,row)=>sum+row.usd,0);
    const custody=rows.filter(row=>row.pooled).reduce((sum,row)=>sum+row.usd,0);
    return {trading,custody,total:trading+custody,pnlUsd:rows.reduce((sum,row)=>sum+row.pnl,0)};
  }

  function balanceTotalRow(rows) {
    const totals=balanceTotals(rows);
    const single=state.portfolioFilters.account!=="all";
    const breakdown=`거래 잔고 ${formatMoneyFromUsd(totals.trading)} + 수탁 잔고 ${formatMoneyFromUsd(totals.custody)}`;
    const note=single?`${MP.accountLabel(state.portfolioFilters.account)} 계정 화면 총 잔고`:"계정 화면 총 잔고";
    return `<tfoot><tr class="balance-total-row" data-balance-trading="${totals.trading}" data-balance-custody="${totals.custody}" data-balance-total="${totals.total}"><td class="main-cell">합계</td><td class="num align-right" colspan="2">${breakdown}</td><td class="num align-right">${formatMoneyFromUsd(totals.total)}</td><td class="num align-right ${toneOf(totals.pnlUsd)}">${formatMoneyFromKrw(totals.pnlUsd*state.constants.usdKrw,{showPlus:true})}</td><td class="balance-account-cell">${note}</td><td></td></tr></tfoot>`;
  }

  function balancesBody() {
    const filtered=filterRows(balanceRows()).filter(row=>!state.portfolioFilters.hideSmall||Math.abs(row.usd)>=100);
    const rows=sortedRows(filtered,balanceColumns);
    const body=rows.map(row=>`<tr${row.pooled?' class="balance-pooled-row"':""}><td class="main-cell">${row.asset}</td><td class="num align-right">${row.total.toLocaleString("en-US",{maximumFractionDigits:4})}</td><td class="num align-right">${row.available.toLocaleString("en-US",{maximumFractionDigits:4})}</td><td class="num align-right">${formatMoneyFromUsd(row.usd)}</td><td class="num align-right ${toneOf(row.pnl)}">${formatMoneyFromKrw(row.pnl*state.constants.usdKrw,{showPlus:true})}</td><td class="balance-account-cell">${row.account}</td><td class="balance-account-cell">${row.custodian}</td></tr>`).join("")
      ||`<tr><td colspan="${balanceColumns.length}"><div class="empty-note">잔고 없음</div></td></tr>`;
    return `<div class="table-scroll"><table class="data-table">${sortableHead(balanceColumns)}<tbody>${body}</tbody>${rows.length?balanceTotalRow(rows):""}</table></div>`;
  }

  /* D-0915: 포지션 탭은 Prime 서브계정 포지션만 보여준다. 계정별 페어 포지션
     (state.tradePositions[accountId][pair])과 ETF 북의 헤지 레그를 계정 단위로 묶은 행만 남기고
     ETF 재고 행과 소싱 행은 손익 분해의 AP 북 뷰에 둔다. */
  /* D-0921: 헤지 레그는 AP 북 모델이 준 수량과 마크를 그대로 쓰고 계정 단위로만 묶는다.
     다른 보유 주체의 북(ETF_C는 고객사 북)은 데스크 포지션이 아니므로 스코프 밖으로 뺀다. */
  function hedgeAccountRows(model) {
    const holder=scopeHolderId();
    const groups=new Map();
    model.legs.forEach(leg=>{
      const quantity=leg.hedge.quantity;
      if(!quantity)return;
      const etfBook=state.etfBooks.find(item=>item.id===leg.bookId);
      if(!etfBook||etfBook.clientId!==holder)return;
      const accountId=MP.primeAccountIdForBook(leg.bookId);
      const key=`${accountId}|${leg.hedge.asset}|${quantity>=0?"long":"short"}`;
      const entry=groups.get(key)||{accountId,books:[],asset:leg.hedge.asset,quantity:0,costUsd:0,markUsd:leg.hedge.markUsd,pnlKrw:0};
      if(!entry.books.includes(leg.bookId))entry.books.push(leg.bookId);
      entry.quantity+=quantity;
      entry.costUsd+=quantity*leg.hedge.avgUsd;
      entry.pnlKrw+=leg.hedge.pnlKrw??0;
      groups.set(key,entry);
    });
    return [...groups.values()].map(entry=>{
      const marked=Number.isFinite(entry.markUsd);
      const quantity=Math.round(entry.quantity*10000)/10000;
      return {
        market:`${entry.asset} 현물`,
        kind:"hedge",
        note:`${entry.books.join(", ")} 헤지 레그, AP 북 모델`,
        side:quantity>=0?"BUY":"SELL",
        short:quantity<0,
        quantity,
        valueKrw:marked?entry.quantity*entry.markUsd*state.constants.usdKrw:null,
        entry:entry.quantity?entry.costUsd/entry.quantity:0,
        mark:marked?entry.markUsd:null,
        pnlKrw:model.mark.available?entry.pnlKrw:null,
        accountId:entry.accountId,
        account:MP.accountLabel(entry.accountId)
      };
    });
  }

  /* D-0921: 코인 포지션 행은 거래 잔고와 맞물린다. 롱은 그 서브계정이 실제로 가진 수량 안에서만
     서고, 숏은 잔고로 덮이지 않으므로 행에 숏 표시를 단다. 손익은 언제나 (마크 - 진입가) x 수량이라
     진입가와 마크, 손익이 한 행 안에서 닫힌다. */
  function positionRows(model) {
    if(MP.clientScopeActive())return balanceRows()
      .filter(row=>!row.pooled&&["BTC","ETH"].includes(row.asset))
      .map(row=>{
        const mark=assetMarkUsd(row.asset);
        const entry=row.asset==="BTC"?state.constants.btcFixingUsd:mark;
        return {market:`${row.asset}/USD`,kind:"balance",note:"거래 잔고",side:row.total>=0?"BUY":"SELL",short:row.total<0,
          quantity:row.total,valueKrw:row.total*mark*state.constants.usdKrw,entry,mark,
          pnlKrw:(mark-entry)*row.total*state.constants.usdKrw,accountId:row.accountId,account:row.account};
      });
    const holder=scopeHolderId();
    const live=MP.tradePositionRows()
      .filter(row=>MP.primeAccountById(row.accountId)?.clientId===holder)
      .map(row=>{
        const pair=MP.pairBySymbol(row.symbol);
        const mark=MP.pairMark(pair);
        const quoteKrw=pair.quote==="KRW"?1:state.constants.usdKrw;
        return {market:MP.pairLabel(pair),kind:"trade",note:"거래 계정 포지션",side:row.size>=0?"BUY":"SELL",short:row.size<0,
          quantity:row.size,valueKrw:row.size*mark*quoteKrw,entry:row.entry,mark,
          pnlKrw:(mark-row.entry)*row.size*quoteKrw,accountId:row.accountId,account:MP.accountLabel(row.accountId)};
      });
    return live.concat(hedgeAccountRows(model||MP.getApBookModel()));
  }

  function positionsBody(model) {
    const rows=filterRows(positionRows(model).map(row=>({...row,type:null})));
    const body=rows.map(row=>{
      const rate=row.valueKrw?row.pnlKrw/Math.abs(row.valueKrw)*100:0;
      /* D-0921: 숏은 수량의 부호가 말한다. 칩과 두 번째 줄을 지우고 한 행 한 줄로 둔다. */
      return `<tr data-position-kind="${row.kind||"trade"}"><td class="main-cell">${row.market}</td><td class="num align-right">${typeof row.quantity==="number"?row.quantity.toLocaleString("en-US",{maximumFractionDigits:4}):row.quantity}</td><td class="num align-right">${row.valueKrw===null?"-":formatMoneyFromKrw(row.valueKrw)}</td><td class="num align-right">${Number.isFinite(row.entry)?row.entry.toLocaleString("en-US",{maximumFractionDigits:2}):"-"}</td><td class="num align-right" data-portfolio-mark>${Number.isFinite(row.mark)?row.mark.toLocaleString("en-US",{maximumFractionDigits:2}):"-"}</td><td class="num align-right ${toneOf(row.pnlKrw)}">${money(row.pnlKrw,{showPlus:true})} (${rate>=0?"+":""}${rate.toFixed(2)}%)</td><td>${row.account}</td></tr>`;
    }).join("");
    return table(["마켓","수량","포지션 가치","진입가","마크","손익 (수익률 %)","계정"],body,"포지션 없음");
  }

  /* D-0921: 미체결 행의 수량은 잔량이다. 같은 주문이 주문 내역에서 54.1% 체결로 찍히는데
     미체결 탭이 원 수량을 그대로 세우면 두 탭이 어긋난다. 주문 금액도 잔량 기준이라
     금액 = 수량 x 가격이 행 안에서 닫히고, 원 수량 x 가격은 주문 내역의 주문 금액과 같다. */
  function openOrderShape(row,{id,time,type,market,side,price,status,accountId,account,notionalKrw,quantity,filledSeed,progressPercent}) {
    const original=Number(quantity)||0;
    const filled=Math.min(original,Number.isFinite(filledSeed)?Number(filledSeed):original*(Number(progressPercent)||0)/100);
    const remaining=Math.max(0,original-filled);
    const fullKrw=Number.isFinite(notionalKrw)&&notionalKrw?Number(notionalKrw):(Number(price)||0)*original*state.constants.usdKrw;
    return {...row,id,time,type,market,side,price,status,accountId,account,
      size:remaining,filled,original,
      orderValue:original?fullKrw*remaining/original:0};
  }

  function openOrderRows() {
    if(MP.clientScopeActive())return orderRows().filter(row=>!/완료|체결|취소/.test(row.status)).map(row=>openOrderShape(row,{
      id:row.id,time:row.time,type:normalType(row.type),market:marketLabel(row.symbol),side:row.side,price:row.price,
      status:row.status,accountId:row.accountId,account:row.account,notionalKrw:row.notionalKrw,
      quantity:row.quantity,progressPercent:row.progressPercent}));
    const records=new Map(orderRows().filter(row=>/집행 중|집행중|견적 수신|대기|부분체결/.test(row.status)).map(row=>[row.id,row]));
    state.openOrders.forEach(row=>records.set(row.id,{...records.get(row.id),...row,time:records.get(row.id)?.time||"10:30:00"}));
    const fallback=defaultAccountId();
    return [...records.values()].map(row=>{
      const accountId=rowAccountId(row)||fallback;
      return openOrderShape({},{
        id:row.id,time:row.time,type:normalType(row.type),market:marketLabel(row.symbol||"BTC/USD"),side:row.side,
        price:row.price,status:row.status,accountId,account:accountId?MP.accountLabel(accountId):"-",
        notionalKrw:row.notionalKrw,quantity:row.size??row.quantity,filledSeed:row.filled,progressPercent:row.progressPercent});
    });
  }

  function openOrdersBody() {
    const rows=filterRows(openOrderRows());
    const body=rows.map(row=>`<tr><td class="num">${row.time||"-"}</td><td>${row.type}</td><td>${row.market}</td><td>${chip(row.side==="SELL"?"매도":"매수",row.side==="SELL"?"info":"negative")}</td><td class="num align-right">${Number(row.size||0).toFixed(4)}<small class="subcell">체결 ${Number(row.filled||0).toFixed(4)}</small></td><td class="num align-right">${Number(row.original||0).toFixed(4)}</td><td class="num align-right">${formatMoneyFromKrw(row.orderValue||0)}</td><td class="num align-right">${Number.isFinite(row.price)?row.price.toLocaleString("en-US",{maximumFractionDigits:2}):"-"}</td><td>${statusChip(row.status)}</td><td>${row.account}</td><td><button class="button small ghost" type="button" data-action="cancel-trade-order" data-id="${row.id}">취소</button></td></tr>`).join("");
    return table(["시각","유형","마켓","방향","수량","원 수량","주문 금액","가격","상태","계정",""],body,"미체결 주문 없음");
  }

  /* D-0921: 체결 금액은 체결분 명목이다. 단가가 시드에 있으면 수량 x 가격,
     단가가 없고 주문 명목만 있는 행(ETF 설정 등)은 주문 명목 x 진행률,
     둘 다 없으면 금액을 지어내지 않고 빈 값으로 둔다. 진행률은 100%를 넘지 않는다. */
  function fillNotionalUsd(priceUsd,quantity,notionalKrw,progress) {
    if(Number.isFinite(priceUsd)&&priceUsd)return priceUsd*quantity;
    const full=Number(notionalKrw)||0;
    return full?full*progress/state.constants.usdKrw:null;
  }

  function fillRows() {
    const normal=orderRows().filter(row=>["체결","완료"].includes(row.status)||Number(row.progressPercent)>0).map(row=>{
      const progress=Math.min(100,Number(row.progressPercent)||100)/100;
      const quantity=(Number(row.quantity)||0)*progress;
      return {time:row.time,market:marketLabel(row.symbol||"BTC/USD"),side:row.side,type:normalType(row.type),price:row.price,
        quantity,notionalUsd:fillNotionalUsd(Number(row.price),quantity,row.notionalKrw,progress),
        fee:row.fee,pnl:row.realisedPnlKrw||0,accountId:row.accountId,account:row.account||"-"};
    });
    /* D-0915: RFQ 수락은 블로터 행과 rfqFills 를 모두 남기므로, 이미 블로터로 그려진 체결은 건너뛴다. */
    const linked=new Set(orderRows().map(row=>row.rfqFillId).filter(Boolean));
    const scoped=MP.clientScopeActive()?state.rfqFills.filter(fill=>fill.clientId===MP.clientScopeCompany()?.id):state.rfqFills;
    const rfq=scoped.filter(fill=>!linked.has(fill.id));
    return normal.concat(rfq.map(fill=>{
      const price=fill.priceUsd||fill.clientPriceUsd||fill.allInUsd;
      return withAccount({time:fill.at,market:`${fill.asset}/USD`,side:fill.side,type:"RFQ",price,quantity:fill.quantity,
        notionalUsd:fillNotionalUsd(Number(price),fill.quantity,fill.notionalKrw,1),
        fee:formatMoneyFromKrw(fill.notionalKrw*fill.feeBps/10000),pnl:0,primeAccountId:fill.primeAccountId});
    }));
  }

  function fillsBody() {
    const rows=filterRows(fillRows());
    const body=rows.map(row=>`<tr><td class="num">${row.time}</td><td>${row.market}</td><td>${row.side==="SELL"?"매도":"매수"}</td><td class="num align-right">${Number.isFinite(row.price)?row.price.toLocaleString("en-US",{maximumFractionDigits:2}):"-"}</td><td class="num align-right">${row.quantity.toFixed(4)}</td><td class="num align-right">${row.notionalUsd===null||row.notionalUsd===undefined?"-":formatMoneyFromUsd(row.notionalUsd)}</td><td class="num align-right">${row.fee||"-"}</td><td class="num align-right ${toneOf(row.pnl)}">${money(row.pnl,{showPlus:true})}</td><td>${row.account}</td></tr>`).join("");
    return `${table(["시각","마켓","방향","가격","수량","체결 금액","수수료","실현 손익","계정"],body,"체결 내역 없음")}<button class="portfolio-link" type="button" data-action="export">CSV 내보내기</button>`;
  }

  function statusChip(status) {const tones={"완료":"positive","체결":"positive","집행 중":"info","집행중":"info","견적 수신":"info","대기":"warning","부분체결":"violet","취소":"muted","WORKING":"info","PARTIAL":"violet"};return chip(status,tones[status]||"muted");}

  /* D-0921: 주문 명목이 시드에 없고 단가도 없는 행(KSD 설정, 환매)은 0원이 아니라 빈 값이다.
     체결 내역의 체결 금액과 같은 규칙이라 두 탭이 같은 행에서 같은 말을 한다. */
  function orderNotionalText(row) {
    const seeded=Number(row.notionalKrw)||0;
    if(seeded)return formatMoneyFromKrw(seeded);
    const price=Number(row.price),quantity=Number(row.quantity)||0;
    if(Number.isFinite(price)&&price&&quantity)return formatMoneyFromKrw(price*quantity*state.constants.usdKrw);
    return "-";
  }

  function ordersBody() {
    const rows=filterRows(orderRows().map(row=>({...row,market:marketLabel(row.symbol||"BTC/USD"),type:normalType(row.type)})));
    if(!rows.some(row=>row.id===state.selectedPortfolioRow))state.selectedPortfolioRow=rows[0]?.id||null;
    const body=rows.map(row=>`<tr class="clickable ${row.id===state.selectedPortfolioRow?"selected":""}" data-action="select-portfolio-row" data-id="${row.id}"><td class="num">${row.time||"-"}</td><td>${row.type}</td><td>${row.market}</td><td>${row.sideLabel||row.side}</td><td class="num align-right">${Number(row.quantity||0).toFixed(4)}</td><td class="num align-right">${((Number(row.quantity)||0)*Math.min(100,Number(row.progressPercent)||0)/100).toFixed(4)}</td><td class="num align-right">${orderNotionalText(row)}</td><td class="num align-right">${Number.isFinite(row.price)?row.price.toLocaleString("en-US",{maximumFractionDigits:2}):"-"}</td><td>${statusChip(row.status)}</td><td>${row.account||"-"}</td><td class="num">${row.id}</td></tr>`).join("");
    const selected=rows.find(row=>row.id===state.selectedPortfolioRow)||rows[0];
    const complete=["체결","완료"].includes(selected?.status);
    const flow=`<div class="table-scroll"><div class="state-flow"><div class="state-step complete">주문 생성<span class="subcell">${selected?.time||"-"}</span></div><div class="state-step complete">소유 귀속<span class="subcell">${selected?.owner||"고객사"}</span></div><div class="state-step ${complete?"complete":"current"}">라우팅<span class="subcell">${selected?.route||"프라임"}</span></div><div class="state-step ${complete?"complete":""}">체결<span class="subcell">${selected?.status||"-"}</span></div><div class="state-step">정산<span class="subcell">17:00 사이클</span></div></div></div>`;
    const twapQuote=selected?.symbol?.split("/")[1]||"USD";
    const twapDetail=selected&&normalType(selected.type)==="TWAP"?`<div class="kv"><label>무작위화</label><strong>${selected.randomize?"사용":"미사용"}</strong></div><div class="kv"><label>슬라이스</label><strong class="num">${selected.sliceMinutes&&selected.childCount?`${selected.sliceMinutes}분, ${selected.childCount}회`:"-"}</strong></div><div class="kv"><label>Trigger Price</label><strong class="num">${selected.triggerPrice?`${selected.triggerPrice.toLocaleString("en-US")} ${twapQuote}`:"즉시 시작"}</strong></div><div class="kv"><label>Max Price</label><strong class="num">${selected.maxPrice?`${selected.maxPrice.toLocaleString("en-US")} ${twapQuote}`:"-"}</strong></div>`:"";
    const detail=selected?`<div class="kv-grid"><div class="kv"><label>소유</label><strong>${selected.owner||"고객사"}</strong></div><div class="kv"><label>계정</label><strong class="num">${selected.account||"-"}</strong></div><div class="kv"><label>업무 태그</label><strong>${MP.linkedBusinessLabel(selected.linkedBusiness)}</strong></div><div class="kv"><label>주문 유형</label><strong>${normalType(selected.type)}</strong></div><div class="kv"><label>수량</label><strong class="num">${Number(selected.quantity||0).toFixed(4)}</strong></div><div class="kv"><label>진행</label><strong>${Number(selected.progressPercent||0).toFixed(1)}%, ${selected.status}</strong></div>${twapDetail}</div>`:'<div class="empty-note">선택 주문 없음</div>';
    return `${table(["시각","유형","마켓","방향","수량","체결 수량","주문 금액","가격","상태","계정","주문 ID"],body,"주문 내역 없음")}<div class="grid split-7-5 blotter-detail-grid">${panel(`${selected?.id||"주문"} 상태 이력`,flow,{actions:MP.clientScopeActive()?"":MP.btn("증빙","download-evidence","small","download"),flush:true})}${panel("주문 연결 상세",detail,{flush:true})}</div>${MP.clientScopeActive()?"":renderKsdDrillIn(selected)}`;
  }

  function clientBreakdown() {
    const rows=clientPnlRows();
    const exportButton=MP.btn("CSV 내보내기","client-pnl-export","small primary","download",MP.canControl("exec","client")?"":'disabled title="조회 전용"');
    return panel("자사 주문 손익 명세",clientPnlTable(rows),{actions:exportButton,flush:true});
  }

  function breakdownBody(model) {
    if(MP.clientScopeActive())return clientBreakdown();
    const view=model||MP.getApBookModel();
    return `${apBookSection(view,view.strategy!=="lp")}${lpBookSection(view,view.strategy!=="ap")}`;
  }

  function tabRowsForFilters(tab,model) {
    if(tab==="positions")return positionRows(model).map(row=>({market:row.market,side:row.side}));
    if(tab==="open")return openOrderRows();
    if(tab==="fills")return fillRows();
    if(tab==="orders")return orderRows().map(row=>({market:marketLabel(row.symbol||"BTC/USD"),side:row.side,type:normalType(row.type)}));
    return [];
  }

  function filterSelect(label,key,options) {
    const selected=state.portfolioFilters[key];
    return `<label class="portfolio-filter"><span>${label}</span><select class="select" data-portfolio-filter="${key}">${options.map(([value,text])=>`<option value="${value}"${selected===value?" selected":""}>${text}</option>`).join("")}</select></label>`;
  }

  function tabsAndFilters(model) {
    const tab=state.portfolioTab;
    const rows=tabRowsForFilters(tab,model);
    const hasSide=rows.some(row=>row.side),hasMarket=rows.some(row=>row.market),hasType=rows.some(row=>row.type);
    const markets=[...new Set(rows.map(row=>row.market).filter(Boolean))];
    const tabs=portfolioTabs.map(([id,label])=>`<button type="button" class="${tab===id?"active":""}" data-action="portfolio-tab" data-tab="${id}">${label}</button>`).join("");
    const accounts=accountFilterOptions();
    const accountFilter=tab!=="breakdown"&&accounts.length?filterSelect("계정","account",[["all","전체"],...accounts]):"";
    const filters=`${hasSide?filterSelect("방향","side",[["all","전체"],["BUY","매수"],["SELL","매도"]]):""}${hasMarket?filterSelect("마켓","market",[["all","전체"],...markets.map(value=>[value,value])]):""}${hasType?filterSelect("유형","type",[["all","전체"],...["Market","Limit","TWAP","RFQ","ETF 설정","ETF 환매"].map(value=>[value,value])]):""}${accountFilter}`;
    const small=tab==="balances"?`<label class="portfolio-small"><input type="checkbox" data-portfolio-small${state.portfolioFilters.hideSmall?" checked":""}>소액 숨기기</label>`:"";
    return `<div class="portfolio-tabs"><div class="portfolio-tab-list" role="tablist">${tabs}</div><div class="portfolio-tab-filters">${filters}${small}</div></div>`;
  }

  function tabBody(model) {
    const render={balances:balancesBody,positions:positionsBody,open:openOrdersBody,fills:fillsBody,orders:ordersBody,breakdown:breakdownBody}[state.portfolioTab]||positionsBody;
    return render(model);
  }

  /* D-0921: 총 자산은 이 한 곳에서만 나온다.
     총 자산 = 계정 화면 총 잔고(거래 잔고 + 수탁 잔고, 계정 화면과 같은 마크)
              + AP 북 ETF 재고 평가액(iNAV).
     행위 주체(데스크 또는 고객사) 기준이라 손익 스코프 칩, 기간 칩, 탭의 계정 필터를 타지 않는다. */
  function accountTotalUsd() {
    return balanceRows().reduce((sum,row)=>sum+row.usd,0);
  }

  function totalAssetParts(model) {
    const accountKrw=accountTotalUsd()*state.constants.usdKrw;
    const etfKrw=(model?.inventory?.etfValueByHolderKrw||{})[scopeHolderId()]||0;
    return {accountKrw,etfKrw,totalKrw:Math.round(accountKrw+etfKrw)};
  }

  function totalAssets(model) {
    return totalAssetParts(model).totalKrw;
  }

  function totalAssetHint(model) {
    const parts=totalAssetParts(model);
    return `총 자산 = 계정 총 잔고 ${formatMoneyFromKrw(parts.accountKrw)} + ETF 재고 평가액 ${formatMoneyFromKrw(parts.etfKrw)}. 계정 총 잔고는 계정 화면의 거래 잔고와 수탁 잔고를 같은 마크로 평가한 값, ETF 재고는 AP 북 모델의 iNAV 평가액`;
  }

  function portfolioStats(model) {
    if(MP.clientScopeActive()){
      const rows=clientPnlRows();
      const total=rows.reduce((sum,row)=>({net:sum.net+row.realisedKrw+row.unrealisedKrw,realised:sum.realised+row.realisedKrw,valued:sum.valued+row.unrealisedKrw,volume:sum.volume+row.executedNotional}),{net:0,realised:0,valued:0,volume:0});
      return {...total,assets:totalAssets(model),delta:balanceRows().filter(row=>row.asset==="BTC").reduce((sum,row)=>sum+row.total,0),limit:MP.clientScopeCapBtc()};
    }
    /* D-0915: 스코프 합계는 모델이 계산한다. AP는 AP 북 기간 합계, LP는 LP 캡처 기간 합계,
       전체는 두 값의 합(ETF 레그에서 LP 호가 마진을 이미 뺀 상태)이다. 순 델타는 기간과 무관한
       기말 스냅샷이며 스코프에 따라 AP 델타, LP 미헤지, 둘의 합으로 바뀐다. */
    const scope=model.strategy;
    const totals=model.scopeTotals;
    const apDelta=model.delta.netBtcEq,apLimit=model.delta.limitBtcEq;
    const lpDelta=state.lpUnhedgedBtc,lpLimit=state.lpHedgeThreshold;
    return {
      net:totals.netKrw,
      realised:totals.realisedKrw,
      valued:totals.valuedKrw,
      volume:totals.tradedNotionalKrw,
      assets:totalAssets(model),
      delta:scope==="lp"?lpDelta:scope==="ap"?apDelta:apDelta+lpDelta,
      limit:scope==="lp"?lpLimit:scope==="ap"?apLimit:apLimit+lpLimit
    };
  }

  function statsPanel(model,stats) {
    const scopes=[["all","전체"],["ap","AP"],["lp","LP"]].map(([id,label])=>`<button type="button" class="filter-chip ${state.pnlStrategyFilter===id?"active":""}" data-action="pnl-filter" data-strategy="${id}">${label}</button>`).join("");
    const periods=MP.apPeriods().map(item=>`<button type="button" class="filter-chip ${state.pnlPeriod===item.key?"active":""}" data-action="pnl-period" data-period="${item.key}">${item.label}</button>`).join("");
    const utilisation=stats.limit?Math.abs(stats.delta)/stats.limit*100:0;
    const row=(label,value,tone="",hint="")=>`<div><span${hint?` class="stat-hint" title="${hint}"`:""}>${label}</span><strong class="num ${tone}">${value}</strong></div>`;
    const actions=`<div class="portfolio-stat-selects">${MP.clientScopeActive()?"":`<div>${scopes}</div>`}<div>${periods}</div></div>`;
    const scopeLabel=MP.clientScopeActive()?"자사":{all:"전체",ap:"AP 북",lp:"LP 북"}[model.strategy]||"전체";
    const basis=`${scopeLabel}, ${model.period.label} 기준. 순 델타와 총 자산은 기말 스냅샷`;
    const body=`<div class="portfolio-stat-rows">${row("순손익",money(stats.net,{showPlus:true}),toneOf(stats.net))}${row("실현",money(stats.realised,{showPlus:true}),toneOf(stats.realised))}${row("평가",money(stats.valued,{showPlus:true}),toneOf(stats.valued))}${row("거래량",formatMoneyFromKrw(stats.volume))}${row("총 자산",formatMoneyFromKrw(stats.assets),"",totalAssetHint(model))}${row("순 델타",`${stats.delta.toFixed(4)} BTC-eq`)}<p>한도 ${stats.limit.toFixed(0)} BTC-eq, 사용률 ${utilisation.toFixed(1)}%</p><p>${basis}</p></div>`;
    return panel("",body,{actions,flush:true,className:"portfolio-stats-panel"});
  }

  /* D-0915: 14 거래일 일별 손익 선. 누적선과 막대는 없애고 그날의 값 한 점씩만 찍으며 0선을 같이
     그린다. 선택 스코프(전체, AP, LP)에 따라 계열이 바뀌고 마지막 점은 그 스코프의 당일 순손익이라
     통계 패널의 당일 값과 같다. 계정 가치 탭은 같은 구간의 자기자본 선이고 종점은 총 자산이다. */
  function chartCompact(value) {
    const usd=state.displayCurrency==="USD";
    const converted=usd?value/state.constants.usdKrw:value;
    const magnitude=Math.abs(converted);
    const unit=magnitude>=1e9?{value:1e9,label:"B"}:magnitude>=1e6?{value:1e6,label:"M"}:magnitude>=1e3?{value:1e3,label:"K"}:{value:1,label:""};
    return `${converted<0?"-":""}${usd?"$":"₩"}${(magnitude/unit.value).toFixed(unit.label?1:0)}${unit.label}`;
  }

  function chartSeries(model,stats,period) {
    const windowDays={"14D":14,"30D":30,"90D":90}[period]||14;
    const rows=model.series.slice(-windowDays);
    const scope=MP.clientScopeActive()?"all":model.strategy;
    const daily=rows.map(row=>row[scope]);
    if(Number.isFinite(stats.net)&&MP.clientScopeActive())daily[daily.length-1]=stats.net;
    return {rows,daily,equity:rows.map(row=>stats.assets+row.equityOffsetKrw)};
  }

  let portfolioChartSpec=null;
  let portfolioChartFrame=0;

  function portfolioChartText(text,x,y,size,extra="") {
    return `<text x="${Math.round(x)}" y="${Math.round(y)}" font-family="var(--exec-ui-font)" font-size="${size}" font-weight="400" text-rendering="geometricPrecision" stroke="none" fill="var(--text-primary)" ${extra}>${text}</text>`;
  }

  function drawPortfolioChart(svg,spec) {
    const width=Math.max(1,Math.round(svg.clientWidth));
    const height=Math.max(1,Math.round(svg.clientHeight));
    svg.setAttribute("width",String(width));
    svg.setAttribute("height",String(height));
    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    svg.removeAttribute("preserveAspectRatio");
    const left=84,right=Math.max(left+1,width-18),top=30,bottom=Math.max(top+1,height-38);
    const step=(right-left)/spec.rows.length;
    const x=index=>Math.round(left+step*(index+.5));
    const scaleOf=(low,high)=>{const span=(high-low)||1;return value=>Math.round(bottom-(value-low)/span*(bottom-top));};
    const gridY=index=>Math.round(top+index*(bottom-top)/2);
    const axisFor=(low,high)=>[high,(high+low)/2,low].map((value,index)=>{
      const y=gridY(index);
      return `${portfolioChartText(chartCompact(value),left-12,y+4,10,'class="chart-value" text-anchor="end"')}<line class="chart-tick" x1="${left-7}" x2="${left}" y1="${y}" y2="${y}"></line>`;
    }).join("");
    const grid=[0,1,2].map(index=>`<line x1="${left}" x2="${right}" y1="${gridY(index)}" y2="${gridY(index)}"></line>`).join("");
    const labelEvery={"14D":2,"30D":5,"90D":10}[spec.period]||2;
    const dates=spec.rows.map((row,index)=>{
      const position=x(index);
      const showLabel=index%labelEvery===0||index===spec.rows.length-1;
      const tick=`<line class="chart-tick" x1="${position}" x2="${position}" y1="${bottom}" y2="${bottom+(showLabel?8:4)}"></line>`;
      return showLabel?`${tick}${portfolioChartText(row.date,position,bottom+26,11,'class="chart-date" text-anchor="middle"')}`:tick;
    }).join("");
    const pnlLow=Math.min(0,...spec.daily),pnlHigh=Math.max(0,...spec.daily),pnlY=scaleOf(pnlLow,pnlHigh);
    const dailyPoints=spec.daily.map((value,index)=>`${x(index)},${pnlY(value)}`).join(" ");
    const dailyDots=spec.daily.map((value,index)=>`<circle class="chart-dot ${value>=0?"up":"down"}" cx="${x(index)}" cy="${pnlY(value)}" r="3"><title>${spec.rows[index].date} 일별 손익 ${formatMoneyFromKrw(value,{showPlus:true})}</title></circle>`).join("");
    const zeroY=pnlY(0);
    const profitLayer=`<g class="chart-layer ${spec.metric==="profit"?"active":""}" data-metric="profit"><g class="chart-axis">${axisFor(pnlLow,pnlHigh)}</g><line class="chart-zero" x1="${left}" x2="${right}" y1="${zeroY}" y2="${zeroY}"></line><polyline class="chart-daily" points="${dailyPoints}"></polyline>${dailyDots}</g>`;
    const equityLow=Math.min(...spec.equity),equityHigh=Math.max(...spec.equity),equityY=scaleOf(equityLow,equityHigh);
    const equityPoints=spec.equity.map((value,index)=>`${x(index)},${equityY(value)}`).join(" ");
    const accountLayer=`<g class="chart-layer ${spec.metric==="account"?"active":""}" data-metric="account"><g class="chart-axis">${axisFor(equityLow,equityHigh)}</g><polyline class="chart-equity" points="${equityPoints}"></polyline></g>`;
    svg.innerHTML=`<g class="chart-grid">${grid}</g><g class="chart-axis">${dates}</g>${accountLayer}${profitLayer}`;
  }

  function drawPortfolioCharts() {
    portfolioChartFrame=0;
    document.querySelectorAll("svg[data-portfolio-chart]").forEach(svg=>{
      if(portfolioChartSpec)drawPortfolioChart(svg,portfolioChartSpec);
    });
  }

  function queuePortfolioChartDraw() {
    if(portfolioChartFrame)return;
    portfolioChartFrame=window.requestAnimationFrame(drawPortfolioCharts);
  }

  window.addEventListener("resize",queuePortfolioChartDraw);

  function chartPanel(model,stats) {
    const metric=state.portfolioChartMetric;
    const period=state.portfolioChartPeriod;
    const {rows,daily,equity}=chartSeries(model,stats,period);
    const tabs=`<div class="portfolio-chart-tabs"><button class="${metric==="account"?"active":""}" data-action="portfolio-chart" data-metric="account">계정 가치</button><button class="${metric==="profit"?"active":""}" data-action="portfolio-chart" data-metric="profit">손익</button></div>`;
    const select=`<select class="select" data-portfolio-chart-period>${["14D","30D","90D"].map(value=>`<option${period===value?" selected":""}>${value}</option>`).join("")}</select>`;
    portfolioChartSpec={metric,period,rows,daily,equity};
    queuePortfolioChartDraw();
    /* D-0921: 계정 가치 선의 마지막 점은 통계 패널의 총 자산과 같은 값이다. 픽셀이 아니라
       원 단위 값을 속성으로 달아 두어 화면 밖에서도 그 항등식을 읽을 수 있게 한다. */
    const chart=`<svg class="portfolio-chart" data-portfolio-chart data-chart-equity-last="${equity[equity.length-1]}" role="img" aria-label="${period.slice(0,-1)} 거래일 ${metric==="profit"?"일별 손익":"계정 가치"} 차트"></svg>`;
    return panel("",chart,{actions:`${tabs}${select}`,flush:true,className:"portfolio-chart-panel"});
  }

  function topSummary(model,stats) {
    /* D-0915: 당일 거래량은 체결된 주문만 센다. 미체결 지정가/TWAP 접수로 부풀던 문제. */
    const dayOrders=orderRows().filter(row=>["체결","완료"].includes(row.status)||Number(row.progressPercent)>0);
    const apNotional=dayOrders.reduce((sum,row)=>sum+(row.notionalKrw||((Number(row.quantity)||0)*(Number(row.price)||0)*state.constants.usdKrw)),0);
    const dayVolume=MP.clientScopeActive()?apNotional:state.lpTodayNotionalKrw+apNotional;
    const volume=panel("당일 거래량",`<strong class="portfolio-big num">${formatMoneyFromKrw(dayVolume)}</strong><button class="portfolio-link" type="button" data-action="portfolio-tab" data-tab="orders">거래량 보기</button>`,{flush:true});
    const fees=panel("수수료",'<strong class="portfolio-big num">0.0150%</strong><small class="portfolio-caption">테이커 / 메이커 동일</small>',{flush:true});
    return `<div class="portfolio-top"><div class="portfolio-left-stack">${volume}${fees}</div>${statsPanel(model,stats)}${chartPanel(model,stats)}</div>`;
  }

  function renderPortfolio() {
    ensurePortfolioDefaults();
    const model=MP.getApBookModel();
    const stats=portfolioStats(model);
    const clientBar=MP.clientScopeActive()?`<div class="client-scope-bar"><b>${MP.clientScopeCompany()?.name||"고객사"}</b>${chip("자사 계정과 주문만","info")}</div>`:"";
    return `<section class="view portfolio-view" data-view="portfolio">${clientBar}${topSummary(model,stats)}${panel("",`${tabsAndFilters(model)}<div class="portfolio-tab-body" data-portfolio-tab-body="${state.portfolioTab}">${tabBody(model)}</div>`,{flush:true,className:"portfolio-tabs-panel"})}</section>`;
  }

  Object.assign(MP,{renderPortfolio,renderKsdDrillIn,clientPnlRows,clientPnlStatement});
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/settlement.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,coin,searchBox,formatMoneyFromUsd,formatMoneyFromKrw,dualValue} = MP;

  function balancePriceUsd(asset) {
    const ticker=asset.ticker||asset.asset;
    if(ticker==="KRW")return 1/state.constants.usdKrw;
    if(asset.priceKey==="usdtUsd")return state.usdtKrw/state.constants.usdKrw;
    if(asset.priceKey)return state[asset.priceKey];
    if(ticker==="BTC")return state.tradePrice;
    if(ticker==="ETH")return state.ethPrice;
    if(ticker==="USDT")return state.usdtKrw/state.constants.usdKrw;
    return asset.priceUsd||1;
  }

  function balanceValueUsd(asset) {
    return asset.quantity*balancePriceUsd(asset);
  }

  function balanceCostValueUsd(asset) {
    return asset.asset==="KRW"?asset.quantity*asset.costPrice/state.constants.usdKrw:asset.quantity*asset.costPrice;
  }

  function balanceDual(asset,variant="cell") {
    const sourceCurrency=asset.asset==="KRW"?"KRW":"USD";
    const markKey={BTC:"tradePrice",ETH:"ethPrice",USDT:"usdtUsd"}[asset.asset]||"";
    return dualValue({quantity:asset.quantity,unit:asset.asset,costPrice:asset.costPrice,markPrice:asset.asset==="KRW"?1:balancePriceUsd(asset),currency:state.displayCurrency,variant,sourceCurrency,markKey});
  }

  function quantityLabel(asset) {
    const ticker=asset.ticker||asset.asset;
    const digits={KRW:0,USD:2,BTC:8,ETH:6,USDT:2}[ticker]||4;
    return `${asset.quantity.toLocaleString("en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits})} ${ticker}`;
  }

  function balanceGroupSummary(items) {
    const mark=items.reduce((sum,asset)=>sum+balanceValueUsd(asset),0);
    const btcQty=items.filter(asset=>asset.asset==="BTC").reduce((sum,asset)=>sum+asset.quantity,0);
    return {cost:items.reduce((sum,asset)=>sum+balanceCostValueUsd(asset),0),mark,btcQty,markBase:mark-btcQty*state.tradePrice};
  }

  function balanceTrioMarkup(items) {
    return `<section class="balance-trio" aria-label="커스터디 잔고 요약">${items.map(([label,group,value])=>`<article><span>${label}</span>${dualValue({quantity:value.btcQty,unit:"BTC",quantityLabel:`${group.length}개 지갑`,costPrice:0,markPrice:state.tradePrice,costAmount:value.cost,markAmount:value.mark,currency:state.displayCurrency,variant:"kpi",showUnitPrice:false,markKey:"tradePrice",markBaseAmount:value.markBase})}</article>`).join("")}</section>`;
  }

  function renderBalanceTrio(assets) {
    const summary=balanceGroupSummary;
    const total=summary(assets);
    const custodyAssets=assets.filter(asset=>asset.ownerType==="client");
    const tradingAssets=assets.filter(asset=>asset.ownerType==="firm");
    const custody=summary(custodyAssets);
    const trading=summary(tradingAssets);
    const items=[
      ["총 잔고",assets,total],
      ["거래 잔고",tradingAssets,trading],
      ["수탁 잔고",custodyAssets,custody]
    ];
    return balanceTrioMarkup(items);
  }

  function formatCycleCountdown(seconds) {
    const safe=Math.max(0,seconds);
    const hours=Math.floor(safe/3600);
    const minutes=Math.floor(safe%3600/60);
    const remainder=safe%60;
    return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(remainder).padStart(2,"0")}`;
  }

  function renderSettlementCycle() {
    const cycle=state.settlementCycle;
    const movementValue=item=>Number(item.quantity.replace("+","").replace("M","e6").replace("B","e9"));
    const movements=cycle.netMovements.map(item=>{const quantity=movementValue(item);const sourceCurrency=item.asset==="KRW"?"KRW":"USD";const costPrice=item.asset==="BTC"?state.constants.btcFixingUsd:1;const markPrice=item.asset==="BTC"?state.tradePrice:1;return `<li><span>${item.walletId}</span>${dualValue({quantity,unit:item.asset,costPrice,markPrice,currency:state.displayCurrency,variant:"kv",sourceCurrency,markKey:item.asset==="BTC"?"tradePrice":"",showQuantitySign:true})}</li>`;}).join("");
    return `<article class="settlement-cycle-card"><header><div><span>정산 사이클</span><strong>${cycle.label}</strong></div>${chip(`${cycle.nettingCount}건 네팅`,"info")}</header><div class="cycle-countdown"><span>다음 사이클까지</span><strong class="num" data-settlement-cycle-countdown>${formatCycleCountdown(cycle.secondsRemaining)}</strong></div><ul class="cycle-net-movements">${movements}</ul></article>`;
  }

  function renderAssetBalances(assets) {
    const rows=assets.map(asset=>{
      const owner=asset.ownerType==="client"?"고객사 분리":"당사 자체";
      const client=state.clients.find(item=>item.id===asset.clientId);
      return `<tr><td><div class="asset-identity">${coin(asset.asset)}<span><strong>${asset.asset}</strong><small class="num">${asset.id}</small></span></div></td><td>${chip(owner,asset.ownerType==="client"?"info":"violet")}<small class="subcell">${client?.name||"메리츠"}</small></td><td class="align-right">${balanceDual(asset)}</td><td>${asset.custodian}</td></tr>`;
    }).join("");
    const subtotal=(ownerType,label)=>{const group=assets.filter(asset=>asset.ownerType===ownerType);const cost=group.reduce((sum,asset)=>sum+balanceCostValueUsd(asset),0);const mark=group.reduce((sum,asset)=>sum+balanceValueUsd(asset),0);const btcQty=group.filter(asset=>asset.asset==="BTC").reduce((sum,asset)=>sum+asset.quantity,0);return `<tr><td colspan="2">${label}</td><td class="align-right">${dualValue({quantity:btcQty,unit:"BTC",quantityLabel:`${group.length}개 지갑`,costPrice:0,markPrice:state.tradePrice,costAmount:cost,markAmount:mark,currency:state.displayCurrency,showUnitPrice:false,markKey:"tradePrice",markBaseAmount:mark-btcQty*state.tradePrice})}</td><td></td></tr>`;};
    const table=`<div class="table-scroll"><table class="data-table asset-balance-table"><thead><tr><th>자산 및 지갑 ID</th><th>소유 구분</th><th class="align-right">수량 / 원가 및 평가</th><th>수탁처</th></tr></thead><tbody>${rows}</tbody><tfoot>${subtotal("client","고객사 분리 합계")}${subtotal("firm","당사 자체 합계")}</tfoot></table></div>`;
    return panel("자산 잔고",table,{actions:searchBox("지갑 또는 자산 검색"),flush:true});
  }

  function custodyTicketPanel() {
    const editable=MP.canControl("exec","securities")||MP.canControl("exec","biz-admin");
    const ticketBlock=editable
      ?`<div class="custody-ticket" data-owned-panel="custody-ticket"><fieldset class="ownership-fieldset">${MP.renderCustodyTicketBody("settlement",true)}</fieldset></div>`
      :"";
    const view=MP.custodyTicketView("settlement");
    const company=MP.clientForAccount(view.ticket.primeAccountId)||MP.internalClient();
    const deskOwned=Boolean(company&&company.internal);
    const primeVendorEdit=MP.canControl("ops","prime")&&state.role==="biz-admin";
    const deskVendorEdit=deskOwned&&MP.canControl("ops","securities");
    const vendorEditable=primeVendorEdit||deskVendorEdit;
    const ownedAttr=deskVendorEdit?' data-owned-panel="desk-vendor-set"':"";
    const vendorBody=`<fieldset class="ownership-fieldset" ${vendorEditable?"":"disabled"}>${MP.renderCustodyVendorSetBody(company?company.id:null,vendorEditable)}</fieldset>`;
    const sub=`<section class="custody-vendor-subpanel"${ownedAttr}><header><h3>${deskOwned?"데스크 벤더 세트":"고객사 벤더 세트"}</h3>${chip(vendorEditable?"편집 가능":"조회 전용",vendorEditable?"positive":"muted")}</header>${vendorBody}</section>`;
    return panel("커스터디 이체",`${ticketBlock}${sub}`,{actions:chip(editable?"편집 가능":"조회 전용",editable?"positive":"muted"),flush:true});
  }

  function intentRow({cycle,title,route,meta,requester,approvalCount,requiredApprovals,attrs="",deskInternal=false,deskApprovedBy=null}) {
    const approved=approvalCount>=requiredApprovals;
    const approvalLabel=`${approvalCount} / ${requiredApprovals} 승인`;
    const owns=MP.canControl("exec","biz-admin");
    const selfRequested=requester===state.roleMeta[state.role].auditUser;
    const deskPending=deskInternal&&!deskApprovedBy;
    const canApprove=owns&&!approved&&!selfRequested&&!deskPending;
    const reason=approved?"":!owns?"2차 승인은 비즈니스 관리자 소관":selfRequested?"요청자 본인, 승인 불가":deskPending?"데스크 내부 1차 승인 대기":"";
    const rowAttrs=`${attrs} data-requester="${requester}"`;
    const buttonAttrs=canApprove?rowAttrs:`${rowAttrs} disabled${reason?` title="${reason}"`:""}`;
    const stage=deskInternal?chip(deskApprovedBy?`1차 승인 ${deskApprovedBy.split(" / ")[0]}`:"1차 승인 대기",deskApprovedBy?"positive":"warning"):"";
    return `<div class="open-intent-row"><time class="num">${cycle}</time><div class="open-intent-copy"><strong>${title}</strong><span>${route}</span><small>${meta}</small></div><span>${requester}</span>${stage}${chip(approvalLabel,approved?"positive":"warning")}<div>${btn(approved?"승인 완료":"2차 승인","approve-settlement","small success","check",buttonAttrs)}</div></div>`;
  }

  function renderOpenIntents() {
    const transfer=state.settlementTransfer;
    const seedRow=intentRow({
      cycle:"09-08 17:00 사이클",
      title:`AP 설정 ${transfer.quantityBtc.toFixed(0)} BTC`,
      route:"DW-MRTZ-BTC-01 → CW-HB-BTC-01",
      meta:"접수 09-08 09:18:42, STL-260909-0081",
      requester:"한승민 / 데스크",
      approvalCount:transfer.approvalCount,
      requiredApprovals:transfer.requiredApprovals
    });
    const ticketRows=state.settlementIntents.map(intent=>{
      return intentRow({
        cycle:intent.cycle,
        title:`${intent.transferType||MP.custodyTransferType(intent.from,intent.to)} ${intent.asset} ${MP.custodyQuantityText(intent.totalQuantity,intent.asset)}`,
        route:`${transferEndpointLabel(intent.from)} → ${transferEndpointLabel(intent.to)}`,
        meta:`접수 ${intent.createdAt}, ${intent.id}`,
        requester:intent.requester,
        approvalCount:intent.approvalCount,
        requiredApprovals:intent.requiredApprovals,
        attrs:`data-intent-id="${intent.id}"`,
        deskInternal:Boolean(intent.deskInternal),
        deskApprovedBy:intent.deskApprovedBy||null
      });
    }).join("");
    const pending=(transfer.approvalCount>=transfer.requiredApprovals?0:1)+state.settlementIntents.filter(intent=>intent.approvalCount<intent.requiredApprovals).length;
    return panel("승인 대기",`${seedRow}${ticketRows}`,{actions:chip(pending?`대기 ${pending}건`:"대기 0건",pending?"warning":"positive"),flush:true});
  }

  function renderRecentTransfers() {
    const transfer=state.settlementTransfer;
    const rows=[
      {cycle:"09-08 17:00 사이클",from:"DW-MRTZ-BTC-01",to:"CW-HB-BTC-01",asset:"BTC",native:`${transfer.quantityBtc.toFixed(8)} BTC`,valueUsd:transfer.quantityBtc*state.constants.btcFixingUsd,counterparty:"KDAC",status:"완료",tone:"positive"},
      {cycle:"09-07 17:00 사이클",from:"CW-GA-USD-01",to:"PB-USD-034",asset:"USD",native:"349,931.00 USD",valueUsd:349931,counterparty:"KODA",status:"매칭",tone:"info"},
      {cycle:"09-08 17:00 사이클",from:"DW-MRTZ-BTC-01",to:"CW-CH-BTC-01",asset:"BTC",native:"5.00000000 BTC",valueUsd:5*state.constants.btcFixingUsd,counterparty:"BDACS",status:"완료",tone:"positive"},
      {cycle:"09-07 17:00 사이클",from:"CW-HB-KRW-01",to:"DW-MRTZ-USD-01",asset:"KRW",native:"9,800,000,000 KRW",valueKrw:9800000000,counterparty:"Ripple Custody",status:"대사 예외",tone:"negative"}
    ];
    const body=rows.map(item=>`<tr><td class="num">${item.cycle}</td><td><span class="transfer-route"><b>${item.from}</b><i>→</i><b>${item.to}</b></span><small class="subcell">${item.counterparty}</small></td><td><span class="asset-inline">${coin(item.asset)}<b>${item.asset}</b></span></td><td class="align-right num"><span>${item.native}</span><small class="subcell num">${item.valueKrw?formatMoneyFromKrw(item.valueKrw):formatMoneyFromUsd(item.valueUsd)}</small></td><td>${chip(item.status,item.tone)}</td></tr>`).join("");
    const table=`<div class="table-scroll"><table class="data-table recent-transfer-table"><thead><tr><th>정산 사이클</th><th>출발 → 도착</th><th>자산</th><th class="align-right">금액</th><th>상태</th></tr></thead><tbody>${body}</tbody></table></div>`;
    return panel("최근 정산/이체",table,{flush:true});
  }

  function renderPairingDetails() {
    const dailyCapture=state.pairingRows.reduce((sum,item)=>sum+item.capture,0);
    const rows=state.pairingRows.map(item=>`<tr><td class="main-cell">${item.krx}</td><td class="num">${item.krxTime}</td><td class="align-right num">${item.shares.toLocaleString("ko-KR")}주</td><td>${item.hedge}</td><td>${MP.linkedBusinessLabel(item.linkedBusiness)}</td><td class="num">${item.hedgeTime}</td><td class="align-right num">${item.margin.toFixed(0)}bp</td><td class="align-right num negative-text">-${item.drag.toFixed(0)}bp</td><td class="align-right num positive-text">${(item.margin-item.drag).toFixed(0)}bp, 약 ${formatMoneyFromKrw(item.capture)}</td></tr>`).join("");
    return `<details class="pairing-details"><summary><span>체결 페어링</span>${chip(`${state.pairingRows.length}건`,"info")}</summary><div class="table-scroll"><table class="data-table"><thead><tr><th>KRX 체결</th><th>KRX 시각</th><th class="align-right">수량</th><th>헤지 체결</th><th>업무 태그</th><th>헤지 시각</th><th class="align-right">호가 마진</th><th class="align-right">드래그</th><th class="align-right">순캡처</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="6" class="main-cell">일 합계, ${state.pairingRows.length}건</td><td class="align-right num">5bp</td><td class="align-right num">-3bp</td><td class="align-right num positive-text">${formatMoneyFromKrw(dailyCapture)}</td></tr></tfoot></table></div></details>`;
  }

  function renderDailyEvidence() {
    const dailyCapture=state.pairingRows.reduce((sum,item)=>sum+item.capture,0);
    const files=`<ul class="list evidence-downloads"><li class="list-item"><span class="file-mark">P</span><div class="list-item-main"><div class="list-item-title">Daily Settlement PDF</div></div>${btn("다운로드","download-statement","small","download")}</li><li class="list-item"><span class="file-mark">C</span><div class="list-item-main"><div class="list-item-title">Settlement Legs CSV</div></div>${btn("다운로드","download-statement","small","download")}</li><li class="list-item"><span class="file-mark">B</span><div class="list-item-main"><div class="list-item-title">BestEx 증빙 패키지</div></div>${btn("다운로드","download-evidence","small","download")}</li></ul>`;
    const summary=`<div class="evidence-summary"><span>${chip(state.eodReady?"EOD 확정":"장중 집계",state.eodReady?"positive":"info")}</span><p>오늘 <b class="num">${state.pairingRows.length}건</b> 페어링, 순캡처 합계 <strong class="num positive-text">${formatMoneyFromKrw(dailyCapture)}</strong></p></div>`;
    return panel("일일 증빙",`${summary}${files}${renderPairingDetails()}`,{flush:true});
  }

  function renderAllocation(assets) {
    const values=assets.map(asset=>balanceValueUsd(asset));
    const total=values.reduce((sum,value)=>sum+value,0);
    let offset=0;
    const colors=["btc","usd","krw","eth","usdt"];
    const ordered=assets.map((asset,index)=>({asset,value:values[index]})).sort((a,b)=>b.value-a.value);

      const percent=entry.value/total*100;
      const segment=`<circle class="donut-segment ${colors[index]}" cx="64" cy="64" r="48" pathLength="100" stroke-dasharray="${percent.toFixed(3)} ${(100-percent).toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}"></circle>`;
      offset+=percent;
      return segment;
    }).join("");
    const legend=ordered.map((entry,index)=>`<li><i class="${colors[index]}"></i><span>${entry.asset.ticker}</span><b class="num">${(entry.value/total*100).toFixed(1)}%</b></li>`).join("");
    const body=`<div class="allocation-chart"><div class="donut-wrap"><svg class="allocation-donut" viewBox="0 0 128 128" role="img" aria-label="자산 배분 도넛"><circle class="donut-track" cx="64" cy="64" r="48"></circle>${segments}</svg><div class="donut-total"><span>Est. total</span><strong class="num">${formatMoneyFromUsd(total)}</strong></div></div><ul class="allocation-legend">${legend}</ul></div>`;
    return panel("자산 배분",body,{});
  }

  function renderCustodyAccounts() {
    const renderGroup=(title,ownerType)=>`<div class="wallet-group"><h3>${title}</h3><ul class="custody-account-list">${state.wallets.filter(wallet=>wallet.ownerType===ownerType).map(wallet=>`<li><div><strong class="num">${wallet.id}</strong><small>${wallet.custodian}</small></div><span class="account-assets">${chip(wallet.asset,ownerType==="client"?"info":"violet")}</span></li>`).join("")}</ul></div>`;
