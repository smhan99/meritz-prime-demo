  const routeWindowLabel = "10:00 to 11:00";
  const routeCustodyUse = {
    "HB-AM-ETF-01":"코인 레그 전용, 금일 미사용",
    "CH-SEC-01":"코인 인도",
    "GA-AM-RFQ-01":"코인 수취, 매도분 출고",
    "CS-SEC-01":"코인 수취, RFQ 정산",
    "HW-INST-01":"코인 수취, 상계분 정산"
  };
  const routeTransitAccountId = "MP-TRANSIT-BTC-01";

  function routeRound4(value) {
    return Math.round(Number(value)*10000)/10000;
  }

  function routeQty(value) {
    return Number(value).toFixed(4);
  }

  function routeAnonymised() {
    return MP.isDeskRole()||state.vendorAnonymised;
  }

  function routeVendorName(vendor) {
    return routeAnonymised()?vendor.anonName:vendor.name;
  }

  function routeVendorCustodian(vendor) {
    return routeAnonymised()?vendor.anonCustodian:vendor.custodian;
  }

  function routeWindowOrders() {
    return state.clientOrders.filter(order=>order.executionWindow===routeWindowLabel);
  }

  function routeOrderQtyBtc(order) {
    return Number.isFinite(order.quantityBtc)?order.quantityBtc:0;
  }

  function routeSourcingOrder(order) {
    return state.primeOrders.find(item=>item.id===String(order.id).replace(/^ORD-/,"PRM-"))||null;
  }

  function routeNetting() {
    const orders=routeWindowOrders();
    const buys=orders.filter(order=>order.side==="매수");
    const sells=orders.filter(order=>order.side==="매도");
    const total=list=>routeRound4(list.reduce((sum,order)=>sum+routeOrderQtyBtc(order),0));
    const buyQty=total(buys);
    const sellQty=total(sells);
    const allocations=buys.map(order=>{
      const sourcing=routeSourcingOrder(order);
      return {order,sourcing,nettingBtc:Number.isFinite(sourcing?.internalNettingBtc)?sourcing.internalNettingBtc:0};
    });
    const nettedQty=routeRound4(allocations.reduce((sum,item)=>sum+item.nettingBtc,0));
    const routing=allocations.map(item=>item.sourcing).find(order=>Array.isArray(order?.vendorRouting))?.vendorRouting||[];
    return {orders,buys,sells,buyQty,sellQty,nettedQty,marketQty:routeRound4(buyQty-nettedQty),allocations,routing};
  }

  function routeFilledPerOrderBtc() {
    const metrics=typeof MP.executionMonitorMetrics==="function"?MP.executionMonitorMetrics(state.executionWindowState):null;
    return metrics&&Number.isFinite(metrics.filledQty)?metrics.filledQty:0;
  }

  function routeNode({step,title,body,tone=""}) {
    return `<article class="route-node ${tone}"><header><span class="route-node-step">${step}</span><strong>${title}</strong></header><div class="route-node-body">${body}</div></article>`;
  }

  function routeLine(label,value,tone="") {
    return `<li><span>${label}</span><b class="num ${tone}">${value}</b></li>`;
  }

  function routeTier(label,nodes) {
    return `<section class="route-tier"><span class="route-tier-label">${label}</span><div class="route-nodes">${nodes.join("")}</div></section>`;
  }

  function routeIntakeNode(netting) {
    const rows=netting.orders.map(order=>{
      const client=state.clients.find(item=>item.id===order.clientId);
      const tone=order.side==="매수"?"positive-text":"negative-text";
      return `<li><span>${client?client.name:order.clientId}</span><b class="${tone}">${order.side}</b><b class="num">${routeQty(routeOrderQtyBtc(order))}</b></li>`;
    }).join("");
    return routeNode({step:"1단",title:"윈도 주문 접수",body:`<ul class="route-line-list route-intake-list">${rows}</ul>`});
  }

  function routeNettingNode(netting) {
    const summary=MP.getPrimePnlSummary();
    const body=`<ul class="route-line-list">${routeLine("총 매수",routeQty(netting.buyQty))}${routeLine("총 매도",routeQty(netting.sellQty))}${routeLine("내부 상계",routeQty(netting.nettedQty),"violet-text")}${routeLine("시장 집행 대상",routeQty(netting.marketQty))}</ul><div class="route-gain"><span>넷팅 이득</span><strong class="num positive-text">${formatMoneyFromKrw(summary.nettingKrw)}</strong></div>`;
    return routeNode({step:"2단",title:"시장 집행 전 넷팅",body,tone:"emphasis"});
  }

  function routeVendorNode(netting) {
    const rows=state.vendorQuotes.map(vendor=>{
      const entry=netting.routing.find(item=>item.vendorId===vendor.id)||null;
      if(!entry)return `<li class="route-excluded"><span>${routeVendorName(vendor)}</span><b>고객 제외</b></li>`;
      return routeLine(routeVendorName(vendor),`${(entry.share*100).toFixed(0)}%`);
    }).join("");
    return routeNode({step:"3단",title:"시장 집행, 벤더 라우팅",body:`<ul class="route-line-list">${rows}</ul>`});
  }

  function routeVendorAccountNode(netting) {
    const rows=netting.routing.map(entry=>{
      const vendor=state.vendorQuotes.find(item=>item.id===entry.vendorId);
      return vendor?`<li><span>${routeVendorCustodian(vendor)}</span><b>수취</b></li>`:"";
    }).join("");
    return routeNode({step:"4단",title:"벤더 결제 계정",body:`<ul class="route-line-list">${rows}</ul>`});
  }

  function routeCycleNode(netting) {
    const cycle=state.settlementCycle;
    const body=`<ul class="route-line-list">${routeLine("사이클",cycle.label)}${routeLine("컷오프",cycle.cutoff)}${routeLine("벤더별 순액",`${cycle.nettingCount}건 네팅`)}${routeLine("이체 건수",`${cycle.nettingTransferFrom}건에서 ${cycle.nettingTransferTo}건`,"violet-text")}</ul>`;
    return routeNode({step:"5단",title:"일 1회 결제 넷팅",body,tone:"emphasis"});
  }

  function routeTransitNode() {
    const body=`<ul class="route-line-list">${routeLine("계정",routeTransitAccountId)}${routeLine("1차 승인","운영")}${routeLine("2차 승인","리스크")}</ul>`;
    return routeNode({step:"6단",title:"당사 트랜짓 계정",body,tone:"gate"});
  }

  function routeDeliveryNode() {
    const body=`<ul class="route-line-list route-branch-list"><li><span>ETF 좌수</span><b>KSD 계좌 대체</b></li><li><span>코인</span><b>고객 외부 커스터디</b></li><li><span>데스크분</span><b>당사 자체 계정</b></li></ul>`;
    return routeNode({step:"7단",title:"인도 분기",body});

  function routeClientCustodyNode() {
    const rows=state.clients.filter(client=>!client.internal).map(client=>{

    const body=`<div class="table-scroll"><table class="data-table route-custody-table"><thead><tr><th>고객</th><th>수탁처</th><th>용도</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    return routeNode({step:"8단",title:"고객 외부 커스터디",body});
  }

  function routeSegregationNode() {
    return routeNode({step:"9단",title:"분리 원칙",body:""});
  }

  function renderSettlementRoute() {
    const netting=routeNetting();
    const tiers=[
      routeTier("집행 전",[routeIntakeNode(netting),routeNettingNode(netting),routeVendorNode(netting)]),
      routeTier("집행 후",[routeVendorAccountNode(netting),routeCycleNode(netting),routeTransitNode()]),
      routeTier("인도",[routeDeliveryNode(),routeClientCustodyNode(),routeSegregationNode()])
    ].join("");
    return panel("커스터디 및 정산 경로",`<div class="route-map">${tiers}</div>`,{flush:true});

    if(!editable)return "";
    const rows=company.users.map(user=>`<tr><td class="main-cell">${user.name}</td><td><select data-client-user-role="${user.id}"><option value="client-master" ${user.role==="client-master"?"selected":""}>마스터/매니저</option><option value="client-trader" ${user.role==="client-trader"?"selected":""}>트레이더</option><option value="client-accounting" ${user.role==="client-accounting"?"selected":""}>관리회계</option></select></td><td>${chip(user.status,user.status==="활성"?"positive":"warning")}</td><td class="num">${user.lastLogin}</td></tr>`).join("");
    const body=`<div class="table-scroll"><table class="data-table"><thead><tr><th>이름</th><th>역할</th><th>상태</th><th>최근 접속</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    return clientOwnedPanel("서브 사용자",body,{editable});
  }

  function clientAccountingRow() {
    const role=MP.resolveRole(state.role);
    if(role!=="client-master"&&role!=="client-accounting")return "";
    return typeof MP.renderAccountingPanel==="function"?MP.renderAccountingPanel():"";
  }

  /* 커스터디 열은 등록 커스터디 목록 1곳에서만 온다. 여기에 이름을 다시 적어 두면
     목록에 없는 커스터디의 보유가 표에서 조용히 사라져 수탁 합계가 어긋난다. */
  const custodyColumns=state.custodians;
  const assetNames={BTC:"Bitcoin",ETH:"Ethereum",USD:"US Dollar",KRW:"Korean Won",PAXG:"PAX Gold",USYC:"Hashnote USYC"};
  const assetDigits={BTC:4,ETH:2,USD:2,KRW:0,PAXG:2,USYC:2};

  function settlementAssetMeta(asset) {
    return state.custodyBalances.find(item=>item.ticker===asset)||{ticker:asset,name:asset,priceUsd:1,change:0};
  }

  function settlementPrice(asset) {
    const meta=settlementAssetMeta(asset);
    if(meta.priceKey==="tradePrice")return state.tradePrice;
    if(meta.priceKey==="ethPrice")return state.ethPrice;
    return Number(meta.priceUsd)||1;
  }

  function settlementQuantity(value,asset,withAsset=false) {
    const digits=assetDigits[asset]??4;
    const text=Number(value||0).toLocaleString("en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits});
    return withAsset?`${text} ${asset}`:text;
  }

  /* D-0921: 수탁 보유는 서브계정에 귀속된다. 단일 서브계정 보기는 그 계정에 귀속된 수탁만
     세고 전체 보기는 셋을 합치므로, 거래 잔고와 수탁 잔고와 총 잔고 셋 다에서
     PRIME_A + PRIME_B + PRIME_C = 전체가 정확히 성립한다. */

  function isAggregateAccount(account) {
    return Boolean(account)&&account.id==="*";
  }

  function accountAssetRows(account,accountIds=[account&&account.id].filter(Boolean)) {
    const rows={};
    const ensure=asset=>rows[asset]||(rows[asset]={asset,trading:0,custody:0,byCustodian:{}});
    (account.liveBalances||[]).forEach(item=>{ensure(item.asset).trading+=Number(item.quantity)||0;});
    MP.custodyHoldingsForAccounts(account.clientId,accountIds).forEach(item=>{
      const row=ensure(item.asset);
      row.custody+=Number(item.quantity)||0;
      row.byCustodian[item.custodian]=(row.byCustodian[item.custodian]||0)+(Number(item.quantity)||0);
    });
    return Object.values(rows).map(row=>({...row,total:row.trading+row.custody,price:settlementPrice(row.asset),valueUsd:(row.trading+row.custody)*settlementPrice(row.asset)}));
  }

  /* 표 바닥 합계, 헤드라인 3장, 도넛이 모두 이 한 곳에서 나온 값을 쓴다. 각각 따로 더하면
     열 합계와 헤드라인이 어긋날 수 있다. */
  function accountRowTotals(rows) {
    const totals={total:0,trading:0,custody:0,byCustodian:{}};
    rows.forEach(row=>{
      totals.total+=row.valueUsd;
      totals.trading+=row.trading*row.price;
      totals.custody+=row.custody*row.price;
      Object.entries(row.byCustodian).forEach(([name,quantity])=>{
        totals.byCustodian[name]=(totals.byCustodian[name]||0)+quantity*row.price;
      });
    });
    return totals;
  }

  function aggregateSettlementAccounts(accounts) {
    const live=new Map();
    accounts.forEach(account=>{
      (account.liveBalances||[]).forEach(row=>live.set(row.asset,(live.get(row.asset)||0)+(Number(row.quantity)||0)));
    });
    return {id:"*",label:"전체",clientId:accounts[0]?.clientId||null,liveBalances:[...live].map(([asset,quantity])=>({asset,quantity}))};
  }

  /* 전체 보기 헤드라인 아래 한 줄. 서브계정 세 개의 총 잔고가 전체 총 잔고로 어떻게
     합쳐지는지 눈으로 본다. 거래 잔고와 수탁 잔고를 다 담은 값이라 덧셈이 그대로 맞는다. */
  function accountBreakdownLine(account,accountIds,total) {
    if(!isAggregateAccount(account)||accountIds.length<2)return "";
    const parts=accountIds.map(id=>{
      const member=MP.primeAccountById(id);
      if(!member)return "";
      const value=accountRowTotals(accountAssetRows(member,[id])).total;
      return `${MP.accountLabel(id)} ${formatMoneyFromUsd(value)}`;
    }).filter(Boolean).join(" + ");
    if(!parts)return "";
    return `<p class="settlement-headline-breakdown num">${parts} = 총 잔고 ${formatMoneyFromUsd(total)}</p>`;
  }

  function accountHeadline(account,accountIds=[]) {
    const rows=accountAssetRows(account,accountIds);
    const totals=accountRowTotals(rows);
    const card=(label,value,count)=>`<article><span>${label}</span><strong class="num">${formatMoneyFromUsd(value)}</strong><small>${count}개 자산</small></article>`;
    const cards=`<section class="settlement-headline" aria-label="계정 잔고 요약">${card("총 잔고",totals.total,rows.filter(row=>row.total>0).length)}${card("거래 잔고",totals.trading,rows.filter(row=>row.trading>0).length)}${card("수탁 잔고",totals.custody,rows.filter(row=>row.custody>0).length)}</section>`;
    return `${cards}${accountBreakdownLine(account,accountIds,totals.total)}`;
  }

  /* 커스터디 이름이 두 단어면 공백에서 줄을 나눠 두 줄 머리글로 세운다. 단어 중간에서
     접히지 않도록 열 최소 너비는 CSS(.settlement-custody-col)가 잡는다. */
  function custodyHeadLabel(name) {
    const index=String(name).indexOf(" ");
    return index<0?name:`${name.slice(0,index)}<br>${name.slice(index+1)}`;
  }

  /* 도넛 범례는 소수 1자리로 반올림하므로 그대로 더하면 합이 100.0에서 벗어난다.
     반올림 잔차를 가장 큰 조각에 몰아 표시 합계를 정확히 100.0으로 맞춘다. */
  function normalisedShares(values) {
    const rounded=values.map(value=>Math.round(value*10)/10);
    if(!rounded.length)return rounded;
    const residual=Math.round((100-rounded.reduce((sum,value)=>sum+value,0))*10)/10;
    let index=0;
    rounded.forEach((value,current)=>{if(value>rounded[index])index=current;});
    rounded[index]=Math.round((rounded[index]+residual)*10)/10;
    return rounded;
  }

  /* 합계 행은 수량이 아니라 가치를 찍는다. 자산이 섞인 열은 수량을 더해 봐야 뜻이 없고,
     커스터디 열 합계가 커스터디 카드의 벤더별 금액과 같은 값이어야 대조가 된다. */
  function accountAssetTable(account,accountIds) {
    const pooled=true;
    const assetRows=accountAssetRows(account,accountIds);
    const totals=accountRowTotals(assetRows);
    const custodyCellsFor=row=>pooled?custodyColumns.map(name=>`<td class="align-right num settlement-custody-cell">${row.byCustodian[name]?settlementQuantity(row.byCustodian[name],row.asset):""}</td>`).join(""):"";
    const rows=assetRows.map(row=>{
      const meta=settlementAssetMeta(row.asset);
      const change=Number(meta.change)||0;
      const custodyCell=pooled?`<td class="align-right num">${row.custody?settlementQuantity(row.custody,row.asset):""}</td>`:"";
      return `<tr data-settlement-asset-row="${row.asset.toLowerCase()} ${String(assetNames[row.asset]||row.asset).toLowerCase()}"><td><div class="settlement-asset-id"><i>${row.asset.slice(0,1)}</i><span><strong>${assetNames[row.asset]||row.asset}</strong><small>${row.asset}</small></span></div></td><td class="align-right num"><b>${settlementQuantity(row.total,row.asset)}</b><small>${formatMoneyFromUsd(row.valueUsd)}</small></td><td class="align-right num">${row.trading?settlementQuantity(row.trading,row.asset):""}</td>${custodyCell}${custodyCellsFor(row)}<td class="align-right num"><b>${formatMoneyFromUsd(row.price)}</b><small class="${change>=0?"positive-text":"negative-text"}">${change>=0?"+":""}${change.toFixed(2)}%</small></td></tr>`;
    }).join("");
    const heads=pooled?custodyColumns.map(name=>`<th class="settlement-custody-col">${custodyHeadLabel(name)}</th>`).join(""):"";
    const custodyHead=pooled?"<th>수탁 잔고</th>":"";
    const custodyFootCell=pooled?`<td class="align-right num">${formatMoneyFromUsd(totals.custody)}</td>`:"";
    const custodyFootCells=pooled?custodyColumns.map(name=>`<td class="align-right num settlement-custody-cell">${totals.byCustodian[name]?formatMoneyFromUsd(totals.byCustodian[name]):""}</td>`).join(""):"";
    const foot=`<tr class="settlement-total-row"><td>합계</td><td class="align-right num">${formatMoneyFromUsd(totals.total)}</td><td class="align-right num">${formatMoneyFromUsd(totals.trading)}</td>${custodyFootCell}${custodyFootCells}<td></td></tr>`;
    const table=`<div class="table-scroll"><table class="data-table settlement-assets-table"><thead><tr><th>자산</th><th>총 잔고</th><th>거래 잔고</th>${custodyHead}${heads}<th class="settlement-price-col">가격 / 24h</th></tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`;
    const search=`<label class="search-field"><span class="sr-only">검색</span><input type="search" data-settlement-search placeholder="자산 검색"></label>`;
    return panel("자산 잔고",table,{actions:search,flush:true});
  }

  function accountBalanceComposition(account,accountIds) {
    const rows=accountAssetRows(account,accountIds).filter(row=>row.valueUsd>0).sort((a,b)=>b.valueUsd-a.valueUsd);
    const total=rows.reduce((sum,row)=>sum+row.valueUsd,0);
    let offset=0;
    const colors=["btc","eth","usd","krw","usdt","violet"];
    const shares=rows.map(row=>total?row.valueUsd/total*100:0);
    const labels=normalisedShares(shares);
    const segments=rows.map((row,index)=>{const share=shares[index];const circle=`<circle class="donut-segment ${colors[index%colors.length]}" cx="64" cy="64" r="48" pathLength="100" stroke-dasharray="${share.toFixed(3)} ${(100-share).toFixed(3)}" stroke-dashoffset="${(-offset).toFixed(3)}"></circle>`;offset+=share;return circle;}).join("");
    const legend=rows.map((row,index)=>`<li><i class="${colors[index%colors.length]}"></i><span>${row.asset}</span><b class="num">${labels[index].toFixed(1)}%</b></li>`).join("");
    return panel("잔고 구성",`<div class="settlement-donut"><div class="donut-wrap"><svg class="allocation-donut" viewBox="0 0 128 128"><circle class="donut-track" cx="64" cy="64" r="48"></circle>${segments}</svg><div class="donut-total"><span>예상 총액</span><strong class="num">${formatMoneyFromUsd(total)}</strong></div></div><ul class="allocation-legend">${legend}</ul></div>`,{flush:true});
  }

  function accountCustodians(account,accountIds) {
    const rows=custodyColumns.map(name=>{
      const held=MP.custodyHoldingsForAccounts(account.clientId,accountIds).filter(item=>item.custodian===name&&item.quantity>0);
      if(!held.length)return "";
      const total=held.reduce((sum,item)=>sum+item.quantity*settlementPrice(item.asset),0);
      const assets=[...new Set(held.map(item=>item.asset))];
      return `<li><div><strong>${name}</strong><small class="num">${formatMoneyFromUsd(total)}</small></div><span>${assets.map(asset=>chip(asset,"muted")).join("")}</span></li>`;
    }).join("");
    return panel("커스터디",`<ul class="settlement-custodian-list">${rows}</ul>`,{flush:true});
  }

  /* 이체 요청서는 보유자 풀의 커스터디에서 출발한다. 거래 잔고에서 풀로 보내는 길은
     커스터디 배분뿐이며, 풀에서 나갈 때만 접근 가능한 Prime 서브계정을 도착으로 고른다. */

  function compactQuantity(value,asset) {
    const text=settlementQuantity(value,asset);
    return text.includes(".")?text.replace(/0+$/,"").replace(/\.$/,""):text;
  }

  function transferEndpointLabel(value) {
    return MP.primeAccountById(value)?MP.accountLabel(value):value;
  }

  function transferHolderId(item) {
    return item.holderId||MP.primeAccountById(item.primeAccountId)?.clientId||null;
  }

  /* D-0921: 이체 요청서의 출처는 늘 서브계정 1개다. 단일 계정 보기에서는 그 계정,
     전체 보기에서는 고른 커스터디와 자산에 가장 많이 귀속된 서브계정이 출처가 된다.
     그래서 자산 선택지에 계정 이름을 붙이지 않고도 귀속이 어디서 빠지는지 정해진다. */
  function custodyHoldingEntries(holderId,accountIds) {
    const rows=MP.custodyHoldingsForAccounts(holderId,accountIds).filter(row=>Number(row.quantity)>0);
    const best=new Map();
    rows.forEach(row=>{
      const key=`${row.custodian}|${row.asset}`;
      const current=best.get(key);
      if(!current||row.quantity>current.quantity)best.set(key,row);
    });
    return [...best.values()];
  }

  function custodyHoldingNames(entries) {
    const rank=name=>{const index=custodyColumns.indexOf(name);return index<0?custodyColumns.length:index;};
    return [...new Set(entries.map(entry=>entry.custodian))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
  }

  function transferTargets(entry,holderId) {
    const vendors=MP.custodyVendorsForClient(holderId);
    const names=(vendors.length?vendors:custodyColumns).filter(name=>name!==entry.custodian);
    const accountTargets=MP.custodyTicketAccountIds().filter(id=>MP.primeAccountById(id)?.clientId===holderId);
    return [...names.map(name=>[name,name]),...accountTargets.map(id=>[id,MP.accountLabel(id)])];
  }

  function resolveTransferTicket(accountIds) {
    const ticket=state.custodyTickets.settlement;
    const holderId=MP.primeAccountById(accountIds[0])?.clientId||null;
    const entries=custodyHoldingEntries(holderId,accountIds);
    if(!entries.length)return {ticket,custodians:[],assets:[],source:null,targets:[]};
    const custodians=custodyHoldingNames(entries);
    if(!custodians.includes(ticket.from))ticket.from=custodians[0];
    const assets=entries.filter(entry=>entry.custodian===ticket.from);
    const source=assets.find(entry=>entry.asset===ticket.asset)||assets[0];
    ticket.holderId=holderId;
    ticket.asset=source.asset;
    ticket.fromAccountId=source.accountId||null;
    const targets=transferTargets(source,holderId);
    if(!targets.some(([value])=>value===ticket.to))ticket.to=targets[0]?targets[0][0]:"";
    const quantity=Number(ticket.quantity);
    ticket.quantity=Number.isFinite(quantity)&&quantity>0?Math.min(quantity,source.quantity):source.quantity;
    return {ticket,custodians,assets,source,targets};
  }

  function ticketSourceBalance(ticket) {
    const rows=MP.custodyHoldingsFor(ticket.holderId).filter(row=>row.asset===ticket.asset&&row.custodian===ticket.from
      &&(!ticket.fromAccountId||row.accountId===ticket.fromAccountId));
    return rows.reduce((sum,row)=>sum+(Number(row.quantity)||0),0);
  }

  function transferTicket(accountIds) {
    const editable=MP.clientScopeActive()?MP.canControl("exec","client"):MP.canControl("exec","securities");
    const {ticket,custodians,assets,source,targets}=resolveTransferTicket(accountIds);
    if(!source)return panel("이체 요청서",'<div class="empty-note"><strong>이체 가능한 커스터디 보유 없음</strong></div>',{flush:true});
    const custodyOptions=custodians.map(name=>`<option value="${name}" ${name===ticket.from?"selected":""}>${name}</option>`).join("");
    const assetOptions=assets.map(entry=>`<option value="${entry.asset}" ${entry===source?"selected":""}>${entry.asset}</option>`).join("");
    const targetOptions=targets.map(([value,label])=>`<option value="${value}" ${value===ticket.to?"selected":""}>${label}</option>`).join("");
    const held=`${compactQuantity(source.quantity,source.asset)} ${source.asset}`;
    /* 전체 보기에서는 어느 서브계정에서 빠지는지가 화면에 드러나야 한다. */
    const sourceNote=accountIds.length>1&&source.accountId?`<small class="field-note settlement-ticket-source">출처 ${MP.accountLabel(source.accountId)}</small>`:"";
    /* 폼 컨트롤은 주문 카드, 커스터디 배분과 같은 앱 표준 .field 묶음을 그대로 쓴다. */
    const fields=`<div class="field"><label>커스터디</label><select data-settlement-ticket-custodian>${custodyOptions}</select></div>`
      +`<div class="field"><label>자산</label><select data-settlement-ticket-asset>${assetOptions}</select></div>`
      +`<div class="field"><label>수량</label><div class="input-with-action"><input class="num" type="number" min="0" max="${source.quantity}" step="0.0001" value="${ticket.quantity}" data-settlement-ticket-quantity>${btn("전체","settlement-ticket-all","small input-all-button","",source.quantity>0&&editable?"":"disabled")}</div><small class="field-note">보유 ${held}</small>${sourceNote}</div>`
      +`<div class="field"><label>도착</label><select data-settlement-ticket-to>${targetOptions}</select></div>`;
    const body=`<div class="settlement-transfer-request"${editable?' data-owned-panel="custody-ticket"':""}><fieldset class="ownership-fieldset" ${editable?"":"disabled"}><div class="settlement-ticket-grid">${fields}</div><div class="settlement-ticket-submit">${btn("이체 요청","submit-custody-transfer","block primary","arrow",`data-surface="settlement"${editable?"":" disabled"}`)}</div></fieldset></div>`;
    return panel("이체 요청서",body,{flush:true});
  }

  function scopedOpenIntents(accountIds,showAccount) {
    /* 승인을 누른 행이 사라지지 않고 승인, 정산 예정으로 바뀐 채 같은 표에 남는다. */
    const holderId=MP.primeAccountById(accountIds[0])?.clientId||null;
    /* D-0915: 정산까지 끝난 건은 최근 이체가 정산 완료로 들고 있으므로 승인 대기에서 내린다. */
    const scoped=state.settlementIntents.filter(intent=>transferHolderId(intent)===holderId
      &&!state.custodyTransferTickets.some(ticket=>ticket.intentId===intent.id&&ticket.state==="정산 완료"));
    const intents=[...scoped.filter(intent=>intent.approvalCount<intent.requiredApprovals),...scoped.filter(intent=>intent.approvalCount>=intent.requiredApprovals)];
    const cycleLabel=MP.settlementCycleLabel();
    const rows=intents.map(intent=>{
      /* 승인은 마스터 계정 소관이다. 데스크 내부 건은 데스크 마스터, 고객 건은 고객 마스터가 누른다. */
      const approved=intent.approvalCount>=intent.requiredApprovals||Boolean(intent.deskApprovedBy);
      const master=intent.deskInternal?MP.canControl("ops","securities"):MP.canControl("ops","client");
      const canApprove=master&&!approved&&intent.requester!==state.roleMeta[state.role].auditUser;
      const action=canApprove?btn("승인","desk-release-settlement","small success","check",`data-intent-id="${intent.id}"`):"";
      const pooled=intent.from!=="거래 잔고";
      return `<tr><td class="num">${intent.createdAt}</td>${showAccount?`<td>${chip(pooled?"수탁":MP.accountLabel(intent.primeAccountId),"muted")}</td>`:""}<td><b>${intent.transferType||MP.custodyTransferType(intent.from,intent.to)}</b><small>${transferEndpointLabel(intent.from||"거래 잔고")} → ${transferEndpointLabel(intent.to||intent.allocations.map(row=>row.custodian).join(", "))}, ${settlementQuantity(intent.totalQuantity,intent.asset,true)}</small></td><td>${intent.requester.split(" /")[0]}</td><td class="num">${cycleLabel}</td><td>${chip(approved?"승인, 정산 예정":"승인 대기",approved?"positive":"warning")} ${action}</td></tr>`;
    }).join("")||`<tr><td colspan="${showAccount?6:5}" class="empty-note">승인 대기 없음</td></tr>`;
    const owned=MP.canControl("exec","desk-master")?' data-owned-panel="desk-internal-release"':"";
    return panel("승인 대기",`<div class="table-scroll"${owned}><table class="data-table settlement-intents-table"><thead><tr><th>생성</th>${showAccount?"<th>계정</th>":""}<th>유형 및 내용</th><th>요청자</th><th>다음 정산</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`,{flush:true});
  }

  function recentTransfers(accountIds,showAccount) {
    const cycleLabel=MP.settlementCycleLabel();
    const holderId=MP.primeAccountById(accountIds[0])?.clientId||null;
    const tickets=state.custodyTransferTickets.filter(item=>transferHolderId(item)===holderId).map(item=>({...item,created:item.createdAt||item.cycle}));
    const runtime=state.settlementIntents.filter(item=>transferHolderId(item)===holderId&&!state.custodyTransferTickets.some(ticket=>ticket.intentId===item.id)).map(item=>({holderId:item.holderId,primeAccountId:item.primeAccountId,created:item.createdAt,from:item.from||"거래 잔고",to:item.to||item.allocations.map(row=>row.custodian).join(", "),transferType:item.transferType,asset:item.asset,quantity:item.totalQuantity,settledAt:null,state:item.approvalCount>=item.requiredApprovals?"정산 예정":"승인 대기"}));
    const rows=[...runtime,...tickets].map(item=>{
      const done=item.state==="정산 완료";
      return `<tr><td class="num">${item.created}</td>${showAccount?`<td>${chip(item.from==="거래 잔고"?MP.accountLabel(item.primeAccountId):"수탁","muted")}</td>`:""}<td>${item.transferType||MP.custodyTransferType(item.from,item.to)}</td><td>${transferEndpointLabel(item.from)}</td><td>${transferEndpointLabel(item.to)}</td><td class="align-right num">${settlementQuantity(item.quantity,item.asset,true)}</td><td class="num">${done?"":cycleLabel}</td><td>${chip(item.state,done?"positive":"warning")}${done&&item.settledAt?`<small class="subcell num">${item.settledAt}</small>`:""}</td></tr>`;
    }).join("")||`<tr><td colspan="${showAccount?8:7}" class="empty-note">최근 이체 없음</td></tr>`;
    return panel("최근 이체",`<div class="table-scroll"><table class="data-table settlement-recent-table"><thead><tr><th>생성</th>${showAccount?"<th>계정</th>":""}<th>이체 유형</th><th>출발</th><th>도착</th><th class="align-right">수량</th><th>다음 정산</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`,{flush:true});
  }

  /* 이체 표는 보유 주체 단위다. 커스터디에서 출발하는 건은 풀의 것이라 서브계정 한 개에
     속하지 않는다. 그래서 단일 서브계정 보기에서도 계정 열을 늘 세운다. 열이 없으면
     PRIME_C 보기에 PRIME_A 의 0.8 BTC 이체가 이름 없이 서서 보유를 넘긴 것처럼 읽힌다. */
  function transferSection(accountIds,scope) {
    const showAccount=true;
    return `<section class="settlement-transfer-section"><header><h2>이체</h2></header><div class="settlement-transfer-grid"><div class="settlement-transfer-side">${transferTicket(accountIds)}${scopedOpenIntents(accountIds,showAccount)}</div>${renderCustodyPolicyEditor(scope)}</div>${renderCustodyPolicyApproval(scope)}${recentTransfers(accountIds,showAccount)}</section>`;
  }

  function settlementAccountView(account,scope,tail,accountBar,accountIds=[account.id]) {
    return `<section class="view custody-view settlement-account-view" data-view="settlement">${accountBar}<section class="settlement-balance-band">${accountHeadline(account,accountIds)}<div class="settlement-main-grid"><div>${accountAssetTable(account,accountIds)}</div><aside>${accountBalanceComposition(account,accountIds)}${accountCustodians(account,accountIds)}</aside></div></section>${transferSection(accountIds,scope)}${tail}</section>`;
  }

  /* 고객 화면도 데스크 전체 보기와 같은 집계다. 커스터디 풀이 보유 주체 1곳에 1개이므로
     풀을 서브계정 한 개에 붙이면 총 잔고가 서브계정 합과 어긋난다. 고객이 열람하는
     Prime 계정 전부를 거래 잔고로 합치고 그 위에 풀을 얹는다. */
  function renderClientSettlement() {
    const company=MP.clientScopeCompany();
    const accountIds=MP.clientVisibleAccountIds();
    const accounts=accountIds.map(id=>MP.primeAccountById(id)).filter(Boolean);
    if(!company||!accounts.length)return '<section class="view custody-view" data-view="settlement"><div class="empty-note"><strong>노출 가능한 Prime 계정 없음</strong></div></section>';
    const account=aggregateSettlementAccounts(accounts);
    const bar=`<div class="settlement-account-bar"><div><small>Prime 계정</small><strong class="num">${accounts.map(item=>MP.accountLabel(item.id)).join(", ")}</strong></div>${chip(company.name,"info")}</div>`;
    return settlementAccountView(account,"client",clientAccountingRow(),bar,accounts.map(item=>item.id));
  }

  /* ---------- desk scope, the desk master owned blocks (USER_ACCOUNT_MODEL §4.1) ---------- */

  function deskOwnedPanel(title,body,{editable,owned}={}) {
    const inner=`<div${owned?` data-owned-panel="${owned}"`:""}><fieldset class="ownership-fieldset" ${editable?"":"disabled"}>${body}</fieldset></div>`;
    /* On a read only route the router appends the "조회 전용" chip to every panel header that
       holds no owned block, so a panel without one prints its own chip only on an editable route. */
    const routeAddsChip=!editable&&!owned&&MP.accessFor("settlement")==="R";
    const actions=routeAddsChip?"":chip(editable?"편집 가능":"조회 전용",editable?"positive":"muted");
    return panel(title,inner,{actions,flush:true});
  }

  function deskScopeSelect(user,field,options,editable) {
    const all=options.map(([id])=>id);
    const current=user[field].length===all.length&&all.length>1?"*":(user[field][0]||"");
    const list=all.length>1?[["*",`${options.map(([,label])=>label).join(", ")} 전체`],...options]:options;
    return scopeSelect(user,field,list,editable,{attr:"data-desk-scope",current});
  }

  function renderDeskTraderScope() {
    const company=MP.deskCompany();
    if(!company)return "";
    const editable=MP.canControl("ops","securities");
    const bookOptions=company.bookIds.map(id=>[id,state.etfBooks.find(book=>book.id===id)?.name||id]);
    const accountOptions=company.primeAccountIds.map(id=>[id,MP.accountLabel(id)]);
    const roleOptions=[["desk-master","데스크 마스터"],["desk-trader","데스크 트레이더"]];
    const rows=company.users.map(user=>{
      const roleCell=editable
        ?`<select data-desk-user-role="${user.id}">${roleOptions.map(([key,label])=>`<option value="${key}" ${MP.resolveRole(user.role)===key?"selected":""}>${label}</option>`).join("")}</select>`
        :`<span class="risk-static-note">${MP.roleMetaFor(user.role).label}</span>`;
      const derived=MP.deskExecuteAccountLabel(user.role);
      return `<tr><td class="main-cell">${user.name}<small class="subcell num">${user.id}</small></td><td>${roleCell}</td><td>${chip(user.status,user.status==="활성"?"positive":"warning")}</td><td>${deskScopeSelect(user,"visibleBookIds",bookOptions,editable)}</td><td>${deskScopeSelect(user,"visiblePrimeAccountIds",accountOptions,editable)}</td><td><span class="risk-static-note">${derived}</span></td></tr>`;
    }).join("")||'<tr><td colspan="6" class="empty-note">데스크 서브 사용자 없음</td></tr>';
    const body=`<div class="table-scroll"><table class="data-table"><thead><tr><th>사용자</th><th>역할</th><th>상태</th><th>열람 ETF 북</th><th>열람 Prime 계정</th><th>집행 Prime 계정 (파생)</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    return deskOwnedPanel("서브 사용자와 스코프",body,{editable,owned:editable?"desk-trader-scope":null});
  }

  function renderDeskInternalRelease() {
    const company=MP.deskCompany();
    if(!company)return "";
    const editable=MP.canControl("exec","desk-master");
    const intents=state.settlementIntents.filter(intent=>intent.deskInternal);
    const rows=intents.map(intent=>{
      const account=MP.primeAccountById(intent.primeAccountId);
      const released=Boolean(intent.deskApprovedBy);
      const selfRequested=intent.requester===state.roleMeta[state.role].auditUser;
      const can=editable&&!released&&!selfRequested;
      const reason=released?"":!editable?"데스크 내부 1차 승인은 데스크 마스터 소관":selfRequested?"기안자 본인, 승인 불가":"";
      const attrs=can?`data-intent-id="${intent.id}"`:`data-intent-id="${intent.id}" disabled${reason?` title="${reason}"`:""}`;
      return `<tr><td class="main-cell num">${intent.id}</td><td class="num">${MP.accountLabel(intent.primeAccountId)}</td><td>커스터디 배분 ${intent.asset}<small class="subcell num">${MP.custodyQuantityText(intent.totalQuantity,intent.asset)}</small></td><td>${intent.requester}</td><td>${released?chip(`승인 ${intent.deskApprovedBy.split(" / ")[0]} ${intent.deskApprovedAt||""}`,"positive"):chip("1차 대기","warning")}</td><td class="align-right">${btn(released?"1차 승인 완료":"1차 승인","desk-release-settlement","small success","check",attrs)}</td></tr>`;
    }).join("");
    const body=rows
      ?`<div class="table-scroll"><table class="data-table"><thead><tr><th>이체 요청서 ID</th><th>출발 Prime 계정</th><th>내용</th><th>기안자</th><th>1차 상태</th><th class="align-right">내부 승인</th></tr></thead><tbody>${rows}</tbody></table></div>`
      :'<div class="empty-note"><strong>데스크 이체 요청서 없음</strong></div>';
    return deskOwnedPanel("이체 요청서 1차 승인",body,{editable,owned:editable?"desk-internal-release":null});
  }

  function deskScopePanels() {
    const firm=state.roleMeta[state.role].affiliation==="firm";
    if(!firm)return "";
    const panels=[renderDeskTraderScope(),MP.isDeskRole()?renderDeskInternalRelease():""].filter(Boolean);
    return panels.length?`<div class="grid cols-${panels.length}">${panels.join("")}</div>`:"";
  }

  /* ---------- desk scope, the desk's own Prime accounts ----------
     Same shape as the client mount: the desk reads its own two Prime accounts, not the prime
     wide screen. The custody path, the settlement cycle, the daily evidence, the recent
     transfer table and every other client's balance stay on the prime mount. */

  function renderDeskBalanceTrio(wallets) {
    return renderScopeBalanceTrio(wallets);
  }

  function renderDeskAssetBalances(accountIds,wallets) {
    return renderScopeAssetBalances(wallets,wallet=>MP.deskWalletCustodians(wallet),{
      
      chipLabel:"당사 자체",chipTone:"violet",
      footLabel:"당사 자체 합계"
    });
  }

  function renderDeskAllocation(accountIds) {
    return renderScopeAllocation(accountIds);
  }

  function renderDeskOpenIntents(accountIds) {
    return renderScopeOpenIntents(accountIds);
  }

  function renderDeskVendorSet() {
    const company=MP.deskCompany();
    const editable=MP.canControl("ops","securities");
    return deskOwnedPanel("벤더 세트",MP.renderCustodyVendorSetBody(company.id,editable),{editable,owned:editable?"desk-vendor-set":null});
  }

  function renderDeskTradeCap() {
    const company=MP.deskCompany();
    const editable=MP.canControl("ops","securities");
    const value=MP.clientPerTradeBtcCap(company);
    const body=`<div class="risk-setting-list"><div class="risk-setting-row"><div class="risk-setting-copy"><label>거래당 BTC 상한</label></div><div class="risk-setting-control">${editable?`<div class="risk-number-control"><input class="num" type="number" min="1" step="1" value="${value}" data-risk-field="deskPerTradeBtcCap"><span>BTC</span></div>${btn("상한 저장","save-desk-cap","small primary","check")}`:`<div class="risk-number-control readonly"><strong class="num">${value}</strong><span>BTC</span></div>`}</div></div></div>`;
    return deskOwnedPanel("거래당 상한",body,{editable,owned:editable?"desk-trade-cap":null});
  }

  function deskSettlementTail() {
    return `<div class="settlement-admin-grid">${renderDeskTraderScope()}${renderDeskVendorSet()}${renderDeskTradeCap()}</div>`;
  }

  function renderDeskSettlement() {
    const accountIds=MP.deskVisibleAccountIds();
    if(!MP.deskCompany()||!accountIds.length)return '<section class="view custody-view" data-view="settlement"><div class="empty-note"><strong>노출 가능한 Prime 계정 없음</strong></div></section>';
    const selected=accountIds.includes(state.settlementDeskAccountId)?state.settlementDeskAccountId:"*";
    const accounts=accountIds.map(id=>MP.primeAccountById(id)).filter(Boolean);
    const account=selected==="*"?aggregateSettlementAccounts(accounts):MP.primeAccountById(selected);
    const options=`<option value="*" ${selected==="*"?"selected":""}>전체</option>`+accountIds.map(id=>`<option value="${id}" ${id===selected?"selected":""}>${MP.accountLabel(id)}</option>`).join("");
    const bar=`<div class="settlement-account-bar"><div data-owned-panel="settlement-account-select"><small>Prime 계정</small><select data-settlement-desk-account>${options}</select></div></div>`;
    return settlementAccountView(account,"desk","",bar,selected==="*"?accountIds:[selected]);
  }

  function renderSettlement() {
    if(MP.clientScopeActive())return renderClientSettlement();
    if(MP.isDeskRole())return renderDeskSettlement();
    const assets=state.wallets;
    const allocationAssets=Object.values(assets.reduce((map,wallet)=>{map[wallet.asset]??={ticker:wallet.asset,quantity:0};map[wallet.asset].quantity+=wallet.quantity;return map;},{}));
    return `<section class="view custody-view" data-view="settlement"><div class="custody-layout"><main class="custody-main stack">${renderSettlementRoute()}<div class="settlement-overview">${renderBalanceTrio(assets)}${renderSettlementCycle()}</div>${renderAssetBalances(assets)}${custodyTicketPanel()}${renderOpenIntents()}${renderSettlementBatch()}${renderRecentTransfers()}${renderDailyEvidence()}</main><aside class="custody-rail stack">${renderAllocation(allocationAssets)}${renderPrimeAccountAllocation()}${renderCustodyAccounts()}</aside></div></section>`;
  }

  /* 프라임 2역할이 커스터디/정산 라우트를 잃었으므로 (D-0910-09) 2차 승인 패널과 정산 배치
     패널은 리스크 화면이 그대로 불러 쓴다. 렌더러는 여기 한 벌만 있고 마운트만 둘이다. */
  Object.assign(MP,{renderSettlement,renderClientSettlement,renderDeskSettlement,balanceValueUsd,settlementSourceBalance:ticketSourceBalance,
    renderSettlementApprovals:renderOpenIntents,renderSettlementBatchPanel:renderSettlementBatch});
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/risk.js">
(function (MP) {
  "use strict";
  const {state,chip,panel,btn}=MP;
  const baseTabs=[["limits","한도"],["users","유저 권한 관리"],["rfq-vendors","RFQ 벤더 설정"],["custody-vendors","수탁 벤더 설정"],["trade-caps","거래 상한 설정"]];
  const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const isBiz=()=>MP.resolveRole(state.role)==="biz-admin";
  function holderCompany(){if(isBiz())return state.clients.find(client=>client.id===state.riskCompanyId)||null;if(MP.clientScopeActive())return MP.clientScopeCompany();if(MP.isDeskRole())return MP.deskCompany();return null;}
  const canEdit=company=>Boolean(company)&&(isBiz()||MP.canControl("ops",company.internal?"securities":"client"));
  function numberControl(field,value,unit,{step=1,company=false,disabled=false}={}){const attr=company?`data-company-risk-field="${field}"`:`data-risk-field="${field}"`;return `<div class="risk-number-control"><input class="num" type="number" min="0" step="${step}" value="${value}" ${attr}${disabled?" disabled":""}><span>${unit}</span></div>`;}
  function readValue(value,unit){return `<div class="risk-number-control readonly"><strong class="num">${Number(value).toLocaleString("ko-KR",{maximumFractionDigits:4})}</strong><span>${unit}</span></div>`;}
  const settingRow=(label,control,className="")=>`<div class="risk-setting-row ${className}"><div class="risk-setting-copy"><label>${label}</label></div><div class="risk-setting-control">${control}</div></div>`;
  const simplePanel=(title,body,owned="")=>panel(title,`<div${owned?` data-owned-panel="${owned}"`:""}>${body}</div>`,{flush:true});

  function companyRegistry(){
    const order=["AP-DESK-INT","HB-AM-ETF-01","CH-SEC-01","GA-AM-RFQ-01","HW-INST-01","CS-SEC-01"];
    const firms=order.map(id=>state.clients.find(client=>client.id===id)).filter(Boolean);
    const firmRow=`<button type="button" class="risk-company-row ${state.riskCompanyId==="firm"?"active":""}" data-action="risk-company" data-company="firm"><span><b>전사</b><small>Prime Services</small></span>${chip(state.killSwitchActive?"차단":"정상",state.killSwitchActive?"negative":"positive")}<em class="num">${state.clients.length}개사</em></button>`;
    const rows=firms.map(company=>`<button type="button" class="risk-company-row ${state.riskCompanyId===company.id?"active":""}" data-action="risk-company" data-company="${company.id}"><span><b>${company.name}</b><small>${company.category}</small></span>${chip(company.onboarding,company.onboarding==="승인 완료"?"positive":"warning")}<em class="num">${company.primeAccountIds.length}계정</em></button>`).join("");
    return `<aside class="risk-company-list" aria-label="계약 회사 목록">${firmRow}${rows}</aside>`;
  }
  function accountRegistry(company){
    const rows=company.primeAccountIds.map(id=>{const account=state.primeAccounts.find(item=>item.id===id);const books=state.etfBooks.filter(book=>book.clientId===company.id&&book.primeAccountId===id).map(book=>book.name).join(", ")||"없음";return `<tr><td class="main-cell num">${MP.accountLabel(id)}</td><td class="wallet-id-cell">${esc(account?.walletIds[0]||"미배정")}</td><td>${books}</td><td>${chip(account?.active?"활성":"중지",account?.active?"positive":"warning")}</td></tr>`;}).join("");
    return `<div class="table-scroll risk-account-registry"><table class="data-table"><thead><tr><th>서브계정</th><th>지갑 ID</th><th>연결 북</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  function companyLimits(company){
    const editable=canEdit(company),limits=company.riskLimits||{};
    const rows=isBiz()?[settingRow("명목 한도",numberControl("limitKrw",company.limitKrw,"₩",{step:100000000,company:true})),settingRow("거래당 상한",numberControl("perTradeBtcCap",company.perTradeBtcCap,"BTC",{company:true})),settingRow("RFQ당 한도",numberControl("rfqLimitKrw",limits.rfqLimitKrw,"₩",{step:100000000,company:true})),settingRow("계약 요율",numberControl("feeBps",company.feeBps,"bp",{step:.1,company:true}))]:[settingRow("명목 한도",readValue(company.limitKrw,"₩")),settingRow("거래당 상한",readValue(company.perTradeBtcCap,"BTC")),settingRow("RFQ당 한도",readValue(limits.rfqLimitKrw,"₩")),settingRow("계약 요율",readValue(company.feeBps,"bp"))];
    const active=Boolean(state.killSwitchByHolder[company.id]);
    rows.push(settingRow("킬 스위치",`<div class="kill-setting-control">${chip(active?"신규 주문 차단":"거래 가능",active?"negative":"positive")}${btn(active?"해제":"활성화",active?"release-holder-kill":"activate-holder-kill",active?"warning":"danger","alert",editable?"":"disabled")}</div>`,"danger-setting-row"));
    return `${accountRegistry(company)}${simplePanel(`${company.name} 한도`,`<div class="risk-setting-list">${rows.join("")}</div>`,`holder-limits-${company.id}`)}${isBiz()?`<div class="risk-settings-footer">${btn("변경 저장","save-company-risk","primary","check")}</div>`:""}`;
  }
  function firmLimits(){
    const settings=state.riskSettings,active=state.killSwitchActive,queued=typeof MP.pendingCycleTickets==="function"?MP.pendingCycleTickets().length:0;
    const rows=[settingRow("일일 명목한도",numberControl("dailyNotionalKrw",settings.dailyNotionalKrw,"₩",{step:100000000})),settingRow("순익스포저",numberControl("netExposureBtc",settings.netExposureBtc,"BTC",{step:.1})),settingRow("미결제 한도",numberControl("unsettledLimitKrw",settings.unsettledLimitKrw,"₩",{step:100000000})),settingRow("전사 킬 스위치",`<div class="kill-setting-control">${chip(active?"신규 주문 차단":"거래 가능",active?"negative":"positive")}${btn(active?"해제":"활성화",active?"release-kill":"activate-kill",active?"warning":"danger","alert")}</div>`,"danger-setting-row")];
    const defaults=settingRow("고객별 거래당 BTC 상한 기본값",numberControl("clientPerTradeBtcCapDefault",settings.clientPerTradeBtcCapDefault,"BTC"));
    const settlement=`<div class="risk-setting-list">${settingRow("정산 사이클 시각",`<div class="risk-cycle-control"><input type="time" data-settlement-cycle-time value="${state.settlementCycle.time}">${btn("저장","save-settlement-cycle-time","small primary","check")}</div>`)}${settingRow("정산 상태",`${chip(`정산 예정 ${queued}건`,queued?"warning":"muted")}${chip(`배분 정책 ${state.custodyPolicies.length}건`,"info")}`)}${settingRow("정산 실행",btn("정산 사이클 실행","run-settlement-cycle","small primary","check"))}</div>`;
    return `${simplePanel("전사 한도",`<div class="risk-setting-list">${rows.join("")}</div>`,"global-limits")}${simplePanel("고객 기본값",`<div class="risk-setting-list">${defaults}</div>`,"client-defaults")}${simplePanel("정산 통제",settlement,"settlement-control")}<div class="risk-settings-footer">${btn("기본값 복원","restore-risk-defaults")}${btn("변경 저장","save-risk-settings","primary","check")}</div>`;
  }

  function scopeSelect(user,field,options,desk,editable,{allowNone=false,all=false}={}){const values=Array.isArray(user[field])?user[field]:[],current=field==="executePrimeAccountId"?(user[field]||""):(all&&values.length===options.length&&options.length>1?"*":(values[0]||""));const entries=[...(allowNone?[["","없음"]]:[]),...(all&&options.length>1?[["*","전체"]]:[]),...options];const attribute=isBiz()?`data-risk-user-scope="${field}"`:`data-${desk?"desk":"client"}-scope="${field}"`;return `<select ${attribute} data-user-id="${user.id}"${editable?"":" disabled"}>${entries.map(([value,label])=>`<option value="${value}"${current===value?" selected":""}>${label}</option>`).join("")}</select>`;}
  function renderUsers(company){
    const desk=Boolean(company.internal),editable=canEdit(company),books=company.bookIds.map(id=>[id,state.etfBooks.find(book=>book.id===id)?.name||id]),accounts=company.primeAccountIds.map(id=>[id,MP.accountLabel(id)]),roles=desk?[["desk-master","데스크 마스터"],["desk-trader","데스크 트레이더"]]:[["client-master","마스터/매니저"],["client-trader","트레이더"],["client-accounting","관리회계"]];
    const rows=company.users.map(user=>`<tr><td class="main-cell">${user.name}<small class="subcell num">${user.id}</small></td><td><select ${isBiz()?"data-risk-user-role":`data-${desk?"desk":"client"}-user-role="${user.id}"`} data-user-id="${user.id}"${editable?"":" disabled"}>${roles.map(([key,label])=>`<option value="${key}"${MP.resolveRole(user.role)===key?" selected":""}>${label}</option>`).join("")}</select></td><td>${chip(user.status,user.status==="활성"?"positive":"warning")}</td><td>${scopeSelect(user,"visibleBookIds",books,desk,editable,{all:desk})}</td><td>${scopeSelect(user,"visiblePrimeAccountIds",accounts,desk,editable,{all:desk})}</td><td>${desk?"데스크 정책":scopeSelect(user,"executePrimeAccountId",accounts,desk,editable,{allowNone:true})}</td></tr>`).join("")||'<tr><td colspan="6"><div class="empty-note">등록 사용자 없음</div></td></tr>';
    return simplePanel("유저 권한 관리",`<div class="table-scroll"><table class="data-table"><thead><tr><th>사용자</th><th>역할</th><th>상태</th><th>열람 ETF 북</th><th>열람 Prime 계정</th><th>집행 Prime 계정</th></tr></thead><tbody>${rows}</tbody></table></div>`,`user-scope-${company.id}`);
  }
  function vendorTable(company,kind){const custody=kind==="custody",rows=custody?company.custodyVendors:company.rfqVendors;const body=rows.map(row=>{const value=custody?[...new Set(MP.custodyHoldingsFor(company.id).filter(item=>item.custodian===row.name&&item.quantity>0).map(item=>item.asset))].join(", ")||"없음":row.interactionCount.toLocaleString("ko-KR");return `<tr><td class="main-cell">${esc(row.name)}</td><td class="num">${row.registeredAt}</td><td class="num">${row.lastInteractionAt}</td><td class="num">${value}</td><td class="num wallet-id-cell">${esc(row.walletId)}</td><td>${chip(row.status,row.status==="등록 완료"?"positive":"warning")}</td></tr>`;}).join("")||'<tr><td colspan="6"><div class="empty-note">등록 벤더 없음</div></td></tr>';const head=custody?["커스터디","등록일","최근 이체","보관 자산","지갑 ID","상태"]:["벤더","등록일","최근 거래","거래 건수","지갑 ID","상태"];return `<div class="table-scroll"><table class="data-table risk-vendor-table"><thead><tr>${head.map(label=>`<th>${label}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;}
  function vendorForm(company,kind){const custody=kind==="custody",catalog=custody?state.custodians.map(name=>({id:name,name})):state.vendorQuotes.map(vendor=>({id:vendor.id,name:vendor.name.replace(" Prime","")})),rows=custody?company.custodyVendors:company.rfqVendors,used=new Set(rows.map(row=>custody?row.name:row.id)),available=catalog.filter(item=>!used.has(item.id));return `<form class="risk-vendor-form"><label><span>벤더명</span><select data-risk-vendor-name>${available.map(item=>`<option value="${esc(item.id)}">${esc(item.name)}</option>`).join("")}</select></label><label><span>지갑 ID</span><input type="text" data-risk-vendor-wallet pattern="[0-9a-f]{32}" maxlength="32" placeholder="7f3a9c2e5b1d4f8a6c0e2b9d4a7f1c3e"></label><label><span>KYC 문서</span><input type="file" data-risk-vendor-file accept=".pdf,.png,.jpg,.jpeg"><small data-risk-file-name>${esc(state.riskVendorFileName||"선택된 파일 없음")}</small></label><div class="risk-vendor-form-actions">${btn("취소","cancel-risk-vendor","small")}${btn("제출","submit-risk-vendor","small primary","check",available.length?"":"disabled")}</div></form>`;}
  /* D-0915: 벤더 등록은 마스터 소관이라, 열람 전용 스윕이 버튼과 폼을 끄지 않도록 소유 패널로 감싼다. */
  function renderVendorSettings(company,kind){const editable=canEdit(company),open=editable&&state.riskVendorForm===kind,action=!open&&editable?btn("벤더 추가","add-risk-vendor","small primary","plus",`data-vendor-kind="${kind}"`):"";const inner=`${action?`<div class="risk-tab-toolbar">${action}</div>`:""}${open?vendorForm(company,kind):vendorTable(company,kind)}`;return panel(kind==="custody"?"수탁 벤더 설정":"RFQ 벤더 설정",editable?`<div data-owned-panel="vendor-${kind}-${company.id}">${inner}</div>`:`<div>${inner}</div>`,{flush:true});}
  function renderTradeCaps(company){const editable=canEdit(company),rows=state.pairs.map(pair=>`<tr><td class="main-cell">${MP.pairLabel(pair)}<small class="subcell num">${pair.symbol}</small></td><td>${pair.base}</td><td>${pair.category}</td><td><div class="risk-number-control"><input class="num" type="number" min="0" step="${pair.sizeDigits>2?"0.0001":"1"}" value="${company.perTradeCaps[pair.symbol]}" data-risk-trade-cap="${pair.symbol}"${editable?"":" disabled"}><span>${pair.base}</span></div></td></tr>`).join("");return simplePanel("거래 상한 설정",`<div class="table-scroll"><table class="data-table"><thead><tr><th>마켓</th><th>기준 자산</th><th>카테고리</th><th>거래당 최대</th></tr></thead><tbody>${rows}</tbody></table></div>`,`trade-caps-${company.id}`);}
  function renderAllocations(company){const editable=canEdit(company),rows=company.venueAllocations.map((row,index)=>`<tr><td class="main-cell">${row.name}</td><td><input class="num" type="number" min="0" max="100" value="${row.weight}" data-risk-allocation="weight" data-index="${index}"${editable?"":" disabled"}>%</td><td><input class="num" type="number" min="0" step="100000000" value="${row.dailyLimitKrw}" data-risk-allocation="dailyLimitKrw" data-index="${index}"${editable?"":" disabled"}></td><td>${chip(row.status,"positive")}</td></tr>`).join("");return simplePanel("라인 배분",`<div class="table-scroll"><table class="data-table"><thead><tr><th>벤더</th><th>배분 비중</th><th>일일 한도</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`,`allocations-${company.id}`);}
  function ensureTab(tabs){if(!tabs.some(([id])=>id===state.riskTab))state.riskTab="limits";}
  function scopedContent(company){const tabs=isBiz()?[...baseTabs,["allocations","라인 배분"]]:baseTabs;ensureTab(tabs);const tabList=tabs.map(([id,label])=>`<button type="button" class="${state.riskTab===id?"active":""}" data-action="risk-tab" data-tab="${id}">${label}</button>`).join("");const renderers={limits:()=>companyLimits(company),users:()=>renderUsers(company),"rfq-vendors":()=>renderVendorSettings(company,"rfq"),"custody-vendors":()=>renderVendorSettings(company,"custody"),"trade-caps":()=>renderTradeCaps(company),allocations:()=>renderAllocations(company)};return `<div class="portfolio-tabs risk-tabs" data-owned-panel="risk-tabs"><div class="portfolio-tab-list">${tabList}</div></div><div class="risk-tab-body">${renderers[state.riskTab]()}</div>`;}
  function renderRisk(){if(isBiz()){if(state.riskCompanyId!=="firm"&&!state.clients.some(client=>client.id===state.riskCompanyId))state.riskCompanyId="firm";const company=holderCompany(),right=state.riskCompanyId==="firm"?firmLimits():scopedContent(company);return `<section class="view risk-settings-page" data-view="risk"><div class="risk-admin-layout">${companyRegistry()}<main class="risk-company-detail">${right}</main></div></section>`;}const company=holderCompany();
    /* D-0915: IT 관리자는 보유 주체가 없어 company 가 null 이다. 빈 상태로 내려야 화면이 죽지 않는다. */
    if(!company)return `<section class="view risk-settings-page" data-view="risk">${panel("",'<div class="empty-note"><strong>보유 주체 미지정</strong><small>한도와 벤더 설정은 데스크 또는 고객사 역할에서 열람</small></div>',{flush:true,className:"portfolio-tabs-panel risk-tabs-panel"})}</section>`;
    return `<section class="view risk-settings-page" data-view="risk">${panel("",scopedContent(company),{flush:true,className:"portfolio-tabs-panel risk-tabs-panel"})}</section>`;}
  Object.assign(MP,{renderRisk,renderClientRisk:renderRisk});
})(window.MP = window.MP || {});
