  <script data-source="js/core/custody.js">
(function (MP) {
  "use strict";

  const {state,chip,btn} = MP;

  const quantityDigits = {BTC:8,ETH:6,USD:2,USDT:2,KRW:0};
  const epsilon = 1e-8;

  function round8(value) {
    return Math.round(Number(value)*1e8)/1e8;
  }

  function quantityText(value,asset) {
    const digits=quantityDigits[asset]??4;
    return `${Number(value).toLocaleString("en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits})} ${asset}`;
  }

  function custodyTransferType(from,to) {
    if(from==="거래 잔고")return "거래 잔고 → 커스터디";
    if(to==="거래 잔고"||primeAccountById(to))return "커스터디 → 거래 잔고";
    return "커스터디 간 이체";
  }

  function custodyEndpointLabel(value) {
    return primeAccountById(value)?MP.accountLabel(value):value;
  }

  function percentText(value) {
    return `${Number(value).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})} %`;
  }

  function primeAccountById(id) {
    return state.primeAccounts.find(item=>item.id===id)||null;
  }

  function clientById(id) {
    return state.clients.find(item=>item.id===id)||null;
  }

  function internalClient() {
    return state.clients.find(item=>item.internal)||null;
  }

  function clientForAccount(id) {
    const account=primeAccountById(id);
    return account?clientById(account.clientId):null;
  }

  function accountAssets(account) {
    return account?[...new Set(accountLiveRows(account).map(item=>item.asset))]:[];
  }

  function accountHolding(account,asset) {
    if(!account)return 0;
    return accountLiveBalance(account.id,asset);
  }

  function custodyHoldingsFor(holderId) {
    return state.custodyHoldings[holderId]||[];
  }

  /* D-0921: 수탁 행은 서브계정에 귀속된다. 화면이 서브계정 하나를 보고 있으면 그 계정에
     귀속된 행만 세고, 전체 보기는 그 계정들의 행을 모두 센다. 이 한 곳만 거치면
     PRIME_A + PRIME_B + PRIME_C 가 전체와 어긋날 수 없다. */
  function custodyHoldingsForAccounts(holderId,accountIds) {
    const rows=custodyHoldingsFor(holderId);
    if(!Array.isArray(accountIds)||!accountIds.length)return rows;
    const allowed=new Set(accountIds);
    return rows.filter(row=>allowed.has(row.accountId));
  }

  /* 귀속을 지우고 커스터디와 자산 단위로 합친 풀 보기. 보유자 통합 잔고를 찍는 화면만 쓴다. */
  function custodyPoolRows(holderId,accountIds=null) {
    const groups=new Map();
    custodyHoldingsForAccounts(holderId,accountIds).forEach(row=>{
      const key=`${row.custodian}|${row.asset}`;
      const entry=groups.get(key);
      if(entry){
        entry.quantity=round8(entry.quantity+(Number(row.quantity)||0));
        if(String(row.lastTransferAt||"")>String(entry.lastTransferAt||""))entry.lastTransferAt=row.lastTransferAt;
      }else groups.set(key,{custodian:row.custodian,asset:row.asset,quantity:Number(row.quantity)||0,lastTransferAt:row.lastTransferAt});
    });
    return [...groups.values()];
  }

  /* 귀속 행 1개를 찾거나 없으면 만든다. 커스터디, 자산, 서브계정 3개가 열쇠다. */
  function custodyAttributionRow(pool,custodian,asset,accountId) {
    return pool.find(row=>row.custodian===custodian&&row.asset===asset&&row.accountId===accountId)||null;
  }

  /* 출발 귀속이 지정되지 않은 옛 이체 건은 그 커스터디와 자산에서 가장 많이 들고 있는
     서브계정에서 빼낸다. 화면의 이체 요청서가 고르는 출처와 같은 규칙이다. */
  function custodySourceRow(pool,custodian,asset,accountId) {
    const direct=accountId?custodyAttributionRow(pool,custodian,asset,accountId):null;
    if(direct)return direct;
    return pool.filter(row=>row.custodian===custodian&&row.asset===asset)
      .sort((a,b)=>b.quantity-a.quantity)[0]||null;
  }

  function custodyIntentSourceAccountId(intent) {
    return intent.fromAccountId||intent.primeAccountId||null;
  }

  /* 이전 화면의 호출 계약만 유지하는 얇은 별칭이다. 반환 데이터는 언제나 보유자 풀이다. */
  function allocationRows(accountId,asset=null) {
    const account=primeAccountById(accountId);
    if(!account)return [];
    return custodyHoldingsFor(account.clientId).filter(row=>!asset||row.asset===asset);
  }

  function allocationTotal(accountId,asset) {
    return round8(allocationRows(accountId,asset).reduce((sum,row)=>sum+row.quantity,0));
  }

  /* 화이트리스트 항목은 문자열일 수도 있고 등록 정보를 담은 객체일 수도 있으므로
     이름만 뽑아 쓴다. custodyVendorNames 게터가 있으면 그 값을 그대로 쓴다. */
  function clientCustodyVendorNames(client) {
    if(!client)return [];
    const list=Array.isArray(client.custodyVendorNames)?client.custodyVendorNames:client.custodyVendors;
    return (list||[]).map(item=>typeof item==="string"?item:item&&item.name).filter(Boolean);
  }

  function custodyVendorsForClient(clientId) {
    return clientCustodyVendorNames(clientById(clientId)).filter(name=>state.custodians.includes(name));
  }

  function custodyVendorsForAccount(accountId) {
    const account=primeAccountById(accountId);
    return account?custodyVendorsForClient(account.clientId):[];
  }

  function portalUserForRole(company,role=state.role) {
    if(!company)return null;
    const key=MP.resolveRole(role);
    return company.users.find(user=>MP.resolveRole(user.role)===key)||null;
  }

  function custodyTicketAccountIds(role=state.role) {
    if(role==="biz-admin")return state.clients.flatMap(client=>client.primeAccountIds);
    if(MP.isDeskRole(role))return MP.deskVisibleAccountIds(role);
    if(MP.roleMetaFor(role)?.affiliation!=="client")return [];
    const company=clientById(state.clientPortal.clientId);
    const user=portalUserForRole(company,role);
    if(!company||!user)return [];
    return user.visiblePrimeAccountIds.filter(id=>company.primeAccountIds.includes(id));
  }

  function custodyExecuteAccountIds(role=state.role) {
    if(MP.isDeskRole(role))return MP.deskExecuteAccountIds(role);
    if(MP.roleMetaFor(role)?.affiliation!=="client")return custodyTicketAccountIds(role);
    const company=clientById(state.clientPortal.clientId);
    const user=portalUserForRole(company,role);
    if(!company||!user||!user.executePrimeAccountId)return [];
    return [user.executePrimeAccountId];
  }

  function custodyTicket(surface) {
    return state.custodyTickets[surface];
  }

  function resolveCustodyTicket(surface,role=state.role) {
    const ticket=custodyTicket(surface);
    const accountIds=custodyTicketAccountIds(role);
    if(!ticket.primeAccountId||!accountIds.includes(ticket.primeAccountId))ticket.primeAccountId=accountIds[0]||null;
    const account=primeAccountById(ticket.primeAccountId);
    const assets=accountAssets(account);
    if(!assets.includes(ticket.asset))ticket.asset=assets.includes("BTC")?"BTC":assets[0]||"BTC";
    const vendors=custodyVendorsForAccount(ticket.primeAccountId);
    ticket.rows=ticket.rows.filter(row=>!row.custodian||vendors.includes(row.custodian));
    return ticket;
  }

  function custodyTicketView(surface,role=state.role) {
    const ticket=resolveCustodyTicket(surface,role);
    const accountIds=custodyTicketAccountIds(role);
    const account=primeAccountById(ticket.primeAccountId);
    const vendors=custodyVendorsForAccount(ticket.primeAccountId);
    const holding=accountHolding(account,ticket.asset);
    const used=round8(ticket.rows.reduce((sum,row)=>sum+(Number.isFinite(row.value)?row.value:0),0));
    const remainder=ticket.mode==="percent"?round8(100-used):round8(holding-used);
    const named=ticket.rows.filter(row=>Boolean(row.custodian));
    const duplicate=new Set(named.map(row=>row.custodian)).size!==named.length;
    const outsideSet=ticket.rows.some(row=>row.custodian&&!vendors.includes(row.custodian));
    const complete=ticket.rows.length>0&&named.length===ticket.rows.length&&ticket.rows.every(row=>Number.isFinite(row.value)&&row.value>0);
    const executable=custodyExecuteAccountIds(role).includes(ticket.primeAccountId);
    const totalQuantity=ticket.mode==="percent"?round8(ticket.rows.reduce((sum,row)=>sum+holding*(row.value||0)/100,0)):used;
    return {ticket,accountIds,account,vendors,holding,used,remainder,duplicate,outsideSet,complete,executable,totalQuantity,
      balanced:Math.abs(remainder)<epsilon,
      submittable:complete&&!duplicate&&!outsideSet&&Math.abs(remainder)<epsilon&&executable};
  }

  function ticketAllocations(surface,role=state.role) {
    const view=custodyTicketView(surface,role);
    return view.ticket.rows.map(row=>{
      const quantity=view.ticket.mode==="percent"?round8(view.holding*row.value/100):round8(row.value);
      return {custodian:row.custodian,asset:view.ticket.asset,quantity,percent:view.holding?round8(quantity/view.holding*100):0};
    });
  }

  function custodyBalanceHolders(clientId) {
    const client=clientById(clientId);
    if(!client)return [];
    const holders=new Set();
    custodyHoldingsFor(clientId).forEach(row=>{if(row.quantity>0)holders.add(row.custodian);});
    state.wallets.filter(wallet=>wallet.clientId===clientId&&wallet.quantity>0).forEach(wallet=>holders.add(wallet.custodian));
    return [...holders];
  }

  function applyCustodyIntent(intent) {
    const account=primeAccountById(intent.primeAccountId);
    if(!account)return false;
    const pool=custodyHoldingsFor(intent.holderId||account.clientId);
    const quantity=round8(intent.totalQuantity);
    const live=accountLiveRows(account).find(row=>row.asset===intent.asset);
    /* D-0921: 귀속은 이체를 따라 움직인다. 커스터디 배분은 출발 서브계정에 귀속되고,
       커스터디 간 이체는 출발 행의 귀속을 그대로 들고 가며, 커스터디에서 서브계정으로
       돌아오면 그 계정의 거래 잔고로 들어가면서 출발 계정의 귀속이 사라진다. */
    if(intent.from==="거래 잔고"){
      const destination=custodyAttributionRow(pool,intent.to,intent.asset,account.id);
      if(live)live.quantity=round8(Math.max(0,live.quantity-quantity));
      if(destination){destination.quantity=round8(destination.quantity+quantity);destination.lastTransferAt=intent.cycleShort||destination.lastTransferAt;}
      else pool.push({custodian:intent.to,asset:intent.asset,accountId:account.id,quantity,lastTransferAt:intent.cycleShort});
      return true;
    }
    const source=custodySourceRow(pool,intent.from,intent.asset,custodyIntentSourceAccountId(intent));
    const sourceAccountId=source?source.accountId:custodyIntentSourceAccountId(intent);
    if(source)source.quantity=round8(Math.max(0,source.quantity-quantity));
    if(primeAccountById(intent.to)||intent.to==="거래 잔고"){
      const target=primeAccountById(intent.to)||account;
      const targetLive=accountLiveRows(target).find(row=>row.asset===intent.asset);
      if(targetLive)targetLive.quantity=round8(targetLive.quantity+quantity);
      else target.liveBalances.push({asset:intent.asset,quantity});
    }else{
      const destination=custodyAttributionRow(pool,intent.to,intent.asset,sourceAccountId);
      if(destination){destination.quantity=round8(destination.quantity+quantity);destination.lastTransferAt=intent.cycleShort||destination.lastTransferAt;}
      else pool.push({custodian:intent.to,asset:intent.asset,accountId:sourceAccountId,quantity,lastTransferAt:intent.cycleShort});
    }
    return true;
  }

  function etfBookConflict(etfId,bookId) {
    const etf=state.etfs.find(item=>item.id===etfId);
    if(!etf)return "미등록 ETF";
    if(etf.bookId===bookId)return null;
    const current=state.etfBooks.find(book=>book.id===etf.bookId);
    return `${etf.name}은 이미 ${current?current.name:etf.bookId} 소속, ETF 1종은 북 1개`;
  }

  function duplicateEtfAssignments() {
    const counts=new Map();
    state.lpBookRows.forEach(row=>counts.set(row.etfId,(counts.get(row.etfId)||0)+1));
    return [...counts.entries()].filter(([,count])=>count>1).map(([etfId])=>etfId);
  }

  function ticketAccountOptions(view) {
    return view.accountIds.map(id=>{
      const account=primeAccountById(id);
      const company=clientForAccount(id);
      return `<option value="${id}" ${view.ticket.primeAccountId===id?"selected":""}>${MP.accountLabel(id)}, ${company?company.name:"미배정"}</option>`;
    }).join("");
  }

  function ticketRowMarkup(surface,view,editable) {
    if(!view.ticket.rows.length)return '<div class="empty-note">배분 행 없음</div>';
    const unit=view.ticket.mode==="percent"?"%":view.ticket.asset;
    return view.ticket.rows.map(row=>{
      const taken=view.ticket.rows.filter(item=>item.id!==row.id).map(item=>item.custodian);
      const options=[`<option value="" ${row.custodian?"":"selected"}>커스터디 선택</option>`,...view.vendors.filter(name=>!taken.includes(name)).map(name=>`<option value="${name}" ${row.custodian===name?"selected":""}>${name}</option>`)].join("");
      return `<div class="allocation-row" data-allocation-row="${row.id}">
        <select data-custody-row-custodian data-surface="${surface}" data-row-id="${row.id}" ${editable?"":"disabled"}>${options}</select>
        <div class="allocation-value"><input class="num" type="number" min="0" step="${view.ticket.mode==="percent"?"0.1":"0.0001"}" value="${Number.isFinite(row.value)?row.value:""}" data-custody-row-value data-surface="${surface}" data-row-id="${row.id}" ${editable?"":"disabled"}><span>${unit}</span></div>
        ${btn("삭제","custody-remove-row","small ghost","",`data-surface="${surface}" data-row-id="${row.id}"${editable?"":" disabled"}`)}
      </div>`;
    }).join("");
  }

  function renderCustodyTicketBody(surface,editable) {
    const view=custodyTicketView(surface);
    if(!view.accountIds.length)return '<div class="empty-note">운용 중인 Prime 계정 없음</div>';
    const account=view.account;
    const company=clientForAccount(view.ticket.primeAccountId);
    const holdingLine=account?accountLiveRows(account).map(item=>quantityText(item.quantity,item.asset)).join(", "):"보유 없음";
    const assets=accountAssets(account);
    const head=`<div class="custody-ticket-head">
      <div class="field"><label>출발 Prime 계정</label><select data-custody-account data-surface="${surface}" ${editable?"":"disabled"}>${ticketAccountOptions(view)}</select></div>
      <div class="field"><label>이체 자산</label><select data-custody-asset data-surface="${surface}" ${editable?"":"disabled"}>${assets.map(asset=>`<option value="${asset}" ${view.ticket.asset===asset?"selected":""}>${asset}</option>`).join("")}</select></div>
    </div>
    <div class="custody-ticket-summary"><span>${company?company.name:"미배정"}</span><strong class="num">${holdingLine}</strong></div>`;
    const modes=[["percent","비율 %"],["quantity","수량"]].map(([id,label])=>`<button type="button" class="${view.ticket.mode===id?"active":""}" data-action="custody-mode" data-surface="${surface}" data-mode="${id}" ${editable?"":"disabled"}>${label}</button>`).join("");
    const remainderText=view.ticket.mode==="percent"?percentText(view.remainder):quantityText(view.remainder,view.ticket.asset);
    const rows=`<div class="allocation-row-list">${ticketRowMarkup(surface,view,editable)}</div>`;
    const addDisabled=!editable||view.ticket.rows.length>=view.vendors.length;
    const controls=`<div class="allocation-controls"><div class="tabs compact">${modes}</div>${btn("행 추가","custody-add-row","small","plus",`data-surface="${surface}"${addDisabled?" disabled":""}`)}</div>`;
    const remainder=`<div class="allocation-remainder ${view.balanced?"balanced":"open"}" data-custody-remainder="${surface}"><span>배분 잔여</span><strong class="num" data-custody-remainder-value>${remainderText}</strong></div>`;
    const submit=btn("제출","submit-custody-transfer","block primary","arrow",`data-surface="${surface}"${view.submittable&&editable?"":" disabled"}`);
    return `${head}${controls}${rows}${remainder}${submit}`;
  }

  function refreshCustodyTicketDom(surface) {
    const view=custodyTicketView(surface);
    const remainderText=view.ticket.mode==="percent"?percentText(view.remainder):quantityText(view.remainder,view.ticket.asset);
    const host=document.querySelector(`[data-custody-remainder="${surface}"]`);
    if(host){
      host.classList.toggle("balanced",view.balanced);
      host.classList.toggle("open",!view.balanced);
      const value=host.querySelector("[data-custody-remainder-value]");
      if(value)value.textContent=remainderText;
    }
    const submit=document.querySelector(`[data-action="submit-custody-transfer"][data-surface="${surface}"]`);
    if(submit)submit.disabled=!view.submittable;
    return view;
  }

  function renderCustodyVendorSetBody(clientId,editable) {
    const client=clientById(clientId);
    if(!client)return '<div class="empty-note">고객사 미선택</div>';
    const holders=custodyBalanceHolders(clientId);
    const linkedNames=clientCustodyVendorNames(client);
    const rows=state.custodians.map(name=>{
      const linked=linkedNames.includes(name);
      const locked=linked&&holders.includes(name);
      return `<label class="check-row"><input type="checkbox" data-custody-vendor data-client-id="${clientId}" data-vendor="${name}" ${linked?"checked":""} ${editable?"":"disabled"}><span>${name}</span>${locked?chip("잔고 보유","warning"):linked?chip("연결","positive"):chip("미연결","muted")}</label>`;
    }).join("");
    return `<div class="vendor-set-grid">${rows}</div>`;
  }

  function renderCustodyAllocationBlocks(accountIds) {
    if(!accountIds.length)return '<div class="empty-note">노출 가능한 Prime 계정 없음</div>';
    const holderIds=[...new Set(accountIds.map(id=>primeAccountById(id)?.clientId).filter(Boolean))];
    return holderIds.map(holderId=>{
      const company=clientById(holderId);
      const ownership=company&&company.internal?"당사 자체":"고객사 분리";
      const pooled=custodyPoolRows(holderId);
      const holdings=pooled.map(item=>quantityText(item.quantity,item.asset)).join(", ");
      const rows=pooled.length
        ?pooled.map(row=>{
          const total=pooled.filter(item=>item.asset===row.asset).reduce((sum,item)=>sum+item.quantity,0);
          return `<tr><td class="main-cell">${row.custodian}</td><td>${row.asset}</td><td class="align-right num">${quantityText(row.quantity,row.asset)}</td><td class="align-right num">${total?percentText(row.quantity/total*100):percentText(0)}</td><td class="num">${row.lastTransferAt||"이체 없음"}</td></tr>`;
        }).join("")
        :'<tr><td colspan="5">배분 없음</td></tr>';
      return `<article class="custody-alloc-block" data-alloc-holder="${holderId}">
        <header class="custody-alloc-head"><div><strong>${company?company.name:holderId}</strong><small>보유자 통합 수탁 잔고</small></div>${chip(ownership,company&&company.internal?"violet":"info")}</header>
        <div class="custody-alloc-holding"><span>총 보유</span><b class="num">${holdings}</b></div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>커스터디</th><th>자산</th><th class="align-right">수량</th><th class="align-right">비중</th><th>최근 이체</th></tr></thead><tbody>${rows}</tbody></table></div>
      </article>`;
    }).join("");
  }

  function allocationViewAccountIds(role=state.role) {
    if(MP.isDeskRole(role))return MP.deskVisibleAccountIds(role);
    return state.primeAccounts.map(account=>account.id);
  }

  /* ---------- 커스터디 배분 정책 (D-0910-04) ----------
     Prime 계정과 자산 1쌍에 정책 1건을 저장한다. 정책은 2단계다.
     1단계 이체 수량, 거래 잔고에서 이번 사이클에 커스터디로 보낼 양.
     2단계 커스터디 배분, 그 이체 수량을 계정 벤더 세트에 나누는 비율 또는 수량.
     상태는 초안, 승인 대기, 확정, 정산 예정, 정산 완료 5종이며 이체 티켓은 승인 시점에 고정된다. */

  const cashAssets = ["KRW","USD"];
  const policyStates = ["초안","승인 대기","확정","정산 예정","정산 완료"];

  function accountLiveRows(account) {
    return account&&Array.isArray(account.liveBalances)?account.liveBalances:[];
  }

  function accountLiveBalance(accountId,asset) {
    const account=primeAccountById(accountId);
    return round8(accountLiveRows(account).filter(row=>row.asset===asset).reduce((sum,row)=>sum+row.quantity,0));
  }

  function policyAssetsForAccount(accountId) {
    const account=primeAccountById(accountId);
    if(!account)return [];
    const names=new Set();
    accountLiveRows(account).forEach(row=>{if(!cashAssets.includes(row.asset))names.add(row.asset);});
    return [...names];
  }

  function custodyPolicyScopeKey(role=state.role) {
    if(MP.isDeskRole(role))return "desk";
    return MP.roleMetaFor(role)?.affiliation==="client"?"client":null;
  }

  function custodyPolicyAccountIds(role=state.role) {
    return custodyTicketAccountIds(role);
  }

  function policyEditorRole(role=state.role) {
    /* 편집은 트레이더와 마스터, 승인은 마스터. 데스크는 exec / securities, 고객은 exec / client. */
    if(MP.isDeskRole(role))return MP.canControl("exec","securities",role);
    return MP.canControl("exec","client",role);
  }

  function policyApproverRole(role=state.role) {
    if(MP.isDeskRole(role))return MP.canControl("exec","desk-master",role);
    return MP.canControl("exec","client-master",role);
  }

  function custodyPolicies(filter={}) {
    return state.custodyPolicies.filter(policy=>{
      if(filter.primeAccountId&&policy.primeAccountId!==filter.primeAccountId)return false;
      if(filter.asset&&policy.asset!==filter.asset)return false;
      if(filter.state&&policy.state!==filter.state)return false;
      if(Array.isArray(filter.accountIds)&&!filter.accountIds.includes(policy.primeAccountId))return false;
      return true;
    });
  }

  function policyTickets(policy) {
    return state.custodyTransferTickets.filter(ticket=>ticket.policyId===policy.id);
  }

  function custodyPolicyStage(policy) {
    /* 저장 상태는 5종 중 하나이며, 확정 정책이 사이클 대기 티켓을 들고 있는 동안 화면 표기는 정산 예정이다. */
    if(policy.state!=="확정")return policy.state;
    return policyTickets(policy).some(ticket=>ticket.state==="정산 예정")?"정산 예정":"확정";
  }

  function policyStateTone(label) {
    if(label==="정산 완료")return "positive";
    if(label==="확정")return "info";
    if(label==="초안")return "muted";
    return "warning";
  }

  function syncPolicyRows(policy) {
    const vendors=custodyVendorsForAccount(policy.primeAccountId);
    const kept=policy.rows.filter(row=>vendors.includes(row.custodian));
    vendors.forEach(name=>{
      if(kept.some(row=>row.custodian===name))return;
      kept.push({id:`PSP-${policy.nextRowNumber++}`,custodian:name,value:null});
    });
    policy.rows=vendors.map(name=>kept.find(row=>row.custodian===name));
    return policy;
  }

  /* 초안 배분은 빈 칸으로 두지 않는다. 계정이 이미 커스터디에 들고 있는 비중이 있으면 그 비중을,
     없으면 균등 배분을 퍼센트로 채우고 합계를 100 %로 맞춘다. 보유가 없는 커스터디는 0으로 선다. */
  function defaultSplitValues(count) {
    if(count<=0)return [];
    const base=Math.floor(100/count);
    const values=new Array(count).fill(base);
    values[0]=round8(100-base*(count-1));
    return values;
  }

  function prefillPolicyRows(policy) {
    if(!policy||policy.state!=="초안"||policy.splitMode!=="percent")return policy;
    if(!policy.rows.length||policy.rows.some(row=>Number.isFinite(row.value)))return policy;
    const held=policy.rows.map(row=>round8(allocationRows(policy.primeAccountId,policy.asset).filter(item=>item.custodian===row.custodian).reduce((sum,item)=>sum+item.quantity,0)));
    const total=round8(held.reduce((sum,value)=>sum+value,0));
    if(total>epsilon){
      let used=0;
      policy.rows.forEach((row,index)=>{
        const share=index===policy.rows.length-1?round8(100-used):Math.round(held[index]/total*1000)/10;
        row.value=share;
        used=round8(used+share);
      });
    }else{
      const values=defaultSplitValues(policy.rows.length);
      policy.rows.forEach((row,index)=>{row.value=values[index];});
    }
    return policy;
  }

  function createCustodyPolicy(primeAccountId,asset) {
    const policy={
      id:`CPL-260909-${String(state.nextCustodyPolicyNumber++).padStart(4,"0")}`,
      primeAccountId,asset,
      transferMode:"quantity",transferValue:null,
      splitMode:"percent",rows:[],nextRowNumber:1,
      state:"초안",
      requester:null,requestedAt:null,approver:null,approvedAt:null,
      rejectReason:null,cycle:null,settledAt:null,ticketIds:[]
    };
    syncPolicyRows(policy);
    prefillPolicyRows(policy);
    state.custodyPolicies.unshift(policy);
    return policy;
  }

  function resolveCustodyPolicyScope(scope,role=state.role) {
    const selection=state.custodyPolicyScope[scope]||(state.custodyPolicyScope[scope]={primeAccountId:null,asset:null});
    const accountIds=custodyPolicyAccountIds(role);
    if(!selection.primeAccountId||!accountIds.includes(selection.primeAccountId))selection.primeAccountId=accountIds[0]||null;
    const assets=policyAssetsForAccount(selection.primeAccountId);
    if(!selection.asset||!assets.includes(selection.asset))selection.asset=assets.includes("BTC")?"BTC":assets[0]||null;
    return {selection,accountIds,assets};
  }

  function custodyPolicyDraft(scope,role=state.role) {
    const {selection}=resolveCustodyPolicyScope(scope,role);
    if(!selection.primeAccountId||!selection.asset)return null;
    const open=state.custodyPolicies.find(policy=>policy.primeAccountId===selection.primeAccountId&&policy.asset===selection.asset&&(policy.state==="초안"||policy.state==="승인 대기"));
    return prefillPolicyRows(syncPolicyRows(open||createCustodyPolicy(selection.primeAccountId,selection.asset)));
  }

  function custodyPolicyView(policy,role=state.role) {
    const account=primeAccountById(policy.primeAccountId);
    const vendors=custodyVendorsForAccount(policy.primeAccountId);
    const live=accountLiveBalance(policy.primeAccountId,policy.asset);
    const transferQty=policy.transferMode==="percent"
      ?round8(live*(Number(policy.transferValue)||0)/100)
      :round8(Number(policy.transferValue)||0);
    const transferPercent=live?round8(transferQty/live*100):0;
    const liveAfter=round8(live-transferQty);
    const rows=policy.rows.map(row=>{
      const value=Number.isFinite(row.value)?row.value:null;
      const quantity=policy.splitMode==="percent"?round8(transferQty*(value||0)/100):round8(value||0);
      const percent=policy.splitMode==="percent"?round8(value||0):(transferQty?round8(quantity/transferQty*100):0);
      const current=round8(allocationRows(policy.primeAccountId,policy.asset).filter(item=>item.custodian===row.custodian).reduce((sum,item)=>sum+item.quantity,0));
      return {...row,value,quantity,percent,current,after:round8(current+quantity)};
    });
    const splitUsed=round8(rows.reduce((sum,row)=>sum+(row.value||0),0));
    const splitRemainder=policy.splitMode==="percent"?round8(100-splitUsed):round8(transferQty-splitUsed);
    const balanced=Math.abs(splitRemainder)<epsilon;
    const positive=rows.filter(row=>row.quantity>epsilon).length;
    const transferPositive=transferQty>epsilon;
    const withinLive=transferQty<=live+epsilon;
    const executable=custodyExecuteAccountIds(role).includes(policy.primeAccountId);
    const editable=policy.state==="초안"&&policyEditorRole(role);
    let reason="";
    if(!transferPositive)reason="이체 수량이 0보다 커야 함";
    else if(!withinLive)reason=`이체 수량이 거래 잔고 ${quantityText(live,policy.asset)}를 넘음`;
    else if(!balanced)reason=policy.splitMode==="percent"?`배분 잔여 ${percentText(splitRemainder)}, 합계가 100 %여야 함`:`배분 잔여 ${quantityText(splitRemainder,policy.asset)}, 합계가 이체 수량과 같아야 함`;
    else if(!positive)reason="배분 수량이 있는 커스터디가 없음";
    else if(!executable)reason="집행 Prime 계정이 아니므로 승인 요청 불가";
    const submittable=transferPositive&&withinLive&&balanced&&positive>0&&executable;
    return {policy,account,vendors,live,transferQty,transferPercent,liveAfter,rows,
      splitUsed,splitRemainder,balanced,positive,transferPositive,withinLive,executable,editable,
      reason,submittable,stage:custodyPolicyStage(policy),
      tickets:policyTickets(policy)};
  }

  function fillCustodyPolicyAll(scope,role=state.role) {
    const policy=custodyPolicyDraft(scope,role);
    if(!policy||policy.state!=="초안")return false;
    const live=accountLiveBalance(policy.primeAccountId,policy.asset);
    policy.transferMode="quantity";
    policy.transferValue=live;
    if(policy.splitMode==="percent"&&policy.rows.length){
      const weights=policy.rows.map(row=>Math.max(0,Number(row.value)||0));
      const total=round8(weights.reduce((sum,value)=>sum+value,0));
      if(total>epsilon){
        const last=weights.reduce((index,value,current)=>value>0?current:index,-1);
        let used=0;
        policy.rows.forEach((row,index)=>{
          row.value=index===last?round8(100-used):round8(weights[index]/total*100);
          used=round8(used+row.value);
        });
      }else{
        const values=defaultSplitValues(policy.rows.length);
        policy.rows.forEach((row,index)=>{row.value=values[index];});
      }
    }
    return true;
  }

  function policyTicketPlan(policy) {
    const view=custodyPolicyView(policy);
    return view.rows.filter(row=>row.quantity>epsilon).map(row=>({
      primeAccountId:policy.primeAccountId,asset:policy.asset,
      from:"거래 잔고",to:row.custodian,quantity:row.quantity
    }));
  }

  /* ---------- 정산 사이클 시각 ----------
     정산 예정은 다음 사이클 시각을 뜻하므로 과거 날짜가 찍히면 안 된다. 사이클 시각은
     state.settlementCycle.time 1곳에서만 오고, 날짜는 그 시각이 아직 지나지 않았으면 오늘,
     이미 지났으면 다음 날로 계산한다. 정산 완료 시각은 현재 시각을 찍는다. */

  function pad2(value) {
    return String(value).padStart(2,"0");
  }

  function dateLabel(date) {
    return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`;
  }

  function stampLabel(date) {
    return `${dateLabel(date)} ${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
  }

  function nextSettlementCycleAt() {
    const parts=String(state.settlementCycle.time||"17:00").split(":");
    const hour=Number(parts[0]);
    const minute=Number(parts[1]);
    const now=new Date();
    const next=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Number.isFinite(hour)?hour:17,Number.isFinite(minute)?minute:0,0,0);
    if(next.getTime()<=now.getTime())next.setDate(next.getDate()+1);
    const label=stampLabel(next);
    state.settlementCycle.nextDate=dateLabel(next);
    state.settlementCycle.nextLabel=label;
    return {at:next,date:dateLabel(next),time:`${pad2(next.getHours())}:${pad2(next.getMinutes())}`,label};
  }

  function settlementCycleLabel() {
    return nextSettlementCycleAt().label;
  }

  function settlementStamp() {
    return stampLabel(new Date());
  }

  /* 정산 예정 행은 저장된 사이클 문자열이 아니라 언제 열어도 다음 사이클을 가리킨다. */
  function ticketCycleLabel(item) {
    return item&&item.state==="정산 완료"?(item.cycle||""):settlementCycleLabel();
  }

  function fixCustodyPolicyTickets(policy) {
    const plan=policyTicketPlan(policy);
    const cycle=settlementCycleLabel();
    const created=plan.map(entry=>{
      const ticket={
        id:`CT-260909-${String(state.nextCustodyTicketNumber++).padStart(4,"0")}`,
        policyId:policy.id,primeAccountId:entry.primeAccountId,asset:entry.asset,
        from:entry.from,to:entry.to,quantity:entry.quantity,
        transferType:custodyTransferType(entry.from,entry.to),
        cycle,createdAt:settlementStamp(),state:"정산 예정",settledAt:null
      };
      state.custodyTransferTickets.push(ticket);
      return ticket;
    });
    policy.cycle=cycle;
    policy.ticketIds=created.map(ticket=>ticket.id);
    return created;
  }

  function fixCustodyIntentTicket(intent) {
    const existing=state.custodyTransferTickets.find(ticket=>ticket.intentId===intent.id);
    if(existing)return existing;
    const ticket={
      id:`CT-260909-${String(state.nextCustodyTicketNumber++).padStart(4,"0")}`,
      intentId:intent.id,policyId:null,holderId:intent.holderId,
      primeAccountId:intent.primeAccountId,fromAccountId:intent.fromAccountId||null,asset:intent.asset,from:intent.from,to:intent.to,
      transferType:intent.transferType||custodyTransferType(intent.from,intent.to),quantity:intent.totalQuantity,
      cycle:intent.cycle,createdAt:intent.createdAt,state:"정산 예정",settledAt:null
    };
    state.custodyTransferTickets.push(ticket);
    return ticket;
  }

  function applyCustodyTicket(ticket) {
    const account=primeAccountById(ticket.primeAccountId);
    if(!account)return false;
    if(ticket.from!=="거래 잔고")return applyCustodyIntent({...ticket,totalQuantity:ticket.quantity,cycleShort:ticket.cycle});
    const live=accountLiveRows(account).find(row=>row.asset===ticket.asset);
    if(live)live.quantity=round8(Math.max(0,live.quantity-ticket.quantity));
    const short=ticket.cycle;
    const pool=custodyHoldingsFor(account.clientId);
    const allocation=custodyAttributionRow(pool,ticket.to,ticket.asset,account.id);
    if(allocation){allocation.quantity=round8(allocation.quantity+ticket.quantity);allocation.lastTransferAt=short;}
    else pool.push({custodian:ticket.to,asset:ticket.asset,accountId:account.id,quantity:round8(ticket.quantity),lastTransferAt:short});
    return true;
  }

  function pendingCycleTickets() {
    return state.custodyTransferTickets.filter(ticket=>ticket.state==="정산 예정");
  }

  function runSettlementCycle({actor="System / 정산 사이클",stamp=null}={}) {
    const tickets=pendingCycleTickets();
    if(!tickets.length)return {tickets:[],policies:[],batch:null};
    const at=stamp||settlementStamp();
    tickets.forEach(ticket=>{applyCustodyTicket(ticket);ticket.state="정산 완료";ticket.settledAt=at;});
    const policies=[...new Set(tickets.map(ticket=>ticket.policyId))]
      .map(id=>state.custodyPolicies.find(policy=>policy.id===id)).filter(Boolean)
      .filter(policy=>policyTickets(policy).every(ticket=>ticket.state==="정산 완료"));
    policies.forEach(policy=>{policy.state="정산 완료";policy.settledAt=at;});
    const batch={
      id:`BAT-260909-${String(state.settlementBatches.length+1).padStart(4,"0")}`,
      cycle:tickets[0].cycle,at,ticketIds:tickets.map(ticket=>ticket.id),
      policyIds:policies.map(policy=>policy.id),
      count:tickets.length,actor
    };
    state.settlementBatches.unshift(batch);
    if(typeof MP.addAudit==="function"){
      policies.forEach(policy=>MP.addAudit("CUSTODY_POLICY_SETTLE",`${policy.id}, ${MP.accountLabel(policy.primeAccountId)}, ${policy.asset}, 이체 요청서 ${policyTickets(policy).length}건 정산 완료`,"성공","positive",actor));
    }
    return {tickets,policies,batch};
  }

  /* ---------- 렌더 ---------- */

    return accountIds.map(id=>{
      const account=primeAccountById(id);
      return `<option value="${id}" ${selection.primeAccountId===id?"selected":""}>${MP.accountLabel(id)}</option>`;
    }).join("");
  }

  function policyBalanceStrip(view) {

      <article class="policy-balance-live"><span>거래 잔고</span><strong class="num">${quantityText(view.live,view.policy.asset)}</strong></article>
      <article class="policy-balance-custody"><span>커스터디 잔고</span><ul class="policy-balance-list">${custody||'<li><span>배분 없음</span><b class="num">0</b></li>'}</ul></article>
    </div>`;
  }

  function policyModeSegment(action,scope,current,pairs,disabled) {
    return `<div class="tabs compact">${pairs.map(([id,label])=>`<button type="button" class="${current===id?"active":""}" data-action="${action}" data-scope="${scope}" data-mode="${id}" ${disabled?"disabled":""}>${label}</button>`).join("")}</div>`;
  }

  function policyTransferBox(scope,view,editable) {
    const policy=view.policy;
    const unit=policy.transferMode==="percent"?"%":policy.asset;
    const step=policy.transferMode==="percent"?"0.1":"0.0001";
    const tone=view.transferPositive&&view.withinLive?"balanced":"open";
    const fillAll=btn("전체","custody-policy-all","small input-all-button","",`data-scope="${scope}"${editable&&view.live>epsilon?"":" disabled"}`);
    return `<section class="policy-box">
      <header><h4>1. 이체 수량</h4>${policyModeSegment("custody-policy-transfer-mode",scope,policy.transferMode,[["quantity","수량"],["percent","%"]],!editable)}</header>
      <div class="policy-transfer-row">
        <label class="policy-input"><span>${policy.transferMode==="percent"?"거래 잔고 대비":"수량"}</span><div class="input-with-action"><span class="policy-input-unit"><input class="num" type="number" min="0" step="${step}" value="${Number.isFinite(policy.transferValue)?policy.transferValue:""}" data-custody-policy-transfer data-scope="${scope}" ${editable?"":"disabled"}><i>${unit}</i></span>${fillAll}</div></label>
        <div class="policy-derived ${tone}"><span>이체 후 거래 잔고</span><b class="num">${quantityText(view.liveAfter,policy.asset)}</b></div>
      </div>
    </section>`;
  }

  function policySplitBox(scope,view,editable) {
    const policy=view.policy;
    const unit=policy.splitMode==="percent"?"%":policy.asset;
    const step=policy.splitMode==="percent"?"0.1":"0.0001";
    const rows=view.rows.map(row=>`<tr>
      <td class="main-cell">${row.custodian}</td>
      <td class="align-right"><input class="num" type="number" min="0" step="${step}" value="${Number.isFinite(row.value)?row.value:""}" data-custody-policy-value data-scope="${scope}" data-row-id="${row.id}" ${editable?"":"disabled"}><small class="subcell">${unit}</small></td>
      <td class="align-right num">${quantityText(row.quantity,policy.asset)}</td>
      <td class="align-right num">${quantityText(row.current,policy.asset)}</td>
      <td class="align-right num">${quantityText(row.after,policy.asset)}</td>
    </tr>`).join("")||`<tr><td colspan="5" class="empty-note">연결 커스터디 없음</td></tr>`;
    const foot=`<tr><td>합계</td><td class="align-right num ${view.balanced?"":"warning-text"}">${policy.splitMode==="percent"?percentText(view.splitUsed):quantityText(view.splitUsed,policy.asset)}</td><td class="align-right num">${quantityText(view.transferQty,policy.asset)}</td><td class="align-right num">${quantityText(view.rows.reduce((sum,row)=>sum+row.current,0),policy.asset)}</td><td class="align-right num">${quantityText(view.rows.reduce((sum,row)=>sum+row.after,0),policy.asset)}</td></tr>`;
    const remainderText=policy.splitMode==="percent"?percentText(view.splitRemainder):quantityText(view.splitRemainder,policy.asset);
    return `<section class="policy-box">
      <header><h4>2. 커스터디 배분</h4>${policyModeSegment("custody-policy-split-mode",scope,policy.splitMode,[["percent","%"],["quantity","수량"]],!editable)}<span class="policy-remainder ${view.balanced?"balanced":"open"}" data-custody-policy-remainder="${scope}">잔여 ${remainderText}</span></header>
      <div class="table-scroll"><table class="data-table policy-split-table"><thead><tr><th>커스터디</th><th class="align-right">%</th><th class="align-right">배정 수량</th><th class="align-right">현재 보유</th><th class="align-right">이체 후 잔액</th></tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>
    </section>`;
  }

  function renderCustodyPolicyEditorBody(scope,role=state.role) {
    const {selection,accountIds,assets}=resolveCustodyPolicyScope(scope,role);
    if(!accountIds.length)return '<div class="empty-note">운용 중인 Prime 계정 없음</div>';

      <div class="field"><label>자산</label><select data-custody-policy-asset data-scope="${scope}">${assets.map(asset=>`<option value="${asset}" ${selection.asset===asset?"selected":""}>${asset}</option>`).join("")}</select></div>
      <div class="field"><label>상태</label><div class="policy-state-cell">${chip(view.stage,policyStateTone(view.stage))}<small>${policy.requestedAt?`요청 ${policy.requestedAt}`:"저장 전"}</small></div></div>
    </div>`;

  function policyDiffTable(view) {
    const policy=view.policy;

  function renderCustodyPolicyApprovalBody(scope,role=state.role) {

  function renderCustodyPolicyCycleBody(role=state.role) {
    const accountIds=custodyPolicyAccountIds(role);
    const tickets=state.custodyTransferTickets.filter(ticket=>accountIds.includes(ticket.primeAccountId));
    const queued=tickets.filter(ticket=>ticket.state==="정산 예정");
    const done=tickets.filter(ticket=>ticket.state==="정산 완료");
    const head=`<div class="grid cols-3 policy-cycle-head">
      <div class="field"><label>정산 시각</label><div class="policy-state-cell"><b class="num">${state.settlementCycle.time}</b><small>KST</small></div></div>
      <div class="field"><label>정산 예정</label><div class="policy-state-cell"><b class="num">${queued.length}건</b></div></div>
      <div class="field"><label>정산 완료</label><div class="policy-state-cell"><b class="num">${done.length}건</b></div></div>
    </div>`;
    const ticketRows=tickets.map(ticket=>`<tr><td class="num">${ticket.id}</td><td>${ticket.asset}</td><td>${custodyEndpointLabel(ticket.from)}</td><td>${custodyEndpointLabel(ticket.to)}</td><td class="align-right num">${quantityText(ticket.quantity,ticket.asset)}</td><td class="num">${ticketCycleLabel(ticket)}</td><td>${chip(ticket.state,ticket.state==="정산 완료"?"positive":"warning")}</td></tr>`).join("")
      ||'<tr><td colspan="7" class="empty-note">사이클 대기 이체 요청서 없음</td></tr>';
    const ticketTable=`<div class="table-scroll"><table class="data-table"><thead><tr><th>이체 요청서</th><th>자산</th><th>출발</th><th>도착</th><th class="align-right">수량</th><th>사이클</th><th>상태</th></tr></thead><tbody>${ticketRows}</tbody></table></div>`;
    const liveAfterRows=accountIds.map(id=>{
      const account=primeAccountById(id);
      if(!account)return "";
      const assets=policyAssetsForAccount(id);
      return assets.map(asset=>{
        const live=accountLiveBalance(id,asset);
        const queuedOut=round8(queued.filter(ticket=>ticket.primeAccountId===id&&ticket.asset===asset).reduce((sum,ticket)=>sum+ticket.quantity,0));
        return `<tr><td class="num">${MP.accountLabel(id)}</td><td>${asset}</td><td class="main-cell">거래 잔고</td><td class="align-right num">${quantityText(live,asset)}</td><td class="align-right num">${quantityText(round8(live-queuedOut),asset)}</td></tr>`;
      }).join("");
    }).join("");
    const holderIds=[...new Set(accountIds.map(id=>primeAccountById(id)?.clientId).filter(Boolean))];
    const custodyAfterRows=holderIds.flatMap(holderId=>custodyPoolRows(holderId).map(row=>{
      const inbound=round8(queued.filter(ticket=>primeAccountById(ticket.primeAccountId)?.clientId===holderId&&ticket.asset===row.asset&&ticket.to===row.custodian).reduce((sum,ticket)=>sum+ticket.quantity,0));
      return `<tr><td>수탁</td><td>${row.asset}</td><td class="main-cell">${row.custodian}</td><td class="align-right num">${quantityText(row.quantity,row.asset)}</td><td class="align-right num">${quantityText(round8(row.quantity+inbound),row.asset)}</td></tr>`;
    })).join("");
    const afterRows=`${liveAfterRows}${custodyAfterRows}`||'<tr><td colspan="5" class="empty-note">배분 없음</td></tr>';
    const afterTable=`<div class="table-scroll"><table class="data-table"><thead><tr><th>계정</th><th>자산</th><th>대상</th><th class="align-right">현재</th><th class="align-right">정산 후</th></tr></thead><tbody>${afterRows}</tbody></table></div>`;
    const auditRows=state.auditLogs.filter(item=>["CUSTODY_POLICY_SET","CUSTODY_POLICY_APPROVE","CUSTODY_POLICY_REJECT","CUSTODY_POLICY_SETTLE"].includes(item.action))
      .map(item=>`<tr><td class="num">${item.time}</td><td class="num">${item.action}</td><td>${item.user}</td><td>${item.target}</td></tr>`).join("")
      ||'<tr><td colspan="4" class="empty-note">정책 감사 기록 없음</td></tr>';
    const auditTable=`<div class="table-scroll"><table class="data-table"><thead><tr><th>시각</th><th>이벤트</th><th>행위자</th><th>내용</th></tr></thead><tbody>${auditRows}</tbody></table></div>`;
    return `${head}<p class="section-label">배치 진행</p>${ticketTable}<p class="section-label">정산 후 잔액</p>${afterTable}<p class="section-label">감사 로그</p>${auditTable}`;
  }

  function renderSettlementBatchBody() {
    const tickets=state.custodyTransferTickets;
    const rows=tickets.map(ticket=>`<tr><td class="num">${ticket.id}</td><td class="num">${ticket.from==="거래 잔고"?MP.accountLabel(ticket.primeAccountId):"수탁"}</td><td>${ticket.asset}</td><td>${custodyEndpointLabel(ticket.from)}</td><td>${custodyEndpointLabel(ticket.to)}</td><td class="align-right num">${quantityText(ticket.quantity,ticket.asset)}</td><td class="num">${ticketCycleLabel(ticket)}</td><td>${chip(ticket.state,ticket.state==="정산 완료"?"positive":"warning")}</td></tr>`).join("")
      ||'<tr><td colspan="8" class="empty-note">확정 이체 요청서 없음</td></tr>';
    const table=`<div class="table-scroll"><table class="data-table"><thead><tr><th>이체 요청서</th><th>계정</th><th>자산</th><th>출발</th><th>도착</th><th class="align-right">수량</th><th>사이클</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    const batches=state.settlementBatches.map(batch=>`<li><span class="num">${batch.cycle}</span><b class="num">${batch.count}건</b><small>${batch.at}, ${batch.actor}</small></li>`).join("")
      ||'<li><span>실행된 배치 없음</span><b class="num">0건</b></li>';
    return `${table}<ul class="settlement-batch-list">${batches}</ul>`;
  }

  Object.assign(MP,{
    round8,custodyQuantityText:quantityText,custodyPercentText:percentText,custodyTransferType,
    primeAccountById,clientForAccount,internalClient,accountAssets,accountHolding,custodyHoldingsFor,
    custodyHoldingsForAccounts,custodyPoolRows,custodySourceRow,
    allocationRows,allocationTotal,custodyVendorsForClient,custodyVendorsForAccount,
    custodyTicketAccountIds,custodyExecuteAccountIds,custodyTicket,resolveCustodyTicket,custodyTicketView,
    ticketAllocations,custodyBalanceHolders,applyCustodyIntent,etfBookConflict,duplicateEtfAssignments,refreshCustodyTicketDom,
    renderCustodyTicketBody,renderCustodyVendorSetBody,renderCustodyAllocationBlocks,allocationViewAccountIds,
    policyStates,accountLiveBalance,policyAssetsForAccount,custodyPolicyScopeKey,custodyPolicyAccountIds,
    policyEditorRole,policyApproverRole,custodyPolicies,policyTickets,custodyPolicyStage,policyStateTone,
    custodyPolicyDraft,custodyPolicyView,fillCustodyPolicyAll,policyTicketPlan,fixCustodyPolicyTickets,fixCustodyIntentTicket,settlementCycleLabel,
    nextSettlementCycleAt,settlementStamp,ticketCycleLabel,clientCustodyVendorNames,prefillPolicyRows,
    pendingCycleTickets,runSettlementCycle,resolveCustodyPolicyScope,syncPolicyRows,
    renderCustodyPolicyEditorBody,renderCustodyPolicyApprovalBody,renderCustodyPolicyCycleBody,renderSettlementBatchBody
  });
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/core/pnl.js">
(function (MP) {
  "use strict";

  const {state} = MP;

  function portalClient() {
    return state.clients.find(item=>item.id===state.clientPortal.clientId)||null;
  }

  function portalFeeBps() {
    const client=portalClient();
    return Number.isFinite(client?.feeBps)?client.feeBps:0;
  }

  function getClientCuQuote() {
    const portal=state.clientPortal;
    const constants=state.constants;
    const basis=portal.quoteBasis;
    const received=state.pdfUploads[portal.etfId];
    const underlyingPerCuKrw=constants.btcPerCu*basis.vendorBestAllInUsd*basis.usdKrw;
    const cashPerCuKrw=received?received.cashPerCuKrw:0;
    const feeBps=portalFeeBps();
    const markupPerCuKrw=Math.round(underlyingPerCuKrw*feeBps/10000);
    const cuPriceKrw=underlyingPerCuKrw+cashPerCuKrw+markupPerCuKrw;
    return {
      feeBps,
      cu:portal.cu,
      cuShares:constants.cuShares,
      vendorBestAllInUsd:basis.vendorBestAllInUsd,
      usdKrw:basis.usdKrw,
      underlyingPerCuKrw,
      cashPerCuKrw,
      markupPerCuKrw,
      cuPriceKrw,
      perShareKrw:cuPriceKrw/constants.cuShares,
      totalKrw:cuPriceKrw*portal.cu,
      notionalKrw:portal.amountKrw
    };
  }

  function getClientPricing({ignoreLock=false}={}) {
    const client=state.clientPortal;
    if(!ignoreLock&&client.quoteApproved&&client.lockedPricing)return {...client.lockedPricing,locked:true};
    const marketOffsetUsd=state.tradePrice-state.constants.btcFixingUsd;
    const vendorBest=MP.bestVendorQuote();
    const vendorBestUsd=(vendorBest?vendorBest.allIn:state.constants.vendorBestAllInUsd)+marketOffsetUsd;
    const ownExpectedUsd=state.tradePrice*(1+state.constants.ownExecutionCostBps/10000);
    const bestProcurementUsd=Math.min(vendorBestUsd,ownExpectedUsd);
    const feeBps=portalFeeBps();
    const feeUsd=bestProcurementUsd*feeBps/10000;
    return {
      vendorBestUsd,
      ownExpectedUsd,
      bestProcurementUsd,
      feeBps,
      feeUsd,
      finalPriceUsd:bestProcurementUsd+feeUsd,
      locked:false
    };
  }

  // ---- 메리츠 증권의 손익, 단일 북 MTM (rev 4) ----
  const AP_LINES = [
    {key:"etf",no:1,label:"ETF 손익",kind:"valued"},
    {key:"hedge",no:2,label:"헤지 손익",kind:"valued"},
    {key:"fee",no:3,label:"수수료",kind:"realised"},
    {key:"funding",no:4,label:"이자와 자금비용",kind:"realised"},
    {key:"transfer",no:5,label:"Prime 수수료",kind:"realised"},
    {key:"residual",no:6,label:"기타",kind:"valued"}
  ];
  const AP_VALUED_KEYS = AP_LINES.filter(line=>line.kind==="valued").map(line=>line.key);
  const AP_REALISED_KEYS = AP_LINES.filter(line=>line.kind==="realised").map(line=>line.key);
  const AP_STRATEGIES = [{key:"all",label:"전체"},{key:"ap",label:"AP"},{key:"lp",label:"LP"}];

  const round2 = value => Math.round(Number(value)*100)/100;

  function apPeriods() {
    return state.apBook.periods;
  }

  function apPeriod() {
    return apPeriods().find(item=>item.key===state.pnlPeriod)||apPeriods()[0];
  }

  function apStrategyFilter() {
    return AP_STRATEGIES.some(item=>item.key===state.pnlStrategyFilter)?state.pnlStrategyFilter:"all";
  }

  function apBookFilter() {
    return state.etfBooks.some(book=>book.id===state.pnlEtfBookFilter)?state.pnlEtfBookFilter:"all";
  }

  function apInternalTransfer() {
    const internalId=MP.internalClient()?.id||null;
    const orders=state.primeOrders.filter(order=>order.clientId===internalId&&Number.isFinite(order.feeBps));
    const amountFor=order=>Math.round(order.notionalKrw*order.feeBps/10000);
    const relayKrw=orders.filter(order=>order.mode==="RFQ").reduce((sum,order)=>sum+amountFor(order),0);
    const algoKrw=orders.filter(order=>order.mode==="알고").reduce((sum,order)=>sum+amountFor(order),0);
    return {orders,relayKrw,algoKrw,totalKrw:relayKrw+algoKrw};
  }

  function apMarkContext() {
    const stateKey=["pre","live","print"].includes(state.executionWindowState)?state.executionWindowState:"live";
    const metrics=typeof MP.executionMonitorMetrics==="function"?MP.executionMonitorMetrics(stateKey):null;
    const raw=metrics&&Number.isFinite(metrics.fixingUsd)?metrics.fixingUsd:null;
    const btcFixingUsd=raw===null?null:round2(raw);
    return {
      stateKey,
      available:btcFixingUsd!==null,
      btcFixingUsd,
      ethFixingUsd:btcFixingUsd===null?null:state.apBook.ethReplicationFixingUsd,
      markLabel:stateKey==="print"?"확정 픽싱":"복제 픽싱",
      stateLabel:stateKey==="pre"?"윈도 전, 기준가 없음":stateKey==="print"?"프린트, 확정 픽싱":"윈도 중, 예상 픽싱 및 실시간 복제",
      stateTone:stateKey==="print"?"positive":stateKey==="pre"?"muted":"warning",
      bpLabel:stateKey==="print"?"확정":"잠정",
      ticketsRealised:stateKey==="print"
    };
  }

  function apInavKrw(etf,mark) {
    if(!mark.available)return null;
    const book=state.apBook;
    const isEth=etf.underlying==="ETH";
    const perCu=isEth?book.ethPerCu:state.constants.btcPerCu;
    const fixingUsd=isEth?mark.ethFixingUsd:mark.btcFixingUsd;
    return round2(perCu*fixingUsd*state.constants.usdKrw/state.constants.cuShares);
  }

  function getApBookModel(options={}) {
    const book=state.apBook;
    const mark=options.mark||apMarkContext();
    const period=options.period||apPeriod();
    const bookFilter=options.bookFilter||apBookFilter();
    const usdKrw=state.constants.usdKrw;
    const cuShares=state.constants.cuShares;
    const transfer=apInternalTransfer();

    const all=book.legs.map(seed=>{
      const etf=state.etfs.find(item=>item.id===seed.etfId)||null;
      const bookId=MP.bookIdForEtf(seed.etfId);
      const etfBook=state.etfBooks.find(item=>item.id===bookId)||null;
      const inavKrw=etf?apInavKrw(etf,mark):null;
      const hedgeMarkUsd=seed.hedge.asset==="ETH"?mark.ethFixingUsd:mark.btcFixingUsd;
      const tradedNotionalKrw=Math.round(Math.abs(seed.etfShares)*seed.etfAvgKrw);
      const ticket=book.ledger.find(item=>item.etfId===seed.etfId)||null;
      const creationFeeKrw=ticket?-ticket.cu*book.creationFeeKrwPerCu:0;
      const krxKsdFeeKrw=-Math.round(tradedNotionalKrw*book.krxKsdFeeBps/10000/1000)*1000;
      const feeDetail={creation:creationFeeKrw,krxKsd:krxKsdFeeKrw,exchange:seed.feeKrw.exchange,custody:seed.feeKrw.custody};
      const fundingDetail={...seed.fundingKrw};
      const lines={
        etf:inavKrw===null?null:Math.round((inavKrw-seed.etfAvgKrw)*seed.etfShares),
        hedge:hedgeMarkUsd===null?null:Math.round((hedgeMarkUsd-seed.hedge.avgUsd)*seed.hedge.quantity*usdKrw),
        fee:feeDetail.creation+feeDetail.krxKsd+feeDetail.exchange+feeDetail.custody,
        funding:fundingDetail.cash+fundingDetail.borrow+fundingDetail.margin,
        transfer:seed.etfId===book.transferEtfId?-transfer.totalKrw:0,
        residual:null
      };
      const accountedKrw=AP_LINES.filter(line=>line.key!=="residual").reduce((sum,line)=>sum+(lines[line.key]??0),0);
      lines.residual=mark.available?Math.round(seed.deltaMtmKrw-accountedKrw):null;
      const ticketRealised=Boolean(ticket)&&mark.ticketsRealised;
      const realisedKeys=ticketRealised?[...AP_REALISED_KEYS,"etf","hedge"]:AP_REALISED_KEYS;
      const realisedKrw=realisedKeys.reduce((sum,key)=>sum+(lines[key]??0),0);
      const netKrw=mark.available?seed.deltaMtmKrw:null;
      return {
        etfId:seed.etfId,
        etfName:etf?etf.name:seed.etfId,
        underlying:etf?etf.underlying:"BTC",
        bookId,
        bookName:etfBook?etfBook.name:bookId,
        shares:seed.etfShares,
        avgKrw:seed.etfAvgKrw,
        inavKrw,
        tradedNotionalKrw,
        hedge:{...seed.hedge,markUsd:hedgeMarkUsd,pnlKrw:lines.hedge},
        feeDetail,
        fundingDetail,
        lines,
        deltaMtmKrw:seed.deltaMtmKrw,
        netKrw,
        realisedKrw,
        valuedKrw:netKrw===null?null:netKrw-realisedKrw,
        residualKrw:lines.residual,
        netMarginBps:netKrw===null||!tradedNotionalKrw?null:netKrw/tradedNotionalKrw*10000,
        ticket,
        ticketRealised
      };
    });

    /* D-0915: 전체 스코프에서는 LP 호가 마진을 ETF 레그에서 차감한다. 같은 금액을 레그의
       deltaMtmKrw에서도 빼므로 미설명 잔차는 그대로이고 북 ΔMTM = Σ 귀속 항등식이 유지된다.
       배분은 체결 명목 비례이며 반올림 잔여는 가장 큰 레그가 받는다. */
    const scope=options.scope||apStrategyFilter();
    const lpSummary=getLpPnlSummary();
    const lpDayNetKrw=lpSummary.netCaptureKrw;
    const apDayNetPureKrw=mark.available?all.reduce((sum,leg)=>sum+leg.netKrw,0):null;
    const dayOverlapKrw=scope==="all"&&mark.available?lpOverlapKrw(lpDayNetKrw):0;
    if(dayOverlapKrw){
      const notionalTotal=all.reduce((sum,leg)=>sum+leg.tradedNotionalKrw,0);
      let assigned=0;
      all.forEach(leg=>{
        leg.lpQuoteOverlapKrw=notionalTotal?Math.round(dayOverlapKrw*leg.tradedNotionalKrw/notionalTotal):0;
        assigned+=leg.lpQuoteOverlapKrw;
      });
      const largest=all.reduce((best,leg)=>best&&best.tradedNotionalKrw>=leg.tradedNotionalKrw?best:leg,null);
      if(largest)largest.lpQuoteOverlapKrw+=dayOverlapKrw-assigned;
      all.forEach(leg=>{
        const share=leg.lpQuoteOverlapKrw||0;
        if(!share)return;
        leg.lines={...leg.lines,etf:leg.lines.etf===null?null:leg.lines.etf-share};
        leg.deltaMtmKrw-=share;
        leg.netKrw=leg.netKrw===null?null:leg.netKrw-share;
        leg.valuedKrw=leg.netKrw===null?null:leg.netKrw-leg.realisedKrw;
        leg.netMarginBps=leg.netKrw===null||!leg.tradedNotionalKrw?null:leg.netKrw/leg.tradedNotionalKrw*10000;
      });
    }

    const legs=bookFilter==="all"?all:all.filter(leg=>leg.bookId===bookFilter);
    const sumOf=(rows,pick)=>rows.reduce((sum,row)=>sum+(pick(row)??0),0);
    const aggregate=rows=>{
      const tradedNotionalKrw=sumOf(rows,row=>row.tradedNotionalKrw);
      const netKrw=mark.available?sumOf(rows,row=>row.netKrw):null;
      const realisedKrw=sumOf(rows,row=>row.realisedKrw);
      return {
        etfCount:rows.length,
        tradedNotionalKrw,
        netKrw,
        realisedKrw,
        valuedKrw:netKrw===null?null:netKrw-realisedKrw,
        residualKrw:mark.available?sumOf(rows,row=>row.residualKrw):null,
        netMarginBps:netKrw===null||!tradedNotionalKrw?null:netKrw/tradedNotionalKrw*10000,
        residualBps:!mark.available||!tradedNotionalKrw?null:sumOf(rows,row=>row.residualKrw)/tradedNotionalKrw*10000
      };
    };
    const books=state.etfBooks
      .filter(entry=>legs.some(leg=>leg.bookId===entry.id))
      .map(entry=>{
        const rows=legs.filter(leg=>leg.bookId===entry.id);
        return {id:entry.id,name:entry.name,etfNames:rows.map(row=>row.etfName),...aggregate(rows)};
      });
    const totals=aggregate(legs);

    /* D-0915: 기간 환산은 일별 시드 합계에서 나온다. pnlScale은 (기간 순손익 / 당일 순손익),
       realisedScale은 (기간 실현 / 당일 실현)이고 평가는 순손익 - 실현으로 닫는다. 당일은 두 배수가
       1이라 모델 실측 그대로다. 명목만 거래일 수 비례 배수(notionalScale)를 쓴다. */
    const series=pnlDailyRows(apDayNetPureKrw,lpDayNetKrw);
    const apPeriodNetKrw=pnlPeriodNetKrw("ap",period.key,series);
    const lpPeriodNetKrw=pnlPeriodNetKrw("lp",period.key,series);
    const allPeriodNetKrw=pnlPeriodNetKrw("all",period.key,series);
    const periodOverlapKrw=dayOverlapKrw?apPeriodNetKrw+lpPeriodNetKrw-allPeriodNetKrw:0;
    const sectionDayNetKrw=apDayNetPureKrw===null?null:apDayNetPureKrw-dayOverlapKrw;
    const sectionPeriodNetKrw=apPeriodNetKrw-periodOverlapKrw;
    const dayRealisedKrw=all.reduce((sum,leg)=>sum+leg.realisedKrw,0);
    const periodRealisedKrw=period.key==="day"?dayRealisedKrw:Math.round(apPeriodNetKrw*(Number(period.realisedShare)||0));
    const pnlScale=sectionDayNetKrw?sectionPeriodNetKrw/sectionDayNetKrw:1;
    const realisedScale=dayRealisedKrw?periodRealisedKrw/dayRealisedKrw:1;
    const scale=source=>{
      const tradedNotionalKrw=Math.round(source.tradedNotionalKrw*period.notionalScale);
      const netKrw=source.netKrw===null?null:Math.round(source.netKrw*pnlScale);
      const realisedKrw=Math.round(source.realisedKrw*realisedScale);
      const residualKrw=source.residualKrw===null?null:Math.round(source.residualKrw*pnlScale);
      return {
        ...source,
        tradedNotionalKrw,
        netKrw,
        realisedKrw,
        valuedKrw:netKrw===null?null:netKrw-realisedKrw,
        residualKrw,
        netMarginBps:netKrw===null||!tradedNotionalKrw?null:netKrw/tradedNotionalKrw*10000,
        residualBps:residualKrw===null||!tradedNotionalKrw?null:residualKrw/tradedNotionalKrw*10000
      };
    };
    const periodTotals=scale(totals);
    const periodBooks=books.map(entry=>({...entry,...scale(entry)}));
    const lpPeriodRatio=lpDayNetKrw?lpPeriodNetKrw/lpDayNetKrw:0;
    const lpQuoteKrw=Math.round(lpSummary.breakdown.quote*lpPeriodRatio);
    const lpDragKrw=Math.round(lpSummary.breakdown.drag*lpPeriodRatio);
    const lpPeriod={
      netKrw:lpPeriodNetKrw,
      ratio:lpPeriodRatio,
      notionalKrw:Math.round(lpSummary.notionalKrw*period.notionalScale),
      unhedgedBtc:lpSummary.unhedgedBtc,
      breakdown:{quote:lpQuoteKrw,drag:lpDragKrw,fees:lpQuoteKrw-lpDragKrw-lpPeriodNetKrw}
    };
    /* 통계 패널이 읽는 스코프 합계. 전체는 AP 섹션(이미 호가 마진 차감분)에 LP 순캡처를 더한 값이라
       AP 부분합과 LP 부분합의 합과 정확히 일치한다. */
    const scopeTotals=scope==="lp"
      ?{netKrw:lpPeriodNetKrw,realisedKrw:lpPeriodNetKrw,valuedKrw:0,tradedNotionalKrw:lpPeriod.notionalKrw}
      :scope==="ap"
        ?{netKrw:periodTotals.netKrw,realisedKrw:periodTotals.realisedKrw,valuedKrw:periodTotals.valuedKrw,tradedNotionalKrw:periodTotals.tradedNotionalKrw}
        :{
          netKrw:periodTotals.netKrw===null?null:periodTotals.netKrw+lpPeriodNetKrw,
          realisedKrw:periodTotals.realisedKrw+lpPeriodNetKrw,
          valuedKrw:periodTotals.valuedKrw,
          tradedNotionalKrw:periodTotals.tradedNotionalKrw+lpPeriod.notionalKrw
        };

    /* 귀속표도 같은 기간 환산을 받는다. 실현 계열은 realisedScale, 평가 계열은 valuedScale을 쓰므로
       열 합이 기간 순손익, 실현 합이 기간 실현, 평가 합이 기간 평가로 닫힌다. */
    const dayValuedKrw=sectionDayNetKrw===null?null:sectionDayNetKrw-dayRealisedKrw;
    const periodValuedKrw=sectionPeriodNetKrw-periodRealisedKrw;
    const valuedScale=dayValuedKrw?periodValuedKrw/dayValuedKrw:1;
    const lineScaleFor=key=>AP_REALISED_KEYS.includes(key)?realisedScale:valuedScale;
    const scaleLine=(value,key)=>value===null||value===undefined?value:Math.round(value*lineScaleFor(key));
    legs.forEach(leg=>{
      const netKrw=leg.netKrw===null?null:Math.round(leg.netKrw*pnlScale);
      const realisedKrw=Math.round(leg.realisedKrw*realisedScale);
      const tradedNotionalKrw=Math.round(leg.tradedNotionalKrw*period.notionalScale);
      leg.period={
        netKrw,
        realisedKrw,
        valuedKrw:netKrw===null?null:netKrw-realisedKrw,
        tradedNotionalKrw,
        netMarginBps:netKrw===null||!tradedNotionalKrw?null:netKrw/tradedNotionalKrw*10000
      };
    });
    const attribution=AP_LINES.map(line=>({
      ...line,
      cells:legs.map(leg=>scaleLine(leg.lines[line.key],line.key)),
      totalKrw:legs.some(leg=>leg.lines[line.key]===null)?null:scaleLine(sumOf(legs,leg=>leg.lines[line.key]),line.key),
      subrows:line.key!=="fee"?[]:[
        {label:`설정환매 수수료, ${legs.reduce((sum,leg)=>sum+(leg.ticket?leg.ticket.cu:0),0)} CU × ${MP.formatMoneyFromKrw(book.creationFeeKrwPerCu)}`,cells:legs.map(leg=>scaleLine(leg.feeDetail.creation,"fee"))},
        {label:"KRX 및 KSD",cells:legs.map(leg=>scaleLine(leg.feeDetail.krxKsd,"fee"))},
        {label:"코인 거래소",cells:legs.map(leg=>scaleLine(leg.feeDetail.exchange,"fee"))},
        {label:"커스터디 및 이체",cells:legs.map(leg=>scaleLine(leg.feeDetail.custody,"fee"))}
      ].map(row=>({...row,totalKrw:row.cells.reduce((sum,value)=>sum+value,0)}))
    }));

    const hedgeGroup=(asset,direction)=>{
      const rows=legs.filter(leg=>leg.hedge.asset===asset&&(direction>0?leg.hedge.quantity>0:leg.hedge.quantity<0));
      if(!rows.length)return null;
      const quantity=Math.round(sumOf(rows,row=>row.hedge.quantity)*10000)/10000;
      const avgUsd=quantity?sumOf(rows,row=>row.hedge.quantity*row.hedge.avgUsd)/quantity:0;
      return {
        kind:"hedge",
        asset,
        label:`${asset} 현물, ${direction>0?"매수":"매도"} 잔고`,
        note:rows.length>1?rows.map(row=>`${row.hedge.note} ${Math.abs(row.hedge.quantity).toFixed(4)}`).join(", "):rows[0].hedge.note,
        quantityText:`${quantity>0?"+":""}${quantity.toFixed(4)} ${asset}`,
        avgUsd:round2(avgUsd),
        markUsd:rows[0].hedge.markUsd,
        markNote:mark.markLabel,
        pnlKrw:mark.available?sumOf(rows,row=>row.hedge.pnlKrw):null
      };
    };
    /* D-0910-07: 선물과 FX 레그가 고정 프레임에서 빠지면서 USD는 데스크 시드가 실제로 들고 있는
       현금 잔고 1행으로만 남는다. 선도 커버 성분이 없으므로 평가손익은 0이다. */
    const usdCashAccount=state.primeAccounts.find(item=>item.id===book.usdCashAccountId)||null;
    const usdCashTrading=usdCashAccount?(usdCashAccount.liveBalances.find(item=>item.asset==="USD")?.quantity||0):0;
    const usdCashCustody=usdCashAccount&&typeof MP.custodyHoldingsFor==="function"?MP.custodyHoldingsFor(usdCashAccount.clientId).filter(item=>item.asset==="USD").reduce((sum,item)=>sum+item.quantity,0):0;
    const usdCashUsd=usdCashTrading+usdCashCustody;
    const positionRows=[
      ...legs.map(leg=>({
        kind:"etf",
        label:leg.etfName,
        note:`${leg.bookId}, ETF`,
        quantityText:`${leg.shares>0?"+":""}${leg.shares.toLocaleString("ko-KR")}주`,
        avgKrw:leg.avgKrw,
        markKrw:leg.inavKrw,
        markNote:"iNAV",
        pnlKrw:leg.lines.etf
      })),
      hedgeGroup("BTC",1),
      hedgeGroup("BTC",-1),
      hedgeGroup("ETH",1),
      hedgeGroup("ETH",-1),
      usdCashUsd?{
        kind:"cash",
        label:"USD 현금",
        note:`거래 ${MP.accountLabel(book.usdCashAccountId)}, 수탁 풀`,
        quantityText:`$${usdCashUsd.toLocaleString("en-US")}`,
        avgKrw:usdKrw,
        markKrw:usdKrw,
        markNote:"USD/KRW",
        pnlKrw:0
      }:null
    ].filter(Boolean);
    const positionPnlKrw=mark.available?positionRows.reduce((sum,row)=>sum+(row.pnlKrw??0),0):null;

    const ethBtcRatio=book.ethReplicationFixingUsd/(mark.available?mark.btcFixingUsd:state.constants.btcFixingUsd);
    const etfBtcEq=legs.reduce((sum,leg)=>{
      const perCu=leg.underlying==="ETH"?book.ethPerCu*ethBtcRatio:state.constants.btcPerCu;
      return sum+leg.shares/cuShares*perCu;
    },0);
    const spotBtc=legs.filter(leg=>leg.hedge.asset==="BTC").reduce((sum,leg)=>sum+leg.hedge.quantity,0);
    const ethQuantity=legs.filter(leg=>leg.hedge.asset==="ETH").reduce((sum,leg)=>sum+leg.hedge.quantity,0);
    const spotBtcEq=spotBtc+ethQuantity*ethBtcRatio;
    const netBtcEq=etfBtcEq+spotBtcEq;
    const limitBtcEq=book.netDeltaLimitBtcEq;
    const delta={
      ethBtcRatio,
      etfBtcEq,
      spotBtcEq,
      netBtcEq,
      limitBtcEq,
      utilisationPercent:limitBtcEq?Math.abs(netBtcEq)/limitBtcEq*100:0,
      remainingBtcEq:limitBtcEq-Math.abs(netBtcEq)
    };
    const etfShares=legs.reduce((sum,leg)=>sum+leg.shares,0);
    /* D-0921: ETF 재고 평가액. 포트폴리오 총 자산 한 줄이 이 값을 쓴다. 북 필터를 타면
       총 자산이 표시 필터에 따라 흔들리므로 필터 이전 레그 전체에서 보유 주체별로 모은다.
       평가는 iNAV, iNAV가 없으면 평균 단가이며 재고이므로 절대 주수로 센다. */
    const etfValueByHolderKrw={};
    all.forEach(leg=>{
      const etfBook=state.etfBooks.find(item=>item.id===leg.bookId);
      if(!etfBook)return;
      const value=Math.abs(leg.shares)*(leg.inavKrw??leg.avgKrw??0);
      etfValueByHolderKrw[etfBook.clientId]=(etfValueByHolderKrw[etfBook.clientId]||0)+value;
    });
    const inventory={
      etfShares,
      cuEq:etfShares/cuShares,
      cuShares,
      spotBtc:Math.round(spotBtc*10000)/10000,
      ethQuantity:Math.round(ethQuantity*10000)/10000,
      usdCashUsd,
      etfValueKrw:Object.values(etfValueByHolderKrw).reduce((sum,value)=>sum+value,0),
      etfValueByHolderKrw
    };

    const ledger=book.ledger
      .map(ticket=>{
        const leg=all.find(item=>item.etfId===ticket.etfId)||null;
        if(!leg)return null;
        const navKrw=leg.inavKrw;
        const cuValueKrw=navKrw===null?null:Math.round(navKrw*cuShares);
        const notionalKrw=cuValueKrw===null?null:cuValueKrw*ticket.cu;
        const hedgeQuantity=Math.abs(leg.hedge.quantity);
        const remainderBtc=Math.round((Math.abs(ticket.deliverBtc)-hedgeQuantity)*10000)/10000;
        const outstandingBtc=ticket.side==="설정"&&remainderBtc>0.00005?remainderBtc:0;
        const etfBps=notionalKrw?leg.lines.etf/notionalKrw*10000:null;
        const hedgeBps=notionalKrw?leg.lines.hedge/notionalKrw*10000:null;
        const captureKrw=notionalKrw===null?null:leg.lines.etf+leg.lines.hedge;
        const completedHedgeKrw=outstandingBtc&&hedgeQuantity?Math.round(leg.lines.hedge*Math.abs(ticket.deliverBtc)/hedgeQuantity):null;
        const completedCaptureKrw=completedHedgeKrw===null?null:leg.lines.etf+completedHedgeKrw;
        return {
          ...ticket,
          bookId:leg.bookId,
          etfName:leg.etfName,
          shares:ticket.cu*cuShares,
          hedgeQuantity,
          hedgeNote:leg.hedge.note,
          outstandingBtc,
          navKrw,
          cuValueKrw,
          notionalKrw,
          offsetAvgKrw:leg.avgKrw,
          etfBps,
          hedgeBps,
          realisedBps:notionalKrw?captureKrw/notionalKrw*10000:null,
          completedBps:completedCaptureKrw===null||!notionalKrw?null:completedCaptureKrw/notionalKrw*10000,
          captureKrw,
          completedCaptureKrw,
          feeKrw:-ticket.cu*book.creationFeeKrwPerCu
        };
      })
      .filter(Boolean)
      .filter(ticket=>bookFilter==="all"||ticket.bookId===bookFilter);
    const ledgerTotals={
      count:ledger.length,
      cu:ledger.reduce((sum,ticket)=>sum+ticket.cu,0),
      deliverBtc:ledger.reduce((sum,ticket)=>sum+ticket.deliverBtc,0),
      captureKrw:mark.available?ledger.reduce((sum,ticket)=>sum+ticket.captureKrw,0):null,
      completedCaptureKrw:mark.available?ledger.reduce((sum,ticket)=>sum+(ticket.completedCaptureKrw??ticket.captureKrw),0):null,
      feeKrw:ledger.reduce((sum,ticket)=>sum+ticket.feeKrw,0)
    };

    return {
      mark,period,bookFilter,strategy:scope,
      series,scopeTotals,lpPeriod,lpSummary,
      overlap:{dayKrw:dayOverlapKrw,periodKrw:periodOverlapKrw},
      legs,books,totals,periodTotals,periodBooks,attribution,
      positionRows,positionPnlKrw,delta,inventory,
      ledger,ledgerTotals,transfer,
      lines:AP_LINES,
      strategies:AP_STRATEGIES,
      residualToleranceBps:book.residualToleranceBps
    };
  }

  function apUnitAmount(value) {
    if(value===null||value===undefined)return "";
    const usd=state.displayCurrency==="USD";
    const converted=usd?Number(value)/state.constants.usdKrw:Number(value);
    const digits=usd?2:0;
    const sign=converted>0?"+":converted<0?"-":"";
    return `${sign}${Math.abs(converted).toLocaleString(usd?"en-US":"ko-KR",{minimumFractionDigits:digits,maximumFractionDigits:digits})}`;
  }

  function internalTransferCheck() {
    const deskKrw=apInternalTransfer().totalKrw;
    const primeKrw=getPrimePnlSummary().internalFeeKrw;
    const matched=deskKrw===primeKrw;
    if(!matched)console.error("[pnl] 내부 대체 대응 불일치",{deskKrw,primeKrw});
    return {deskKrw,primeKrw,matched};
  }

  function getPrimePnlRows() {
    return state.primePnlSeed.map(seed=>{
      const client=state.clients.find(item=>item.id===seed.clientId)||null;
      const primeOrder=seed.primeOrderId?state.primeOrders.find(item=>item.id===seed.primeOrderId):null;
      const feeBps=primeOrder?primeOrder.feeBps:client?.feeBps??0;
      const notionalKrw=primeOrder?primeOrder.notionalKrw:seed.notionalKrw;
      const feeKrw=Math.round(notionalKrw*feeBps/10000);
      const relayKrw=seed.mode==="RFQ"?feeKrw:0;
      const algoKrw=seed.mode==="알고"?feeKrw:0;
      return {
        ...seed,
        clientName:client?client.name:seed.clientId,
        category:client?.internal?"내부":client?.category||"기타",
        internal:Boolean(client?.internal),
        feeBps,
        notionalKrw,
        relayKrw,
        algoKrw,
        primeAccountId:primeOrder?primeOrder.primeAccountId:null,
        totalKrw:relayKrw+algoKrw+seed.nettingKrw
      };
    });
  }

  function getPrimePnlSummary() {
    const rows=getPrimePnlRows();
    const sum=key=>rows.reduce((total,row)=>total+row[key],0);
    const relayKrw=sum("relayKrw");
    const algoKrw=sum("algoKrw");
    const nettingKrw=sum("nettingKrw");
    const totalKrw=relayKrw+algoKrw+nettingKrw;
    const categories=[...new Set(rows.map(row=>row.category))].map(name=>{
      const group=rows.filter(row=>row.category===name);
      return {
        name,
        rows:group,
        feeKrw:group.reduce((total,row)=>total+row.relayKrw+row.algoKrw,0),
        nettingKrw:group.reduce((total,row)=>total+row.nettingKrw,0),
        totalKrw:group.reduce((total,row)=>total+row.totalKrw,0)
      };
    }).sort((a,b)=>b.totalKrw-a.totalKrw);
    return {
      rows,
      relayKrw,
      algoKrw,
      nettingKrw,
      totalKrw,
      notionalKrw:sum("notionalKrw"),
      relayCount:rows.filter(row=>row.relayKrw>0).length,
      algoCount:rows.filter(row=>row.algoKrw>0).length,
      categories,
      internalFeeKrw:rows.filter(row=>row.internal).reduce((total,row)=>total+row.relayKrw+row.algoKrw,0),
      internalNettingKrw:rows.filter(row=>row.internal).reduce((total,row)=>total+row.nettingKrw,0)
    };
  }

  function internalNettingBtc() {
    return state.primeOrders.reduce((sum,order)=>sum+(Number.isFinite(order.internalNettingBtc)?order.internalNettingBtc:0),0);
  }

  function nettingGainNote() {
    const cycle=state.settlementCycle;
    return `윈도 내부 상계 ${internalNettingBtc()} BTC, 이체 ${cycle.nettingTransferFrom}건에서 ${cycle.nettingTransferTo}건`;
  }

  /* D-0915: 호가 마진과 헤지 드래그를 페어링 행에서 직접 집계한다. quote - drag = Σ capture 가
     항상 성립하도록 drag 를 잔여로 잡으므로 마진 분해 폭포와 페어링 표 합계가 같은 수치가 된다. */
  function lpPairingTotals() {
    const price=state.constants.ownInavKrw;
    const quoteKrw=Math.round(state.pairingRows.reduce((sum,row)=>sum+row.shares*price*row.margin/10000,0));
    const captureKrw=state.pairingRows.reduce((sum,row)=>sum+row.capture,0);
    return {quoteKrw,dragKrw:quoteKrw-captureKrw,captureKrw};
  }

  function getLpPnlSummary() {
    const pairing=lpPairingTotals();
    const fees=state.lpMarginBreakdownKrw.fees;
    return {
      rows:state.pairingRows,
      grossCaptureKrw:pairing.captureKrw,
      netCaptureKrw:pairing.captureKrw-fees,
      notionalKrw:state.lpTodayNotionalKrw,
      captureBps:state.constants.lpNetCaptureBps,
      unhedgedBtc:state.lpUnhedgedBtc,
      breakdown:{quote:pairing.quoteKrw,drag:pairing.dragKrw,fees}
    };
  }

  /* D-0915: 기간과 전략 스코프의 단일 산출부.
     - LP 호가 마진은 AP 북의 ETF 레그(Σ(체결가 - NAV) x 주수)에 이미 들어 있으므로, 전체 스코프에서는
       그만큼을 ETF 레그에서 빼고 LP 순캡처를 더한다. 전체 = AP + LP - LP 호가 마진.
     - 일별 시드(state.portfolioSeries)가 차트와 기간 합계의 공통 원천이다. 당일은 마지막 점,
       MTD는 마지막 점과 같은 월의 합, YTD는 1월부터 8월까지 누계 + MTD이며 셋 다 같은 배열에서 나온다. */
  function lpOverlapKrw(lpNetKrw) {
    const summary=getLpPnlSummary();
    const factor=summary.netCaptureKrw?summary.breakdown.quote/summary.netCaptureKrw:0;
    return Math.round((Number(lpNetKrw)||0)*factor);
  }

  function pnlDailyRows(dayApKrw,dayLpKrw) {
    const lastIndex=state.portfolioSeries.length-1;
    return state.portfolioSeries.map((point,index)=>{
      const ap=index===lastIndex&&Number.isFinite(dayApKrw)?dayApKrw:point.apPnlKrw;
      const lp=index===lastIndex&&Number.isFinite(dayLpKrw)?dayLpKrw:point.lpPnlKrw;
      return {date:point.date,equityOffsetKrw:point.equityOffsetKrw,ap,lp,all:ap+lp-lpOverlapKrw(lp)};
    });
  }

  function pnlMtdRows(rows) {
    const last=rows[rows.length-1];
    const month=last&&last.date.slice(0,2);
    return rows.filter(row=>row.date.slice(0,2)===month);
  }

  function pnlPriorKrw(scope) {
    const ytd=apPeriods().find(item=>item.key==="ytd")||{};
    const ap=Number(ytd.apPriorKrw)||0;
    const lp=Number(ytd.lpPriorKrw)||0;
    return scope==="ap"?ap:scope==="lp"?lp:ap+lp-lpOverlapKrw(lp);
  }

  function pnlPeriodNetKrw(scope,periodKey,rows) {
    if(periodKey==="day")return rows[rows.length-1][scope];
    const mtdKrw=pnlMtdRows(rows).reduce((sum,row)=>sum+row[scope],0);
    return periodKey==="ytd"?pnlPriorKrw(scope)+mtdKrw:mtdKrw;
  }

  function formatCompactMoneyFromKrw(value) {
    const isUsd=state.displayCurrency==="USD";
    const converted=isUsd?value/state.constants.usdKrw:value;
    const symbol=isUsd?"$":"₩";
    const unit=converted>=1000000000?{value:1000000000,label:"B"}:converted>=1000000?{value:1000000,label:"M"}:null;
    if(!unit)return MP.formatMoneyFromKrw(value);
    return `${symbol}${(converted/unit.value).toFixed(1)}${unit.label}`;
  }

  Object.assign(MP,{getClientPricing,getClientCuQuote,portalClient,portalFeeBps,apPeriods,apPeriod,apStrategyFilter,apBookFilter,apMarkContext,apInternalTransfer,getApBookModel,apUnitAmount,getPrimePnlRows,getPrimePnlSummary,internalNettingBtc,nettingGainNote,internalTransferCheck,getLpPnlSummary,lpOverlapKrw,pnlDailyRows,pnlPeriodNetKrw,formatCompactMoneyFromKrw});
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/core/client-scope.js">
(function (MP) {
  "use strict";

  const {state} = MP;

  /* ---------- who is acting ---------- */

  function clientScopeActive(role=state.role) {
    return MP.roleMetaFor(role)?.affiliation==="client";
  }

  function actingClientIdentity(role=state.role) {
    const meta=MP.roleMetaFor(role);
    if(!meta||meta.affiliation!=="client")return {company:null,user:null};
    const auditName=String(meta.auditUser||"").split(" / ")[0];
    let company=state.clients.find(item=>item.id===meta.clientId)||null;
    let user=company?.users.find(item=>item.id===meta.userId)
      ||company?.users.find(item=>item.name===auditName)
      ||null;
    if(!user){
      for(const candidate of state.clients){
        const found=candidate.users.find(item=>item.id===meta.userId||item.name===auditName);
        if(found){company=candidate;user=found;break;}
      }
    }
    if(!user&&company)user=company.users.find(item=>MP.resolveRole(item.role)===MP.resolveRole(role))||null;
    return {company,user};
  }

  function clientScopeCompany(role=state.role) {
    return actingClientIdentity(role).company;
  }

  function clientScopeUser(role=state.role) {
    return actingClientIdentity(role).user;
  }

  /* ---------- account scope ---------- */

  function clientVisibleAccountIds(role=state.role) {
    const company=clientScopeCompany();
    const user=clientScopeUser(role);
    if(!company||!user)return [];
    return user.visiblePrimeAccountIds.filter(id=>company.primeAccountIds.includes(id));
  }

  function clientExecuteAccountId(role=state.role) {
    const company=clientScopeCompany();
    const user=clientScopeUser(role);
    if(!company||!user||!user.executePrimeAccountId)return null;
    return company.primeAccountIds.includes(user.executePrimeAccountId)?user.executePrimeAccountId:null;
  }

  function clientScopeAccountId(role=state.role) {
    return clientExecuteAccountId(role)||clientVisibleAccountIds(role)[0]||null;
  }

  function clientScopeAccount(role=state.role) {
    return MP.primeAccountById(clientScopeAccountId(role));
  }

  function clientSettlementAccount(role=state.role) {
    return clientScopeAccount(role);
  }

  function clientScopeWallets(role=state.role) {
    const company=clientScopeCompany();
    if(!company)return [];
    const ids=new Set(clientVisibleAccountIds(role).flatMap(id=>MP.primeAccountById(id)?.walletIds||[]));
    if(!ids.size)return [];
    return state.wallets.filter(wallet=>wallet.clientId===company.id&&ids.has(wallet.id));
  }

  function clientScopeBookIds(role=state.role) {
    const company=clientScopeCompany();
    const user=clientScopeUser(role);
    if(!company||!user)return [];
    return user.visibleBookIds.filter(id=>company.bookIds.includes(id));
  }

  /* ---------- contract and operating values in scope ---------- */

  function clientScopeFeeBps() {
    const company=clientScopeCompany();
    return Number.isFinite(company?.feeBps)?company.feeBps:0;
  }

  function clientScopeCapBtc() {
    const company=clientScopeCompany();
    return company?MP.clientPerTradeBtcCap(company):state.riskSettings.clientPerTradeBtcCapDefault;
  }

  function clientScopeVendorIds() {
    const company=clientScopeCompany();
    if(!company)return [];
    const available=new Set(state.vendorQuotes.filter(vendor=>!vendor.excluded).map(vendor=>vendor.id));
    /* D-0915: RFQ 벤더 설정의 화이트리스트가 요청 카드 벤더 목록의 단일 출처다.
       Risk 에서 벤더를 추가하면 그 자리에서 픽커에 나타나야 한다. */
    const whitelisted=Array.isArray(company.rfqVendors)?company.rfqVendors.map(row=>row.id).filter(id=>available.has(id)):[];
    if(whitelisted.length)return whitelisted;
    const registered=Array.isArray(company.tradingVendorIds)?company.tradingVendorIds.filter(id=>available.has(id)):[];
    if(registered.length)return registered;
    const requested=clientScopeRfqs().flatMap(rfq=>Array.isArray(rfq.vendorIds)?rfq.vendorIds:[]).filter(id=>available.has(id));
    return [...new Set(requested)];
  }

  /* ---------- traded pair scope ----------
     Hook: a client row may carry `tradablePairs`, a subset of `state.pairs` symbols.
     No seeded client carries one today, so every client trades all eight pairs. */

  function clientPairSymbols() {
    const company=clientScopeCompany();
    const all=state.pairs.map(pair=>pair.symbol);
    const allowed=Array.isArray(company&&company.tradablePairs)
      ?company.tradablePairs.filter(symbol=>all.includes(symbol))
      :null;
    return allowed&&allowed.length?allowed:all;
  }

  function pairsInScope() {
    if(!clientScopeActive())return state.pairs;
    const allowed=new Set(clientPairSymbols());
    return state.pairs.filter(pair=>allowed.has(pair.symbol));
  }

  /* ---------- order scope ---------- */

  function clientScopeOrders() {
    const company=clientScopeCompany();
    if(!company)return [];
    return state.clientOrders.filter(order=>order.clientId===company.id);
  }

  function clientScopeRfqs() {
    const company=clientScopeCompany();
    if(!company)return [];
    return state.activeRfqs.filter(rfq=>rfq.clientId===company.id);
  }

  function clientLatestRfq() {
    return clientScopeRfqs()[0]||null;
  }

  function deskScopeRfqs() {
    return state.activeRfqs.filter(rfq=>!rfq.clientId);
  }

  /* ---------- custody read at client scope ---------- */

  function clientWalletCustodians(wallet,role=state.role) {
    const account=clientVisibleAccountIds(role).map(id=>MP.primeAccountById(id))
      .find(item=>item&&item.walletIds.includes(wallet.id));
