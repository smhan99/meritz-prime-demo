  function applyExecutionWindowParam(field,value) {
    const params=state.executionWindowParams;
    if(!["start","end","slice"].includes(field)||!Number.isFinite(value)){renderRoute(state.current,false);return;}
    if(MP.executionParamsLocked()){
      renderRoute(state.current,false);
      showToast("윈도 파라미터 잠김",MP.executionParamsLockReason(),"warning");
      return;
    }
    const next={...params};
    if(field==="start")next.startMinutes=value;
    if(field==="end")next.endMinutes=value;
    if(field==="slice")next.sliceMinutes=value;
    if(next.endMinutes<=next.startMinutes){
      renderRoute(state.current,false);
      showToast("윈도 값 확인","윈도 종료는 시작보다 뒤여야 함","danger");
      return;
    }
    if(next.endMinutes-next.startMinutes<next.sliceMinutes){
      renderRoute(state.current,false);
      showToast("슬라이스 길이 확인","슬라이스가 윈도보다 길 수 없음","danger");
      return;
    }
    if(MP.executionSliceCount(next)>MP.executionMaxSlices){
      renderRoute(state.current,false);
      showToast("슬라이스 수 상한",`슬라이스 ${MP.executionMaxSlices}개까지만 목업에서 재생 가능`,"danger");
      return;
    }
    const previousLabel=`${MP.executionWindowLabel()}, ${MP.executionSliceLabel()}`;
    params.startMinutes=next.startMinutes;
    params.endMinutes=next.endMinutes;
    params.sliceMinutes=next.sliceMinutes;
    MP.resetExecutionTape();
    state.executionStateView="auto";
    addAudit("EXEC_WINDOW_PARAM",`${executionMonitorOrderLabel()}, ${previousLabel} to ${MP.executionWindowLabel()}, ${MP.executionSliceLabel()}`);
    renderRoute(state.current,false);
  }

  /* ---------- RFQ 수락은 체결로 종결된다 ----------
     RFQ 모드에는 집행 레그도 픽싱 대기도 없다. 수락한 올인가로 그 자리에서 체결이
     성립하므로 주문은 체결 완료가 되고, Portfolio는 체결 100%, 운영 큐는 백투백 체결
     레그, 정산 레그는 17:00 사이클에 적재된다. 알고 모드(instruct-ap-algo,
     client-algo-execute)는 이 경로를 쓰지 않고 집행 모니터를 유지한다. */

  function rfqFillWalletId(primeAccountId,asset) {
    const account=MP.primeAccountById(primeAccountId);
    if(!account)return primeAccountId||"";
    return account.walletIds[0]||account.id;
  }

  function queueRfqSettlementLeg(fill) {
    const cycle=state.settlementCycle;
    const signed=fill.side==="SELL"?-fill.quantity:fill.quantity;
    cycle.netMovements.push({
      walletId:fill.settlementWalletId,asset:fill.asset,
      quantity:`${signed<0?"-":"+"}${Math.abs(signed).toFixed(4)}`,
      ref:fill.orderId,source:"RFQ 체결"
    });
    cycle.nettingCount+=1;
  }

  function rfqFillQueueOrder(fill,client,summaryNote) {
    const sideLabel=fill.side==="SELL"?"매도":"매수";
    const quantityText=`${fill.quantity.toFixed(4)} ${fill.asset}`;
    return {
      id:fill.orderId,clientId:client.id,kind:"코인 세그먼트",mode:"RFQ",side:sideLabel,
      feeBps:fill.feeBps,quantityBtc:fill.quantity,notionalKrw:fill.notionalKrw,
      summary:`코인 ${sideLabel}`,summaryNote,
      fulfilRoute:"벤더 호가 릴레이",primeAccountId:fill.primeAccountId,
      stage:"완료",progressPercent:100,statusLabel:"완료",time:fill.at,
      delivery:`${quantityText}, ${fill.settlementWalletId}`,settlementDate:"2026-09-09",
      fulfilment:[
        {step:1,label:"벤더 호가 수취",target:`${fill.rfqId}, 벤더 ${fill.vendorCount}곳 릴레이`,quantity:quantityText,exposure:"쿼트 스택 캡처 완료",status:"완료",time:fill.at},
        {step:2,label:"백투백 체결",target:`${fill.vendorLabel} 올인가 ${MP.formatLiteralMoney(fill.allInUsd,"USD")}`,quantity:quantityText,exposure:"프라임 자기 포지션 없음, 벤더 체결과 고객 체결 동시 성립",status:"완료",time:fill.at},
        {step:3,label:"정산 레그 적재",target:`${fill.cycle}, ${fill.settlementWalletId}`,quantity:quantityText,check:"컷오프 17:00",status:"완료",time:fill.at}
      ]
    };
  }

  function completeRfqFill(options) {
    const {rfq=null,rfqId=null,target,vendorId,vendorLabel,vendorCount,side,quantity,asset,
      allInUsd,clientPriceUsd=null,notionalKrw,feeBps,client,primeAccountId,summaryNote}=options;
    const serial=String(state.nextClientOrderNumber++).padStart(4,"0");
    const orderId=`ORD-260908-${serial}`;
    const primeOrderId=`PRM-260908-${serial}`;
    const fill={
      id:`FILL-260908-${String(state.nextRfqFillNumber++).padStart(4,"0")}`,
      orderId,primeOrderId,rfqId:rfqId||(rfq?rfq.id:orderId),target,
      vendorId,vendorLabel,vendorCount,
      side,quantity,asset,
      allInUsd,clientPriceUsd,
      priceUsd:Number.isFinite(clientPriceUsd)?clientPriceUsd:allInUsd,
      notionalKrw,feeBps,
      clientId:client.id,primeAccountId,
      settlementWalletId:rfqFillWalletId(primeAccountId,asset),
      at:MP.currentTimestamp().slice(0,8),
      cycle:state.settlementCycle.label,
      status:"체결 완료"
    };
    state.rfqFills.unshift(fill);
    queueRfqSettlementLeg(fill);
    if(rfq){
      rfq.acceptedVendorId=vendorId;
      rfq.status="체결 완료";
      rfq.ttl=null;
      rfq.statusHistory=["견적 수신","체결 완료"];
      rfq.executionTarget=quantity;
      rfq.executionFilled=quantity;
      rfq.orderId=orderId;
      rfq.fill=fill;
      if(Number.isFinite(clientPriceUsd))rfq.clientPriceUsd=clientPriceUsd;
    }
    state.clientOrders.unshift(rfqFillQueueOrder(fill,client,summaryNote));
    state.primeOrders.unshift({
      id:primeOrderId,clientId:client.id,mode:"RFQ",side:side==="SELL"?"매도":"매수",
      quantityBtc:quantity,notionalKrw,
      primeAccountId,receivingWalletId:fill.settlementWalletId,
      feeBps,reason:client.internal?"데스크 RFQ 소싱":"고객 RFQ 릴레이",
      vendorBestAllInUsd:allInUsd,vendorRouting:[{vendorId,share:1}],
      reference:orderId,progressPercent:100,status:"완료",statusTime:fill.at
    });
    state.primePnlSeed.push({
      id:`PPL-${serial}`,orderId,clientId:client.id,mode:"RFQ",
      primeOrderId,nettingKrw:0,note:client.internal?"당사 내부":""
    });
    addAudit("RFQ_FILLED",`${orderId}, ${fill.rfqId}, ${vendorLabel}, ${side} ${quantity.toFixed(4)} ${asset}, All-in ${MP.formatLiteralMoney(allInUsd,"USD")}, 체결 ${fill.at}, ${fill.cycle}`);
    return fill;
  }

  function handleAction(action,element) {
    const blockedActions=["review-trade","request-trade-rfq","accept-trade-rfq","create-ap-rfq","instruct-ap-algo","accept-ap-quote","execute-hedge","client-submit","client-approve","client-algo-execute","create-client-rfq","accept-client-quote","instruct-client-algo","submit-custody-transfer","custody-policy-submit","custody-policy-approve","run-settlement-cycle","queue-relay"];
    if(riskHolderKillActive()&&blockedActions.includes(action)){addAudit("ORDER_BLOCKED",action,"차단","negative");showToast("킬 스위치 활성","신규 주문, RFQ, 헤지 실행 차단","danger");return;}
    switch(action) {
      case "role-home":navigate(roleDefaults[state.role]);break;
      case "role-switch":switchRole(element.dataset.role);break;
      case "display-currency":{
        const next=element.dataset.currency==="USD"?"USD":"KRW";
        if(next===state.displayCurrency)break;
        state.displayCurrency=next;
        renderRoute(state.current,false);
        break;
      }
      case "noop":showToast("컨트롤 비활성","현재 화면 미지원");break;
      case "new-rfq":state.orderCardTarget="etf";navigate("ap-order");break;
      case "go-blotter":state.portfolioTab="orders";navigate("portfolio");break;
      /* 고객 역할은 blotter 라우트가 없으므로 같은 목록인 트레이드 하단 주문 탭으로 보낸다. */
      case "go-client-orders":state.tradeTab="orders";state.tradeOrderFilter="all";navigate("trade","execution");break;
      case "go-settlement":navigate("settlement");break;
      case "focus-settlement-transfer":document.querySelector("[data-settlement-ticket-custodian]")?.focus();break;
      case "select-pdf-etf":state.selectedPdfEtf=element.dataset.etf;renderRoute("admin-system",false);break;
      case "go-execution":navigate("ap-execution");break;
      case "focus-trade-ticket":navigate("trade","execution");setTimeout(()=>document.getElementById("trade-order-size")?.focus(),0);break;
      case "watch-star":MP.toggleFavouritePair(MP.pairBySymbol(element.dataset.pair).symbol);renderRoute("trade",false);break;
      case "watch-filter":state.watchFilter=element.dataset.filter;renderRoute("trade",false);break;
      case "watch-select":{
        const symbol=MP.pairBySymbol(element.dataset.pair).symbol;
        state.watchSelected=symbol;
        document.querySelectorAll("[data-watch-row]").forEach(row=>row.classList.toggle("selected",row.dataset.watchRow===symbol));

  function receivePdfRevision() {
    const etfId=state.selectedPdfEtf;
    const etf=state.etfs.find(item=>item.id===etfId);
    const received=state.pdfUploads[etfId];
    if(!etf||!received)return;
    const time=MP.currentTimestamp().slice(0,8);
    const currentVersion=Number(String(received.history[0]?.version||"v00").replace(/\D/g,""))||0;
    const version=`v${String(currentVersion+1).padStart(2,"0")}`;
    received.history=[{time,version,changeSummary:"추정현금 정정"},...received.history].slice(0,5);
    received.receivedAt=time;
    received.status="갱신 수신";
    received.validationStep=4;
    received.validationResult="자동 검증 통과";
    received.fileName=`${etf.id.replace("-btc","").toUpperCase()}_BTC_PDF_${received.asofDate.replace(/-/g,"")}_${version}.pdf`;
    addAudit("PDF_REVISION",`${etf.code}, ${version}, 추정현금 정정`);
    renderRoute("admin-system",false);
    showToast("최신본 수신",`${etf.name}, ${version}, 자동 검증 통과`,"success");
  }

    const ticket=MP.custodyTicket(surface);
    const row=ticket?.rows.find(item=>item.id===rowId);
    if(!row)return false;
    const value=Number(raw);
    row.value=raw===""||!Number.isFinite(value)||value<0?null:value;

      return;
    }
    if(target.matches("[data-client-ttl]")){
      if(!MP.canControl("exec","client")){renderRoute("trade",false);return;}
      const value=Number(target.value);
      state.clientTradeTicket.ttl=[30,60,300].includes(value)?value:60;
      renderRoute("trade",false);
      return;
    }
    if(target.matches("[data-settlement-desk-account]")){
      if(target.value==="*"||MP.deskVisibleAccountIds().includes(target.value)){
        state.settlementDeskAccountId=target.value;
        if(target.value!=="*")state.custodyTickets.settlement.primeAccountId=target.value;
        state.custodyPolicyScope.desk.primeAccountId=target.value==="*"?MP.deskVisibleAccountIds()[0]:target.value;
        state.custodyPolicyScope.desk.asset=null;
      }
      renderRoute("settlement",false);
      return;
    }
    if(target.matches("[data-settlement-ticket-custodian]")){
      if(!custodyTicketEditable("settlement")){renderRoute(state.current,false);return;}
      const ticket=state.custodyTickets.settlement;
      ticket.from=target.value;
      ticket.quantity=null;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-settlement-ticket-asset]")){
      if(!custodyTicketEditable("settlement")){renderRoute(state.current,false);return;}
      const ticket=state.custodyTickets.settlement;
      ticket.asset=target.value;
      ticket.quantity=null;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-settlement-ticket-to]")){
      if(!custodyTicketEditable("settlement")){renderRoute(state.current,false);return;}
      state.custodyTickets.settlement.to=target.value;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-account]")){
      const surface=target.dataset.surface;
      if(!custodyTicketEditable(surface)){renderRoute(state.current,false);return;}
      const ticket=MP.custodyTicket(surface);
      if(!MP.custodyTicketAccountIds().includes(target.value)){renderRoute(state.current,false);showToast("계정 선택 불가","운용 중인 Prime 계정만 선택 가능","danger");return;}
      ticket.primeAccountId=target.value;
      ticket.rows=[];
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-asset]")){
      const surface=target.dataset.surface;
      if(!custodyTicketEditable(surface)){renderRoute(state.current,false);return;}
      const ticket=MP.custodyTicket(surface);
      ticket.asset=target.value;
      ticket.rows=ticket.rows.map(row=>({...row,value:null}));
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-row-custodian]")){
      const surface=target.dataset.surface;
      const ticket=MP.custodyTicket(surface);
      const row=ticket?.rows.find(item=>item.id===target.dataset.rowId);
      if(!custodyTicketEditable(surface)||!row){renderRoute(state.current,false);return;}
      const vendors=MP.custodyVendorsForAccount(ticket.primeAccountId);
      if(target.value&&!vendors.includes(target.value)){renderRoute(state.current,false);showToast("커스터디 확인","고객사 연결 커스터디만 배분 대상","danger");return;}
      if(target.value&&ticket.rows.some(item=>item.id!==row.id&&item.custodian===target.value)){renderRoute(state.current,false);showToast("중복 커스터디","같은 커스터디를 두 행에 넣을 수 없음","danger");return;}
      row.custodian=target.value;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-row-value]")){
      const surface=target.dataset.surface;
      if(!custodyTicketEditable(surface)){renderRoute(state.current,false);return;}
      readCustodyRowValue(surface,target.dataset.rowId,target.value);
      MP.refreshCustodyTicketDom(surface);
      return;
    }
    if(target.matches("[data-custody-policy-account]")){
      const scope=target.dataset.scope;
      if(!MP.custodyPolicyAccountIds().includes(target.value)){renderRoute(state.current,false);showToast("계정 선택 불가","운용 중인 Prime 계정만 선택 가능","danger");return;}
      state.custodyPolicyScope[scope].primeAccountId=target.value;
      state.custodyPolicyScope[scope].asset=null;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-policy-asset]")){
      const scope=target.dataset.scope;
      const selection=state.custodyPolicyScope[scope];
      if(!MP.policyAssetsForAccount(selection.primeAccountId).includes(target.value)){renderRoute(state.current,false);return;}
      selection.asset=target.value;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-policy-transfer]")){
      const policy=MP.custodyPolicyDraft(target.dataset.scope);
      if(!policyEditable(policy)){renderRoute(state.current,false);return;}
      policy.transferValue=readPolicyNumber(target.value);
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-policy-value]")){
      const policy=MP.custodyPolicyDraft(target.dataset.scope);
      const row=policy?policy.rows.find(item=>item.id===target.dataset.rowId):null;
      if(!policyEditable(policy)||!row){renderRoute(state.current,false);return;}
      row.value=readPolicyNumber(target.value);
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-custody-vendor]")){
      const clientId=target.dataset.clientId;
      const owner=MP.clientScopeActive()?"client":"prime";
      const deskOwned=Boolean(state.clients.find(item=>item.id===clientId)?.internal);
      const allowed=owner==="client"
        ?MP.canControl("ops","client")
        :(MP.canControl("ops","prime")&&state.role==="biz-admin")||(deskOwned&&MP.canControl("ops","securities"));
      if(!allowed){renderRoute(state.current,false);return;}
      changeCustodyVendorSet(clientId,target.dataset.vendor,target.checked);
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-client-order-kind]")){state.clientPortal.orderKind=target.value;renderRoute(state.current,false);return;}
    /* ETF 블록 티켓 3필드 (D-0910-10). 수량은 CU와 주수 두 입력이 서로를 파생시키고
       명목은 기초자산 수량으로 다시 계산된다. 시드 20 CU에서는 값이 그대로 유지된다. */
    if(target.matches("[data-client-order-etf]")){
      if(!MP.canControl("exec","client")){renderRoute(state.current,false);return;}
      const etf=state.etfs.find(item=>item.id===target.value);
      if(!etf){renderRoute(state.current,false);return;}
      state.clientPortal.etfId=etf.id;
      state.clientPortal.quoteApproved=false;
      state.clientPortal.lockedPricing=null;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-client-price-basis]")){
      if(!MP.canControl("exec","client")){renderRoute(state.current,false);return;}
      state.clientPortal.priceBasis=target.value==="inav"?"inav":"nav";
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-client-block-quantity]")){
      if(!MP.canControl("exec","client")){renderRoute(state.current,false);return;}
      const portal=state.clientPortal;
      const value=Math.max(0,Number(String(target.value).replace(/,/g,""))||0);
      const cuShares=state.constants.cuShares;
      if(!value){renderRoute(state.current,false);showToast("수량 확인","0보다 큰 값 필요","danger");return;}
      const cu=target.dataset.clientBlockQuantity==="shares"?value/cuShares:value;
      portal.cu=cu;
      portal.shares=cu*cuShares;
      portal.btc=cu*state.constants.btcPerCu;
      portal.amountKrw=Math.round(portal.btc*state.constants.btcFixingUsd*state.constants.usdKrw);
      portal.quoteApproved=false;
      portal.lockedPricing=null;
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-client-cap]")){
      const company=MP.clientScopeCompany();
      if(!MP.canControl("ops","client")||!company){renderRoute(state.current,false);return;}
      const value=Number(target.value);
      if(!Number.isFinite(value)||value<=0){renderRoute(state.current,false);showToast("상한값 확인","0보다 큰 값 필요","danger");return;}
      const previous=MP.clientPerTradeBtcCap(company);
      company.perTradeBtcCap=value;
      addAudit("OPS_PARAM_CHANGE",`${company.name} 거래당 BTC 상한: ${previous} to ${value}`);
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-client-scope]")){
      const company=MP.clientScopeCompany();
      const user=company?.users.find(item=>item.id===target.dataset.userId);
      if(!MP.canControl("ops","client")||!user){renderRoute(state.current,false);return;}
      const field=target.dataset.clientScope;
      if(field==="executePrimeAccountId")user[field]=target.value||null;
      else user[field]=target.value?[target.value]:[];
      addAudit("OPS_PARAM_CHANGE",`${company.name} ${user.name} ${field}: ${target.value||"미지정"}`);
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-desk-scope]")){
      const company=MP.deskCompany();
      const user=company?.users.find(item=>item.id===target.dataset.userId);
      if(!MP.canControl("ops","securities")||!company||!user){renderRoute(state.current,false);return;}
      const field=target.dataset.deskScope;
      const all=field==="visibleBookIds"?[...company.bookIds]:[...company.primeAccountIds];
      user[field]=target.value==="*"?all:(target.value?[target.value]:[]);
      addAudit("OPS_PARAM_CHANGE",`${company.name} ${user.name} ${field}: ${user[field].join(", ")||"미지정"}`);
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-desk-user-role]")){
      const company=MP.deskCompany();
      const user=company?.users.find(item=>item.id===target.dataset.deskUserRole);
      if(!MP.canControl("ops","securities")||!company||!user){renderRoute(state.current,false);return;}
      if(!MP.deskRoleKeys.includes(target.value)){renderRoute(state.current,false);return;}
      const previous=MP.roleMetaFor(user.role).label;
      user.role=target.value;
      addAudit("DESK_USER_ROLE",`${company.name} ${user.name}: ${previous} -> ${MP.roleMetaFor(user.role).label}`);
      renderRoute(state.current,false);
      return;
    }
    if(target.matches("[data-desk-book-account]")){
      if(!MP.canControl("ops","securities")){repaintLp();return;}
      const book=state.etfBooks.find(item=>item.id===target.dataset.deskBookAccount);
      const account=state.primeAccounts.find(item=>item.id===target.value);
      if(!book||!account||!MP.deskOwnsBook(book.id)||account.clientId!==book.clientId){repaintLp();showToast("매핑 불가","같은 고객사의 Prime 계정만 북 기본값으로 지정","danger");return;}
      const previous=book.primeAccountId;
      if(previous===account.id)return;
      book.primeAccountId=account.id;
      addAudit("OPS_PARAM_CHANGE",`${book.id} 기본 Prime 계정: ${MP.accountLabel(previous)} to ${MP.accountLabel(account.id)}`);
      repaintLp();
      return;
    }
    if(target.matches("[data-desk-row-account]")){
      if(!MP.canControl("ops","securities")){repaintLp();return;}
      const row=lpBookRowById(target.dataset.deskRowAccount);
      const book=state.etfBooks.find(item=>item.id===row?.bookId);
      if(!row||!book||!MP.deskOwnsBook(book.id)){repaintLp();return;}
      const previous=row.primeAccountId;
      const account=state.primeAccounts.find(item=>item.id===target.value);
      if(!account||account.clientId!==book.clientId){repaintLp();showToast("변경 불가","같은 고객사의 Prime 계정만 지정 가능","danger");return;}
      if(previous===account.id)return;
      row.primeAccountId=account.id;
      addAudit("OPS_PARAM_CHANGE",`${row.id} Prime 계정: ${previous?MP.accountLabel(previous):"미배정"} to ${MP.accountLabel(account.id)}`);
      repaintLp();
      return;
    }
    if(target.matches("[data-client-user-role]")){
      const company=MP.clientScopeCompany();
      if(!MP.canControl("ops","client")||!company){renderRoute(state.current,false);return;}
      const user=company?.users.find(item=>item.id===target.dataset.clientUserRole);
      if(user&&MP.roleMetaFor(target.value)?.affiliation==="client"){
        const previous=MP.roleMetaFor(user.role).label;
        user.role=target.value;
        addAudit("CLIENT_USER_ROLE",`${company.name} ${user.name}: ${previous} -> ${MP.roleMetaFor(user.role).label}`);
        renderRoute(state.current,false);
      }
      return;
    }
    /* 계정 선택. 포지션과 매도 잔고, 그리고 현재 수량의 슬라이더 비율을 제자리에서 다시 읽는다. */
    if(target.matches("[data-order-account]")){state.orderAccountId=target.value;MP.syncOrderAccountRows();return;}
    if(target.matches("[data-order-etf]")){state.apOrderDraft.etfId=target.value;state.orderAccountId=null;renderRoute("trade",false);return;}
    if(target.matches("[data-order-unit]")){state.orderUnit=target.value==="quote"?"quote":"base";state.orderPercent=MP.orderPercentFromSize(state.orderSize);renderRoute("trade",false);return;}
    if(target.matches("[data-twap-randomize]")){state.twapRandomize=target.checked;MP.syncTwapPreview();return;}
    if(target.matches("[data-twap-advanced]")){state.twapAdvanced=target.checked;if(!target.checked){state.twapTriggerPrice=null;state.twapMaxPrice=null;}renderRoute("trade",false);return;}
    if(target.matches("[data-rfq-basis]")){state.rfqBasis=target.value;return;}
    if(target.matches("[data-rfq-ttl]")){state.rfqTtl=Number(target.value)===60?60:30;state.apOrderDraft.ttl=state.rfqTtl;return;}
    if(target.matches("[data-trade-rfq-vendor-all]")){
      document.querySelectorAll("[data-trade-rfq-vendor]").forEach(box=>{box.checked=target.checked;});
      state.apOrderDraft.vendorIds=[...document.querySelectorAll("[data-trade-rfq-vendor]:checked")].map(input=>input.value);
      MP.syncVendorPick("trade-rfq-vendor");
      return;
    }
    if(target.matches("[data-trade-rfq-vendor]")){state.apOrderDraft.vendorIds=[...document.querySelectorAll("[data-trade-rfq-vendor]:checked")].map(input=>input.value);MP.syncVendorPick("trade-rfq-vendor");return;}
    if(target.matches("[data-order-ttl]")){state.apOrderDraft.ttl=Number(target.value);document.querySelectorAll("[data-fixing-summary]").forEach(node=>node.textContent=MP.fixingSummaryText());return;}
    if(target.matches("[data-ap-rfq]")){state.selectedApRfq=target.value;const rfq=state.activeRfqs.find(item=>item.id===state.selectedApRfq);if(rfq){state.rfqQuantity=rfq.quantity;state.executionTarget=rfq.executionTarget??rfq.quantity;state.executionFilled=rfq.executionFilled||0;state.rfqTTL=rfq.ttl||0;}renderRoute("trade",false);return;}
    if(target.matches("[data-linked-business]")){state.selectedLinkedBusiness=target.value;return;}
    if(target.matches("[data-order-vendor-all]")){
      document.querySelectorAll("[data-order-vendor]").forEach(box=>{box.checked=target.checked;});
      state.apOrderDraft.vendorIds=[...document.querySelectorAll("[data-order-vendor]:checked")].map(input=>input.value);
      MP.syncVendorPick("order-vendor");
      document.querySelectorAll("[data-selected-vendors]").forEach(node=>node.textContent=state.apOrderDraft.vendorIds.length);
      document.querySelectorAll("[data-vendor-summary]").forEach(node=>node.textContent=MP.vendorSummaryText());
      const submitAll=document.querySelector('[data-action="create-ap-rfq"],[data-action="instruct-ap-algo"]');
      if(submitAll)submitAll.disabled=!MP.canCreateRfq();
      return;
    }
    if(target.matches("[data-order-vendor]")){MP.syncVendorPick("order-vendor");state.apOrderDraft.vendorIds=[...document.querySelectorAll("[data-order-vendor]:checked")].map(input=>input.value);document.querySelectorAll("[data-selected-vendors]").forEach(node=>node.textContent=state.apOrderDraft.vendorIds.length);document.querySelectorAll("[data-vendor-summary]").forEach(node=>node.textContent=MP.vendorSummaryText());const submit=document.querySelector('[data-action="create-ap-rfq"],[data-action="instruct-ap-algo"]');if(submit)submit.disabled=!MP.canCreateRfq();}
    if(target.matches("[data-order-venue-exclusion]")){
      state.apOrderDraft.excludedVenueIds=[...document.querySelectorAll("[data-order-venue-exclusion]:checked")].map(input=>input.value);
      target.nextElementSibling?.classList.toggle("ck",target.checked);
      const names=state.apOrderDraft.excludedVenueIds.map(id=>state.vendorQuotes.find(vendor=>vendor.id===id)?.name.replace(/ Prime$/,"")).filter(Boolean);
      document.querySelectorAll("[data-excluded-venue-label]").forEach(node=>{node.textContent=names.join(", ")||"없음";});
      return;
    }
    if(target.matches("[data-row-param]")){
      const row=lpBookRowById(target.dataset.rowId);const field=target.dataset.rowParam;
      if(!row||!MP.canControl("exec","securities")){repaintLp();return;}
      const value=["hedgeVenue","hedgePriceType","hedgeOrderMode","quoteSourceMode"].includes(field)?target.value:Number(target.value);
      if(value===""||(typeof value==="number"&&(!Number.isFinite(value)||value<0))){showToast("파라미터값 확인","0 이상 값 필요","danger");return;}
      stageRowValue(row,field,value);repaintLp();return;
    }
  });
  document.addEventListener("input",event=>{
    if(event.target.matches("[data-ticket-order-param]")){
      const key=event.target.dataset.ticketOrderParam;
      const value=Number(event.target.value);
      if(Number.isFinite(value)){
        if(key==="participation")state.apOrderDraft.participationPct=value;
        if(key==="collar")state.apOrderDraft.priceBandBp=value;
      }
      return;
    }
    if(event.target.id==="trade-order-price"){state.orderLimitPrice=MP.pairValueFromInput(MP.currentPair(),event.target.value);MP.syncTradeOrderSummary();}
    if(event.target.id==="trade-order-size"){state.orderSize=Number(String(event.target.value).replace(/,/g,""))||0;state.orderPercent=MP.orderPercentFromSize(state.orderSize);MP.syncOrderSlider();MP.syncTradeOrderSummary();MP.syncTwapPreview();}
    /* 드래그 중 전체 재렌더는 range 요소를 파괴해 포인터 캡처가 끊긴다.
       슬라이더는 DOM 만 제자리에서 갱신한다. */
    if(event.target.matches("[data-order-percent]")){
      state.orderPercent=Math.max(0,Math.min(100,Number(event.target.value)||0));
      state.orderSize=MP.orderSizeFromPercent(state.orderPercent);
      event.target.style.setProperty("--range-fill",`${state.orderPercent}%`);
      document.querySelectorAll("[data-order-percent-label]").forEach(node=>{node.textContent=`${state.orderPercent}%`;});
      MP.syncOrderSizeInput();
      MP.syncTradeOrderSummary();
      MP.syncTwapPreview();
    }
    if(event.target.matches("[data-twap-duration]")){state.twapDuration[event.target.dataset.twapDuration]=Math.max(0,Number(event.target.value)||0);MP.syncTwapPreview();}
    if(event.target.matches("[data-twap-slice]")){
      const value=String(event.target.value).trim();
      state.twapSliceMinutes=value===""?null:Math.max(1,Math.floor(Number(value)||1));
      MP.syncTwapPreview();
    }
    if(event.target.matches("[data-twap-price]")){
      const value=String(event.target.value).replace(/,/g,"").trim();
      const parsed=Number(value);
      state[`twap${event.target.dataset.twapPrice[0].toUpperCase()}${event.target.dataset.twapPrice.slice(1)}`]=value&&Number.isFinite(parsed)&&parsed>0?parsed:null;
    }
    if(event.target.id==="watch-search"){
      state.watchQuery=event.target.value;
      const rows=document.getElementById("watchlist-rows");
      if(rows)rows.innerHTML=MP.renderWatchRows();
    }
    if(event.target.id==="market-selector-search"){
      state.selectorQuery=event.target.value;
      marketSelectorRefresh();
    }
    if(event.target.matches("[data-settlement-search]")){
      const query=event.target.value.trim().toLowerCase();
      document.querySelectorAll("[data-settlement-asset-row]").forEach(row=>{row.hidden=query&&!row.dataset.settlementAssetRow.includes(query);});
    }
    if(event.target.matches("[data-settlement-ticket-quantity]")){
      const ticket=state.custodyTickets.settlement;
      const available=typeof MP.settlementSourceBalance==="function"?MP.settlementSourceBalance(ticket):Infinity;
      const value=Number(event.target.value);
      if(Number.isFinite(value)&&value>available){event.target.value=available;ticket.quantity=available;showToast("가용 수량 초과",`출발 잔고 ${MP.custodyQuantityText(available,ticket.asset)}까지 가능`,"warning");}
      else ticket.quantity=Number.isFinite(value)&&value>0?value:null;
    }
    if(event.target.matches("[data-custody-row-value]")){
      const surface=event.target.dataset.surface;
      if(custodyTicketEditable(surface)&&readCustodyRowValue(surface,event.target.dataset.rowId,event.target.value))MP.refreshCustodyTicketDom(surface);
    }
    if(event.target.matches("[data-order-quantity]"))MP.updateApOrderQuantity(event.target.dataset.orderQuantity,event.target.value);
    if(event.target.matches("[data-lp-spread]")){
      const value=Number(event.target.value);
      if(!Number.isFinite(value)||value<0||value>100)return;
      state.lpSpreadBps=value;
      const bid=Math.round(state.constants.ownInavKrw*(1-value/10000));
      const ask=Math.round(state.constants.ownInavKrw*(1+value/10000));
      document.querySelectorAll("[data-lp-suggested-bid]").forEach(node=>node.textContent=MP.formatMoneyFromKrw(bid));
      document.querySelectorAll("[data-lp-suggested-ask]").forEach(node=>node.textContent=MP.formatMoneyFromKrw(ask));
      document.querySelectorAll("[data-lp-spread-label]").forEach(node=>node.textContent=value.toFixed(2));
    }
  });

  function renderCommands(query="") {const normalized=query.trim().toLowerCase();const entries=Object.entries(screens).filter(([route])=>isRouteAllowed(route)&&routeDisplayName(route).toLowerCase().includes(normalized));commandResults.innerHTML=entries.map(([route],index)=>`<button class="command-result ${index===0?"active":""}" type="button" data-command-route="${route}"><span><strong>${routeDisplayName(route)}</strong></span><kbd>↵</kbd></button>`).join("")||'<div class="empty-note">일치 화면 없음</div>';}
  function openCommands(){renderCommands();commandPalette.showModal();commandInput.value="";setTimeout(()=>commandInput.focus(),0);}
  document.querySelector(".command-trigger").addEventListener("click",openCommands);
  commandInput.addEventListener("input",()=>renderCommands(commandInput.value));
  commandResults.addEventListener("click",event=>{const result=event.target.closest("[data-command-route]");if(!result)return;commandPalette.close();navigate(result.dataset.commandRoute);});
  commandInput.addEventListener("keydown",event=>{if(event.key==="Enter"){const first=commandResults.querySelector("[data-command-route]");if(first){commandPalette.close();navigate(first.dataset.commandRoute);}}});
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape"){closeRoleMenu();closeNotifications();if(state.selectorOpen){event.preventDefault();closeMarketSelector();return;}}
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){
      event.preventDefault();
      if(state.current==="trade"&&isRouteAllowed("trade"))openMarketSelector();
      else openCommands();
      return;
    }
    if(!state.selectorOpen)return;
    if(event.key==="ArrowDown"||event.key==="ArrowUp"){event.preventDefault();moveSelectorHighlight(event.key==="ArrowDown"?1:-1);return;}
    if(event.key==="Enter"&&state.selectorHighlight){event.preventDefault();setTradePair(state.selectorHighlight,{reset:true});}
  });

  function updateTTLDisplay(){
    state.activeRfqs.forEach(rfq=>document.querySelectorAll(`[data-rfq-ttl="${rfq.id}"]`).forEach(node=>node.textContent=rfq.ttl!==null?`00:${String(Math.max(0,rfq.ttl)).padStart(2,"0")}`:"--:--"));
  }
  Object.assign(MP,{screens,windowScreens,routeAccess,accessFor,isRouteAllowed,isRouteVisibleInNav,canControl,settingControl,navigate,renderRoute,showToast,openConfirm,downloadFile,exportData,handleAction,addAudit,addPairingRows});
  setInterval(MP.simulationTick(()=>{let expired=null;state.activeRfqs.forEach(rfq=>{if(rfq.status!=="견적 수신"||rfq.ttl===null||rfq.ttl<=0)return;rfq.ttl-=1;if(rfq.ttl===0){rfq.status="만료";expired=rfq;}});const selected=state.activeRfqs.find(item=>item.id===state.selectedApRfq);state.rfqTTL=selected?.ttl||0;state.rfqLive=Boolean(selected&&selected.status==="견적 수신");updateTTLDisplay();if(expired){showToast("RFQ 견적 만료",`${expired.id}, Firm quote TTL 종료`,"warning");if(state.current==="trade"&&state.tradeView==="execution"&&state.tradeType==="rfq")renderRoute("trade",false);}}),1000);
  setInterval(MP.simulationTick(()=>{if(!state.clientPortal.submitted||state.clientPortal.quoteApproved||state.clientPortal.quoteTtl<=0)return;state.clientPortal.quoteTtl-=1;document.querySelectorAll(".client-quote-ttl").forEach(node=>node.textContent=`00:${String(state.clientPortal.quoteTtl).padStart(2,"0")}`);if(state.clientPortal.quoteTtl===0)showToast("고객사 견적 만료","블록 주문 갱신 후 새 견적 필요","warning");}),1000);
  setInterval(MP.simulationTick(()=>{const quote=state.primeQuote;if(quote.expired||quote.ttl<=0)return;quote.ttl-=1;document.querySelectorAll("[data-prime-quote-ttl]").forEach(node=>node.textContent=`00:${String(Math.max(0,quote.ttl)).padStart(2,"0")}`);if(quote.ttl<=0){quote.expired=true;if(state.current==="prime-quotes")renderRoute("prime-quotes",false);showToast("쿼트 TTL 만료",`${quote.orderId}, 수동 릴레이 대기`,"warning");}}),1000);
  setInterval(MP.simulationTick(()=>MP.updatePrimeEngine()),1000);
  setTimeout(()=>{if(!state.killSwitchActive)state.connection="connected";syncGlobalState();},1200);
  window.addEventListener("hashchange",()=>renderRoute());
  syncGlobalState();
  if(!location.hash)location.hash="trade";else renderRoute();
})(window.MP = window.MP || {});
  </script>
</body>
</html>
