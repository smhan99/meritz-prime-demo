    const names=account?[...new Set(MP.custodyHoldingsFor(account.clientId).filter(row=>row.asset===wallet.asset&&row.quantity>0).map(row=>row.custodian))]:[];
    return names.length?names.join(", "):wallet.custodian;
  }

  Object.assign(MP,{
    clientScopeActive,actingClientIdentity,clientScopeCompany,clientScopeUser,
    clientVisibleAccountIds,clientExecuteAccountId,clientScopeAccountId,clientScopeAccount,clientSettlementAccount,
    clientScopeWallets,clientScopeBookIds,
    clientScopeFeeBps,clientScopeCapBtc,clientScopeVendorIds,
    clientPairSymbols,pairsInScope,
    clientScopeOrders,clientScopeRfqs,clientLatestRfq,deskScopeRfqs,clientWalletCustodians
  });
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/core/desk-scope.js">
(function (MP) {
  "use strict";

  const {state} = MP;

  /* ---------- who is acting ----------
     The desk is a registered client of Prime (`AP-DESK-INT`, `internal:true`), so it
     carries the same registration fields as an external client and its own sub users.
     This file is the desk twin of `client-scope.js`. */

  function deskScopeActive(role=state.role) {
    return MP.isDeskRole(role);
  }

  function deskCompany() {
    return MP.internalClient()||null;
  }

  function deskUsers() {
    const company=deskCompany();
    return company&&Array.isArray(company.users)?company.users:[];
  }

  function deskScopeUser(role=state.role) {
    const key=MP.resolveRole(role);
    return deskUsers().find(user=>MP.resolveRole(user.role)===key)||null;
  }

  /* ---------- book and account scope ---------- */

  function deskVisibleBookIds(role=state.role) {
    const company=deskCompany();
    const user=deskScopeUser(role);
    if(!company)return [];
    if(!user)return [...company.bookIds];
    return user.visibleBookIds.filter(id=>company.bookIds.includes(id));
  }

  function deskVisibleAccountIds(role=state.role) {
    const company=deskCompany();
    const user=deskScopeUser(role);
    if(!company)return [];
    if(!user)return [...company.primeAccountIds];
    return user.visiblePrimeAccountIds.filter(id=>company.primeAccountIds.includes(id));
  }

  function deskSettlementAccountId(role=state.role) {
    const ids=deskVisibleAccountIds(role);
    if(!ids.includes(state.settlementDeskAccountId))state.settlementDeskAccountId=ids[0]||null;
    return state.settlementDeskAccountId;
  }

  function deskSettlementAccount(role=state.role) {
    return MP.primeAccountById(deskSettlementAccountId(role));
  }

  /* ---------- the §2.5 desk exception ----------
     A client user names one executable Prime account. A desk user does not: the LP hedge
     lands in the effective Prime account of the row, so the executable set is DERIVED
     from the Prime execution accounts of the books the user may see (book default plus any row
     reassignment), intersected with the accounts the user may see. */

  function deskExecuteAccountIds(role=state.role) {
    const company=deskCompany();
    if(!company)return [];
    const visible=deskVisibleAccountIds(role);
    const derived=new Set();
    deskVisibleBookIds(role).forEach(bookId=>{
      const book=state.etfBooks.find(item=>item.id===bookId);
      if(book&&book.primeAccountId)derived.add(book.primeAccountId);
      state.lpBookRows.filter(row=>row.bookId===bookId&&row.primeAccountId).forEach(row=>derived.add(row.primeAccountId));
    });
    return [...derived].filter(id=>company.primeAccountIds.includes(id)&&visible.includes(id));
  }

  function deskExecuteAccountLabel(role=state.role) {
    const ids=deskExecuteAccountIds(role);
    if(!ids.length)return "없음";
    return ids.map(id=>MP.accountLabel(id)).join(", ");
  }

  /* ---------- custody read at desk scope ----------
     The desk twin of `clientScopeWallets` and `clientWalletCustodians`. The desk wallets are
     firm owned (`clientId` null), so the set is taken off the visible accounts' `walletIds`
     rather than off a client id, and the custodian cell unions the allocation rows of every
     visible account that holds the wallet, because both desk accounts share the same two. */

  function deskScopeWallets(role=state.role) {
    const ids=new Set(deskVisibleAccountIds(role).flatMap(id=>MP.primeAccountById(id)?.walletIds||[]));
    if(!ids.size)return [];
    return state.wallets.filter(wallet=>ids.has(wallet.id));
  }

  function deskWalletCustodians(wallet,role=state.role) {
    const names=new Set();
    deskVisibleAccountIds(role).map(id=>MP.primeAccountById(id)).forEach(account=>{
      if(!account||!account.walletIds.includes(wallet.id))return;
      MP.custodyHoldingsFor(account.clientId).filter(row=>row.asset===wallet.asset&&row.quantity>0).forEach(row=>names.add(row.custodian));
    });
    return names.size?[...names].join(", "):wallet.custodian;
  }

  /* ---------- registration values in scope ---------- */

  function deskFeeBps() {
    const company=deskCompany();
    return Number.isFinite(company?.feeBps)?company.feeBps:0;
  }

  function deskCapBtc() {
    const company=deskCompany();
    return company?MP.clientPerTradeBtcCap(company):state.riskSettings.clientPerTradeBtcCapDefault;
  }

  function deskVendorSet() {
    const company=deskCompany();
    return company?company.custodyVendors.filter(name=>state.custodians.includes(name)):[];
  }

  function deskOwnsBook(bookId) {
    const company=deskCompany();
    const book=state.etfBooks.find(item=>item.id===bookId);
    return Boolean(company&&book&&book.clientId===company.id);
  }

  Object.assign(MP,{
    deskScopeActive,deskCompany,deskUsers,deskScopeUser,
    deskVisibleBookIds,deskVisibleAccountIds,deskSettlementAccountId,deskSettlementAccount,deskExecuteAccountIds,deskExecuteAccountLabel,
    deskScopeWallets,deskWalletCustodians,
    deskFeeBps,deskCapBtc,deskVendorSet,deskOwnsBook
  });
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/core/accounting.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn} = MP;

  /* ---------- role gate ----------
     v3.1 renames client-viewer to client-accounting. The live key is the only one listed
     here; the legacy key is handled by the alias layer, `MP.resolveRole` in state.js. */

  const accountingRoleKeys = ["client-accounting"];

  function isAccountingRole(role=state.role) {
    return accountingRoleKeys.includes(MP.resolveRole(role));
  }

  function canAccountingExport(role=state.role) {
    const key=MP.resolveRole(role);
    return isAccountingRole(key)||key==="client-master";
  }

  /* ---------- fixed column order, USER_ACCOUNT_MODEL section 4.3 ---------- */

  const tradeColumns = ["trade_date","fill_time","client_id","prime_account_id","order_id","rfq_id","mode","pair","side","qty","price","notional","venue_ref","fee_bps","fee_amount","etf_code","shares","cu_count","underlying_qty","nav_at_print","fixing_ref","inav_ref","usdkrw"];
  const settleColumns = ["trade_date","settle_date","client_id","prime_account_id","asset","currency","gross_amount","fee_total_day","net_amount","netting_result","movement_type","custodian","movement_qty","cycle","ticket_id","fixing_ref","inav_ref","usdkrw","status"];

  /* ---------- date helpers ---------- */

  function pad(value) {
    return String(value).padStart(2,"0");
  }

  function asofDateKey() {
    const key=String(state.asof||"").slice(0,10);
    return /^\d{4}-\d{2}-\d{2}$/.test(key)?key:"2026-09-08";
  }

  function orderDateKey(order) {
    const matched=/-(\d{6})-/.exec(String(order&&order.id||""));
    if(!matched)return asofDateKey();
    const stamp=matched[1];
    return `20${stamp.slice(0,2)}-${stamp.slice(2,4)}-${stamp.slice(4,6)}`;
  }

  function shiftDate(key,days) {
    const [year,month,day]=key.split("-").map(Number);
    const moved=new Date(Date.UTC(year,month-1,day+days));
    return `${moved.getUTCFullYear()}-${pad(moved.getUTCMonth()+1)}-${pad(moved.getUTCDate())}`;
  }

  function weekday(key) {
    const [year,month,day]=key.split("-").map(Number);
    return new Date(Date.UTC(year,month-1,day)).getUTCDay();
  }

  function stepBusinessDay(key,direction) {
    let cursor=shiftDate(key,direction);
    while([0,6].includes(weekday(cursor)))cursor=shiftDate(cursor,direction);
    return cursor;
  }

  function settleDateKey(key) {
    return stepBusinessDay(key,1);
  }

  function compactDate(key) {
    return key.replace(/-/g,"");
  }

  function monthDay(key) {
    return key.slice(5);
  }

  function tradeDateOptions() {
    const own=[...new Set(clientOrdersInScope().map(orderDateKey))].sort();
    const latest=own[own.length-1]||asofDateKey();
    const list=[latest];
    while(list.length<3)list.push(stepBusinessDay(list[list.length-1],-1));
    return list;
  }

  function activeTradeDate() {
    const options=tradeDateOptions();
    const chosen=state.accounting.tradeDate;
    return options.includes(chosen)?chosen:options[0];
  }

  /* ---------- scope ---------- */

  function clientOrdersInScope() {
    return typeof MP.clientScopeOrders==="function"?MP.clientScopeOrders():[];
  }

  function scopeCompany() {
    return typeof MP.clientScopeCompany==="function"?MP.clientScopeCompany():null;
  }

  function scopeAccountId(order) {
    const visible=typeof MP.clientVisibleAccountIds==="function"?MP.clientVisibleAccountIds():[];
    if(order&&visible.includes(order.primeAccountId))return order.primeAccountId;
    return (typeof MP.clientScopeAccountId==="function"?MP.clientScopeAccountId():null)||visible[0]||"";
  }

  /* ---------- marks, one set per day, written on every row of both files ---------- */

  function markSet() {
    const mark=typeof MP.apMarkContext==="function"?MP.apMarkContext():null;
    return {
      btcFixingUsd:mark&&mark.available?mark.btcFixingUsd:null,
      ethFixingUsd:mark&&mark.available?mark.ethFixingUsd:null,
      label:mark?mark.markLabel:"복제 픽싱",
      stateKey:mark?mark.stateKey:"live",
      inavKrw:state.constants.ownInavKrw,
      usdKrw:state.constants.usdKrw
    };
  }

  function fixingFor(underlying,marks) {
    return underlying==="ETH"?marks.ethFixingUsd:marks.btcFixingUsd;
  }

  function cycleConfirmed() {
    return Number(state.settlementCycle.secondsRemaining)<=0;
  }

  /* ---------- fills of one order ---------- */

  function orderEtf(order) {
    return order.etfId?state.etfs.find(item=>item.id===order.etfId)||null:null;
  }

  function orderUnderlying(order) {
    const etf=orderEtf(order);
    return etf?etf.underlying:"BTC";
  }

  function orderPairSymbol(order) {
    const note=String(order.summaryNote||"");
    const matched=state.pairs.find(pair=>note.startsWith(pair.symbol));
    if(matched)return matched.symbol;
    return `${orderUnderlying(order)}/USD`;
  }

  function orderRfqId(order) {
    if(order.mode!=="RFQ")return "";
    const text=`${order.summaryNote||""} ${order.fulfilRoute||""} ${(order.fulfilment||[]).map(step=>`${step.target||""} ${step.reference||""}`).join(" ")}`;
    const matched=/RFQ-\d{6}-\d+/.exec(text);
    return matched?matched[0]:"";
  }

  function linkedPrimeOrder(order) {
    return state.primeOrders.find(item=>item.reference===order.id)||null;
  }

  function orderRouting(order) {
    const prime=linkedPrimeOrder(order);
    const routing=Array.isArray(prime&&prime.vendorRouting)?prime.vendorRouting:[];
    return routing.filter(entry=>state.vendorQuotes.some(vendor=>vendor.id===entry.vendorId));
  }

  /* The routing share is the split of the executed quantity across venues, so a fill is
     attributed to the venue whose cumulative share band holds its midpoint. Names are the
     anonymised ones on every client file whatever state.vendorAnonymised says. */
  function venueRef(routing,targetQty,cumulativeBefore,qty) {
    if(!routing.length||!(targetQty>0))return "";
    const midpoint=cumulativeBefore+qty/2;
    let bound=0;
    for(let index=0;index<routing.length;index+=1){
      bound+=routing[index].share*targetQty;
      if(midpoint<=bound||index===routing.length-1){
        const vendor=state.vendorQuotes.find(item=>item.id===routing[index].vendorId);
        return vendor?vendor.anonName:"";
      }
    }
    return "";
  }

  function orderFills(order) {
    const usesTape=order.mode==="알고"&&order.id===state.executionMonitorOrderId&&typeof MP.executionViewRows==="function";
    if(usesTape){
      const stateKey=typeof MP.executionStateKey==="function"?MP.executionStateKey():state.executionWindowState;
      let cumulative=0;
      return MP.executionViewRows(stateKey).filter(row=>row.fillQty>0).map(row=>{
        const fill={time:`${row.label}:00`,qty:row.fillQty,priceUsd:row.fillPriceUsd,cumulativeBefore:cumulative};
        cumulative+=row.fillQty;
        return fill;
      });
    }
    const target=Number.isFinite(order.quantityBtc)?order.quantityBtc:null;
    const progress=Number.isFinite(order.progressPercent)?order.progressPercent:0;
    const qty=target===null?null:Math.round(target*progress/100*10000)/10000;
    if(!qty)return [];
    const priceUsd=Number.isFinite(order.notionalKrw)&&target
      ?Math.round(order.notionalKrw/target/state.constants.usdKrw*100)/100
      :state.constants.btcFixingUsd;
    return [{time:String(order.time||"00:00:00").slice(0,8),qty,priceUsd,cumulativeBefore:0}];
  }

  function orderTargetQty(order) {
    if(Number.isFinite(order.quantityBtc))return order.quantityBtc;
    const prime=linkedPrimeOrder(order);
    return Number.isFinite(prime&&prime.quantityBtc)?prime.quantityBtc:0;
  }

  /* ---------- file 1, the day's fills ---------- */

  function buildTradeRows(dateKey) {
    const company=scopeCompany();
    if(!company)return [];
    const marks=markSet();
    const usdKrw=state.constants.usdKrw;
    const rows=[];
    clientOrdersInScope()
      .filter(order=>orderDateKey(order)===dateKey)
      .forEach(order=>{
        const etf=orderEtf(order);
        const underlying=orderUnderlying(order);
        const routing=orderRouting(order);
        const target=orderTargetQty(order);
        const feeBps=Number.isFinite(order.feeBps)?order.feeBps:company.feeBps;
        const pdf=etf?state.pdfUploads[etf.id]:null;
        const fixingUsd=fixingFor(underlying,marks);
        const navAtPrint=etf&&pdf&&Number.isFinite(fixingUsd)
          ?(state.constants.btcPerCu*fixingUsd*usdKrw+pdf.cashPerCuKrw)/state.constants.cuShares
          :null;
        orderFills(order).forEach(fill=>{
          const notionalKrw=fill.qty*fill.priceUsd*usdKrw;
          const isBlock=order.kind==="ETF 블록"&&Boolean(etf);
          const cuCount=isBlock?fill.qty/state.constants.btcPerCu:null;
          rows.push({
            trade_date:dateKey,
            fill_time:`${dateKey}T${fill.time}+09:00`,
            client_id:company.id,
            prime_account_id:MP.accountLabel(scopeAccountId(order)),
            order_id:order.id,
            rfq_id:orderRfqId(order),
            mode:order.mode==="RFQ"?"RFQ 릴레이":"픽싱 알고",
            pair:orderPairSymbol(order),
            side:order.side==="매도"?"SELL":"BUY",
            qty:fill.qty.toFixed(4),
            price:fill.priceUsd.toFixed(2),
            notional:String(Math.round(notionalKrw)),
            venue_ref:venueRef(routing,target,fill.cumulativeBefore,fill.qty),
            fee_bps:feeBps.toFixed(1),
            fee_amount:String(Math.round(notionalKrw*feeBps/10000)),
            etf_code:isBlock?etf.code:"",
            shares:isBlock?String(Math.round(cuCount*state.constants.cuShares)):"",
            cu_count:isBlock?cuCount.toFixed(4):"",
            underlying_qty:isBlock?fill.qty.toFixed(4):"",
            nav_at_print:isBlock&&navAtPrint!==null?navAtPrint.toFixed(2):"",
            fixing_ref:Number.isFinite(fixingUsd)?fixingUsd.toFixed(2):"",
            inav_ref:marks.inavKrw.toFixed(2),
            usdkrw:marks.usdKrw.toFixed(2),
            _asset:underlying,
            _notionalKrw:notionalKrw,
            _feeKrw:notionalKrw*feeBps/10000,
            _signedQty:order.side==="매도"?-fill.qty:fill.qty
          });
        });
      });
    return rows;
  }

  /* The private keys carry the per fill money the settlement file aggregates. The public
     row is the file row, exactly the fixed columns and nothing else. */
  function publicRow(row,columns) {
    const out={};
    columns.forEach(column=>{out[column]=row[column];});
    return out;
  }

  function tradeRows(dateKey=activeTradeDate()) {
    return buildTradeRows(dateKey).map(row=>publicRow(row,tradeColumns));
  }

  /* ---------- file 2, T+1 settlement by asset and currency ---------- */

  function settleCurrency() {
    const wallets=typeof MP.clientScopeWallets==="function"?MP.clientScopeWallets():[];
    const cash=wallets.find(wallet=>wallet.asset==="KRW"||wallet.asset==="USD");
    return cash?cash.asset:"KRW";
  }

  function nettingResultText(asset,currency) {
    const wallets=typeof MP.clientScopeWallets==="function"?MP.clientScopeWallets():[];
    const ids=wallets.map(wallet=>wallet.id);
    const moves=state.settlementCycle.netMovements.filter(move=>ids.includes(move.walletId));
    const assetMove=moves.find(move=>move.asset===asset);
    const cashMove=moves.find(move=>move.asset===currency);
    const parts=[];
    if(assetMove)parts.push(`${assetMove.quantity} ${assetMove.asset}`);
    if(cashMove&&cashMove!==assetMove)parts.push(`${cashMove.quantity} ${cashMove.asset}`);
    return parts.join(" / ");
  }

  function dayMovements(accountIds,asset,dateKey) {
    const stamp=monthDay(dateKey);
    const rows=[];
    const holderId=accountIds.map(id=>MP.primeAccountById(id)?.clientId).find(Boolean);
    MP.custodyHoldingsFor(holderId)
      .filter(row=>row.asset===asset&&String(row.lastTransferAt||"").startsWith(stamp))
      .forEach(row=>rows.push({accountId:null,type:"이체 완료",custodian:row.custodian,quantity:row.quantity,cycle:row.lastTransferAt,ticketId:"",approvals:null}));
    state.settlementIntents
      .filter(intent=>accountIds.includes(intent.primeAccountId)&&intent.asset===asset&&String(intent.cycle||"").startsWith(stamp))
      .forEach(intent=>intent.allocations.forEach(row=>rows.push({
        accountId:intent.primeAccountId,type:"이체 요청",custodian:row.custodian,quantity:row.quantity,
        cycle:intent.cycle,ticketId:intent.id,approvals:{count:intent.approvalCount,required:intent.requiredApprovals}
      })));
    return rows;
  }

  function movementStatus(movement) {
    const suffix=cycleConfirmed()?"":" (미확정)";
    if(!movement)return `이동 없음${suffix}`;
    if(!movement.approvals)return `2 of 2 완료${suffix}`;
    const done=movement.approvals.count>=movement.approvals.required;
    return `${movement.approvals.count} of ${movement.approvals.required} ${done?"완료":"대기"}${suffix}`;
  }

  function settleRows(dateKey=activeTradeDate()) {
    const company=scopeCompany();
    if(!company)return [];
    const accountIds=typeof MP.clientVisibleAccountIds==="function"?MP.clientVisibleAccountIds():[];
    const marks=markSet();
    const currency=settleCurrency();
    const fills=buildTradeRows(dateKey);
    const assets=[...new Set([
      ...fills.map(row=>row._asset),
      ...MP.custodyHoldingsFor(company.id)
        .filter(row=>String(row.lastTransferAt||"").startsWith(monthDay(dateKey)))
        .map(row=>row.asset),
      ...state.settlementIntents
        .filter(intent=>accountIds.includes(intent.primeAccountId)&&String(intent.cycle||"").startsWith(monthDay(dateKey)))
        .map(intent=>intent.asset)
    ])];
    const rows=[];
    assets.forEach(asset=>{
      const assetFills=fills.filter(row=>row._asset===asset);
      const gross=assetFills.reduce((sum,row)=>sum+row._notionalKrw,0);
      const fee=assetFills.reduce((sum,row)=>sum+row._feeKrw,0);
      const netQty=assetFills.reduce((sum,row)=>sum+row._signedQty,0);
      const net=netQty>=0?gross+fee:gross-fee;
      const fixingUsd=fixingFor(asset,marks);
      const movements=dayMovements(accountIds,asset,dateKey);
      const list=movements.length?movements:[null];
      list.forEach((movement,index)=>{
        const lead=index===0;
        rows.push({
          trade_date:dateKey,
          settle_date:settleDateKey(dateKey),
          client_id:company.id,
          prime_account_id:MP.accountLabel(movement?movement.accountId:scopeAccountId(null)),
          asset,
          currency,
          gross_amount:lead?String(Math.round(gross)):"",
          fee_total_day:lead?String(Math.round(fee)):"",
          net_amount:lead?String(Math.round(net)):"",
          netting_result:lead?nettingResultText(asset,currency):"",
          movement_type:movement?movement.type:"",
          custodian:movement?movement.custodian:"",
          movement_qty:movement?Number(movement.quantity).toFixed(4):"",
          cycle:movement?movement.cycle:state.settlementCycle.label,
          ticket_id:movement?movement.ticketId:"",
          fixing_ref:Number.isFinite(fixingUsd)?fixingUsd.toFixed(2):"",
          inav_ref:marks.inavKrw.toFixed(2),
          usdkrw:marks.usdKrw.toFixed(2),
          status:movementStatus(movement)
        });
      });
    });
    return rows;
  }

  /* ---------- CSV ---------- */

  function csvCell(value) {
    const text=value===null||value===undefined?"":String(value);
    return /[",\r\n]/.test(text)?`"${text.replace(/"/g,'""')}"`:text;
  }

  function csvBody(columns,rows) {
    const lines=[columns.join(",")];
    rows.forEach(row=>lines.push(columns.map(column=>csvCell(row[column])).join(",")));
    return `﻿${lines.join("\r\n")}\r\n`;
  }

  function exportRevision(dateKey=activeTradeDate()) {
    return (state.accounting.exportCounts[dateKey]||0)+1;
  }

  function revisionSuffix(revision) {
    return revision>1?`_r${revision}`:"";
  }

  function fileName(kind,dateKey=activeTradeDate(),revision=exportRevision(dateKey)) {
    const company=scopeCompany();
    return `MP_${company?company.id:"UNKNOWN"}_${kind==="settle"?"SETTLE":"TRADE"}_${compactDate(dateKey)}${revisionSuffix(revision)}.csv`;
  }

  function exportFiles(dateKey=activeTradeDate()) {
    const revision=exportRevision(dateKey);
    const trade=tradeRows(dateKey);
    const settle=settleRows(dateKey);
    return {
      dateKey,
      revision,
      files:[
        {kind:"trade",name:fileName("trade",dateKey,revision),content:csvBody(tradeColumns,trade),rowCount:trade.length},
        {kind:"settle",name:fileName("settle",dateKey,revision),content:csvBody(settleColumns,settle),rowCount:settle.length}
      ]
    };
  }

  /* ---------- panel ---------- */

  function previewTab() {
    return state.accounting.previewTab==="settle"?"settle":"trade";
  }

  function previewRows(kind,dateKey) {
    return kind==="settle"?settleRows(dateKey):tradeRows(dateKey);
  }

  function previewTable(kind,dateKey) {
    const columns=kind==="settle"?settleColumns:tradeColumns;
    const rows=previewRows(kind,dateKey);
    if(!rows.length)return '<div class="empty-note"><strong>해당 거래일 데이터 없음</strong></div>';
    const selected=state.accounting.selected[kind];
    const head=columns.map(column=>`<th>${column}</th>`).join("");
    const body=rows.map((row,index)=>`<tr class="${selected===index?"selected":""}" data-action="accounting-row" data-kind="${kind}" data-index="${index}">${columns.map(column=>`<td class="${/qty|price|notional|amount|bps|shares|cu_count|nav|fixing|inav|usdkrw/.test(column)?"num":""}">${row[column]===""?'<span class="muted-cell">공란</span>':row[column]}</td>`).join("")}</tr>`).join("");
    return `<div class="table-scroll acct-preview"><table class="data-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  function fileRow(kind,dateKey,revision) {
    const rows=previewRows(kind,dateKey);
    const columns=kind==="settle"?settleColumns:tradeColumns;
    const label=kind==="settle"?"정산 파일":"거래 파일";
    return `<div class="acct-file-row"><div class="acct-file-copy"><strong>${label}</strong></div><span class="acct-file-name num">${fileName(kind,dateKey,revision)}</span><span class="acct-file-count num">${rows.length}행</span><span class="acct-file-count num">${columns.length}열</span></div>`;
  }

  function lastExportLine() {
    const last=state.accounting.lastExport;
    if(!last)return '<div class="acct-last">최근 내보내기 없음</div>';
    return `<div class="acct-last"><span>최근 내보내기</span><strong class="num">${last.time}</strong><span>거래일 ${last.tradeDate}</span><span class="num">${last.files.map((file,index)=>`${file} ${last.rowCounts[index]}행`).join(", ")}</span></div>`;
  }

  function renderAccountingPanel() {
    if(typeof MP.clientScopeActive!=="function"||!MP.clientScopeActive())return "";
    const company=scopeCompany();
    if(!company)return "";
    const dateKey=activeTradeDate();
    const revision=exportRevision(dateKey);
    const editable=canAccountingExport();
    const marks=markSet();
    const confirmed=cycleConfirmed();
    const kind=previewTab();
    const options=tradeDateOptions().map(key=>`<option value="${key}" ${key===dateKey?"selected":""}>${key} (체결 ${tradeRows(key).length}건)</option>`).join("");
    const controls=`<div class="acct-controls"><label class="field"><span>거래일</span><select data-accounting-date>${options}</select></label>${chip(confirmed?"17:00 KST 넷팅 확정":"17:00 KST 넷팅 전, 미확정 발행",confirmed?"positive":"warning")}${chip(`${marks.label} ${marks.btcFixingUsd===null?"산출 전":MP.formatLiteralMoney(marks.btcFixingUsd,"USD")}`,"info")}${revision>1?chip(`재발행 ${revision}회차`,"violet"):""}</div>`;
    const files=`<div class="acct-file-list">${fileRow("trade",dateKey,revision)}${fileRow("settle",dateKey,revision)}</div>`;
    const tabs=`<div class="tabs compact acct-tabs"><button type="button" class="${kind==="trade"?"active":""}" data-action="accounting-tab" data-kind="trade">거래 파일 미리보기</button><button type="button" class="${kind==="settle"?"active":""}" data-action="accounting-tab" data-kind="settle">정산 파일 미리보기</button></div>`;
    const actions=`<div class="portal-ticket-actions">${btn("일별 파일 내보내기","client-accounting-export","block primary","download",editable?"":"disabled")}</div>`;
    const body=`<div data-owned-panel="accounting">${controls}${files}${tabs}${previewTable(kind,dateKey)}${actions}${lastExportLine()}</div>`;
    return panel("관리회계",body,{actions:chip(editable?"편집 가능":"조회 전용",editable?"positive":"muted"),flush:true});
  }

  Object.assign(MP,{
    isAccountingRole,canAccountingExport,
    accountingTradeColumns:tradeColumns,accountingSettleColumns:settleColumns,
    accountingTradeDates:tradeDateOptions,accountingTradeDate:activeTradeDate,
    accountingTradeRows:tradeRows,accountingSettleRows:settleRows,
    accountingSettleDate:settleDateKey,accountingFileName:fileName,
    accountingExportFiles:exportFiles,renderAccountingPanel
  });
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/core/engine.js">
(function (MP) {
  "use strict";

  const {state,formatTradePrice,formatMoneyFromUsd,formatMoneyFromKrw,usdValueFromDisplay} = MP;

  function currentTimestamp() {
    const now = new Date();
    const time = new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:"Asia/Seoul"}).format(now);
    return `${time}.${String(now.getMilliseconds()).padStart(3,"0")}`;
  }

  function syncTradeOrderSummary() {
    if (state.current !== "trade") return;
    const priceInput = document.getElementById("trade-order-price");
    const sizeInput = document.getElementById("trade-order-size");
    if (!sizeInput) return;
    const pair = MP.currentPair();
    const price = state.orderCardMode === "limit"&&priceInput ? MP.pairValueFromInput(pair,priceInput.value) : MP.pairMark(pair);
    const size = Number(sizeInput.value.replace(/,/g,""));
    const baseSize=state.orderUnit==="quote"?size/MP.pairMark(pair):size;
    const notional = Number.isFinite(price) && Number.isFinite(baseSize) && price > 0 && baseSize > 0 ? price*baseSize : 0;
    const notionalElement = document.querySelector("[data-estimated-notional]");
    if (notionalElement) notionalElement.textContent = MP.formatPairMoney(pair,notional);
  }

  function riskLimitViolation({kind="trade",notionalKrw=0,btc=0,side="buy",symbol="BTC/USD"}={}) {
    const settings=state.riskSettings;
    if(state.riskUsedNotionalKrw+notionalKrw>settings.dailyNotionalKrw)return `일일 명목한도 ${formatMoneyFromKrw(settings.dailyNotionalKrw)} 초과`;
    if(kind==="rfq"&&notionalKrw>settings.rfqLimitKrw)return `RFQ당 한도 ${formatMoneyFromKrw(settings.rfqLimitKrw)} 초과`;
    if(kind==="trade"){
      if(symbol==="BTC/USD"){
        const signedBtc=side==="sell"?-btc:btc;
        const projectedExposure=state.tradePosition.size+state.lpUnhedgedBtc+signedBtc;
        if(Math.abs(projectedExposure)>settings.netExposureBtc)return `순익스포저 한도 ${settings.netExposureBtc.toFixed(2)} BTC 초과`;
      }
      const workingNotional=state.openOrders.reduce((sum,item)=>sum+(Number.isFinite(item.notionalKrw)?item.notionalKrw:item.price*item.size*state.constants.usdKrw),0);
      if(workingNotional+notionalKrw>settings.unsettledLimitKrw)return `미결제 한도 ${formatMoneyFromKrw(settings.unsettledLimitKrw)} 초과`;
    }
    return "";
  }

  function recordRiskOrder(signature,notionalKrw) {
    state.riskUsedNotionalKrw+=notionalKrw;
  }


  function applyLinkedBusinessFill(draft,fillPrice,orderId,fillTime,pair=MP.pairBySymbol("BTC/USD")) {
    const linked=draft.linkedBusiness||"inventory";
    const isBtcUsd=pair.symbol==="BTC/USD";
    if(isBtcUsd&&linked.startsWith("rfq:")){
      const id=linked.slice(4);
      const rfq=state.activeRfqs.find(item=>item.id===id);
      if(rfq){
        rfq.executionTarget=(rfq.executionTarget??rfq.quantity)+draft.size;
        rfq.executionFilled=(rfq.executionFilled||0)+draft.size;
        if(state.selectedApRfq===id){
          state.executionTarget+=draft.size;
          state.executionFilled+=draft.size;
        }
      }
    }
    if(isBtcUsd&&linked.startsWith("hedge:")){
      const id=linked.slice(6);
      const item=state.lpHedgeQueue.find(candidate=>candidate.id===id);
      if(item&&item.status==="READY"){
        const applied=Math.min(item.quantity,draft.size);
        const signed=item.side==="BUY"?applied:-applied;
        const row=lpBookRow(item.rowId);if(row)row.netUnhedgedQty=roundLpBtc(row.netUnhedgedQty-signed);
        item.quantity=roundLpBtc(item.quantity-applied);
        if(item.quantity<.0001){item.quantity=0;item.status="DONE";item.executed=fillTime.slice(0,8);}
        if(typeof MP.addPairingRows==="function")MP.addPairingRows(orderId,fillTime.slice(0,8),applied,linked,item.rowId);
      }
    }
    state.orderRecords.unshift({id:orderId,time:fillTime.slice(0,8),owner:MP.clientScopeActive()?"고객사":"메리츠 증권",bookId:draft.bookId||state.deskSourcingBookId,primeAccountId:draft.primeAccountId||MP.primeAccountIdForBook(state.deskSourcingBookId),noteRef:draft.primeAccountId||MP.primeAccountIdForBook(state.deskSourcingBookId),noteReason:"수동 주문",symbol:pair.symbol,side:draft.side.toUpperCase(),sideLabel:draft.side==="buy"?"매수":"매도",quantity:draft.size,type:draft.type.toUpperCase(),route:"집계 SOR",price:fillPrice,fee:`${pair.quote} ${(fillPrice*draft.size*.0002).toFixed(2)}`,status:"체결",progressPercent:100,linkedBusiness:linked,runningTime:draft.runningTime||null});
    if(typeof MP.addAudit==="function")MP.addAudit("ORDER_FILL",`${orderId}, ${draft.side.toUpperCase()} ${draft.size.toFixed(6)} ${pair.base}, 업무 태그 ${MP.linkedBusinessLabel(linked)}`);
  }

  /* D-0915: 체결이 나면 계정별 포지션 맵과 해당 계정 잔고를 같이 움직인다.
     이걸 하지 않으면 포트폴리오 포지션/잔고 탭이 체결을 반영하지 못한다. */
  function applyAccountFill(accountId,pair,side,size,fillPrice) {
    if(!accountId||!(size>0))return;
    const signed=side==="sell"?-size:size;
    const byPair=state.tradePositions[accountId]||(state.tradePositions[accountId]={});
    const prev=byPair[pair.symbol]||{size:0,entry:fillPrice};
    const next=prev.size+signed;
    let entry=prev.entry;
    if(prev.size===0||Math.sign(prev.size)===Math.sign(signed))entry=next?(prev.size*prev.entry+signed*fillPrice)/next:fillPrice;
    else if(Math.sign(next)!==Math.sign(prev.size)&&next!==0)entry=fillPrice;
    if(Math.abs(next)<1e-8)delete byPair[pair.symbol];
    else byPair[pair.symbol]={size:Math.round(next*1e8)/1e8,entry:Math.round(entry*1e8)/1e8};
    const account=state.primeAccounts.find(item=>item.id===accountId);
    if(!account)return;
    const balances=account.liveBalances||(account.liveBalances=[]);
    const bump=(asset,delta)=>{
      if(!asset||!delta)return;
      const row=balances.find(item=>item.asset===asset);
      if(row)row.quantity=Math.round((row.quantity+delta)*1e8)/1e8;
      else balances.push({asset,quantity:Math.round(delta*1e8)/1e8});
    };
    bump(pair.base,signed);
    /* 현금 레그는 통화 단위라 소수 둘째 자리에서 끊는다. */
    bump(pair.quote,Math.round(-signed*fillPrice*100)/100);
  }

  function commitTrade(draft) {
    const pair = MP.pairBySymbol(draft.symbol||"BTC/USD");
    const symbol = pair.symbol;
    const mark = MP.pairMark(pair);
    const notionalKrw = MP.pairNotionalKrw(pair,draft.price,draft.size);
    const gap = MP.pairCrossGap(pair);
    recordRiskOrder(`TRADE:${symbol}:${draft.side}:${draft.size.toFixed(6)}:${draft.price.toFixed(2)}`,notionalKrw);
    const crosses = draft.fillNow || draft.type === "market" || (draft.side === "buy" && draft.price >= mark+gap) || (draft.side === "sell" && draft.price <= mark-gap);
    if (crosses) {
      const fillPrice = draft.fillNow ? draft.price : draft.type === "market" ? mark+(draft.side==="buy"?pair.slip:-pair.slip) : draft.price;
      const position = state.positions[symbol]||(state.positions[symbol]={size:0,entry:fillPrice,realizedPnl:0});
      if (draft.side === "buy") {
        const priorNotional = position.size*position.entry;
        position.size += draft.size;
        position.entry = (priorNotional+draft.size*fillPrice)/position.size;
      } else position.size = Math.max(0,position.size-draft.size);
      applyAccountFill(draft.primeAccountId||MP.primeAccountIdForBook(state.deskSourcingBookId),pair,draft.side,draft.size,fillPrice);
      const orderId=`ORD-260908-${state.nextTradeOrderNumber++}`;
      const fillTime=currentTimestamp();
      const print={price:fillPrice,size:draft.size,side:draft.side,time:fillTime,orderId,linkedBusiness:draft.linkedBusiness};
      if(symbol==="BTC/USD"){
        state.recentTrades.unshift(print);
        state.recentTrades = state.recentTrades.slice(0,40);
      }else{
        MP.ensurePairTape(pair);
        pair.tape.unshift(print);
        pair.tape = pair.tape.slice(0,40);
      }
      applyLinkedBusinessFill(draft,fillPrice,orderId,fillTime,pair);
      state.tradeTab = "trades";
      MP.renderRoute("trade");
      MP.showToast("주문 체결",`${draft.side.toUpperCase()} ${draft.size.toFixed(6)} ${pair.base} @ ${MP.formatPairPrice(pair,fillPrice)}`,"success");
      return;
    }
    const orderId = `ORD-260908-${state.nextTradeOrderNumber++}`;
    const twapFields=draft.type==="twap"?{randomize:draft.randomize,triggerPrice:draft.triggerPrice,maxPrice:draft.maxPrice,sliceMinutes:draft.sliceMinutes,childCount:draft.childCount,childSizes:draft.childSizes}:{};
    state.openOrders.unshift({id:orderId,symbol,side:draft.side.toUpperCase(),type:draft.type.toUpperCase(),price:draft.price,size:draft.size,filled:0,status:"WORKING",linkedBusiness:draft.linkedBusiness,notionalKrw,bookId:draft.bookId,primeAccountId:draft.primeAccountId,runningTime:draft.runningTime||null,...twapFields});
    state.orderRecords.unshift({id:orderId,time:currentTimestamp().slice(0,8),owner:MP.clientScopeActive()?"고객사":"메리츠 증권",bookId:draft.bookId||state.deskSourcingBookId,primeAccountId:draft.primeAccountId||MP.primeAccountIdForBook(state.deskSourcingBookId),noteRef:draft.primeAccountId||MP.primeAccountIdForBook(state.deskSourcingBookId),noteReason:"수동 주문",symbol,side:draft.side.toUpperCase(),sideLabel:draft.side==="buy"?"매수":"매도",quantity:draft.size,type:draft.type.toUpperCase(),route:"집계 SOR",price:draft.price,fee:"-",status:"대기",progressPercent:0,linkedBusiness:draft.linkedBusiness,runningTime:draft.runningTime||null,...twapFields});
    if(typeof MP.addAudit==="function")MP.addAudit("ORDER_WORKING",`${orderId}, 업무 태그 ${MP.linkedBusinessLabel(draft.linkedBusiness)}`);
    state.tradeTab = "orders";
    state.tradeOrderFilter = "open";
    MP.renderRoute("trade");
    MP.showToast(`${draft.type==="twap"?"TWAP":"지정가"} 주문 접수`,`${orderId}, 대기열 등록`,"success");
  }

  function roundLpBtc(value) {
    return Math.round(value*10000)/10000;
  }

  function lpBookRow(rowId=state.lpRowSelected) {
    return state.lpBookRows.find(row=>row.id===rowId)||state.lpBookRows[0];
  }

  function lpRowLabel(row) {
    const holder=MP.accountHolderLabel(row?.primeAccountId);
    return row?`${holder}, ${state.etfs.find(etf=>etf.id===row.etfId)?.name||row.etfId}, ${state.etfBooks.find(book=>book.id===row.bookId)?.name||row.bookId}`:"";
  }

  function lpRowPair(row) {
    const derived=`${row?.underlying||"BTC"}/USD`;
    const selected=MP.pairBySymbol(row?.params?.hedgeVenue||derived);
    return selected?.base===row?.underlying?selected:MP.pairBySymbol(derived);
  }

  function lpReadyExposure(rowId=state.lpRowSelected) {
    return roundLpBtc(state.lpHedgeQueue.filter(item=>item.rowId===rowId&&item.status==="READY").reduce((sum,item)=>sum+(item.side==="BUY"?item.quantity:-item.quantity),0));
  }

  function lpUnallocatedExposure(rowId=state.lpRowSelected) {
    const row=lpBookRow(rowId);
    return row?roundLpBtc(row.netUnhedgedQty-lpReadyExposure(row.id)):0;
  }

  /* 데모용 거절 시드. 헤지 전송 12건에 1건은 벤더가 거절한다. 정상 헤지에는 토스트가 없으므로
     거절과 세이프티 트립만 토스트로 뜬다. */
  const LP_REJECT_REASONS=["벤더 거절, 잔고 부족","벤더 거절, 계정 한도 초과","거래소 거절, 최소 주문 단위 미달"];

  function rejectLpHedgeCandidate(item,row,automatic) {
    const reason=LP_REJECT_REASONS[state.lpHedgeAttempts/12%LP_REJECT_REASONS.length|0];
    item.status="REJECTED";
    item.rejectReason=reason;
    item.rejectedAt=currentTimestamp().slice(0,8);
    if(typeof MP.addAudit==="function")MP.addAudit("HEDGE_ORDER_REJECT",`${row.id}, ${item.id}, ${item.side} ${item.quantity.toFixed(4)} ${row.underlying}, ${reason}`,"거절","negative",automatic?"System / Auto Hedge":"차도윤 / DA");
    if(typeof MP.showToast==="function")MP.showToast("헤지 주문 거절",`${lpRowLabel(row)}, ${item.id}, ${reason}`,"danger");
    return false;
  }

  function executeLpHedgeCandidate(item,{automatic=false,notify=true}={}) {
    if(!item||item.status!=="READY"||state.killSwitchActive)return false;
    const row=lpBookRow(item.rowId);
    if(!row)return false;
    state.lpHedgeAttempts=(state.lpHedgeAttempts||0)+1;
    if(state.lpHedgeAttempts%12===0)return rejectLpHedgeCandidate(item,row,automatic);
    const pair=lpRowPair(row);
    const price=MP.pairMark(pair);
    const signedQuantity=item.side==="BUY"?item.quantity:-item.quantity;
    const hedgeTime=currentTimestamp();
    const position=state.positions[pair.symbol]||(state.positions[pair.symbol]={size:0,entry:price,realizedPnl:0});
    if(item.side==="BUY"){
      const prior=position.size*position.entry;
      position.size+=item.quantity;
      position.entry=(prior+item.quantity*price)/position.size;
    }else position.size=Math.max(0,position.size-item.quantity);
    const print={price,size:item.quantity,side:item.side.toLowerCase(),time:hedgeTime,automatic,orderId:item.id,linkedBusiness:`hedge:${item.id}`};
    if(pair.symbol==="BTC/USD"){
      state.recentTrades.unshift(print);
      state.recentTrades=state.recentTrades.slice(0,40);
    }else{
      MP.ensurePairTape(pair);
      pair.tape.unshift(print);
      pair.tape=pair.tape.slice(0,40);
    }
    row.netUnhedgedQty=roundLpBtc(row.netUnhedgedQty-signedQuantity);
    row.lastHedgeAt=hedgeTime.slice(0,8);
    item.status="DONE";
    item.executed=hedgeTime.slice(0,8);
    if(typeof MP.addPairingRows==="function")MP.addPairingRows(item.id,hedgeTime.slice(0,8),item.quantity,`hedge:${item.id}`,row.id);
    state.orderRecords.unshift({id:item.id,time:hedgeTime.slice(0,8),owner:"LP 데스크",noteRef:row.bookId,noteReason:row.primeAccountId||"미배정",symbol:pair.symbol,side:item.side,sideLabel:item.side==="BUY"?"매수":"매도",quantity:item.quantity,type:"LP 헤지",route:"집계 SOR",price,fee:`${pair.quote} ${(price*item.quantity*.0002).toFixed(2)}`,status:"체결",linkedBusiness:`hedge:${item.id}`});
    /* 정상 헤지는 감사 로그로만 남긴다 (토스트 없음). */
    if(typeof MP.addAudit==="function")MP.addAudit("HEDGE_EXECUTE",`${row.id}, ${item.id}, ${item.quantity.toFixed(4)} ${row.underlying}`,"성공","positive",automatic?"System / Auto Hedge":"차도윤 / DA");
    return true;
  }

  function runLpAutoHedges(rowId) {
    const row=lpBookRow(rowId);
    if(!row||!row.autohedge||row.dirty||row.safetyLock||state.killSwitchActive)return 0;
    const ready=state.lpHedgeQueue.filter(item=>item.rowId===row.id&&item.status==="READY");
    const executed=ready.filter(item=>executeLpHedgeCandidate(item,{automatic:true,notify:false}));
    return executed.length;
  }

  function createLpHedgeCandidate(row,signedQuantity,reason) {
    const quantity=Math.abs(roundLpBtc(signedQuantity));
    if(quantity<.0001)return null;
    const side=signedQuantity>0?"BUY":"SELL";
    const amendEnabled=side==="BUY"?row.params.autoAmendBuy:row.params.autoAmendSell;
    const working=state.lpHedgeQueue.filter(item=>item.rowId===row.id&&item.side===side&&item.status==="READY");
    if(amendEnabled&&working.length&&row.params.hedgeOrderMode==="amend"){
      const item=working[0];
      item.quantity=roundLpBtc(working.reduce((sum,entry)=>sum+entry.quantity,quantity));
      item.reason=reason;
      item.forced=item.forced||reason==="max-carry";
      item.amended=currentTimestamp().slice(0,8);
      working.slice(1).forEach(entry=>{entry.status="CANCELLED";entry.cancelReason="AMEND_CONSOLIDATION";});
      row.nettingElapsedSeconds=0;
      if(typeof MP.addAudit==="function")MP.addAudit("HEDGE_ORDER_AMEND",`${row.id}, ${item.id}, ${side} ${item.quantity.toFixed(4)} ${row.underlying}`);
      if(!item.forced)runLpAutoHedges(row.id);
      return item;
    }
    let replacementQuantity=quantity;
    if(amendEnabled&&working.length&&row.params.hedgeOrderMode==="replace"){
      replacementQuantity=roundLpBtc(working.reduce((sum,entry)=>sum+entry.quantity,quantity));
      working.forEach(entry=>{entry.status="CANCELLED";entry.cancelReason="REPLACED";});
    }
    const item={id:`HEDGE-260908-${String(state.nextLpHedgeNumber++).padStart(3,"0")}`,rowId:row.id,bookId:row.bookId,side,quantity:replacementQuantity,status:"READY",created:currentTimestamp().slice(0,8),reason,forced:reason==="max-carry"};
    state.lpHedgeQueue.unshift(item);
    if(amendEnabled&&working.length&&row.params.hedgeOrderMode==="replace"&&typeof MP.addAudit==="function")MP.addAudit("HEDGE_ORDER_REPLACE",`${row.id}, ${working.map(entry=>entry.id).join(", ")} to ${item.id}, ${side} ${item.quantity.toFixed(4)} ${row.underlying}`);
    row.nettingElapsedSeconds=0;
    if(!item.forced)runLpAutoHedges(row.id);
    return item;
  }

  /* ---------- LP 세이프티 스톱 ----------
     구 VEGA LP 엔진의 정지 조건 5종을 행 파라미터로 옮긴 것. 단위는 모두 퍼센트다.
     PRE_iNAV  직전 iNAV 대비 iNAV 점프
     PRE_SPOT  직전 틱 대비 기초자산 현물 점프
     SPOT_SHIFT 기준 시점 이후 현물 변동과 iNAV 변동의 괴리
     REF_SHIFT 기준 iNAV 대비 현재 iNAV 변동
     GAP_SHIFT 호가 범프를 반영한 iNAV 와 원 iNAV 의 괴리
     기준값은 마지막 헤지 시각이 바뀔 때와 세이프티 해제 시 다시 잡는다. */

  const LP_SAFETY_STOPS=[["theoryJumpStopPct","PRE_iNAV"],["preSpotStopPct","PRE_SPOT"],["spotShiftStopPct","SPOT_SHIFT"],["refShiftStopPct","REF_SHIFT"],["gapShiftStopPct","GAP_SHIFT"]];

  function lpRawInavKrw(row) {
    const c=state.constants;
    const mode=row.params.quoteSourceMode;
    if(mode==="krx")return c.krxInavKrw;
    if(mode==="blend")return (c.ownInavKrw+c.krxInavKrw)/2;
    return c.ownInavKrw;
  }

  function lpBumpedInavKrw(row) {
    const p=row.params;
    return (lpRawInavKrw(row)+p.inavBumpKrw)*(1+(p.askOffsetBp-p.bidOffsetBp)/2/10000);
  }

  function lpRowSpotUsd(row) {
    const pair=lpRowPair(row);
    const mark=pair?MP.pairMark(pair):null;
    return Number.isFinite(mark)&&mark>0?mark:null;
  }

  /* 기준값을 다시 잡은 틱에는 세이프티를 평가하지 않는다. 파라미터 적용이나 해제 동작
     자체가 트립을 만들지 않게 하는 장치다. */
  function lpResetSafetyRefs(row) {
    if(!row)return;
    row.prevInavKrw=null;
    row.prevSpotUsd=null;
    row.refInavKrw=null;
    row.refSpotUsd=null;
    row.refHedgeAt=null;
    row.safetySkipTick=state.engineTick;
  }

  function lpSafetyBreach(row) {
    const p=row.params;
    const inav=lpRawInavKrw(row);
    const spot=lpRowSpotUsd(row);
    if(!Number.isFinite(row.refInavKrw)||row.refHedgeAt!==row.lastHedgeAt){
      row.refInavKrw=inav;
      row.refSpotUsd=spot;
      row.refHedgeAt=row.lastHedgeAt;
    }
    const prevInav=Number.isFinite(row.prevInavKrw)?row.prevInavKrw:inav;
    const prevSpot=Number.isFinite(row.prevSpotUsd)?row.prevSpotUsd:spot;
    row.prevInavKrw=inav;
    row.prevSpotUsd=spot;
    const refInav=Number.isFinite(row.refInavKrw)?row.refInavKrw:inav;
    const refSpot=Number.isFinite(row.refSpotUsd)?row.refSpotUsd:spot;
    const values={
      theoryJumpStopPct:prevInav?Math.abs(inav/prevInav-1)*100:0,
      preSpotStopPct:spot&&prevSpot?Math.abs(spot/prevSpot-1)*100:0,
      spotShiftStopPct:spot&&refSpot&&refInav?Math.abs(spot/refSpot-inav/refInav)*100:0,
      refShiftStopPct:refInav?Math.abs(inav/refInav-1)*100:0,
      gapShiftStopPct:inav?Math.abs(lpBumpedInavKrw(row)/inav-1)*100:0
    };
    for(const [key,label] of LP_SAFETY_STOPS){
      const limit=p[key];
      if(!Number.isFinite(limit)||limit<=0)continue;
      if(values[key]>limit)return {key,label,limit,value:values[key]};
    }
    return null;
  }

  function tripLpSafety(row,breach) {
    row.autohedge=false;
    row.engineStatus="hold";
    row.safetyLock=`${breach.label} ${breach.limit.toFixed(2)}% 초과`;
    row.safetyTrippedAt=currentTimestamp().slice(0,8);
    row.cooldownUntilTick=null;
    if(typeof MP.addAudit==="function")MP.addAudit("BOOKROW_SAFETY_TRIP",`${row.id}, ${breach.label} ${breach.value.toFixed(2)}% > ${breach.limit.toFixed(2)}%`,"차단","negative","System");
    if(typeof MP.showToast==="function")MP.showToast("세이프티 트립",`${lpRowLabel(row)}, ${breach.label} ${breach.limit.toFixed(2)}% 초과로 호가 정지`,"danger");
  }

  function evaluateLpHedgePolicy({rowId=null,fillQty=null,tick=false,policyChange=false}={}) {
    const rows=rowId?[lpBookRow(rowId)]:state.lpBookRows;
    let result=null;
    rows.filter(Boolean).forEach(row=>{
      if(row.safetyLock&&row.cooldownUntilTick!==null&&state.engineTick>=row.cooldownUntilTick){
        row.safetyLock=null;
        row.cooldownUntilTick=null;
        row.engineStatus="manual";
        if(typeof MP.addAudit==="function")MP.addAudit("BOOKROW_SAFETY_COOLDOWN",`${row.id}, 재가동 가능`);
      }
      if(!row.safetyLock&&row.safetySkipTick!==state.engineTick){
        const breach=lpSafetyBreach(row);
        if(breach){tripLpSafety(row,breach);return;}
      }
      if(!row.autohedge||row.dirty||row.safetyLock)return;
      const policy=row.params;
      const residual=lpUnallocatedExposure(row.id);
      if(Math.abs(row.netUnhedgedQty)>policy.maxCarryBtc){
        const ready=state.lpHedgeQueue.filter(item=>item.rowId===row.id&&item.status==="READY");
        let candidate=ready[0]||null;
        if(Math.abs(residual)>=.0001)candidate=createLpHedgeCandidate(row,residual,"max-carry");
        else ready.forEach(item=>{item.forced=true;item.reason="max-carry";});
        row.autohedge=false;
        row.engineStatus="hold";
        row.safetyLock="LOCK";
        row.safetyTrippedAt=currentTimestamp().slice(0,8);
        row.cooldownUntilTick=state.engineTick+policy.rearmDelaySeconds;
        if(typeof MP.addAudit==="function")MP.addAudit("BOOKROW_SAFETY_TRIP",`${row.id}, ${Math.abs(row.netUnhedgedQty).toFixed(4)} ${row.underlying}`,"차단","negative","System");
        if(typeof MP.showToast==="function")MP.showToast("세이프티 트립",`${lpRowLabel(row)}, 강제 헤지 후보 생성 후 호가 정지`,"danger");
        result=candidate;
        return;
      }
      if(Math.abs(residual)<.0001){row.nettingElapsedSeconds=0;return;}
      if(Math.abs(residual)>=policy.netHedgeThresholdBtc){result=createLpHedgeCandidate(row,residual,"threshold");return;}
      if(fillQty!==null&&policyChange){result=createLpHedgeCandidate(row,residual,"per-fill");return;}
      if(tick)row.nettingElapsedSeconds+=1;
      if(row.nettingElapsedSeconds>=policy.nettingWindowSeconds)result=createLpHedgeCandidate(row,residual,"window");
    });
    return result;
  }

  function applyLpHedgePolicy(rowId=state.lpRowSelected) {
    const row=lpBookRow(rowId);
    if(row)runLpAutoHedges(row.id);
    evaluateLpHedgePolicy({rowId,policyChange:true});
  }

  function addLpFill() {
    const activeRows=state.lpBookRows.filter(row=>row.autohedge&&!row.dirty&&!row.safetyLock);
    const row=activeRows[state.lpFillSequence%Math.max(1,activeRows.length)]||state.lpBookRows[0];
    const isSell=state.lpFillSequence%4!==0;
    const shares=[1200,1800,2600,3400,4800][state.lpFillSequence%5];
    const received=state.pdfUploads[row.etfId];
    const cuShares=received?.cuShares||state.constants.cuShares;
    const unitPerCu=received?.btcPerCu||state.constants.btcPerCu;
    const qty=roundLpBtc(shares/cuShares*unitPerCu*(isSell?1:-1));
    state.lpFills.unshift({id:`KRX-${state.lpFillSequence++}`,rowId:row.id,bookId:row.bookId,time:currentTimestamp().slice(0,8),side:isSell?"SELL":"BUY",shares,price:state.constants.ownInavKrw+(isSell?3:-3)+(state.engineTick%3),qty});
    state.lpFills=state.lpFills.slice(0,12);
    row.netUnhedgedQty=roundLpBtc(row.netUnhedgedQty+qty);
    evaluateLpHedgePolicy({rowId:row.id,fillQty:qty});
  }

  function flashTick(element,direction) {
    if(!direction)return;
    element.classList.remove("price-tick-up","price-tick-down");
    void element.offsetWidth;
    element.classList.add(direction);
  }

  function pairTickDirection(pair) {
    const mark=MP.pairMark(pair);
    const previous=Number.isFinite(pair.previousMark)?pair.previousMark:mark;
    return mark>previous?"price-tick-up":mark<previous?"price-tick-down":"";
  }

  function updateWatchDom() {
    state.pairs.forEach(pair=>{
      const symbol=pair.symbol;
      const direction=pairTickDirection(pair);
      const change=MP.pairChangePercent(pair);
      const bid=document.querySelector(`[data-pair-bid="${symbol}"]`);
      const offer=document.querySelector(`[data-pair-offer="${symbol}"]`);
      const spread=document.querySelector(`[data-pair-spread="${symbol}"]`);
      const ladder=document.querySelector(`[data-pair-ladder="${symbol}"]`);
      const rowPrice=document.querySelector(`[data-row-price="${symbol}"]`);
      const rowVolume=document.querySelector(`[data-row-volume="${symbol}"]`);
      const rowChange=document.querySelector(`[data-row-change="${symbol}"]`);
      const cardChange=document.querySelector(`[data-card-change="${symbol}"]`);
      if(bid){bid.textContent=MP.formatPairPrice(pair,MP.pairBid(pair));flashTick(bid,direction);}
      if(offer){offer.textContent=MP.formatPairPrice(pair,MP.pairOffer(pair));flashTick(offer,direction);}
      if(spread)spread.textContent=`${MP.pairSpreadBps(pair).toFixed(2)}bp`;
      if(ladder)ladder.innerHTML=MP.renderPairLadderRows(pair);
      if(rowPrice){rowPrice.textContent=MP.formatPairPrice(pair,MP.pairMark(pair));flashTick(rowPrice,direction);}
      if(rowVolume)rowVolume.textContent=MP.compactQuantity(pair.volume24h);
      if(rowChange){rowChange.textContent=`${change>=0?"+":""}${change.toFixed(2)}%`;rowChange.className=`num watch-row-change ${change>=0?"positive-text":"negative-text"}`;}
      if(cardChange){cardChange.textContent=`24H ${change>=0?"+":""}${change.toFixed(2)}%`;cardChange.className=`num ${change>=0?"positive-text":"negative-text"}`;}
    });
  }

  function updateExecutionTradeDom() {
    const pair=MP.currentPair();
    const mark=MP.pairMark(pair);
    const direction=pairTickDirection(pair)||"price-tick-up";
    document.querySelectorAll("[data-live-price]").forEach(element=>{
      element.textContent=MP.formatPairPrice(pair,mark);
      flashTick(element,direction);
    });
    const chart = document.querySelector("[data-candle-chart]");
    if (chart) chart.innerHTML = MP.candleChartSvg(pair);
    const candles = MP.pairCandles(pair);
    const last = candles[candles.length-1];
    const values = {"[data-ohlc-open]":last.open,"[data-ohlc-high]":last.high,"[data-ohlc-low]":last.low};
    Object.entries(values).forEach(([selector,value])=>{const node=document.querySelector(selector);if(node)node.textContent=MP.formatPairPrice(pair,value);});
    const book = document.getElementById("live-order-book");
    const tape = document.getElementById("live-trade-tape");
    if (book) book.innerHTML = MP.renderOrderBookRows(pair);
    if (tape) tape.innerHTML = MP.renderRecentTrades(pair);
    const rfq=state.tradeRfq;
    const countdown=document.querySelector("[data-trade-rfq-countdown]");
    if(rfq&&(rfq.status==="quoted"||Array.isArray(rfq.responses))){
      const seconds=Math.max(0,Math.ceil((rfq.expiresAt-Date.now())/1000));
      if(countdown)countdown.textContent=`${seconds}s`;
      if(seconds===0){rfq.status="expired";MP.renderRoute("trade",false);}
    }
    syncTradeOrderSummary();
  }

  function updateTradeDom() {
    if(state.tradeView==="execution")updateExecutionTradeDom();
    else updateWatchDom();
  }

  function bucketMedian(values) {
    const sorted=values.filter(Number.isFinite).slice().sort((a,b)=>a-b);
    if(!sorted.length)return null;
    const middle=Math.floor(sorted.length/2);
    const value=sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2;
    return Math.round(value*100)/100;
  }

  function syncExecutionTapeStatus(tape=state.executionTape,tapeWindow=state.executionTapeWindow) {
    const openIndex=tapeWindow.index;
    tape.forEach(row=>{
      row.status=row.index<openIndex?"완료":row.index===openIndex?"진행":"대기";
    });
  }

  function advanceExecutionTape(openedNewBucket) {
    const tapeWindow=state.executionTapeWindow;
    const tape=state.executionTape;
    if(state.executionSim&&state.executionSim.running)return;
    if(!tapeWindow||tapeWindow.index<0||tapeWindow.index>=tape.length)return;
    const print=state.recentTrades[0];
    if(print&&Number.isFinite(print.price)){
      tapeWindow.prices.push(print.price);
      tapeWindow.prices=tapeWindow.prices.slice(-60);
    }
    const bucket=tape[tapeWindow.index];
    if(state.executionActive&&!state.executionPaused&&bucket){
      const step=bucket.fillQty/12;
      tapeWindow.fillQty=Math.min(bucket.fillQty,Math.round((tapeWindow.fillQty+step)*10000)/10000);
    }
    if(!openedNewBucket||!bucket)return;
    const median=bucketMedian(tapeWindow.prices);
    if(median!==null)bucket.medianUsd=median;
    tapeWindow.index+=1;
    tapeWindow.prices=[];
    tapeWindow.fillQty=0;
    syncExecutionTapeStatus();
  }

  function updateExecutionDom() {
    let monitor=null;
    if(typeof MP.executionMonitorMetrics==="function"){
      if(state.current==="ap-execution"&&typeof MP.withExecutionTapeContext==="function"){
        const run=typeof MP.executionRunById==="function"?MP.executionRunById(state.executionSelectedOrderId):null;
        const context=typeof MP.executionRunContext==="function"?MP.executionRunContext(run):null;
        monitor=context?MP.withExecutionTapeContext(context,()=>MP.executionMonitorMetrics(MP.executionDerivedStateKey())):MP.executionMonitorMetrics();
      }else monitor=MP.executionMonitorMetrics();
    }
    const target=monitor?monitor.targetQty:state.executionTarget;
    const filled=monitor?monitor.filledQty:state.executionFilled;
    const percent = target>0?Math.min(100,filled/target*100):0;
    document.querySelectorAll("[data-execution-filled]").forEach(node=>node.textContent=`${filled.toFixed(4)} BTC`);
    document.querySelectorAll("[data-execution-percent]").forEach(node=>node.textContent=`${percent.toFixed(1)}%`);
    document.querySelectorAll("[data-fixing-countdown]").forEach(node=>node.textContent=`${String(Math.floor(state.fixingSeconds/60)).padStart(2,"0")}:${String(state.fixingSeconds%60).padStart(2,"0")}`);
    document.querySelectorAll("[data-exec-wall-clock]").forEach(node=>node.textContent=currentTimestamp().slice(0,8));
    document.querySelectorAll("[data-exec-sim-clock]").forEach(node=>node.textContent=MP.executionSimClockLabel());
    if(monitor&&Number.isFinite(monitor.participationPct)){
      document.querySelectorAll("[data-exec-participation]").forEach(node=>node.textContent=`${monitor.participationPct.toFixed(2)}%`);
    }
  }

  function updateClientPricingDom() {
    if(state.current!=="client-portal")return;
    if(!state.clientPortal.quoteApproved&&!state.clientPortal.algoInstructed)return;
    const executionPercent=state.executionTarget>0?Math.min(100,state.executionFilled/state.executionTarget*100):0;
    document.querySelectorAll(".portal-progress-meter strong").forEach(node=>node.textContent=`${executionPercent.toFixed(1)}%`);
  }

  function updateFxDom() {
    const node=document.getElementById("usd-krw-value");
    if(!node)return;
    node.textContent=state.constants.usdKrw.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    if(state.constants.usdKrw===state.previousUsdKrw)return;
    const direction=state.constants.usdKrw>state.previousUsdKrw?"price-tick-up":"price-tick-down";
    node.classList.remove("price-tick-up","price-tick-down");
    void node.offsetWidth;
    node.classList.add(direction);
  }

  function formatCycleCountdown(seconds) {
    const safe=Math.max(0,seconds);
    const hours=Math.floor(safe/3600);
    const minutes=Math.floor(safe%3600/60);
    const remainder=safe%60;
    return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(remainder).padStart(2,"0")}`;
  }

  function updateSettlementCycleDom() {
    document.querySelectorAll("[data-settlement-cycle-countdown]").forEach(node=>node.textContent=formatCycleCountdown(state.settlementCycle.secondsRemaining));
  }

  function updatePrimeEngine() {
    if (document.hidden) return;
    state.engineTick += 1;
    state.previousTradePrice = state.tradePrice;
    state.pairs.forEach(pair=>{pair.previousMark=MP.pairMark(pair);});
    const move = Math.sin(Date.now()/5200)*.55+(Math.random()-.5)*5.4;
    state.tradePrice = Math.max(69800,Math.min(70180,Math.round((state.tradePrice+move)*100)/100));
    state.ethPrice = Math.max(3790,Math.min(3860,state.ethPrice+(Math.random()-.5)*1.8));
    state.usdtKrw = Math.max(1398.8,Math.min(1401.2,state.usdtKrw+(Math.random()-.5)*.08));
    state.previousUsdKrw = state.constants.usdKrw;
    state.constants.usdKrw = Math.max(1380,Math.min(1420,Math.round((state.constants.usdKrw+(Math.random()-.5)*.3)*100)/100));
    state.pairs.forEach(pair=>{
      if(pair.walk)pair.mark=Math.max(pair.floor,Math.min(pair.ceiling,pair.mark+(Math.random()-.5)*pair.walk));
      pair.volume24h+=pair.volume24h*Math.random()*.00002;
    });
    state.pairs.filter(pair=>pair.symbol!=="BTC/USD").forEach(pair=>{
      MP.ensurePairTape(pair);
      const mark=MP.pairMark(pair);
      pair.tape.unshift({price:mark+(Math.random()-.5)*pair.halfSpread*1.8,size:Math.max(pair.ladderSize*.04,Math.random()*pair.ladderSize*1.3),side:mark>=pair.previousMark?"buy":"sell",time:currentTimestamp()});
      pair.tape=pair.tape.slice(0,40);
    });
    const latest = state.tradeCandles[state.tradeCandles.length-1];
    latest.close = state.tradePrice;
    latest.high = Math.max(latest.high,state.tradePrice);
    latest.low = Math.min(latest.low,state.tradePrice);
    const candleIndex=35+Math.floor((state.engineTick-1)/18);
    latest.volume=MP.tradeCandleVolume(latest.high-latest.low,candleIndex);
    if (state.engineTick%18===0) {
      const high=state.tradePrice+3;
      const low=state.tradePrice-3;
      state.tradeCandles.push({open:state.tradePrice,high,low,close:state.tradePrice,volume:MP.tradeCandleVolume(high-low,candleIndex+1)});
      state.tradeCandles.shift();
    }
    const side = state.tradePrice >= state.previousTradePrice ? "buy" : "sell";
    state.recentTrades.unshift({price:state.tradePrice+(Math.random()-.5)*1.2,size:Math.max(.001,Math.random()*1.1),side,time:currentTimestamp()});
    state.recentTrades = state.recentTrades.slice(0,40);
    if (state.fixingSeconds>0) state.fixingSeconds -= 1;
    if(state.current==="settlement"&&state.settlementCycle.secondsRemaining>0){
      state.settlementCycle.secondsRemaining-=1;
      /* 시뮬레이션 시계가 정산 시각을 지나면 확정 정책의 이체 티켓이 집행된다 (D-0910-04). */
      if(state.settlementCycle.secondsRemaining===0&&typeof MP.runSettlementCycle==="function"){
        const batch=MP.runSettlementCycle({actor:"System / 정산 사이클"});
        if(batch.tickets.length){
          if(typeof MP.showToast==="function")MP.showToast("정산 사이클 실행",`${batch.tickets.length}건 정산 완료`,"success");
          if(state.current==="settlement")MP.renderRoute("settlement",false);
        }
      }
    }
    const lpActive=["lp-desk","lp-fills-window","lp-queue-window"].includes(state.current);
    if (lpActive&&!state.lpFeedPaused) {
      state.lpAggregateDelayMs=state.engineTick%30===0?1200:70+state.engineTick%40;
      state.lpFeedStale=false;
      state.lpFeedSequence+=1;
      state.lpFeedLastSent=currentTimestamp();
    } else if(lpActive) {
      state.lpFeedStale=false;
    }
    if(lpActive){
      evaluateLpHedgePolicy({tick:true});
      if (state.engineTick%5===0) addLpFill();
    }
    let openedNewBucket=false;
    const executionActive=["ap-execution","prime-execution"].includes(state.current);
    if (executionActive&&state.executionActive && !state.executionPaused && !state.executionSim.running && state.engineTick%4===0 && state.executionFilled<state.executionTarget) {
      const nextBucket = state.executionBuckets.findIndex(value=>value===0);
      if (nextBucket>=0) {state.executionBuckets[nextBucket]=5;openedNewBucket=true;}
      else state.executionBuckets[state.executionBuckets.length-1]=Math.min(120,state.executionBuckets[state.executionBuckets.length-1]+5);
      const bucketTarget=state.executionTarget/12;
      state.executionFilled=Math.min(state.executionTarget,state.executionBuckets.reduce((sum,value)=>sum+bucketTarget*value/100,0));
    }
    if(executionActive)advanceExecutionTape(openedNewBucket);

    updateFxDom();
    if (state.current === "trade") updateTradeDom();
    /* LP 데스크는 전체 재렌더 대신 셀 단위 갱신을 쓴다. 가로 스크롤과 편집 중 입력이 유지된다. */
    if (state.current==="lp-desk"&&typeof MP.updateLpDeskDom==="function") MP.updateLpDeskDom();
    else if (["lp-fills-window","lp-queue-window"].includes(state.current) && state.engineTick%5===0&&!document.activeElement?.matches("[data-row-param], [data-lp-bulk-value]")) MP.renderRoute(state.current,false);
    if (state.current === "ap-execution" || state.current === "prime-execution") updateExecutionDom();
    if (state.current === "client-portal") updateClientPricingDom();
    if (state.current === "settlement") updateSettlementCycleDom();
    if (state.current === "portfolio") document.querySelectorAll("[data-portfolio-mark]").forEach(node=>node.textContent=formatTradePrice(state.tradePrice));
    MP.refreshDualValueOverlays();

  /* ---------- simulation control ---------- */

  function simulationTimeout(handler,delay) {
    const entry={timer:setTimeout(handler,Math.max(0,Number(delay)||0))};
    return entry;
  }

  function cancelSimulationTimeout(entry) {
    if(!entry||entry.timer===null)return false;

    return handler;

  /* ---------- compressed clock window run ---------- */
  /* one slice of the fixing window per 슬라이스 시뮬레이션 간격 of real time. it runs on the
     same MP.simulationTimeout gate as every other feed, so the global 시뮬레이션 switch
     freezes it and 시작 resumes it from the remaining delay. */

  let executionSimEntry = null;

  function executionSimClear() {
    if(executionSimEntry)cancelSimulationTimeout(executionSimEntry);
    executionSimEntry=null;
  }

  function executionSimRepaint() {
    if(typeof MP.renderRoute!=="function")return;
    if(state.current==="prime-execution"||state.current==="ap-execution")MP.renderRoute(state.current,false);

  /* 런이 걸려 있으면 그 런의 테이프를, 아니면 전역 테이프를 민다. 주문 런은 명목 슬라이스
     길이와 무관하게 `executionOrderSliceMs` 간격으로 한 구간씩 채운다. */
  function executionSimTapeContext() {
    const run=state.executionSim.runId?MP.executionRunById(state.executionSim.runId):null;

  }

  function executionSimSchedule() {
    executionSimClear();
    const base=state.executionSim.orderRun?state.executionOrderSliceMs:state.executionSimIntervalMs;
    const delay=Math.max(200,Number(base)||5000);
    executionSimEntry=simulationTimeout(executionSimStep,delay);
  }

  function executionScreenActive() {
    return state.current==="ap-execution";
  }

  function executionSimStep() {
    executionSimEntry=null;
    if(!state.executionSim.running)return;
    /* 화면별 시뮬레이션 규칙: 집행 화면을 떠나면 런은 멈추고 돌아오면 이어서 간다. */
    if(state.executionSim.orderRun&&!executionScreenActive()){executionSimSchedule();return;}
    const {tape,tapeWindow}=executionSimTapeContext();
    if(tapeWindow.index>=tape.length){executionSimFinish();return;}
    const bucket=tape[tapeWindow.index];
    if(Number.isFinite(bucket.planFillQty))bucket.fillQty=bucket.planFillQty;
    tapeWindow.index+=1;
    tapeWindow.prices=[];
    tapeWindow.fillQty=0;
    syncExecutionTapeStatus(tape,tapeWindow);
    if(tapeWindow.index>=tape.length){executionSimFinish();return;}
    executionSimSchedule();
    executionSimRepaint();
  }

  /* D-0915: 집행이 끝난 주문 런을 장부에 기록한다. 이걸 하지 않으면 Execution 은 집행 완료인데
     포트폴리오의 주문 내역, 체결 내역, 포지션, 잔고, 손익 분해가 전부 그대로 남는다. */
  function bookExecutionRunFill(run) {
    if(!run||run.global||run.booked)return;
    const context=MP.executionRunContext(run);
    const filled=Math.round(context.tape.reduce((sum,row)=>sum+(Number(row.fillQty)||0),0)*10000)/10000;
    if(!(filled>0))return;
    run.booked=true;
    const notionalUsd=context.tape.reduce((sum,row)=>sum+(Number(row.fillQty)||0)*(Number(row.fillPriceUsd)||0),0);
    const avgUsd=Math.round(notionalUsd/filled*100)/100;
    const notionalKrw=Math.round(notionalUsd*state.constants.usdKrw);
    const record=state.orderRecords.find(item=>item.id===run.id)||null;
    const rfq=state.activeRfqs.find(item=>item.id===run.id)||null;

      record.notionalKrw=notionalKrw;
      record.fee=MP.formatMoneyFromKrw(Math.round(notionalKrw*feeBps/10000));

    const accountId=rfq?.primeAccountId||record?.primeAccountId||record?.noteRef;
    const side=String(rfq?.side||record?.side||"BUY").toUpperCase()==="SELL"?"sell":"buy";
    const etfRun=Boolean(rfq&&Number.isFinite(rfq.cu)&&rfq.cu>0);
    /* 설정과 환매의 코인 레그는 AP 북 원장 소관이다. 트레이딩 계정의 잔고와 포지션은 건드리지 않는다. */
    if(!etfRun)applyAccountFill(accountId,MP.pairBySymbol("BTC/USD"),side,filled,avgUsd);
    /* 설정과 환매는 AP 북 원장의 CU 를 움직인다. 같은 ETF, 같은 방향 행이 있으면 거기에 더한다. */
    if(etfRun){
      const sideLabel=side==="buy"?"설정":"환매";
      const deliver=side==="buy"?-filled:filled;
      const entry=state.apBook.ledger.find(item=>item.etfId===rfq.etfId&&item.side===sideLabel);
      if(entry){entry.cu=Math.round((entry.cu+rfq.cu)*10000)/10000;entry.deliverBtc=Math.round((entry.deliverBtc+deliver)*10000)/10000;}
      else state.apBook.ledger.push({id:`KSD-${side==="buy"?"CR":"RD"}-260908-${String(state.apBook.ledger.length+40).padStart(4,"0")}`,side:sideLabel,etfId:rfq.etfId,cu:rfq.cu,deliverBtc:deliver,owner:"자기 재고"});
    }
    if(typeof MP.addAudit==="function")MP.addAudit("ALGO_FILL",`${run.id}, ${filled.toFixed(4)} BTC, 평균 $${avgUsd.toLocaleString("en-US",{minimumFractionDigits:2})}`);
  }

  function executionSimFinish() {
    const completedRun=state.executionSim.runId?MP.executionRunById(state.executionSim.runId):null;
    if(completedRun&&!Number.isFinite(completedRun.completedAt))completedRun.completedAt=Date.now();
    bookExecutionRunFill(completedRun);
    state.executionSim.running=false;
    state.executionSim.completed=true;
    state.executionSim.orderRun=false;
    executionSimClear();
    executionSimRepaint();
    if(typeof MP.showToast==="function")MP.showToast("윈도 프린트","확정 픽싱 산출 완료, TCA 확정 이탈 표시","success");
  }

  function startExecutionSim() {
    if(state.executionSim.running)return {ok:false,reason:"이미 실행 중"};
    if(state.executionTapeWindow.index>=state.executionTape.length)return {ok:false,reason:"윈도 프린트 완료, 재설정 후 실행 가능"};
    executionOrderCountdownClear();
    state.executionSim.running=true;
    state.executionSim.completed=false;
    state.executionSim.runId=null;
    state.executionSim.orderRun=false;
    state.executionPaused=false;
    state.executionStateView="auto";
    executionSimSchedule();
    return {ok:true};
  }

  function pauseExecutionSim() {
    if(!state.executionSim.running)return {ok:false,reason:"실행 중 아님"};
    state.executionSim.running=false;
    state.executionSim.orderRun=false;
    executionSimClear();
    return {ok:true};
  }

  function resetExecutionSim() {
    state.executionSim.running=false;
    state.executionSim.completed=false;
    state.executionSim.runId=null;
    state.executionSim.orderRun=false;
    executionOrderCountdownClear();
    executionSimClear();
    MP.resetExecutionTape();
    state.executionStateView="auto";
    return {ok:true};
  }

  /* ---------- 티켓 런, 5초 카운트다운 뒤 구간당 2초 ---------- */

  let executionCountdownEntry = null;

  function executionOrderCountdownClear() {
    if(executionCountdownEntry)cancelSimulationTimeout(executionCountdownEntry);
    executionCountdownEntry=null;
    const run=state.executionSim.runId?MP.executionRunById(state.executionSim.runId):null;
    if(run)run.countdown=0;
  }

  function executionCountdownStep() {
    executionCountdownEntry=null;
    const run=state.executionSim.runId?MP.executionRunById(state.executionSim.runId):null;
    if(!run||run.countdown<=0)return;
    if(!executionScreenActive()){executionCountdownEntry=simulationTimeout(executionCountdownStep,1000);return;}
    run.countdown-=1;
    if(run.countdown>0){
      executionCountdownEntry=simulationTimeout(executionCountdownStep,1000);
      executionSimRepaint();
      return;
    }
    run.started=true;
    state.executionSim.running=true;
    state.executionSim.completed=false;
    state.executionSim.orderRun=true;
    executionSimSchedule();
    executionSimRepaint();
  }

  function startExecutionOrderRun(orderId) {
    const run=MP.executionRunById(orderId);
    if(!run)return {ok:false,reason:"주문 런 없음",started:false};
    const context=MP.executionRunContext(run);
    if(context.tapeWindow.index>=context.tape.length)return {ok:true,reason:"집행 완료",started:false};
    if(state.executionSim.runId===orderId&&(run.countdown>0||state.executionSim.running))return {ok:true,reason:"진행 중",started:false};
    state.executionSim.running=false;
    state.executionSim.orderRun=false;
    executionSimClear();
    executionOrderCountdownClear();
    state.executionSim.runId=orderId;
    state.executionSim.completed=false;
    run.countdown=Math.max(1,Number(state.executionCountdownSeconds)||5);
    executionCountdownEntry=simulationTimeout(executionCountdownStep,1000);
    return {ok:true,reason:"",started:true};
  }

  function executionSimRunnable() {
    if(state.executionTapeWindow.index>=state.executionTape.length)return {ok:false,reason:"윈도 프린트 완료, 재설정 후 실행 가능"};
    return {ok:true,reason:""};
  }

  Object.assign(MP,{currentTimestamp,syncTradeOrderSummary,updateFxDom,riskLimitViolation,recordRiskOrder,commitTrade,applyLinkedBusinessFill,lpBookRow,lpRowLabel,lpRowPair,lpUnallocatedExposure,executeLpHedgeCandidate,runLpAutoHedges,createLpHedgeCandidate,evaluateLpHedgePolicy,applyLpHedgePolicy,lpResetSafetyRefs,lpSafetyBreach,updatePrimeEngine,advanceExecutionTape,syncExecutionTapeStatus,simulationTick,simulationTimeout,cancelSimulationTimeout,startExecutionSim,pauseExecutionSim,resetExecutionSim,executionSimRunnable,startExecutionOrderRun});
})(window.MP = window.MP || {});

  const selectorFilters = [["Starred","★"],["All","All"],["Spot","Spot"],["tk-Stock","tk-Stock"],["tk-Fund","tk-Fund"],["tk-Bond","tk-Bond"],["RWA","RWA"]];

  /* ---------- pair model ---------- */

  function pairBySymbol(symbol) {

  }

  function pairMark(pair) {

    if(pair.premium)return state.tradePrice*state.constants.usdKrw*pair.premium;

  function pairMarkBySymbol(symbol) {

  }

  function currentPair() {
    return pairBySymbol(state.tradeSymbol);
  }

  const pairBid = (pair) => pairMark(pair)-pair.halfSpread;
  const pairOffer = (pair) => pairMark(pair)+pair.halfSpread;
  const pairSpreadBps = (pair) => pair.halfSpread*2/pairMark(pair)*10000;
  const pairChangePercent = (pair) => (pairMark(pair)/pair.open24h-1)*100;
  const pairCrossGap = (pair) => pair.halfSpread*2;

  function fixedNumber(value,digits) {
    return Number(value).toLocaleString("en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits});
  }

    return formatLiteralMoney(value,pair.quote);

  function pairNotionalKrw(pair,price,size) {
    return pair.quote==="KRW"?price*size:price*size*state.constants.usdKrw;
  }

  function formatPairSize(pair,value) {
    return Number(value).toLocaleString("en-US",{minimumFractionDigits:pair.sizeDigits,maximumFractionDigits:pair.sizeDigits});
  }

  function compactQuantity(value) {
    const absolute=Math.abs(value);
    if(absolute>=1e9)return `${(value/1e9).toFixed(2)}B`;
    if(absolute>=1e6)return `${(value/1e6).toFixed(2)}M`;
    if(absolute>=1e3)return `${(value/1e3).toFixed(2)}K`;

  }

  function pairDual(pair,quantity,costPrice,options={}) {
    return dualValue({
      quantity,
      unit:pair.base,
      costPrice,
      markPrice:pairMark(pair),
      currency:state.displayCurrency,
      sourceCurrency:pair.quote==="KRW"?"KRW":"USD",
      markKey:pair.symbol==="BTC/USD"?"tradePrice":`pair:${pair.symbol}`,
      ...options
    });
  }

  function pairDepth(pair) {
    const mark=pairMark(pair);
    return Array.from({length:25},(_,level)=>{
      const bidPrice=mark-pair.halfSpread-level*pair.levelStep;
      const askPrice=mark+pair.halfSpread+level*pair.levelStep;
      return {
        level,
        bidPrice,
        askPrice,
        bidSize:pair.ladderSize*(.68+(25-level)*.055),
        askSize:pair.ladderSize*(.72+(25-level)*.052),
        spreadBps:(askPrice-bidPrice)/mark*10000
      };
    });
  }

  function basePairCandles(pair) {
    if(pair.symbol==="BTC/USD")return state.tradeCandles.map(item=>({...item}));
    const source=state.tradeCandles;
    const mark=pairMark(pair);
    const last=source[source.length-1].close;
    const ratio=mark/last;
    const seed=pair.symbol.length+pair.base.charCodeAt(0)%7;
    const wobble=index=>1+Math.sin(index*.41+seed)*.0006;
    const scale=ratio/wobble(source.length-1);
    return source.map((candle,index)=>{

        high:candle.high*factor,
        low:candle.low*factor,
        close:candle.close*factor,
        volume:candle.volume
      };
    });
  }

  function pairCandles(pair) {
    const source=basePairCandles(pair);
    const bucketSize={"1m":1,"5m":2,"15m":4,"1h":9}[state.tradeTimeframe]||2;
    if(bucketSize===1)return source;
    const offset=source.length%bucketSize;

    if(pair.tape.length)return;
    const mark=pairMark(pair);

      price:mark+(index%2?-1:1)*pair.halfSpread*(1+index*.2),

  /* ---------- shared pieces ---------- */

  function chartHost() {

  /* 캔들 비율은 패널의 실제 픽셀 크기를 viewBox 로 그대로 써야 늘어나 보이지 않는다.
     렌더 시점과 resize 시점에 clientWidth / clientHeight 를 읽는다. */
  function chartBox() {

  }

  function candleChartSvg(pair=currentPair()) {

    }).join("");
    return `<svg viewBox="0 0 ${box.width} ${box.height}" preserveAspectRatio="none" aria-label="${MP.pairLabel(pair)} ${state.tradeTimeframe} OHLC 캔들 차트" data-chart-timeframe="${state.tradeTimeframe}" data-candle-count="${candles.length}">${ticks}<line class="chart-axis-base" x1="0" y1="${plotBottom.toFixed(1)}" x2="${box.width}" y2="${plotBottom.toFixed(1)}"></line>${bodies}${volumes}<line class="mark-line" x1="0" y1="${y(mark).toFixed(1)}" x2="${box.width}" y2="${y(mark).toFixed(1)}"></line></svg><span class="live-price-label num" style="top:${(y(mark)/box.height*100).toFixed(1)}%" data-live-chart-label>${formatPairPrice(pair,mark)}</span>`;
  }

  let chartResizeFrame=null;
  window.addEventListener("resize",()=>{

  function pairLastCell(pair) {

  function pairChangeText(pair) {

    const query=state.selectorQuery.trim().toLowerCase();
    if(query&&!`${MP.pairLabel(pair)} ${pair.name}`.toLowerCase().includes(query))return false;
