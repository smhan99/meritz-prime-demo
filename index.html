  <script data-source="js/screens/ap-execution.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,formatTradePrice} = MP;

  /* ---------- 집행 화면 (D-0914 재구성) ----------
     좌: 오늘의 픽싱 주문 티켓 목록. 중: 선택 주문의 주문 개요와 결과.
     우: 픽싱 창 진행 그래프와 구간별 결과표.
     실행 정지 버튼은 없다. 집행은 정해진 스케줄을 따르고, 티켓을 누르면 5초 뒤 시작해
     구간마다 2초씩 채워진다. 상태는 런에서 파생된다. */

  const stateLabels = {
    "대기":{label:"집행 전",tone:"muted"},
    "카운트다운":{label:"시작 대기",tone:"warning"},
    "진행":{label:"집행 중",tone:"info"},
    "완료":{label:"집행 완료",tone:"positive"}
  };

  function qtyText(value) {
    return Number(value||0).toFixed(4);
  }

  function sideLabelOf(value) {
    if(value==="SELL"||value==="매도")return "매도";
    return "매수";
  }

  /* 티켓 하나 = 오늘 집행하는 픽싱 주문 하나. `primeOrders`의 알고 주문 전부와,
     트레이드 화면의 집행 버튼이 올린 픽싱 알고 주문을 같은 모양으로 세운다. */
  function fixingTickets() {
    const list=[];
    (state.activeRfqs||[]).forEach(rfq=>{
      if(rfq.mode!=="픽싱 알고")return;
      list.push({
        id:rfq.id,
        symbol:"BTC/USD",
        sideLabel:sideLabelOf(rfq.side),
        quantityBtc:Number(rfq.quantity)||0,
        window:rfq.fixingWindow||{...state.executionWindowParams},
        participationPct:rfq.participationPct??18,
        priceBandBp:rfq.priceBandBp??25,
        excludedVenueIds:rfq.excludedVenueIds||[],
        fixingBasis:rfq.fixingBasis==="daily-replication"?"BRRNY":"윈도우 평균",
        algoLabel:"Quantizer"
      });
    });
    state.primeOrders.forEach(order=>{
      if(order.mode!=="알고")return;
      list.push({
        id:order.id,
        symbol:"BTC/USD",
        sideLabel:sideLabelOf(order.side),
        quantityBtc:Number(order.quantityBtc)||0,
        window:order.fixingWindow||{...state.executionWindowParams},
        fixingBasis:order.fixingBasis||"윈도우 평균",
        benchmarkFixes:order.benchmarkFixes||{},
        algoLabel:order.algoLabel||"Quantizer"
      });
    });
    return list.sort((a,b)=>{
      const runA=MP.executionRunFor(a);
      const runB=MP.executionRunFor(b);
      const doneA=MP.executionRunStatus(runA)==="완료";
      const doneB=MP.executionRunStatus(runB)==="완료";
      if(doneA!==doneB)return doneA?1:-1;
      if(!doneA)return a.window.startMinutes-b.window.startMinutes;
      return (runA.completedAt??a.window.endMinutes)-(runB.completedAt??b.window.endMinutes);
    });
  }

  function selectedTicket(tickets) {
    return tickets.find(item=>item.id===state.executionSelectedOrderId)||tickets[0]||null;
  }

  function runStatusOf(ticket) {
    return MP.executionRunStatus(MP.executionRunFor(ticket));
  }

  function ticketCard(ticket,selected) {
    const run=MP.executionRunFor(ticket);
    const status=MP.executionRunStatus(run);
    const context=MP.executionRunContext(run);
    const meta=stateLabels[status]||stateLabels["대기"];
    const label=status==="카운트다운"?`${run.countdown}초 후 시작`:meta.label;
    const done=context.tape.filter(row=>row.status==="완료").length;
    const filledQty=context.tape.reduce((sum,row)=>sum+(row.status==="완료"?row.fillQty:0),0);
    const filledNotional=context.tape.reduce((sum,row)=>sum+(row.status==="완료"?row.fillQty*row.fillPriceUsd:0),0);
    const pair=MP.pairBySymbol?MP.pairBySymbol(ticket.symbol):null;
    const resultPrice=filledQty>0?(MP.formatPairPrice&&pair?MP.formatPairPrice(pair,filledNotional/filledQty):formatTradePrice(filledNotional/filledQty)):"-";
    const quantity=status==="완료"?`${qtyText(filledQty)} ${pair?.base||"BTC"} @ ${resultPrice}`:`${qtyText(ticket.quantityBtc)} BTC`;
    const classes=["exec-ticket",selected?"selected":"",status==="완료"?"done":""].filter(Boolean).join(" ");
    return `<button type="button" class="${classes}" data-action="execution-select-order" data-order="${ticket.id}">
      <span class="exec-ticket-id num">${ticket.id}</span>
      <span class="exec-ticket-head"><b>${ticket.symbol}</b><span class="exec-ticket-side ${ticket.sideLabel==="매도"?"sell":"buy"}">${ticket.sideLabel}</span>${status==="완료"?'<span class="exec-ticket-complete-chip">집행 완료</span>':""}</span>
      <span class="exec-ticket-qty num">${quantity}</span>
      <span class="exec-ticket-window">${basisOverviewLabel(ticket.fixingBasis)}, <span class="num">${MP.executionWindowLabel(context.params)}</span></span>
      <span class="exec-ticket-foot">${chip(label,meta.tone)}<small class="num">${done} / ${context.tape.length}</small></span>
    </button>`;
  }

  function ticketPanel(tickets,ticket) {
    const body=tickets.length
      ?`<div class="exec-ticket-list">${tickets.map(item=>ticketCard(item,Boolean(ticket)&&item.id===ticket.id)).join("")}</div>`
      :'<div class="empty-note"><strong>오늘 픽싱 주문 없음</strong></div>';
    const pending=tickets.filter(item=>runStatusOf(item)!=="완료").length;
    return panel("오늘 픽싱 주문",body,{actions:chip(`잔여 ${pending}건`,pending?"info":"muted"),flush:true,className:"exec-ticket-panel"});
  }

  function overviewPanel(ticket,run) {
    const context=MP.executionRunContext(run);
    const status=MP.executionRunStatus(run);
    const excluded=(ticket.excludedVenueIds||[]).map(id=>state.vendorQuotes.find(vendor=>vendor.id===id)?.name.replace(/ Prime$/,"")).filter(Boolean).join(", ")||"없음";
    const rows=`<div class="kv-grid exec-overview-grid">
      <div class="kv"><label>수량</label><strong class="num">${qtyText(ticket.quantityBtc)} BTC</strong></div>
      <div class="kv"><label>픽싱 기준</label><strong>${basisOverviewLabel(ticket.fixingBasis)}</strong></div>
      <div class="kv"><label>윈도우</label><strong class="num">${MP.executionWindowLabel(context.params)}</strong></div>
      <div class="kv"><label>슬라이스 길이</label><strong class="num">${context.params.sliceMinutes}분</strong></div>
      <div class="kv"><label>최대 참여율</label><strong class="num">${ticket.participationPct??18}%</strong></div>
      <div class="kv"><label>가격 밴드</label><strong class="num">${ticket.priceBandBp??25} bp</strong></div>
      <div class="kv"><label>제외 베뉴</label><strong>${excluded}</strong></div>
      <div class="kv"><label>알고리즘</label><strong>Quantizer</strong></div>
    </div>`;
    const countdown=status==="카운트다운"
      ?`<div class="exec-countdown">${chip(`${run.countdown}초 후 시작`,"warning")}</div>`
      :"";
    return panel("주문 개요",`${rows}${countdown}`,{actions:chip(ticket.id,"violet"),flush:true});
  }

  function basisOverviewLabel(basis) {
    return basis==="BRRNY"?"BRRNY (CME CF)":"윈도우 평균";
  }

  function bpsGap(value,benchmark) {
    return Number.isFinite(value)&&Number.isFinite(benchmark)&&benchmark>0?(value/benchmark-1)*10000:null;
  }

  function bpsText(value) {
    return Number.isFinite(value)?`${value>=0?"+":""}${value.toFixed(2)}bp`:"-";
  }

  function resultPanel(ticket,view,run) {
    const status=MP.executionRunStatus(run);
    const finished=status==="완료";
    const statusMeta=finished?stateLabels["완료"]:status==="진행"?stateLabels["진행"]:stateLabels["대기"];
    const benchmarks=ticket.benchmarkFixes||{};
    const reference=ticket.fixingBasis==="BRRNY"?benchmarks.brrny:null;
    const fixingPrice=finished&&Number.isFinite(view.fixingUsd)?formatTradePrice(view.fixingUsd):"";
    const referencePrice=reference&&Number.isFinite(reference.price)?formatTradePrice(reference.price):"";
    const averagePrice=Number.isFinite(view.averagePriceUsd)?formatTradePrice(view.averagePriceUsd):"";
    const drift=finished?bpsText(bpsGap(view.averagePriceUsd,view.fixingUsd)):"";
    const midGap=finished?bpsText(bpsGap(state.tradePrice,view.fixingUsd)):"";
    const comparisonRows=`<tr><td><strong>상태</strong></td><td colspan="2">${chip(statusMeta.label,statusMeta.tone)}</td></tr>
      <tr><td><strong>진행률</strong></td><td colspan="2" class="align-right num">${qtyText(view.filledQty)} / ${qtyText(view.targetQty)} BTC, ${view.percent.toFixed(1)}%</td></tr>
      <tr class="exec-result-key"><td><strong>픽싱 결과</strong></td><td colspan="2" class="align-right num">${fixingPrice}</td></tr>
      ${referencePrice?`<tr class="exec-result-reference"><td><strong>참고값</strong></td><td colspan="2" class="align-right num">${referencePrice}</td></tr>`:""}
      <tr><td><strong>평균 체결가</strong></td><td colspan="2" class="align-right num">${averagePrice}</td></tr>
      <tr><td><strong>이탈</strong></td><td colspan="2" class="align-right num">${drift}</td></tr>
      <tr><td><strong>현재 mid</strong></td><td class="align-right num">${formatTradePrice(state.tradePrice)}</td><td class="align-right"><span class="exec-result-gap"><small>픽싱 대비</small><b class="num">${midGap}</b></span></td></tr>`;
    const body=`<div class="exec-result-comparison"><div class="table-scroll"><table class="data-table exec-result-table"><tbody>${comparisonRows}</tbody></table></div></div>`;
    return panel("결과",body,{flush:true});
  }

  function emptyView() {
    const body='<div class="empty-note"><strong>오늘 픽싱 주문 없음</strong></div>';
    return `<section class="view ap-exec-view" data-view="ap-execution">${panel("오늘 픽싱 주문",body,{flush:true})}</section>`;
  }

  function renderApExecution() {
    const tickets=fixingTickets();
    const ticket=selectedTicket(tickets);
    if(!ticket)return emptyView();
    const run=MP.executionRunFor(ticket);
    const context=MP.executionRunContext(run);
    return MP.withExecutionTapeContext(context,()=>{
      const view=MP.executionMonitorMetrics(MP.executionDerivedStateKey());
      const middle=`${overviewPanel(ticket,run)}${resultPanel(ticket,view,run)}`;
      const right=`${MP.executionChartPanel(view,{title:"진행률",captions:false})}${MP.executionBucketPanel(view,{title:"요약",captions:false,stateLabels})}`;
      return `<section class="view ap-exec-view" data-view="ap-execution"><div class="ap-exec-grid">
        <div class="ap-exec-col ap-exec-left">${ticketPanel(tickets,ticket)}</div>
        <div class="ap-exec-col ap-exec-mid">${middle}</div>
        <div class="ap-exec-col ap-exec-right">${right}</div>
      </div></section>`;
    });
  }

  /* 티켓 클릭. 선택하고, 아직 끝나지 않은 주문이면 5초 카운트다운 뒤 런을 시작한다.
     이미 집행된 주문은 결과만 보여준다. */
  function selectExecutionOrder(orderId) {
    const ticket=fixingTickets().find(item=>item.id===orderId);
    if(!ticket)return {ok:false,started:false};
    state.executionSelectedOrderId=orderId;
    const run=MP.executionRunFor(ticket);
    if(MP.executionRunStatus(run)==="완료")return {ok:true,started:false};
    return MP.startExecutionOrderRun(orderId);
  }

  MP.renderApExecution = renderApExecution;
  MP.selectExecutionOrder = selectExecutionOrder;
  MP.executionFixingTickets = fixingTickets;
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/lp-desk.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,progress,formatMoneyFromKrw} = MP;
  const priceTypeOptions=[["maker","메이커"],["taker","테이커"],["mid","미드"]];
  const quoteSourceOptions=[["own","자체"],["krx","KRX 배포"],["blend","혼합"]];
  const orderModeOptions=[["amend","정정"],["replace","취소 신규"]];
  const fieldLabels={autohedge:"자동 헤지",hedgeVenue:"헤지 종목",hedgePriceType:"가격 유형",autoAmendBuy:"자동정정 매수",autoAmendSell:"자동정정 매도",hedgeOrderMode:"주문 처리 방식",hedgeSliceQty:"분할 수량",hedgeBidOffsetBp:"매수 범프",hedgeAskOffsetBp:"매도 범프",netHedgeThresholdBtc:"헤지 임계",maxCarryBtc:"최대 캐리",nettingWindowSeconds:"넷팅 창",rearmDelaySeconds:"재가동 대기",quoteSourceMode:"iNAV 소스",inavBumpKrw:"iNAV 보정",bidOffsetBp:"제안 Bid 폭",askOffsetBp:"제안 Ask 폭",dutySize:"의무 수량",inavDivergenceStopBps:"Basis Band (bp)",theoryJumpStopPct:"PRE_iNAV (%)",preSpotStopPct:"PRE_SPOT (%)",spotShiftStopPct:"SPOT_SHIFT (%)",refShiftStopPct:"REF_SHIFT (%)",gapShiftStopPct:"GAP_SHIFT (%)",staleGuardSeconds:"Stale Cut (s)"};
  const GRID_COLUMNS=36;
  const detailTabs=[["orders","주문 내역"],["fills","체결 내역"],["pnl","헤지 손익"]];
  const hedgeReasonLabels={"per-fill":"체결 건별",threshold:"넷 임계",window:"시간창","max-carry":"강제 헤지"};
  const krxFeeBps=1.5;

  /* ---------- selection helpers ---------- */

  function books(){return state.etfBooks;}
  function bookById(id){return state.etfBooks.find(book=>book.id===id)||null;}
  function etfName(id){return state.etfs.find(etf=>etf.id===id)?.name||id;}

  function selectedBookIds(){return state.lpBookSelection.filter(id=>bookById(id));}
  function visibleRows(){const selection=selectedBookIds();return state.lpBookRows.filter(row=>selection.includes(row.bookId));}
  function selectedRow(){const rows=visibleRows();return rows.find(row=>row.id===state.lpRowSelected)||rows[0]||null;}

  function rowPrimeAccountId(row){return row?.primeAccountId||bookById(row?.bookId)?.primeAccountId||null;}

  function liveValue(row,field){return Object.prototype.hasOwnProperty.call(row.pendingParams,field)?row.pendingParams[field]:row.params[field];}
  function staged(row,field){return Object.prototype.hasOwnProperty.call(row.pendingParams,field);}
  function signed(value,digits=4){return `${value>=0?"+":""}${value.toFixed(digits)}`;}

  function underlyingTotals(rows){
    const totals={};
    rows.forEach(row=>{totals[row.underlying]=Math.round(((totals[row.underlying]||0)+row.netUnhedgedQty)*10000)/10000;});
    return Object.entries(totals).map(([unit,value])=>`${signed(value,2)} ${unit}`).join(", ")||"0.00";
  }

  function feedState(){
    if(state.lpFeedStale)return {label:"STALE",tone:"negative"};
    return {label:"STREAMING",tone:"positive"};
  }

  function rowPair(row){
    if(!row)return null;
    const symbol=liveValue(row,"hedgeVenue")||`${row.underlying}/USD`;
    return state.pairs.find(pair=>pair.symbol===symbol)||state.pairs.find(pair=>pair.base===row.underlying)||null;
  }

  function usdPrice(value){
    if(value===null||value===undefined||Number.isNaN(value))return "-";
    return typeof MP.formatMoneyFromUsd==="function"?MP.formatMoneyFromUsd(value):value.toLocaleString("ko-KR");
  }

  function queueItemsFor(ids){return state.lpHedgeQueue.filter(item=>ids.includes(item.rowId));}
  function fillsFor(ids){return state.lpFills.filter(fill=>ids.includes(fill.rowId));}

  function rowOutputs(row){
    const c=state.constants;
    const p=row.params;
    const source={own:c.ownInavKrw,krx:c.krxInavKrw,blend:(c.ownInavKrw+c.krxInavKrw)/2}[p.quoteSourceMode];
    const base=(source===undefined?c.ownInavKrw:source)+p.inavBumpKrw;
    return {base:Math.round(base),bid:Math.round(base*(1-p.bidOffsetBp/10000)),ask:Math.round(base*(1+p.askOffsetBp/10000))};
  }

  /* ---------- 북 선택 툴바 ---------- */

  function bookMenuLabel(){
    const selection=selectedBookIds();
    if(!selection.length)return "선택 없음";
    return selection.length===books().length?"전체":selection.join(", ");
  }

  function bookMenu(){
    const selection=selectedBookIds();
    const all=books();
    const allOn=all.length>0&&selection.length===all.length;
    const allMark=allOn?"ck":selection.length?"hf":"";
    const rows=[`<button class="lp-bookopt ${allOn?"on":""}" type="button" data-action="lp-book-check-all" role="checkbox" aria-checked="${allOn}"><span class="lpsq ${allMark}"></span>전체</button>`]
      .concat(all.map(book=>{
        const on=selection.includes(book.id);
        return `<button class="lp-bookopt ${on?"on":""}" type="button" data-action="lp-book-check" data-book-id="${book.id}" role="checkbox" aria-checked="${on}"><span class="lpsq ${on?"ck":""}"></span>${book.id}</button>`;
      }));
    const list=state.lpBookMenuOpen?`<div class="lp-bookmenu">${rows.join("")}</div>`:"";
    return `<span class="lp-bookmenu-wrap"><button class="lp-bookbtn" type="button" data-action="lp-toggle-book-menu" aria-haspopup="true" aria-expanded="${state.lpBookMenuOpen}">${bookMenuLabel()}<i aria-hidden="true">${state.lpBookMenuOpen?"▴":"▾"}</i></button>${list}</span>`;
  }

  function toolbar(){
    const checked=visibleRows().filter(row=>state.lpRowBulkSelected.includes(row.id)).length;
    const bulk=MP.settingControl("exec","securities",
      `<button class="lp-bulkbtn" type="button" data-action="lp-bulk-autohedge" ${checked?"":"disabled"}>일괄 ON</button>`,
      "");
    const windows=`${btn("체결 창","open-lp-window","small","",'data-window="lp-fills-window"')}${btn("헤지 큐 창","open-lp-window","small","",'data-window="lp-queue-window"')}`;
    return `<div class="lp-toolbar"><span class="lab">북</span>${bookMenu()}${bulk}<span class="push">${windows}</span></div>`;
  }

  function feedDivergenceBp(){
    const c=state.constants;
    return (c.ownInavKrw-c.krxInavKrw)/c.krxInavKrw*10000;
  }

  function feedFooter(){
    const feed=feedState();
    const c=state.constants;
    const divergence=feedDivergenceBp();
    return `<div class="lp-feed-line lp-feed-footer"><span>LP 시스템 피드</span><span data-lp-feed="state" data-lp-sig="${feed.label}">${chip(feed.label,feed.tone)}</span>`
      +`<span>지연 <b class="num" data-lp-feed="delay">${state.lpAggregateDelayMs}ms</b></span>`
      +`<span>지연 경보 <b class="num ${state.lpFeedStale?"negative-text":""}" data-lp-feed="stale">${state.lpFeedStale?"STALE":"정상"}</b></span>`
      +`<span>최근 전송 <b class="num" data-lp-feed="sent">${state.lpFeedLastSent}</b></span>`
      +`<span>시퀀스 <b class="num" data-lp-feed="seq">${state.lpFeedSequence.toLocaleString("ko-KR")}</b></span>`
      +`<span>KRX 배포 iNAV <b class="num" data-lp-feed="krxinav">${formatMoneyFromKrw(c.krxInavKrw)}</b></span>`
      +`<span>괴리 <b class="num warning-text" data-lp-feed="divergence">${divergence>=0?"+":""}${divergence.toFixed(2)}bp</b></span></div>`;
  }

  /* ---------- in row controls ---------- */

  /* 자동 헤지를 켤 수 없는 사유. 끄는 방향은 언제나 허용하므로 켜는 경우만 본다.
     계정은 행에 지정된 Prime 계정만 본다.
     미적용 파라미터는 차단 사유가 아니다. ON 으로 넘길 때 적용을 먼저 수행한다.
     세이프티 LOCK 도 차단 사유가 아니다. 토글은 LOCK 동안 OFF 로 남고, 그 상태에서
     ON 을 누르면 해제와 가동이 한 번에 이루어진다. */
  function autohedgeBlock(row){
    if(!row)return null;
    if(state.killSwitchActive)return {key:"kill",label:"킬 스위치 해제 후 가동"};
    if(!rowPrimeAccountId(row))return {key:"account",label:"헤지 계정 미지정"};
    return null;
  }

  function autoSignature(row){
    const block=row.autohedge?null:autohedgeBlock(row);
    return `${row.autohedge?"on":"off"}:${block?block.key:""}`;
  }

  function autoToggle(row){
    const on=row.autohedge;
    const block=on?null:autohedgeBlock(row);
    const note=block?`<small class="subcell lp-blocknote">${block.label}</small>`:"";
    const editable=`<button class="tgl ${on?"on":""}" type="button" data-action="toggle-row-autohedge" data-row-param="autohedge" data-row-id="${row.id}" data-auto-blocked="${block?block.key:""}" aria-pressed="${on}" aria-label="${etfName(row.etfId)} 자동 헤지${block?`, ${block.label}`:""}">${on?"ON":"OFF"}</button>${note}`;
    return MP.settingControl("exec","securities",editable,`<span class="tgl ${on?"on":""}">${on?"ON":"OFF"}</span>${note}`);
  }

  function stagedToggle(row,field){
    const value=liveValue(row,field);
    const editable=`<button class="tgl ${value?"on":""} ${staged(row,field)?"staged":""}" type="button" data-action="stage-row-toggle" data-row-param="${field}" data-row-id="${row.id}" data-field="${field}" aria-pressed="${value}" aria-label="${etfName(row.etfId)} ${fieldLabels[field]}">${value?"ON":"OFF"}</button>`;
    return MP.settingControl("exec","securities",editable,`<span class="tgl ${value?"on":""}">${value?"ON":"OFF"}</span>`);
  }

  function hedgeInstrumentCell(row){
    const options=state.pairs.filter(pair=>pair.base===row.underlying).map(pair=>[pair.symbol,MP.pairLabel(pair)]);
    if(options.length>1)return rowSelect(row,"hedgeVenue",options,"w7");
    return `<span class="lp-static num">${options[0]?.[0]||`${row.underlying}/USD`}</span>`;
  }

  function rowSelect(row,field,options,modifier=""){
    const value=liveValue(row,field);
    const label=options.find(([key])=>key===value)?.[1]||value;
    const editable=`<select class="lp-rsel ${modifier} ${staged(row,field)?"staged":""}" data-row-param="${field}" data-row-id="${row.id}" aria-label="${etfName(row.etfId)} ${fieldLabels[field]}">${options.map(([key,text])=>`<option value="${key}" ${value===key?"selected":""}>${text}</option>`).join("")}</select>`;
    return MP.settingControl("exec","securities",editable,`<span class="lp-static">${label}</span>`);
  }

  function rowNumber(row,field,unit,step="0.1"){
    const value=liveValue(row,field);
    const editable=`<span class="lp-cellin ${staged(row,field)?"staged":""}"><input class="num lp-rin" type="number" step="${step}" value="${value}" data-row-param="${field}" data-row-id="${row.id}" aria-label="${etfName(row.etfId)} ${fieldLabels[field]}">${unit?`<span class="u">${unit}</span>`:""}</span>`;
    return MP.settingControl("exec","securities",editable,`<span class="lp-static num">${value}${unit?` ${unit}`:""}</span>`);
  }

  /* 세이프티 스톱 파라미터. 전부 퍼센트 입력이고 소수점 두 자리로 통일한다. */
  function rowPercent(row,field){
    const value=liveValue(row,field);
    const shown=Number.isFinite(value)?value.toFixed(2):value;
    const editable=`<span class="lp-cellin lp-pctin ${staged(row,field)?"staged":""}"><input class="num lp-rin" type="number" step="0.01" min="0" value="${shown}" data-row-param="${field}" data-row-id="${row.id}" aria-label="${etfName(row.etfId)} ${fieldLabels[field]}"><span class="u">%</span></span>`;
    return MP.settingControl("exec","securities",editable,`<span class="lp-static num">${shown} %</span>`);
  }

  function netCell(row){
    const clear=MP.settingControl("exec","securities",
      `<button class="lp-subbtn" type="button" data-action="clear-row-net" data-row-id="${row.id}" aria-label="${etfName(row.etfId)} 미헤지 클리어">${row.underlying} 클리어</button>`,
      `<small class="subcell">${row.underlying}</small>`);
    return `<td class="align-right num ${row.netUnhedgedQty>=0?"positive-text":"negative-text"}" data-lp-cell="net"><span data-lp-net>${signed(row.netUnhedgedQty)}</span>${clear}</td>`;
  }

  function safetySignature(row){return row.safetyLock?`${row.safetyLock}|${row.safetyTrippedAt||""}`:"clear";}

  /* 셀은 LOCK 과 OK 두 글자만 쓴다. 트립 사유와 시각은 툴팁과 감사 로그에만 남긴다. */
  function safetyInner(row){
    if(!row.safetyLock)return chip("OK");
    const reason=`${row.safetyLock}${row.safetyTrippedAt?` ${row.safetyTrippedAt}`:""}`;
    const editable=`<button class="status-chip negative lp-chipbtn" type="button" data-action="unlock-row-safety" data-row-id="${row.id}" aria-label="${etfName(row.etfId)} 세이프티 해제, ${reason}" title="${reason}, 클릭하면 해제">LOCK</button>`;
    return MP.settingControl("exec","securities",editable,`<span class="status-chip negative" title="${reason}">LOCK</span>`);
  }

  function safetyCell(row){
    return `<td data-lp-cell="safety" data-lp-sig="${safetySignature(row)}">${safetyInner(row)}</td>`;
  }

  function changeSignature(row){return row.dirty?`dirty:${row.dirtyFields.length}`:"clean";}

  function changeInner(row){
    if(!row.dirty)return '<span class="lp-nochange">-</span>';
    const label=`미적용 ${row.dirtyFields.length}`;
    const editable=`<button class="status-chip warning lp-chipbtn" type="button" data-action="apply-row-params" data-row-id="${row.id}" aria-label="${etfName(row.etfId)} 변경 적용" title="변경 적용">${label}</button>`;
    return MP.settingControl("exec","securities",editable,chip(label,"warning"));
  }

  function changeCell(row){
    return `<td data-lp-cell="change" data-lp-sig="${changeSignature(row)}">${changeInner(row)}</td>`;
  }

  function deskAccountOptions(bookId){
    const book=bookById(bookId);
    const company=state.clients.find(client=>client.id===book?.clientId);
    const ids=company?company.primeAccountIds:[];
    return ids.map(id=>[id,MP.accountHolderLabel(id)]);
  }

  function mappingEditable(bookId){
    return MP.canControl("ops","securities")&&MP.deskOwnsBook(bookId);
  }

  function accountCell(row){
    const current=rowPrimeAccountId(row);
    if(mappingEditable(row.bookId)){
      const list=deskAccountOptions(row.bookId);
      const select=`<select class="lp-rsel w7" data-desk-row-account="${row.id}" aria-label="${etfName(row.etfId)} Prime 계정">${list.map(([option,label])=>`<option value="${option}" ${current===option?"selected":""}>${label}</option>`).join("")}</select>`;
      return `<td class="f2"><div class="row-account-cell">${select}</div></td>`;
    }
    return `<td class="f2"><div class="row-account-cell"><span class="num">${current?MP.accountHolderLabel(current):"미배정"}</span></div></td>`;
  }

  /* ---------- row grid ---------- */

  function gridHead(){
    const rows=visibleRows();
    const allChecked=rows.length>0&&rows.every(row=>state.lpRowBulkSelected.includes(row.id));
    const bands=[["식별",3,"fg"],["헤지 제어",3,"gs"],["헤지 실행",8,"gs"],["잔량과 넷팅",6,"gs"],["호가",5,"gs"],["산출",3,"gs"],["세이프티",7,"gs"],["상태",1,"gs"]];
    const band=bands.map(([label,span,cls])=>`<th class="${cls}" colspan="${span}">${label}</th>`).join("");
    const cols=`<th class="f0"><input type="checkbox" data-action="lp-head-select-all" aria-label="표시 행 전체 선택" ${allChecked?"checked":""} ${rows.length?"":"disabled"}></th><th class="f1">ETF</th><th class="f2">Prime 계정</th>`
      +["자동 헤지","세이프티","적용","헤지 종목","가격 유형","자동정정 매수","자동정정 매도","주문 처리 방식","분할 수량","매수 범프","매도 범프"].map(label=>`<th>${label}</th>`).join("")
      +'<th class="align-right">Δ 미헤지</th>'
      +["헤지 임계","최대 캐리","캐리 게이지","넷팅 창","재가동 대기","iNAV 소스","iNAV 보정","제안 Bid 폭","제안 Ask 폭","의무 수량"].map(label=>`<th>${label}</th>`).join("")
      +'<th class="align-right">자체 iNAV</th><th class="align-right">제안 Bid</th><th class="align-right">제안 Ask</th>'
      +["Basis Band (bp)","PRE_iNAV (%)","PRE_SPOT (%)","SPOT_SHIFT (%)","REF_SHIFT (%)","GAP_SHIFT (%)","Stale Cut (s)"].map(label=>`<th>${label}</th>`).join("")
      +'<th>최근 헤지</th>';
    return `<thead><tr class="grp">${band}</tr><tr>${cols}</tr></thead>`;
  }

  function gridRow(row){
    const selected=row.id===state.lpRowSelected;
    const bulk=state.lpRowBulkSelected.includes(row.id);
    const exposure=Math.abs(row.netUnhedgedQty);
    const breached=exposure>row.params.maxCarryBtc;
    const rowClass=[selected?"selected":"",row.dirty?"dirty":"",row.safetyLock?"safety-trip":"",breached?"carry-breach":""].filter(Boolean).join(" ");
    const out=rowOutputs(row);
    const unit=row.underlying;
    return `<tr class="${rowClass}" data-row-id="${row.id}">`
      +`<td class="f0"><input type="checkbox" data-action="toggle-row-bulk" data-row-id="${row.id}" aria-label="${etfName(row.etfId)} 일괄 선택" ${bulk?"checked":""}></td>`
      +`<td class="f1 main-cell clickable" data-action="select-row" data-row-id="${row.id}" title="${row.etfCode}, ${row.bookId}">${etfName(row.etfId)}</td>`
      +accountCell(row)
      +`<td data-lp-cell="auto" data-lp-sig="${autoSignature(row)}">${autoToggle(row)}</td>`
      +safetyCell(row)
      +changeCell(row)
      +`<td>${hedgeInstrumentCell(row)}</td><td>${rowSelect(row,"hedgePriceType",priceTypeOptions)}</td><td>${stagedToggle(row,"autoAmendBuy")}</td><td>${stagedToggle(row,"autoAmendSell")}</td><td>${rowSelect(row,"hedgeOrderMode",orderModeOptions,"w7")}</td>`
      +`<td>${rowNumber(row,"hedgeSliceQty",unit)}</td><td>${rowNumber(row,"hedgeBidOffsetBp","bp")}</td><td>${rowNumber(row,"hedgeAskOffsetBp","bp")}</td>`
      +netCell(row)
      +`<td>${rowNumber(row,"netHedgeThresholdBtc",unit)}</td><td>${rowNumber(row,"maxCarryBtc",unit)}</td>`
      +`<td data-lp-cell="carry"><div class="row-carry-cell"><span class="num ${breached?"positive-text":""}" data-lp-carry>${exposure.toFixed(2)} / ${row.params.maxCarryBtc.toFixed(1)}</span><div class="progress ${breached?"negative":"warning"}" data-lp-carry-bar style="--progress:${Math.min(100,exposure/row.params.maxCarryBtc*100)}%"><i></i></div></div></td>`
      +`<td>${rowNumber(row,"nettingWindowSeconds","초","1")}</td><td>${rowNumber(row,"rearmDelaySeconds","초","1")}</td>`
      +`<td>${rowSelect(row,"quoteSourceMode",quoteSourceOptions)}</td><td>${rowNumber(row,"inavBumpKrw","원","1")}</td><td>${rowNumber(row,"bidOffsetBp","bp")}</td><td>${rowNumber(row,"askOffsetBp","bp")}</td><td>${rowNumber(row,"dutySize","주","100")}</td>`
      +`<td class="align-right num lp-out" data-lp-cell="inav">${formatMoneyFromKrw(out.base)}</td><td class="align-right num lp-out positive-text" data-lp-cell="bid">${formatMoneyFromKrw(out.bid)}</td><td class="align-right num lp-out negative-text" data-lp-cell="ask">${formatMoneyFromKrw(out.ask)}</td>`
      +`<td>${rowNumber(row,"inavDivergenceStopBps","bp")}</td>`
      +["theoryJumpStopPct","preSpotStopPct","spotShiftStopPct","refShiftStopPct","gapShiftStopPct"].map(field=>`<td>${rowPercent(row,field)}</td>`).join("")
      +`<td>${rowNumber(row,"staleGuardSeconds","초","1")}</td>`
      +`<td class="num" data-lp-cell="lasthedge">${row.lastHedgeAt}</td>`
      +`</tr>`;
  }

  function rowGrid(){
    const rows=visibleRows();
    const emptyText=selectedBookIds().length?"선택 북에 ETF 행 없음":"선택된 ETF 북 없음";
    const body=rows.map(gridRow).join("")||`<tr><td colspan="${GRID_COLUMNS}" class="empty-note">${emptyText}</td></tr>`;
    return `<div class="lp-grid-wrap"><div class="table-scroll"><table class="data-table book-row-grid">${gridHead()}<tbody>${body}</tbody></table></div></div>`;
  }

  /* ---------- 선택 행 상세 패널 (그리드 아래 3개 탭) ---------- */

  function sideChip(side){return chip(side==="BUY"?"매수":"매도",side==="BUY"?"positive":"info",true);}

  function detailTable(head,body,foot=""){
    return `<div class="table-scroll"><table class="data-table lp-dtable"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
  }

  /* 거절은 벤더 응답이므로 취소와 다른 라벨을 쓴다. */
  function queueStatusLabel(item){
    if(item.status==="READY")return "실행 대기";
    if(item.status==="DONE")return "반영 완료";
    if(item.status==="REJECTED")return "거절";
    return "취소";
  }

  function queueStatusTone(item){
    if(item.status==="READY")return item.forced?"negative":"warning";
    return item.status==="DONE"?"positive":"negative";
  }

  function orderDetail(row){
    const items=queueItemsFor([row.id]);
    const pair=rowPair(row);
    const symbol=liveValue(row,"hedgeVenue")||`${row.underlying}/USD`;
    const head=['<th>시각</th><th>종목</th><th>방향</th>','<th class="align-right">수량</th><th class="align-right">가격</th>','<th>유형</th><th>상태</th>'].join("");
    const body=items.map(item=>{
      const record=state.orderRecords.find(entry=>entry.id===item.id);
      const marked=!record&&!Number.isFinite(item.price);
      const price=record?record.price:Number.isFinite(item.price)?item.price:pair?MP.pairMark(pair):null;
      const type=item.forced?"강제 헤지":hedgeReasonLabels[item.reason]||"넷 임계";
      const note=item.status==="REJECTED"&&item.rejectReason?`<small class="subcell">${item.rejectReason}</small>`:"";
      return `<tr><td class="num">${item.rejectedAt||item.executed||item.created}</td><td class="main-cell">${symbol}</td><td>${sideChip(item.side)}</td>`
        +`<td class="align-right num">${item.quantity.toFixed(4)} ${row.underlying}</td><td class="align-right num" ${marked?"data-lp-mark":""}>${usdPrice(price)}</td>`
        +`<td>${type}</td><td>${chip(queueStatusLabel(item),queueStatusTone(item))}${note}</td></tr>`;
    }).join("")||'<tr><td colspan="7" class="empty-note">이 행의 헤지 주문 없음</td></tr>';
    return detailTable(head,body);
  }

  function fillDetail(row){
    const fills=fillsFor([row.id]);
    const head=`<th>시각</th><th>시장</th><th>방향</th><th class="align-right">수량</th><th class="align-right">체결가</th><th class="align-right">${row.underlying} 환산</th><th class="align-right">수수료</th>`;
    let feeTotal=0;
    const body=fills.map(fill=>{
      const fee=Math.round(fill.shares*fill.price*krxFeeBps/10000);
      feeTotal+=fee;
      return `<tr><td class="num">${fill.time}</td><td>KRX</td><td>${sideChip(fill.side)}</td>`
        +`<td class="align-right num">${fill.shares.toLocaleString("ko-KR")}주</td><td class="align-right num">${formatMoneyFromKrw(fill.price)}</td>`
        +`<td class="align-right num ${fill.qty>=0?"positive-text":"negative-text"}">${signed(fill.qty)}</td>`
        +`<td class="align-right num">${formatMoneyFromKrw(fee)}</td></tr>`;
    }).join("")||'<tr><td colspan="7" class="empty-note">이 행의 체결 없음</td></tr>';
    const qtyTotal=fills.reduce((sum,fill)=>sum+fill.qty,0);
    const foot=fills.length?`<tfoot><tr><td colspan="3" class="main-cell">합계 ${fills.length}건, 수수료 ${krxFeeBps}bp</td><td class="align-right num">${fills.reduce((sum,fill)=>sum+fill.shares,0).toLocaleString("ko-KR")}주</td><td></td><td class="align-right num">${signed(Math.round(qtyTotal*10000)/10000)}</td><td class="align-right num">${formatMoneyFromKrw(feeTotal)}</td></tr></tfoot>`:"";
    return detailTable(head,body,foot);
  }

  /* 헤지 손익. KRX 체결 1건과 그 체결을 덮은 헤지 주문 1건을 짝지어 보여준다.
     헤지 수량은 주수를 그 ETF 의 cuShares 와 CU 당 기초자산 수량으로 환산한 값이고,
     캡처 bp = 마진 bp - 드래그 bp, 손익 = 캡처 bp * KRX 체결 금액이다. */
  function pairingDetail(row){
    const c=state.constants;
    const pair=rowPair(row);
    const received=state.pdfUploads[row.etfId];
    const cuShares=received?.cuShares||c.cuShares;
    const unitPerCu=received?.btcPerCu||c.btcPerCu;
    const items=state.pairingRows.filter(item=>item.rowId?item.rowId===row.id:item.bookId===row.bookId);
    const head=['<th>KRX 시각</th><th class="align-right">주수</th><th class="align-right">KRX 가격</th>','<th>헤지 시각</th><th class="align-right">헤지 수량</th><th class="align-right">헤지 가격</th>','<th class="align-right">마진</th><th class="align-right">드래그</th><th class="align-right">캡처</th><th class="align-right">손익</th>'].join("");
    let notionalTotal=0;
    let captureTotal=0;
    const body=items.map(item=>{
      const fill=state.lpFills.find(entry=>entry.id===item.krx);
      const order=state.lpHedgeQueue.find(entry=>entry.id===item.hedge);
      const record=state.orderRecords.find(entry=>entry.id===item.hedge);
      const krxPrice=fill?fill.price:c.krxInavKrw;
      const hedgeQty=record?record.quantity:order?order.quantity:item.shares/cuShares*unitPerCu;
      const hedgePrice=record?record.price:Number.isFinite(order?.price)?order.price:pair?MP.pairMark(pair):null;
      const marked=!record&&!Number.isFinite(order?.price);
      const captureBp=item.margin-item.drag;
      const notional=item.shares*krxPrice;
      const capture=Math.round(notional*captureBp/10000);
      notionalTotal+=notional;
      captureTotal+=capture;
      return `<tr><td class="num">${item.krxTime}</td><td class="align-right num">${item.shares.toLocaleString("ko-KR")}주</td><td class="align-right num">${formatMoneyFromKrw(krxPrice)}</td>`
        +`<td class="num">${item.hedgeTime}</td><td class="align-right num">${hedgeQty.toFixed(4)} ${row.underlying}</td><td class="align-right num" ${marked?"data-lp-mark":""}>${usdPrice(hedgePrice)}</td>`
        +`<td class="align-right num">${item.margin.toFixed(1)}bp</td><td class="align-right num negative-text">-${item.drag.toFixed(1)}bp</td>`
        +`<td class="align-right num positive-text">${captureBp.toFixed(1)}bp</td><td class="align-right num positive-text">${formatMoneyFromKrw(capture)}</td></tr>`;
    }).join("")||'<tr><td colspan="10" class="empty-note">이 행의 페어링 없음</td></tr>';
    const shares=items.reduce((sum,item)=>sum+item.shares,0);
    const weightedBp=notionalTotal?captureTotal/notionalTotal*10000:0;
    const foot=items.length?`<tfoot><tr><td class="main-cell">합계 ${items.length}건</td><td class="align-right num">${shares.toLocaleString("ko-KR")}주</td><td colspan="6"></td><td class="align-right num positive-text">${weightedBp.toFixed(1)}bp</td><td class="align-right num positive-text">${formatMoneyFromKrw(captureTotal)}</td></tr></tfoot>`:"";
    return detailTable(head,body,foot);
  }

  function detailTab(){return detailTabs.some(([key])=>key===state.lpDetailTab)?state.lpDetailTab:"orders";}

  function detailBody(row,active){
    return !row?'<div class="empty-note">표시할 행 없음</div>'
      :active==="fills"?fillDetail(row)
      :active==="pnl"?pairingDetail(row)
      :orderDetail(row);
  }

  /* 상세 패널은 행 집합이 아니라 건수와 상태가 바뀔 때만 다시 그린다. 마크 가격은 셀 훅으로 따로 갱신한다. */
  function detailSignature(row,active){
    if(!row)return `none|${active}`;
    const queue=queueItemsFor([row.id]);
    const fills=fillsFor([row.id]);
    const pairing=state.pairingRows.filter(item=>item.rowId?item.rowId===row.id:item.bookId===row.bookId);
    return [active,row.id,queue.length,queue.map(item=>item.status.slice(0,1)).join(""),fills.length,fills[0]?.id||"",pairing.length].join("|");
  }

  function detailPanel(){
    const row=selectedRow();
    const active=detailTab();
    const tabs=detailTabs.map(([key,label])=>`<button class="lp-dtab ${key===active?"on":""}" type="button" data-action="lp-detail-tab" data-tab="${key}" aria-pressed="${key===active}">${label}</button>`).join("");
    const label=row?`${etfName(row.etfId)} ${row.etfCode}, ${row.bookId}`:"선택된 행 없음";
    return `<div class="lp-detail"><div class="lp-detail-head">${tabs}<span class="sub">${label}</span></div><div class="lp-detail-body" data-lp-detail-sig="${detailSignature(row,active)}">${detailBody(row,active)}</div></div>`;
  }

  function renderLpDesk(){
    return `<section class="view lp-desk" data-view="lp-desk">${toolbar()}${rowGrid()}${detailPanel()}${feedFooter()}</section>`;
  }

  /* ---------- 틱 인플레이스 갱신 ----------
     주기 틱마다 화면 전체를 다시 그리면 그리드 가로 스크롤이 처음으로 돌아가고 편집 중인 입력이 사라진다.
     행 집합과 열 구성이 그대로면 아래 data 훅이 가리키는 셀만 값을 갈아끼우고,
     행이 늘거나 줄었을 때만 스크롤 위치를 보존한 전체 렌더로 넘어간다. */

  function gridScrollBox(){return document.querySelector(".lp-desk .lp-grid-wrap .table-scroll");}
  function detailScrollBox(){return document.querySelector(".lp-desk .lp-detail-body .table-scroll");}
  function editingRowInput(){return !!document.activeElement?.matches?.("[data-row-param], [data-lp-bulk-value], [data-desk-row-account]");}

  function lpFullRender(){
    const grid=gridScrollBox();
    const detail=detailScrollBox();
    const gridPos=grid?[grid.scrollLeft,grid.scrollTop]:null;
    const detailPos=detail?[detail.scrollLeft,detail.scrollTop]:null;
    MP.renderRoute("lp-desk",false);
    const nextGrid=gridScrollBox();
    if(nextGrid&&gridPos){nextGrid.scrollLeft=gridPos[0];nextGrid.scrollTop=gridPos[1];}
    const nextDetail=detailScrollBox();
    if(nextDetail&&detailPos){nextDetail.scrollLeft=detailPos[0];nextDetail.scrollTop=detailPos[1];}
  }

  function setText(node,text){if(node&&node.textContent!==text)node.textContent=text;}
  function setSigned(node,signature,html){
    if(!node||node.dataset.lpSig===signature)return;
    node.dataset.lpSig=signature;
    node.innerHTML=html;
  }

  function patchRow(tr,row){
    const exposure=Math.abs(row.netUnhedgedQty);
    const breached=exposure>row.params.maxCarryBtc;
    tr.classList.toggle("selected",row.id===state.lpRowSelected);
    tr.classList.toggle("dirty",!!row.dirty);
    tr.classList.toggle("safety-trip",!!row.safetyLock);
    tr.classList.toggle("carry-breach",breached);
    const netTd=tr.querySelector('[data-lp-cell="net"]');
    if(netTd){
      netTd.classList.toggle("positive-text",row.netUnhedgedQty>=0);
      netTd.classList.toggle("negative-text",row.netUnhedgedQty<0);
      setText(netTd.querySelector("[data-lp-net]"),signed(row.netUnhedgedQty));
    }
    const carry=tr.querySelector("[data-lp-carry]");
    if(carry){
      setText(carry,`${exposure.toFixed(2)} / ${row.params.maxCarryBtc.toFixed(1)}`);
      carry.classList.toggle("positive-text",breached);
    }
    const bar=tr.querySelector("[data-lp-carry-bar]");
    if(bar){
      bar.style.setProperty("--progress",`${Math.min(100,exposure/row.params.maxCarryBtc*100)}%`);
      bar.classList.toggle("negative",breached);
      bar.classList.toggle("warning",!breached);
    }
    const out=rowOutputs(row);
    setText(tr.querySelector('[data-lp-cell="inav"]'),formatMoneyFromKrw(out.base));
    setText(tr.querySelector('[data-lp-cell="bid"]'),formatMoneyFromKrw(out.bid));
    setText(tr.querySelector('[data-lp-cell="ask"]'),formatMoneyFromKrw(out.ask));
    setText(tr.querySelector('[data-lp-cell="lasthedge"]'),row.lastHedgeAt);
    setSigned(tr.querySelector('[data-lp-cell="auto"]'),autoSignature(row),autoToggle(row));
    setSigned(tr.querySelector('[data-lp-cell="safety"]'),safetySignature(row),safetyInner(row));
    setSigned(tr.querySelector('[data-lp-cell="change"]'),changeSignature(row),changeInner(row));
  }

  function patchFeedFooter(){
    const footer=document.querySelector(".lp-desk .lp-feed-footer");
    if(!footer)return;
    const feed=feedState();
    const divergence=feedDivergenceBp();
    setSigned(footer.querySelector('[data-lp-feed="state"]'),feed.label,chip(feed.label,feed.tone));
    setText(footer.querySelector('[data-lp-feed="delay"]'),`${state.lpAggregateDelayMs}ms`);
    const stale=footer.querySelector('[data-lp-feed="stale"]');
    if(stale){
      setText(stale,state.lpFeedStale?"STALE":"정상");
      stale.classList.toggle("negative-text",!!state.lpFeedStale);
    }
    setText(footer.querySelector('[data-lp-feed="sent"]'),state.lpFeedLastSent);
    setText(footer.querySelector('[data-lp-feed="seq"]'),state.lpFeedSequence.toLocaleString("ko-KR"));
    setText(footer.querySelector('[data-lp-feed="krxinav"]'),formatMoneyFromKrw(state.constants.krxInavKrw));
    setText(footer.querySelector('[data-lp-feed="divergence"]'),`${divergence>=0?"+":""}${divergence.toFixed(2)}bp`);
  }

  function patchDetail(){
    const host=document.querySelector(".lp-desk .lp-detail-body");
    if(!host)return;
    const row=selectedRow();
    const active=detailTab();
    const signature=detailSignature(row,active);
    if(host.dataset.lpDetailSig!==signature){
      const box=host.querySelector(".table-scroll");
      const position=box?[box.scrollLeft,box.scrollTop]:null;
      host.dataset.lpDetailSig=signature;
      host.innerHTML=detailBody(row,active);
      const next=host.querySelector(".table-scroll");
      if(next&&position){next.scrollLeft=position[0];next.scrollTop=position[1];}
      return;
    }
    if(!row)return;
    const pair=rowPair(row);
    const mark=pair?usdPrice(MP.pairMark(pair)):"-";
    host.querySelectorAll("[data-lp-mark]").forEach(node=>setText(node,mark));
  }

  /* 틱 갱신 진입점. 행이 늘거나 줄면 전체 렌더로 넘어가되 편집 중에는 건드리지 않는다. */
  function updateLpDeskDom(){
    const table=document.querySelector(".lp-desk .book-row-grid");
    if(!table)return;
    const rows=visibleRows();
    const trs=[...table.querySelectorAll("tbody tr[data-row-id]")];
    if(trs.length!==rows.length||trs.some((tr,index)=>tr.dataset.rowId!==rows[index].id)){
      if(!editingRowInput())lpFullRender();
      return;
    }
    trs.forEach((tr,index)=>patchRow(tr,rows[index]));
    patchDetail();
    patchFeedFooter();
  }

  /* ---------- popup windows ---------- */

  function windowFilterIds(key){
    const rows=visibleRows();
    const stored=state[key];
    if(!Array.isArray(stored))return rows.map(row=>row.id);
    return rows.filter(row=>stored.includes(row.id)).map(row=>row.id);
  }

  function windowRows(key){
    const ids=windowFilterIds(key);
    return visibleRows().filter(row=>ids.includes(row.id));
  }

  function windowFilter(key){
    const rows=visibleRows();
    const ids=windowFilterIds(key);
    const allMark=ids.length===0?"":ids.length===rows.length?"ck":"hf";
    const chips=rows.map(row=>{
      const on=ids.includes(row.id);
      return `<button class="lp-fchip ${on?"on":""}" type="button" data-action="lp-window-filter" data-filter-key="${key}" data-row-id="${row.id}" role="checkbox" aria-checked="${on}"><span class="lpsq ${on?"ck":""}"></span>${etfName(row.etfId)} ${row.etfCode}</button>`;
    }).join("")||'<span class="lp-static">선택된 북이 없어 표시할 ETF 없음</span>';
    return `<div class="lp-winfilter"><span class="lab">ETF 필터</span><button class="lp-fchip" type="button" data-action="lp-window-filter-all" data-filter-key="${key}" role="checkbox" aria-checked="${ids.length===rows.length&&rows.length>0}"><span class="lpsq ${allMark}"></span>전체</button>${chips}<div class="fnote">데스크 그리드의 행 체크와 무관하게 이 창에서 따로 고름. 체결 창과 헤지 큐 창은 필터를 공유하지 않음</div></div>`;
  }

  function windowBookLabel(){
    const selection=selectedBookIds();
    return selection.map(id=>bookById(id)?.name||id).join(", ")||"선택 북 없음";
  }

  function windowBar(title,tailChip){
    return `<div class="lp-win-bar"><span class="t">${title}</span><span class="sub">${windowBookLabel()}</span>${tailChip}<span class="btns">${btn("닫기","close-lp-window","small ghost")}</span></div>`;
  }

  function renderLpFillsWindow(){
    const feed=feedState();
    const rows=windowRows("lpFillsFilter");
    const ids=rows.map(row=>row.id);
    const fills=fillsFor(ids);
    const units=[...new Set(rows.map(row=>row.underlying))];
    const effectLabel=units.length===1?`${units[0]} 효과`:"기초자산 효과";
    const exposure=rows.reduce((sum,row)=>sum+Math.abs(row.netUnhedgedQty),0);
    const cap=rows.reduce((sum,row)=>sum+row.params.maxCarryBtc,0);
    const capLabel=units.length===1?`${cap.toFixed(1)} ${units[0]}`:cap.toFixed(1);
    const body=fills.map(fill=>{
      const row=state.lpBookRows.find(item=>item.id===fill.rowId);
      return `<tr class="hl"><td class="main-cell">${fill.id}</td><td class="num">${fill.time}</td><td>${etfName(row?.etfId)}<small class="subcell num">${row?.etfCode||""}</small></td><td>${chip(`ETF ${fill.side==="BUY"?"매수":"매도"}`,fill.side==="BUY"?"positive":"info",true)}</td><td class="align-right num">${fill.shares.toLocaleString("ko-KR")}주</td><td class="align-right num">${formatMoneyFromKrw(fill.price)}</td><td class="align-right num ${fill.qty>=0?"positive-text":"negative-text"}">${signed(fill.qty)}</td></tr>`;
    }).join("")||'<tr><td colspan="7" class="empty-note">필터에 걸린 체결 없음</td></tr>';
    const gauge=`<div class="exposure-gauge"><div><label>필터 합계 누적 미헤지</label><strong class="num positive-text">${underlyingTotals(rows)}</strong></div><div><span>최대 캐리 한도 합계</span><b class="num">${capLabel}</b>${progress(cap?Math.min(100,exposure/cap*100):0,exposure>cap?"negative":"warning")}</div></div>`;
    const table=`<div class="table-scroll"><table class="data-table"><thead><tr><th>KRX 체결 ID</th><th>시각</th><th>ETF</th><th>방향</th><th class="align-right">수량</th><th class="align-right">체결가</th><th class="align-right">${effectLabel}</th></tr></thead><tbody>${body}</tbody></table></div>`;
    return `<section class="view lp-window" data-view="lp-fills-window"><div class="lp-win">${windowBar("KRX ETF 라이브 체결",chip(feed.label,feed.tone))}<div class="lp-win-body">${windowFilter("lpFillsFilter")}${gauge}${table}<div class="lp-win-note">창을 닫아도 데스크의 잔량 열은 계속 갱신됨</div></div></div></section>`;
  }

  function renderLpQueueWindow(){
    const rows=windowRows("lpQueueFilter");
    const ids=rows.map(row=>row.id);
    const queue=queueItemsFor(ids);
    const ready=queue.filter(item=>item.status==="READY");
    const reasonLabels={"per-fill":"체결 건별",threshold:"넷 임계",window:"임계 미달 잔량 시간창","max-carry":"강제 헤지"};
    const thresholds=[...new Set(rows.map(row=>row.params.netHedgeThresholdBtc))].sort((a,b)=>a-b);
    const units=[...new Set(rows.map(row=>row.underlying))];
    const thresholdLabel=thresholds.length===0?"선택 행 없음":thresholds.length===1?`절대 잔량 ${thresholds[0].toFixed(1)} ${units[0]} 이상`:`행별 임계 ${thresholds[0].toFixed(1)} to ${thresholds[thresholds.length-1].toFixed(1)}`;
    const windows=[...new Set(rows.map(row=>row.params.nettingWindowSeconds))].sort((a,b)=>a-b);
    const windowLabel=windows.length===1?`${windows[0]}초`:windows.length?`${windows[0]}초 to ${windows[windows.length-1]}초`:"미설정";
    const cards=rows.map(row=>{
      const items=queue.filter(item=>item.rowId===row.id);
      if(!items.length){
        if(!row.safetyLock)return "";
        return `<article class="hedge-candidate"><div><span>${etfName(row.etfId)} ${row.etfCode}</span><strong class="num">후보 없음</strong><small title="${row.safetyLock}${row.safetyTrippedAt?` ${row.safetyTrippedAt}`:""}">세이프티 LOCK 으로 신규 후보 생성 정지, 자동 헤지 ON 을 누르면 해제와 가동이 함께 이루어짐</small></div><div>${chip("LOCK","negative")}</div></article>`;
      }
      return items.map(item=>{
        const statusLabel=queueStatusLabel(item);
        const statusTone=queueStatusTone(item);
        const auto=row.autohedge;
        const action=item.status==="READY"&&!auto
          ?MP.settingControl("exec","securities",btn(item.forced?"강제 헤지 실행":"헤지 실행","execute-hedge",`small ${item.forced?"danger":"primary"}`,"arrow",`data-id="${item.id}"`),"")
          :"";
        return `<article class="hedge-candidate ${item.forced?"forced":""}"><div><span>${item.id}, ${etfName(row.etfId)} ${row.etfCode}${item.forced?' <b class="forced-label">강제 헤지</b>':""}</span><strong class="${item.side==="BUY"?"positive-text":"negative-text"}">${item.side} ${item.quantity.toFixed(4)} ${row.underlying}</strong><small>생성 ${item.created}, ${reasonLabels[item.reason]||"넷 임계"}${auto?", 자동 헤지 ON이라 자동 전송":""}</small></div><div>${chip(statusLabel,statusTone)}${action}</div></article>`;
      }).join("");
    }).join("")||'<div class="empty-note">헤지 후보 없음, 체결 누적 대기</div>';
    const policy=`<div class="queue-policy"><span>현재 생성 규칙</span><b>${thresholdLabel}</b><small>임계 미달 잔량은 ${windowLabel} 시간창 적용, 최대 캐리 초과 시 강제 후보로 승격되고 해당 행 호가가 정지됨</small></div>`;
    const flow=panel("헤지 반영 경로",
      `<div class="state-flow compact-flow"><div class="state-step complete">KRX 체결</div><div class="state-step ${rows.some(row=>Math.abs(row.netUnhedgedQty)>=row.params.netHedgeThresholdBtc)?"complete":"current"}">정책 감지</div><div class="state-step ${ready.length?"current":""}">후보 생성</div><div class="state-step ${queue.some(item=>item.status==="DONE")?"complete":""}">Trade 반영</div></div>`,
      {flush:true});
    return `<section class="view lp-window" data-view="lp-queue-window"><div class="lp-win">${windowBar("자동 헤지 큐",chip(`${ready.length} READY`,"warning"))}<div class="lp-win-body">${windowFilter("lpQueueFilter")}${policy}<div class="hedge-queue">${cards}</div>${flow}<div class="lp-win-note">LP 시스템 피드 패널은 어느 창에도 없음, 산출값 3개는 데스크 행 열로 흡수했고 전송 상태 1줄만 북 스트립에 남김</div></div></div></section>`;
  }

  Object.assign(MP,{renderLpDesk,renderLpFillsWindow,renderLpQueueWindow,updateLpDeskDom,lpFullRender,lpAutohedgeBlock:autohedgeBlock,lpSelectedBookIds:selectedBookIds,lpVisibleRows:visibleRows,lpRowOutputs:rowOutputs,lpSelectedRow:selectedRow,lpOrderDetail:orderDetail,lpFillDetail:fillDetail,lpPairingDetail:pairingDetail});
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/client-portal.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,progress,formatMoneyFromKrw,formatLiteralMoney,dualValue} = MP;

  const stageOrder = ["접수","견적 확정","집행 중","결제 대기","완료"];

  function unitMoneyFromKrw(value) {
    const usd=MP.displayCurrency()==="USD";
    const converted=usd?value/state.constants.usdKrw:value;
    return `${usd?"$":"₩"}${converted.toLocaleString(usd?"en-US":"ko-KR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  }

  function portalCompany() {
    return MP.portalClient()||state.clients[0];
  }

  function portalOrder() {
    return state.clientOrders.find(order=>order.id===state.clientPortal.orderId)||state.clientOrders[0];
  }

  function liveExecution() {
    return state.clientPortal.quoteApproved||state.clientPortal.algoInstructed;
  }

  function ticketPanel(company,etf) {
    const portal=state.clientPortal;
    const constants=state.constants;
    const canExec=MP.canControl("exec","client");
    const lock=canExec?"":"disabled";
    const custodian=company.custodyVendors[0]||"미지정";
    const kinds=[["ETF 블록","ETF 블록"],["코인 세그먼트","코인 세그먼트"]];
    const side=`<div class="portal-side-toggle"><button type="button" class="${portal.side==="creation"?"active creation":""}" data-action="client-side" data-side="creation" ${lock}>매수</button><button type="button" class="${portal.side==="redemption"?"active redemption":""}" data-action="client-side" data-side="redemption" ${lock}>매도</button></div>`;
    const fields=`<div class="field-grid">
      <div class="field"><label>주문 종류</label><select data-client-order-kind ${lock}>${kinds.map(([value,label])=>`<option value="${value}" ${portal.orderKind===value?"selected":""}>${label}</option>`).join("")}</select></div>
      <div class="field"><label>종목</label><input value="${etf.name} (${etf.code})" readonly></div>
      <div class="field"><label>주문 단위</label><input value="${portal.cu} CU, 1 CU = ${constants.cuShares.toLocaleString("ko-KR")}주" readonly></div>
      <div class="field"><label>주문 수량</label><div class="input-suffix"><input class="num" value="${portal.shares.toLocaleString("ko-KR")}" readonly><span>주</span></div></div>
      <div class="field"><label>명목, 마크업 전</label><input class="num" value="${formatMoneyFromKrw(portal.amountKrw)}" readonly></div>
      <div class="field"><label>결제</label><input value="KSD 계좌 대체 인도" readonly><small class="field-note">코인 레그 화이트리스트 ${custodian}</small></div>
    </div>`;
    const note=`<p class="order-mode-note">ETF 블록 주문의 인도는 ETF 좌수의 KSD 계좌 대체이며 코인 인도가 아님. 기초자산 ${portal.btc.toFixed(4)} BTC 분해는 프라임 내부 레그.</p>`;
    const actions=`<div class="portal-ticket-actions">${btn(portal.submitted?"접수 내용 갱신":"주문 접수","client-submit","block primary","arrow",lock)}${btn("초기화","client-reset","ghost","refresh",lock)}</div>`;
    return `${side}${fields}${note}${actions}`;
  }

  function rfqTabBody(company,etf) {
    const portal=state.clientPortal;
    const quote=MP.getClientCuQuote();
    const master=MP.canControl("exec","client")&&state.role==="client-master";
    const ttl=`00:${String(Math.max(0,portal.quoteTtl)).padStart(2,"0")}`;
    const fxText=quote.usdKrw.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    const lines=`<div class="client-quote-breakdown">
      <div class="client-quote-line"><div><span>기초자산 상당액, 1 CU</span><small><i class="status-dot info"></i>${state.constants.btcPerCu} ${etf.underlying} x 벤더 베스트 올인가 ${formatLiteralMoney(quote.vendorBestAllInUsd,"USD")} x USD/KRW ${fxText}</small></div><strong class="num">${formatMoneyFromKrw(quote.underlyingPerCuKrw)}</strong></div>
      <div class="client-quote-line"><div><span>현금 정산분, 1 CU</span><small>ETF PDF 추정현금 기준</small></div><strong class="num">${formatMoneyFromKrw(quote.cashPerCuKrw)}</strong></div>
      <div class="client-quote-line"><div><span>Meritz 마크업 ${quote.feeBps}bp</span><small>기초자산 상당액 기준, 현금 정산분 제외</small></div><strong class="num positive-text">+${formatMoneyFromKrw(quote.markupPerCuKrw)}</strong></div>
      <div class="client-quote-line final"><div><span>CU 제시가</span><small>1 CU = ${quote.cuShares.toLocaleString("ko-KR")}주, 주당 ${unitMoneyFromKrw(quote.perShareKrw)}</small></div><strong class="num">${formatMoneyFromKrw(quote.cuPriceKrw)}</strong></div>
    </div>
    <div class="client-quote-total"><span>${quote.cu} CU 총액</span><strong class="num">${formatMoneyFromKrw(quote.totalKrw)}</strong></div>
    <div class="client-quote-total"><span>명목, 마크업 전</span><strong class="num">${formatMoneyFromKrw(quote.notionalKrw)}</strong></div>
    <div class="quote-validity"><span><i class="status-dot ${portal.quoteTtl>0?"positive":"warning"}"></i>유효 시간</span><strong class="num client-quote-ttl">${ttl}</strong></div>`;
    if(portal.quoteApproved)return `${lines}<div class="approved-line">${chip("CU 단가 수락","positive")}<span>수락 시점 CU 단가 고정, 프라임 집행 대기열 연결</span></div>`;
    const disabled=!master||!portal.submitted||portal.quoteTtl<=0;
    const roleNote=state.role==="client-trader"?'<div class="permission-note">마스터 승인 필요</div>':MP.resolveRole(state.role)==="client-accounting"?'<div class="permission-note">관리회계 역할은 단가를 수락할 수 없음</div>':"";
    const actions=`<div class="portal-ticket-actions">${btn("CU 단가 수락","client-approve","block success","check",disabled?"disabled":"")}${btn("재견적 요청","client-requote","","refresh",MP.canControl("exec","client")?"":"disabled")}</div>${roleNote}`;
    return `${lines}${actions}`;
  }

  function algoTabBody() {
    const portal=state.clientPortal;
    const feeBps=MP.portalFeeBps();
    const feeKrw=Math.round(portal.amountKrw*feeBps/10000);
    const master=MP.canControl("exec","client")&&state.role==="client-master";
    const costs=`<div class="kv-grid">
      <div class="kv"><label>집행 수수료</label><strong class="num">${feeBps}bp</strong></div>
      <div class="kv"><label>수수료 금액</label><strong class="num">${formatMoneyFromKrw(feeKrw)}</strong></div>
      <div class="kv"><label>부과 기준</label><strong>명목 ${formatMoneyFromKrw(portal.amountKrw)}, 마크업 전</strong></div>
      <div class="kv"><label>벤더 수수료</label><strong>체결 시 실비 전가</strong></div>
    </div>`;
    const roleNote=state.role==="client-trader"?'<div class="permission-note">마스터 승인 필요</div>':MP.resolveRole(state.role)==="client-accounting"?'<div class="permission-note">관리회계 역할은 집행을 지시할 수 없음</div>':"";
    const action=portal.algoInstructed
      ?`<div class="approved-line">${chip("알고 집행 지시","positive")}<span>접수 시점 파라미터로 집행 진행</span></div>`
      :`${btn("알고 집행 지시","client-algo-execute","block primary","arrow",master&&portal.submitted?"":"disabled")}${roleNote}`;
    return `${costs}${action}`;
  }

  function orderModePanel(company,etf) {
    const portal=state.clientPortal;
    const tabs=MP.renderOrderModeTabs({
      mode:portal.orderMode,
      modes:company.modes,
      action:"client-order-mode",
      editable:MP.canControl("exec","client"),
      surface:"client",
      rfqBody:rfqTabBody(company,etf),
      algoBody:algoTabBody(),
      rfqNotes:["CU 단가 확정이므로 수락 시 그 단가로 좌수가 인도되며 프라임의 벤더 체결가와 무관"],
      algoNotes:[
        "체결은 고객 귀속이며 복제 픽싱 대비 이탈과 미체결 잔량은 고객 부담",
        "복제 픽싱은 윈도 진행 중 구간 중앙값으로 실시간 산출되며 사전 고정값 아님"
      ]
    });
    return panel("견적과 집행",tabs,{});
  }

  function progressPanel(order) {
    const portal=state.clientPortal;
    const live=liveExecution();
    const livePercent=state.executionTarget>0?Math.min(100,state.executionFilled/state.executionTarget*100):0;
    const percent=live?livePercent:order.progressPercent;
    const filledBtc=live?state.executionFilled:order.quantityBtc*order.progressPercent/100;
    let current=Math.max(0,stageOrder.indexOf(order.stage));
    if(live)current=percent>0?2:1;
    if(portal.settlementPending||percent>=100)current=3;
    if(portal.complete)current=4;
    const stageLabel=stageOrder[current];
    const pricing=MP.getClientPricing();
    const costPriceUsd=portal.lockedPricing?.finalPriceUsd??pricing.finalPriceUsd;
    const filled=dualValue({quantity:filledBtc,unit:"BTC",costPrice:costPriceUsd,markPrice:state.tradePrice,currency:state.displayCurrency,variant:"kv",markKey:"tradePrice"});
    const flow=`<div class="portal-progress"><div class="state-flow">${stageOrder.map((label,index)=>`<div class="state-step ${index<current?"complete":index===current?"current":""}">${label}</div>`).join("")}</div><div class="portal-progress-meter"><span>진행률</span><strong class="num">${percent.toFixed(1)}%</strong>${progress(percent,percent>=100?"positive":"info")}</div><div class="portal-filled-balance"><span>체결 수량 / 금액</span>${filled}</div></div>`;
    const facts=`<div class="kv-grid"><div class="kv"><label>주문</label><strong class="num">${order.id}</strong></div><div class="kv"><label>단계</label><strong>${stageLabel}</strong></div><div class="kv"><label>인도 예정</label><strong>${order.delivery}</strong></div><div class="kv"><label>결제일</label><strong class="num">${order.settlementDate}</strong></div></div>`;
    const completion=portal.complete
      ?`<div class="portal-complete"><span class="alert-icon info">R</span><div><strong>블록 주문 집행 완료</strong><small>${order.mode==="알고"?"확정 픽싱과 구간별 이탈을 포함한 TCA 증빙":"벤더 호가 캡처와 단일가 산출을 포함한 RFQ 증빙"}</small></div>${btn(order.mode==="알고"?"TCA 증빙 다운로드":"증빙 리포트 다운로드","client-evidence","small","download",MP.canControl("exec","client")?"":"disabled")}</div>`
      :`<div class="portal-next"><span class="status-dot info"></span><div><strong>${live?"프라임 집행 상태 연동":"충족은 프라임 운영 큐가 처리"}</strong><small>내부 집행과 결제 상태를 자동 반영</small></div></div>`;
    return `${flow}${facts}${completion}`;
  }

  function executionMonitorPanel() {
    const portal=state.clientPortal;
    const order=portalOrder();
    const algoMode=order?.mode==="알고"||portal.orderMode==="algo"||portal.algoInstructed;
    if(!algoMode)return "";
    if(typeof MP.renderExecutionMonitor!=="function")return "";
    return MP.renderExecutionMonitor({surface:"client"});
  }

  /* 보류 화면 (D-0910-10). 접수부는 고객 트레이드 티켓의 ETF 블록 주문 종류로, 진행 상태와
     충족 3단은 트레이드 주문 탭으로, 계정 조건과 서브 사용자와 관리회계 내보내기는 계정으로,
     거래당 상한은 리스크로, 명세는 손익으로 갔다. 라우트는 전 역할 X이고 렌더러만 남긴다. */
  function renderClientPortal() {
    const company=portalCompany();
    const order=portalOrder();
    const etf=state.etfs.find(item=>item.id===state.clientPortal.etfId)||state.etfs[0];
    const activeUser=company.users.find(user=>user.role===state.role)||company.users[0];
    const walletIds=state.wallets.filter(wallet=>wallet.clientId===company.id).map(wallet=>wallet.id);
    const header=`<header class="client-view-header"><div><h2>${company.name}</h2><p>${company.id} ${chip(`${company.name} (${company.category})`,"info")} ${chip(`요율 ${company.feeBps}bp`,"violet")}</p></div><div class="client-account-meta"><span class="account-state"><i class="status-dot positive"></i>계정 정상</span><strong>${activeUser.name}</strong><small>${walletIds.join(" / ")}</small></div></header>`;
    const split=`<div class="grid split-5-7"><div class="stack">${panel("주문 접수",ticketPanel(company,etf),{})}</div><div class="stack">${orderModePanel(company,etf)}${panel("진행 상태",progressPanel(order),{flush:true})}${executionMonitorPanel()}</div></div>`;
    return `<section class="view client-portal-view" data-view="client-portal">${header}${split}</section>`;
  }

  MP.renderClientPortal = renderClientPortal;
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/prime-queue.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,formatMoneyFromKrw} = MP;

  const queueRuleText = "고객사 ETF 블록 주문의 충족은 메리츠 증권 내부 설정 및 환매, 프라임 Quantizer, 고객 ETF 인도 3단으로 구성되며 전부 본 큐 소관이고 증권 데스크 티켓에는 비노출. 메리츠 증권도 내부 고객으로 같은 큐에 적재.";
  const queueFootnote = "각 충족 단계는 수동 릴레이로 진행되고 같은 형식으로 감사 기록됨. 메리츠 증권 주문은 내부 고객 건으로 Prime 손익에 내부 대체로 계상되고 데스크 측에서는 AP 손익 귀속의 Prime 내부 대체가 됨.";

  function queueClient(order) {
    return state.clients.find(item=>item.id===order.clientId)||null;
  }

  function queueClientName(order) {
    const client=queueClient(order);
    return client?client.name:order.clientId;
  }

  function statusTone(text) {
    const label=String(text||"");
    if(label.startsWith("완료")||label.startsWith("내부 상계"))return "positive";
    if(label.startsWith("집행 중")||label.startsWith("진행"))return "info";
    if(label.startsWith("견적 제시")||label.startsWith("대기"))return "warning";
    return "muted";
  }

  function fulfilmentLegs(order) {
    return Array.isArray(order.fulfilment)?order.fulfilment:[];
  }

  function pendingLeg(order) {
    return fulfilmentLegs(order).find(leg=>leg.status==="대기")||null;
  }

  function activeLeg(order) {
    return fulfilmentLegs(order).find(leg=>leg.status==="진행 중")||null;
  }

  function settledRow(order) {
    return order.stage==="완료"||(order.stage==="내부 상계"&&order.progressPercent>=100);
  }

  function recomputeQueueStatus(order) {
    const legs=fulfilmentLegs(order);
    if(!legs.length)return order;
    if(legs.every(leg=>leg.status==="완료")){
      order.stage="완료";
      order.progressPercent=100;
      order.statusLabel="완료";
      return order;
    }
    const active=activeLeg(order);
    if(active&&Number.isFinite(active.progressPercent))order.progressPercent=active.progressPercent;
    order.statusLabel=`${order.stage} ${order.progressPercent}%`;
    return order;
  }

  function relayQueueOrder(order) {
    if(!order)return null;
    const leg=pendingLeg(order);
    if(!leg)return null;
    const stamp=MP.currentTimestamp().slice(0,8);
    leg.status="완료";
    leg.time=stamp;
    order.time=stamp;
    recomputeQueueStatus(order);
    return leg;
  }

  function legNote(leg) {
    if(leg.exposure)return leg.exposure;
    return [
      leg.window?`윈도 ${leg.window}`:"",
      leg.routing||"",
      leg.check||"",
      leg.settlementDate?`결제일 ${leg.settlementDate}`:""
    ].filter(Boolean).join(", ");
  }

  function monitorButton(order) {
    return btn("모니터","queue-monitor","small ghost","arrow",`data-order="${order.id}"`);
  }

  function rowAction(order) {
    if(pendingLeg(order)){
      const allowed=MP.canControl("exec","biz-admin");
      const attrs=`data-order="${order.id}"${allowed?"":' disabled title="수동 릴레이는 비즈니스 관리자 소관"'}`;
      return btn("수동 릴레이","queue-relay","small primary","arrow",attrs);
    }
    if(activeLeg(order))return monitorButton(order);
    if(settledRow(order))return btn("증빙","queue-evidence","small ghost","download",`data-order="${order.id}"`);
    return '<span class="muted-cell">해당 없음</span>';
  }

  function orderRow(order) {
    const client=queueClient(order);
    const internalNote=client?.internal?'<small class="subcell">당사 내부</small>':"";
    const sideClass=order.side==="매수"?"positive-text":"negative-text";
    return `<tr class="queue-order-row">
      <td class="main-cell"><strong class="num">${order.id}</strong><small class="subcell num">${order.time}</small></td>
      <td class="main-cell">${queueClientName(order)}${internalNote}</td>
      <td>${client?client.category:"미상"}</td>
      <td>${chip(order.mode,order.mode==="알고"?"violet":"info")}</td>
      <td class="align-right num">${order.feeBps.toFixed(1)}bp</td>
      <td class="main-cell"><strong class="${sideClass}">${order.summary}</strong><small class="subcell">${order.summaryNote}</small></td>
      <td class="align-right num">${formatMoneyFromKrw(order.notionalKrw)}</td>
      <td>${order.fulfilRoute}</td>
      <td>${chip(order.statusLabel,statusTone(order.statusLabel))}</td>
      <td>${rowAction(order)}</td>
    </tr>`;
  }

  function legRow(order,leg,index) {
    const stepLabel=`${Number.isFinite(leg.step)?leg.step:index+1}단 ${leg.label}`;
    const reference=leg.reference?`<small class="subcell num">${leg.reference}</small>`:"";
    const note=legNote(leg);
    const statusText=leg.status==="진행 중"&&Number.isFinite(leg.progressPercent)?`${leg.status} ${leg.progressPercent}%`:leg.status;
    const time=leg.time?`<small class="subcell num">${leg.time}</small>`:"";
    const action=leg.status==="진행 중"?monitorButton(order):'<span class="muted-cell">해당 없음</span>';
    return `<tr class="sub queue-leg-row" data-queue-leg="${order.id}">
      <td class="queue-leg-step">${stepLabel}</td>
      <td colspan="3">${leg.target}${reference}</td>
      <td class="align-right num">${leg.quantity||"해당 없음"}</td>
      <td colspan="4">${note||"해당 없음"}</td>
      <td>${chip(statusText,statusTone(leg.status))}${time}</td>
      <td>${action}</td>
    </tr>`;
  }

  function queueTable() {
    const body=state.clientOrders.map(order=>{
      const legs=fulfilmentLegs(order).map((leg,index)=>legRow(order,leg,index)).join("");
      return `${orderRow(order)}${legs}`;
    }).join("");
    const head=`<thead><tr><th>주문</th><th>고객</th><th>카테고리</th><th>모드</th><th class="align-right">요율</th><th>주문 내용</th><th class="align-right">명목, 마크업 전</th><th>충족 경로</th><th>상태</th><th>작업</th></tr></thead>`;
    return `<div class="table-scroll"><table class="data-table prime-queue-table">${head}<tbody>${body}</tbody></table></div>`;
  }

  function queuePanel() {
    const rule=`<div class="queue-rule-box"><span class="status-dot info"></span><p>${queueRuleText}</p></div>`;
    return panel("운영 큐",`${rule}${queueTable()}`,{flush:true,footer:`<span>${queueFootnote}</span>`});
  }

  function renderPrimeQueue() {
    return `<section class="view prime-queue-view" data-view="prime-queue">${queuePanel()}</section>`;
  }

  Object.assign(MP,{renderPrimeQueue,relayQueueOrder,recomputeQueueStatus,queueClientName});
})(window.MP = window.MP || {});

  <script data-source="js/screens/prime-quotes.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,formatLiteralMoney,formatMoneyFromKrw} = MP;

  function quoteClient() {
    return state.clients.find(item=>item.id===state.primeQuote.clientId)||null;
  }

  function primeQuotePricing() {
    const quote=state.primeQuote;
    const client=quoteClient();
    const markupBps=Number.isFinite(client?.feeBps)?client.feeBps:0;
    const best=MP.bestVendorQuote();
    const bestAllInUsd=best?best.allIn:state.constants.vendorBestAllInUsd;
    const markupUsd=MP.roundCents(bestAllInUsd*markupBps/10000);
    const clientPriceUsd=MP.roundCents(bestAllInUsd+markupUsd);
    const totalUsd=MP.roundCents(clientPriceUsd*quote.quantityBtc);
    const preMarkupNotionalKrw=quote.quantityBtc*state.constants.btcFixingUsd*quote.usdKrw;
    return {
      client,
      markupBps,
      best,
      bestAllInUsd,
      markupUsd,
      clientPriceUsd,
      totalUsd,
      preMarkupNotionalKrw,
      totalKrw:Math.round(totalUsd*quote.usdKrw),
      relayMarginKrw:Math.round(preMarkupNotionalKrw*markupBps/10000),
      quantityBtc:quote.quantityBtc,
      usdKrw:quote.usdKrw
    };
  }

  function anonymiseToggle() {
    const on=state.vendorAnonymised;
    const editable=`<button class="switch ${on?"on":""}" type="button" data-action="prime-quote-anonymise" aria-label="벤더 익명화" aria-pressed="${on}"></button>`;
    const readonly=chip(on?"익명화 ON":"익명화 OFF",on?"violet":"muted");
    return `<div class="prime-quote-toggle"><span>벤더 익명화</span>${MP.settingControl("ops","prime",editable,readonly)}<small>${on?"고객 사본 표기":"프라임 내부 실명"}</small></div>`;
  }

  function header(pricing) {
    const quote=state.primeQuote;
    const clientName=pricing.client?pricing.client.name:quote.clientId;
    return `<div class="prime-quote-header"><div><h2>${quote.orderId}</h2><p>${clientName}, ${quote.asset} ${quote.side} ${MP.formatTradeSize(quote.quantityBtc)}</p></div><div class="prime-quote-header-right">${chip(`증빙 캡처됨 ${MP.latestVendorQuoteTime()}`,"info")}${anonymiseToggle()}</div></div>`;
  }

  function vendorCell(vendor,isBest) {
    const marks=`${isBest?chip("BEST","positive"):""}${vendor.excluded?chip("고객 제외 베뉴","warning"):""}`;
    return `<td class="main-cell vendor-cell"><strong>${MP.vendorDisplayName(vendor)}${marks}</strong><small class="subcell">${MP.vendorDisplayCustodian(vendor)}</small></td>`;
  }

  function vendorTable(pricing) {
    const bestId=pricing.best?pricing.best.id:null;
    const rows=state.vendorQuotes.map(vendor=>{
      const isBest=vendor.id===bestId;
      const markup=vendor.excluded?'<span class="muted-cell">제외</span>':isBest?`<b class="num positive-text">${formatLiteralMoney(pricing.markupUsd,"USD",{showPlus:true})}</b>`:'<span class="muted-cell">미적용</span>';
      const clientPrice=vendor.excluded?'<span class="muted-cell">제외</span>':isBest?`<b class="num">${formatLiteralMoney(pricing.clientPriceUsd,"USD")}</b>`:'<span class="muted-cell">미적용</span>';
      return `<tr class="${isBest?"best-row":""}${vendor.excluded?" excluded-row":""}">${vendorCell(vendor,isBest)}<td class="align-right num">${formatLiteralMoney(vendor.raw,"USD")}</td><td class="align-right num">${vendor.feeBps.toFixed(1)}bp</td><td class="align-right num">${formatLiteralMoney(vendor.allIn,"USD")}</td><td class="align-right">${markup}</td><td class="align-right">${clientPrice}</td><td class="align-right num">${vendor.receivedAt}</td></tr>`;
    }).join("");
    const table=`<div class="table-scroll"><table class="data-table"><thead><tr><th>벤더</th><th class="align-right">Raw</th><th class="align-right">벤더 수수료</th><th class="align-right">올인가</th><th class="align-right">Meritz 마크업</th><th class="align-right">고객 제시가</th><th class="align-right">수신 시각</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    const basis=`<div class="evidence-summary prime-quote-basis"><span class="status-dot positive"></span><p>선택 근거<strong class="num">베스트 올인가 ${formatLiteralMoney(pricing.bestAllInUsd,"USD")}</strong> to <strong class="num">마크업 ${formatLiteralMoney(pricing.markupUsd,"USD",{showPlus:true})}</strong> to <strong class="num">고객 제시가 ${formatLiteralMoney(pricing.clientPriceUsd,"USD")}</strong>, 수량 ${MP.formatTradeSize(pricing.quantityBtc)} ${state.primeQuote.asset}</p></div>`;
    return `${basis}${table}`;
  }

  function pricingPanel(pricing) {
    const quote=state.primeQuote;
    const line=(label,note,value,sub="",className="")=>`<div class="client-quote-line ${className}"><div><span>${label}</span>${note?`<small>${note}</small>`:""}</div><strong class="num">${value}${sub?`<small>${sub}</small>`:""}</strong></div>`;
    return `<div class="client-quote-breakdown">
      ${line("마크업 전 명목",`${MP.formatTradeSize(pricing.quantityBtc)} ${quote.asset}, 기준가 ${formatLiteralMoney(state.constants.btcFixingUsd,"USD")} 환산`,formatMoneyFromKrw(pricing.preMarkupNotionalKrw))}
      ${line("베스트 올인가","벤더 견적 최저 올인가",formatLiteralMoney(pricing.bestAllInUsd,"USD"))}
      ${line("Meritz 마크업",`${pricing.markupBps.toFixed(1)}bp, 올인가 x 요율`,formatLiteralMoney(pricing.markupUsd,"USD",{showPlus:true}))}
      ${line("고객 제시가","베스트 올인가 + 마크업",formatLiteralMoney(pricing.clientPriceUsd,"USD"),"","final")}
      ${line("주문 총액",`제시가 x ${MP.formatTradeSize(pricing.quantityBtc)}`,formatLiteralMoney(pricing.totalUsd,"USD"))}
      ${line("원화 환산",`총액 x USD/KRW ${pricing.usdKrw.toLocaleString("ko-KR")}`,formatMoneyFromKrw(pricing.totalKrw))}
      ${line("릴레이 마진",`${pricing.markupBps.toFixed(1)}bp x 마크업 전 명목`,formatMoneyFromKrw(pricing.relayMarginKrw))}
    </div>`;
  }

  function ttlPanel(pricing) {
    const quote=state.primeQuote;
    const seconds=Math.max(0,quote.ttl);
    const statusChip=quote.expired?chip("만료","warning"):quote.presented?chip("고객 제시됨","positive"):chip("유효","info");
    const relayControl=MP.canControl("exec","biz-admin");
    const captureControl=MP.canControl("exec","prime");
    const actions=[
      btn("고객 제시","prime-quote-present","primary","arrow",relayControl?"":"disabled"),
      btn("재견적","prime-quote-requote","","refresh",relayControl?"":"disabled"),
      btn("캡처 보기","prime-quote-capture","ghost","file",captureControl?"":"disabled")
    ].join("");
    return `<div class="rfq-banner prime-quote-ttl"><span class="status-dot ${quote.expired?"warning":"info"}"></span><span><b>${quote.orderId}</b>, 고객 제시가 ${formatLiteralMoney(pricing.clientPriceUsd,"USD")}</span>${statusChip}<strong class="countdown" data-prime-quote-ttl>00:${String(seconds).padStart(2,"0")}</strong></div><div class="prime-quote-actions">${actions}</div>`;
  }

  function renderPrimeQuotes() {
    const pricing=primeQuotePricing();
    const quote=state.primeQuote;
    const footnote=`캡처 시점의 ${state.vendorQuotes.length}개 호가 전량이 증빙에 포함되며 베스트 이외 행도 삭제하지 않음`;
    const ttlNote="TTL 만료 시 자동 재견적 없음, 만료 상태로 큐에 남고 수동 릴레이 대기";
    return `<section class="view prime-quotes-view" data-view="prime-quotes">${header(pricing)}<div class="grid split-7-5">${panel("벤더 호가",vendorTable(pricing),{flush:true,footer:`<span>${footnote}</span>`})}${panel("단일가 산출",pricingPanel(pricing),{flush:true})}</div>${panel("제시와 TTL",ttlPanel(pricing),{flush:true,footer:`<span>${ttlNote}</span>`})}</section>`;
  }

  Object.assign(MP,{renderPrimeQuotes,primeQuotePricing});
})(window.MP = window.MP || {});
