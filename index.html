  <script data-source="js/screens/prime-execution.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,formatTradePrice,formatMoneyFromKrw} = MP;

  const stateTabDefs = [
    {key:"pre",label:"상태 1, 윈도우 전",time:"09:58:22"},
    {key:"live",label:"상태 2, 윈도우 중",time:"10:31:04"},
    {key:"print",label:"상태 3, 프린트",time:"11:02:10"}
  ];
  /* ---------- 테이프 컨텍스트 ----------
     D-0914. 집행 화면이 주문 티켓마다 자기 테이프를 갖게 되면서, 여기 있는 뷰 계산과 차트와
     구간표는 전역 테이프 대신 "지금 끼워져 있는 테이프"를 읽는다. 컨텍스트가 비어 있으면
     예전 그대로 전역 테이프이므로 `prime-execution` 렌더는 바뀌지 않는다. */
  let tapeContext = null;
  const activeTape = () => tapeContext?tapeContext.tape:state.executionTape;
  const activeWindow = () => tapeContext?tapeContext.tapeWindow:state.executionTapeWindow;
  const activeParams = () => tapeContext?tapeContext.params:state.executionWindowParams;

  function withExecutionTapeContext(context,render) {
    const previous=tapeContext;
    tapeContext=context||null;
    try{return render();}finally{tapeContext=previous;}
  }

  const windowOpenTime = () => MP.executionWindowOpenTime(activeParams());
  const windowCloseLabel = () => MP.executionWindowCloseLabel(activeParams());
  const defaultClientOrderId = "ORD-260908-0031";
  const clientPrimeOrderId = "PRM-260908-0031";
  const deskPrimeOrderId = "PRM-260908-0018";

  function round4(value) {
    return Math.round(Number(value)*10000)/10000;
  }

  const stateRank = {pre:0,live:1,print:2};

  function derivedStateKey() {
    const tape=activeTape();
    const completed=tape.filter(row=>row.status==="완료").length;
    if(completed===0)return "pre";
    if(completed>=tape.length)return "print";
    return "live";
  }

  function stateKeyAvailable(key) {
    const derived=derivedStateKey();
    if(stateRank[key]===undefined||stateRank[derived]===undefined)return false;
    if(stateRank[key]>stateRank[derived])return false;
    return key!=="live"||derived==="live";
  }

  function effectiveStateKey() {
    const view=state.executionStateView;
    return stateKeyAvailable(view)?view:derivedStateKey();
  }

  function medianOf(values) {
    const sorted=values.filter(Number.isFinite).slice().sort((a,b)=>a-b);
    if(!sorted.length)return null;
    const middle=Math.floor(sorted.length/2);
    const value=sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2;
    return Math.round(value*100)/100;
  }

  function runningMedianFor(row) {
    const derived=medianOf(activeWindow().prices);
    return derived===null?row.medianUsd:derived;
  }

  function bucketBps(row) {
    if(!Number.isFinite(row.fillPriceUsd)||!Number.isFinite(row.medianUsd)||row.medianUsd<=0)return null;
    return (row.fillPriceUsd/row.medianUsd-1)*10000;
  }

  function viewRows(stateKey) {
    const tapeWindow=activeWindow();
    return activeTape().map(row=>{
      if(stateKey==="pre")return {...row,fillQty:0,status:"대기",running:false};
      if(stateKey==="print")return {...row,status:"완료",running:false};
      if(row.index<tapeWindow.index)return {...row,status:"완료",running:false};
      if(row.index===tapeWindow.index)return {...row,fillQty:tapeWindow.fillQty,medianUsd:runningMedianFor(row),status:"진행",running:true};
      return {...row,fillQty:0,status:"대기",running:false};
    });
  }

  function metricsFor(stateKey=effectiveStateKey()) {
    const rows=viewRows(stateKey);
    const targetQty=round4(rows.reduce((sum,row)=>sum+row.targetQty,0));
    const completed=rows.filter(row=>row.status==="완료");
    const open=rows.find(row=>row.status==="진행")||null;
    const worked=open?[...completed,open]:completed;
    const filledQty=round4(worked.reduce((sum,row)=>sum+row.fillQty,0));
    const filledNotional=worked.reduce((sum,row)=>sum+row.fillQty*row.fillPriceUsd,0);
    const averagePriceUsd=filledQty>0?filledNotional/filledQty:null;
    const fixingUsd=worked.length?worked.reduce((sum,row)=>sum+row.medianUsd,0)/worked.length:null;
    const weightQty=completed.reduce((sum,row)=>sum+row.fillQty,0);
    const weightedBps=weightQty>0?completed.reduce((sum,row)=>sum+bucketBps(row)*row.fillQty,0)/weightQty:null;
    const confirmedBps=stateKey==="print"&&averagePriceUsd&&fixingUsd?(averagePriceUsd/fixingUsd-1)*10000:null;
    const workedTargetQty=worked.reduce((sum,row)=>sum+row.targetQty,0);
    const capPct=typeof MP.orderModeParticipationCapPct==="function"?MP.orderModeParticipationCapPct():0;
    const participationPct=workedTargetQty>0?filledQty/workedTargetQty*capPct:null;
    return {
      stateKey,rows,completed,open,worked,
      targetQty,filledQty,
      remainingQty:round4(targetQty-filledQty),
      percent:targetQty>0?filledQty/targetQty*100:0,
      averagePriceUsd,fixingUsd,weightedBps,confirmedBps,
      participationCapPct:capPct,participationPct,
      medianSampleCount:worked.length
    };
  }

  function bpsText(value,prefix="") {
    if(!Number.isFinite(value))return "-";
    return `${prefix}${value>=0?"+":""}${value.toFixed(2)}bp`;
  }

  function bpsTone(value) {
    if(!Number.isFinite(value))return "";
    return value<=0?"positive-text":"negative-text";
  }

  function qtyText(value) {
    return `${Number(value).toFixed(4)}`;
  }

  function primeOrderById(id) {
    return state.primeOrders.find(item=>item.id===id)||null;
  }

  function clientOrderForPrimeOrder(order) {
    if(!order)return null;
    return state.clientOrders.find(item=>item.id===String(order.id).replace(/^PRM-/,"ORD-"))||null;
  }

  function algoMonitorOrder(id) {
    const order=primeOrderById(id);
    if(!order||order.mode!=="알고"||!Array.isArray(order.vendorRouting))return null;
    return order;
  }

  function algoOrderForRfq(rfq) {
    if(!rfq)return null;
    const linked=state.primeOrders.find(item=>item.reference===rfq.id);
    return algoMonitorOrder(linked?linked.id:String(rfq.id).replace(/^RFQ-/,"PRM-"));
  }

  function monitorContext(surface) {
    if(surface==="desk"){
      const rfq=state.rfqAccepted?state.activeRfqs.find(item=>item.id===state.selectedApRfq):null;
      const mapped=algoOrderForRfq(rfq);
      const order=mapped||algoMonitorOrder(deskPrimeOrderId);
      return {order,clientOrder:clientOrderForPrimeOrder(order),headerId:order?.id||deskPrimeOrderId,rfq:mapped?rfq:null};
    }
    if(surface==="client"){
      const order=algoMonitorOrder(clientPrimeOrderId);
      return {order,clientOrder:clientOrderForPrimeOrder(order),headerId:order?.id||clientPrimeOrderId,rfq:null};
    }
    const selected=state.executionMonitorOrderId||defaultClientOrderId;
    const order=algoMonitorOrder(String(selected).replace(/^ORD-/,"PRM-"))||algoMonitorOrder(clientPrimeOrderId);
    return {order,clientOrder:clientOrderForPrimeOrder(order),headerId:order?.id||clientPrimeOrderId,rfq:null};
  }

  function monitorClient(context) {
    return state.clients.find(item=>item.id===context.order?.clientId)||null;
  }

  function vendorLabel(vendor,surface) {
    return surface==="prime"?MP.vendorDisplayName(vendor):vendor.anonName;
  }

  function custodianLabel(vendor,surface) {
    return surface==="prime"?MP.vendorDisplayCustodian(vendor):vendor.anonCustodian;
  }

  function previousFixingText() {
    const note=MP.orderModeParams().find(param=>param.key==="fixing")?.note||"";
    return note.replace("전일 확정 ","").trim();
  }

  function secondsBetween(from,to) {
    const parse=text=>String(text).split(":").reduce((sum,part)=>sum*60+Number(part),0);
    return Math.max(0,parse(to)-parse(from));
  }

  function countdownText(seconds) {
    return `${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`;
  }

  function anonymiseToggle() {
    const on=state.vendorAnonymised;
    const editable=`<span data-owned-panel><button class="switch ${on?"on":""}" type="button" data-action="execution-anonymise" aria-label="벤더 익명화" aria-pressed="${on}"></button></span>`;
    const readonly=chip(on?"익명화 ON":"익명화 OFF",on?"violet":"muted");
    return `<div class="prime-quote-toggle"><span>벤더 익명화</span>${MP.settingControl("ops","prime",editable,readonly)}<small>${on?"고객 사본 표기":"프라임 내부 실명"}</small></div>`;
  }

  function monitorHeader(context,surface) {
    const client=monitorClient(context);
    const clientChip=chip(client?client.name:context.order?.clientId||"미상","info");
    const orderChip=chip(context.headerId,"violet");
    const right=surface==="prime"
      ?anonymiseToggle()
      :chip("벤더 익명화 적용","violet");
    const line=context.rfq?"Quantizer, 수락 RFQ 우선 표시":"Quantizer 소싱 레그";
    return `<header class="prime-quote-header exec-monitor-header"><div><h2>${context.headerId}</h2><p>${line}</p></div><div class="prime-quote-header-right">${orderChip}${clientChip}${right}</div></header>`;
  }

  function stateTabs(stateKey) {
    const tabs=stateTabDefs.map(tab=>{
      const available=stateKeyAvailable(tab.key);
      const classes=`${tab.key===stateKey?"active":""}${available?"":" unavailable"}`.trim();
      const guard=available?"":' disabled title="아직 도달하지 않은 상태"';
      const note=available?"":' <span class="exec-tab-off">미도달</span>';
      return `<button type="button" class="${classes}"${guard} data-action="execution-state-view" data-state="${tab.key}">${tab.label} ${tab.time}${note}</button>`;
    }).join("");
    return `<div class="tabs compact exec-state-tabs">${tabs}</div>`;
  }

  function paramPanel(context) {
    const params=MP.orderModeParams();
    const clientOrder=context.clientOrder;
    const feeBps=Number.isFinite(clientOrder?.feeBps)?clientOrder.feeBps:0;
    const notionalKrw=Number.isFinite(clientOrder?.notionalKrw)?clientOrder.notionalKrw:0;
    const feeKrw=Math.round(notionalKrw*feeBps/10000);
    const rows=params.map(param=>`<div class="kv"><label>${param.label.replace(/윈도(?!우)/g,"윈도우")}</label><strong>${param.key==="fixing"?"윈도우 평균 (기본값)":param.value}</strong>${param.note?`<small class="subcell">${param.note.replace(/윈도(?!우)/g,"윈도우")}</small>`:""}</div>`).join("");
    const feeRow=`<div class="kv"><label>수수료</label><strong class="num">${feeBps.toFixed(1)}bp</strong><small class="subcell num">${formatMoneyFromKrw(feeKrw)}</small></div>`;
    const attribution=`<div class="exec-attribution">${chip("체결과 구간 이탈은 고객 귀속","violet")}</div>`;
    const footer="파라미터는 접수 시점에 동결되고 변경은 신규 주문으로만 가능하며 복제 픽싱은 사전 고정값이 아님";
    return panel("고객 설정 파라미터",`<div class="kv-grid exec-param-grid">${rows}${feeRow}</div>${attribution}`,{flush:true,footer:`<span>${footer}</span>`});
  }

  function windowParamDefs() {
    return MP.orderModeParams().filter(param=>["windowStart","windowEnd","windowSlice"].includes(param.key));
  }

  function windowParamRows() {
    const locked=MP.executionParamsLocked();
    const guard=locked?` disabled title="${MP.executionParamsLockReason()}"`:"";
    return windowParamDefs().map(param=>{
      const options=param.options.map(option=>`<option value="${option.value}"${String(option.value)===String(param.rawValue)?" selected":""}>${option.label}</option>`).join("");
      return `<div class="kv exec-window-kv"><label>${param.label.replace(/윈도(?!우)/g,"윈도우")}</label><select class="exec-window-select" data-execution-window="${param.field}"${guard}>${options}</select></div>`;
    }).join("");
  }

  function windowLockLine() {
    const locked=MP.executionParamsLocked();
    return `<div class="exec-window-lock">${locked?chip("윈도우 파라미터 잠김","warning"):chip("윈도우 파라미터 편집 가능","info")}<small>${locked?MP.executionParamsLockReason().replace(/윈도(?!우)/g,"윈도우"):"윈도우 개시 전에만 편집 가능하며 저장 즉시 테이프를 다시 만듦"}</small></div>`;
  }

  function windowFooterText() {

  function runPanel(view) {
    const sim=state.executionSim;
    const gate=MP.executionSimRunnable();

    const frozen=running&&!state.simulationRunning;
    const runDisabled=running||!gate.ok;
    const runGuard=runDisabled?`disabled title="${running?"실행 중":gate.reason}"`:"";
    const pauseGuard=running?"":'disabled title="실행 중 아님"';
    const buttons=`${btn(running?"실행 중":"실행","execution-run","small primary","play",runGuard)}${btn("정지","execution-pause","small warning","pause",pauseGuard)}${btn("재설정","execution-reset","small ghost","refresh")}`;
    const interval=`<label class="exec-run-interval"><span>슬라이스 시뮬레이션 간격</span><select data-execution-sim-interval>${simIntervalOptions()}</select></label>`;
    const clocks=`<div class="exec-run-clock"><label>벽시계</label><strong class="num" data-exec-wall-clock>${MP.currentTimestamp().slice(0,8)}</strong></div><div class="exec-run-clock"><label>시뮬 윈도우 시각</label><strong class="num violet-text" data-exec-sim-clock>${MP.executionSimClockLabel()}</strong></div>`;
    const sliceCount=state.executionTape.length;
    const doneSlices=Math.min(state.executionTapeWindow.index,sliceCount);
    const readout=`<div class="exec-run-readout"><div class="exec-run-cell"><label>슬라이스 진행</label><strong class="num">${doneSlices} / ${sliceCount}</strong></div><div class="exec-run-cell"><label>누적 체결</label><strong class="num" data-exec-run-filled>${qtyText(view.filledQty)} BTC</strong></div><div class="exec-run-cell"><label>참여율</label><strong class="num" data-exec-participation>${Number.isFinite(view.participationPct)?`${view.participationPct.toFixed(2)}%`:"-"}</strong><small class="exec-stat-note">상한 ${view.participationCapPct.toFixed(0)} %</small></div><div class="exec-run-cell"><label>${view.stateKey==="print"?"픽싱 결과":"예상 픽싱"}</label><strong class="num violet-text">${Number.isFinite(view.fixingUsd)?formatTradePrice(view.fixingUsd):"산출 전"}</strong></div></div>`;
    const tca=view.stateKey==="print"&&Number.isFinite(view.confirmedBps)

      :"";
    const statusChip=running
      ?chip(frozen?"시뮬레이션 종료로 일시 정지":"실행 중",frozen?"warning":"info")
      :sim.completed?chip("프린트 완료","positive"):chip("대기","muted");
    const reason=!gate.ok&&!running?`<p class="order-mode-note">${gate.reason}</p>`:"";
    const footer=`슬라이스 1개가 ${(state.executionSimIntervalMs/1000).toFixed(0)}초의 실시간을 쓰며 전역 시뮬레이션 스위치가 꺼지면 압축 시계도 함께 멈춤`;
    return panel("윈도우 집행 실행",`<div class="exec-run-bar">${buttons}${interval}${clocks}</div>${readout}${tca}${reason}`,{actions:statusChip,flush:true,footer:`<span>${footer}</span>`});

  function chartText(text,x,y,size,extra="") {
    return `<text x="${Math.round(x)}" y="${Math.round(y)}" font-family="var(--exec-ui-font)" font-size="${size}" font-weight="400" text-rendering="geometricPrecision" stroke="none" fill="var(--text-primary)" ${extra}>${text}</text>`;

  /* 차트 축 라벨용 축약 금액. 표시 통화를 따르며 USD 는 K/M/B, KRW 는 만/억/조 단위. */
  function compactMoneyFromUsd(value,digits=1) {
    const usd=Number(value);
    const krw=MP.displayCurrency()==="KRW";
    const amount=(Number.isFinite(usd)?usd:0)*(krw?state.constants.usdKrw:1);
    const sign=amount<0?"-":"";
    const symbol=krw?"₩":"$";
    const absolute=Math.abs(amount);
    const units=krw?[[1e12,"조"],[1e8,"억"],[1e4,"만"]]:[[1e9,"B"],[1e6,"M"],[1e3,"K"]];
    for(const [scale,suffix] of units){
      if(absolute>=scale)return `${sign}${symbol}${(absolute/scale).toFixed(absolute/scale>=100?0:digits)}${suffix}`;
    }
    return `${sign}${symbol}${absolute.toFixed(krw?0:Math.min(2,digits))}`;
  }

  function drawExecutionChart(svg,spec) {
    const width=Math.max(1,Math.round(svg.clientWidth));
    const height=Math.max(1,Math.round(svg.clientHeight));
    svg.setAttribute("width",String(width));
    svg.setAttribute("height",String(height));
    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    svg.removeAttribute("preserveAspectRatio");
    const left=78;
    const right=62;
    const top=26;
    const bottom=34;
    const plotWidth=Math.max(1,width-left-right);
    const plotHeight=Math.max(1,height-top-bottom);
    const plotBottom=top+plotHeight;
    const sliceCount=Math.max(1,spec.rows.length);
    const xAt=index=>Math.round(left+index/sliceCount*plotWidth);
    /* 좌축은 누적 체결 금액. 목표선은 구간 목표 수량 x 그 시점까지의 윈도우 평균
       (첫 구간 전에는 현재 mid) 이고, 체결선은 구간 체결 수량 x 체결가의 누계이다. */
    const midUsd=Number.isFinite(spec.midUsd)&&spec.midUsd>0?spec.midUsd:0;
    let sampleSum=0;
    let sampleCount=0;
    let estimateUsd=midUsd;
    const estimates=spec.rows.map(row=>{
      if(row.status!=="대기"&&Number.isFinite(row.medianUsd)&&row.medianUsd>0){
        sampleSum+=row.medianUsd;
        sampleCount+=1;
        estimateUsd=sampleSum/sampleCount;
      }
      return estimateUsd;
    });
    let cumulativeTarget=0;
    const targetSeries=spec.rows.map((row,index)=>{
      cumulativeTarget+=row.targetQty*estimates[index];
      return cumulativeTarget;
    });
    const worked=spec.rows.filter(row=>row.status!=="대기");
    let cumulativeFill=0;
    let cumulativeFillNotional=0;
    const fillSeries=worked.map(row=>{
      cumulativeFill+=row.fillQty;
      cumulativeFillNotional+=row.fillQty*(Number.isFinite(row.fillPriceUsd)&&row.fillPriceUsd>0?row.fillPriceUsd:estimates[row.index]||estimateUsd);
      return {index:row.index,notional:cumulativeFillNotional};
    });
    const maxNotional=Math.max(1,cumulativeTarget,cumulativeFillNotional);
    const yAt=notional=>Math.round(plotBottom-notional/maxNotional*plotHeight);
    const targetPoints=[[left,plotBottom],...targetSeries.map((notional,index)=>[xAt(index+1),yAt(notional)])].map(point=>point.join(",")).join(" ");
    const actualPoints=[[left,plotBottom],...fillSeries.map(point=>[xAt(point.index+1),yAt(point.notional)])].map(point=>point.join(",")).join(" ");
    const markerX=worked.length?xAt(worked[worked.length-1].index+1):left;
    const markerY=yAt(cumulativeFillNotional);
    const bpZeroY=Math.round(top+plotHeight/2);
    const barWidth=Math.round(Math.max(8,Math.min(22,plotWidth/(sliceCount*2.2))));
    const shade=spec.stateKey==="live"?`<rect class="chart-shade" x="${markerX}" y="${top}" width="${Math.max(0,left+plotWidth-markerX)}" height="${plotHeight}"></rect>`:"";
    const bars=spec.rows.filter(row=>row.status==="완료"&&Number.isFinite(row.bps)).map(row=>{
      const x=Math.round(left+(row.index+.5)/sliceCount*plotWidth);
      const endY=Math.round(bpZeroY-Math.max(-6,Math.min(6,row.bps))/6*(plotHeight*.36));
      const y=Math.min(bpZeroY,endY);
      const barHeight=Math.max(1,Math.abs(endY-bpZeroY));
      const tone=row.bps>=0?"positive":"negative";
      const labelY=row.bps>=0?Math.max(top+10,endY-7):Math.min(plotBottom-2,endY+13);
      return `<rect class="exec-bp-bar ${tone}" x="${Math.round(x-barWidth/2)}" y="${y}" width="${barWidth}" height="${barHeight}"></rect>${chartText(`${row.bps>=0?"+":""}${row.bps.toFixed(1)}`,x,labelY,10,`class="exec-bp-value ${tone}" text-anchor="middle"`)}`;
    }).join("");
    const marker=worked.length?`<g class="exec-fill-latest"><circle class="chart-marker" cx="${markerX}" cy="${markerY}" r="4"></circle>${chartText(`${qtyText(cumulativeFill)} BTC, ${compactMoneyFromUsd(cumulativeFillNotional,2)}`,Math.max(left+56,Math.min(left+plotWidth-56,markerX)),Math.max(top+10,markerY-9),10,'text-anchor="middle"')}</g>`:"";
    const axisText=[
      chartText("누적 체결 금액",left-8,top-11,10,'class="exec-axis-title" text-anchor="end"'),
      chartText("이탈 (bp)",left+plotWidth+8,top-11,10,'class="exec-axis-title" text-anchor="start"'),
      chartText(compactMoneyFromUsd(maxNotional),left-8,top+4,11,'text-anchor="end"'),
      chartText(compactMoneyFromUsd(maxNotional/2),left-8,bpZeroY+4,11,'text-anchor="end"'),
      chartText("0",left-8,plotBottom,11,'text-anchor="end"'),
      chartText("+6bp",left+plotWidth+8,top+4,11,'text-anchor="start"'),
      chartText("0bp",left+plotWidth+8,bpZeroY+4,11,'text-anchor="start"'),
      chartText("-6bp",left+plotWidth+8,plotBottom,11,'text-anchor="start"')
    ].join("");
    const tickEvery=Math.max(1,Math.ceil(sliceCount/Math.max(1,Math.floor(plotWidth/48))));
    const timeText=spec.labels.map((label,index)=>{
      if(index!==0&&index!==sliceCount&&index%tickEvery!==0)return "";
      const x=xAt(index);
      const anchor=index===0?"start":index===sliceCount?"end":"middle";
      return chartText(label,x,height-8,11,`text-anchor="${anchor}"`);
    }).join("");
    svg.innerHTML=`${shade}<line class="exec-bp-zero" x1="${left}" y1="${bpZeroY}" x2="${left+plotWidth}" y2="${bpZeroY}"></line>${bars}<polyline class="line-benchmark" points="${targetPoints}"></polyline>${spec.stateKey==="pre"?"":`<polyline class="line-primary" points="${actualPoints}"></polyline>${marker}`}${axisText}${timeText}`;
  }

  function drawExecutionCharts() {
    executionChartFrame=0;
    document.querySelectorAll("svg[data-execution-chart]").forEach(svg=>{
      const spec=executionChartSpecs.get(svg.dataset.executionChart);

    });

      const nameCell=`<td class="main-cell vendor-cell"><strong>${vendorLabel(vendor,surface)}${excluded?chip("고객 제외","warning"):""}</strong></td>`;
      const custodyCell=withCustody?`<td>${custodianLabel(vendor,surface)}</td>`:"";

      const excluded=!entry;
      const priceCell=excluded||!Number.isFinite(view.averagePriceUsd)?'<span class="muted-cell">해당 없음</span>':`<span class="num">${formatTradePrice(view.averagePriceUsd)}</span>`;
      const bpsCell=excluded||!Number.isFinite(view.weightedBps)?'<span class="muted-cell">해당 없음</span>':`<span class="num ${bpsTone(view.weightedBps)}">${bpsText(view.weightedBps)}</span>`;
      return `<tr class="${excluded?"excluded-row":""}"><td class="main-cell"><strong>${vendor.anonName}${excluded?chip("고객 제외","warning"):""}</strong></td><td class="align-right num">${(share*100).toFixed(1)}%</td><td class="align-right num">${excluded?"-":qtyText(round4(share*total))}</td><td class="align-right">${priceCell}</td><td class="align-right">${bpsCell}</td></tr>`;
    }).join("");
    const totalShare=routing.reduce((sum,item)=>sum+item.share,0);
    const foot=`<tfoot><tr><td>합계</td><td class="align-right num">${(totalShare*100).toFixed(1)}%</td><td class="align-right num">${qtyText(total)}</td><td class="align-right num">${Number.isFinite(view.averagePriceUsd)?formatTradePrice(view.averagePriceUsd):"-"}</td><td class="align-right num ${bpsTone(view.weightedBps)}">${bpsText(view.weightedBps)}</td></tr></tfoot>`;
    const head=`<thead><tr><th>벤더</th><th class="align-right">배분</th><th class="align-right">체결</th><th class="align-right">평균가</th><th class="align-right">구간 이탈</th></tr></thead>`;
    return `<div class="table-scroll"><table class="data-table exec-vendor-table">${head}<tbody>${rows}</tbody>${foot}</table></div>`;
  }

  function bucketRowMarkup(row,compact,stateLabels) {
    const bps=bucketBps(row);
    const started=row.status!=="대기";
    const quantityDrift=started?round4(row.fillQty-row.targetQty):null;
    const fillCell=started?qtyText(row.fillQty):'<span class="muted-cell">-</span>';
    const priceCell=started?formatTradePrice(row.fillPriceUsd):'<span class="muted-cell">-</span>';
    const medianCell=started?`${formatTradePrice(row.medianUsd)}${row.running?'<small class="subcell">러닝</small>':""}`:'<span class="muted-cell">-</span>';
    const bpsCell=started?`<span class="${bpsTone(bps)}">${bpsText(bps,row.running?"잠정 ":"")}</span>`:'<span class="muted-cell">-</span>';
    const label=`${row.label} to ${activeTape()[row.index+1]?activeTape()[row.index+1].label:windowCloseLabel()}`;
    if(compact){
      return `<tr><td class="num">${label}</td><td class="align-right num">${qtyText(row.targetQty)}</td><td class="align-right num">${fillCell}</td><td class="align-right num">${priceCell}</td><td class="align-right num">${medianCell}</td><td class="align-right num">${bpsCell}</td></tr>`;
    }
    const driftCell=started?`<span class="${quantityDrift>=0?"positive-text":"negative-text"}">${quantityDrift>=0?"+":""}${qtyText(quantityDrift)}</span>`:'<span class="muted-cell">-</span>';
    const fallback={"완료":{label:"완료",tone:"positive"},"진행":{label:"진행",tone:"info"},"대기":{label:"대기",tone:"muted"}};
    const statusMeta=stateLabels?.[row.status]||fallback[row.status];
    return `<tr><td class="num">${label}</td><td class="align-right num">${qtyText(row.targetQty)}</td><td class="align-right num">${fillCell}</td><td class="align-right num">${driftCell}</td><td class="align-right num">${priceCell}</td><td class="align-right num">${medianCell}</td><td class="align-right num">${bpsCell}</td><td>${chip(statusMeta.label,statusMeta.tone)}</td></tr>`;
  }

  function foldedRowMarkup(pending,compact,stateLabels) {
    const label=`${pending[0].label} to ${windowCloseLabel()}`;
    const targetSum=qtyText(round4(pending.reduce((sum,row)=>sum+row.targetQty,0)));
    const dash='<span class="muted-cell">-</span>';
    if(compact)return `<tr class="exec-folded-row"><td class="num">${label}</td><td class="align-right num">${targetSum}</td><td class="align-right">${dash}</td><td class="align-right">${dash}</td><td class="align-right">${dash}</td><td class="align-right">${dash}</td></tr>`;
    const pendingLabel=stateLabels?.["대기"]?.label||"미개시";
    return `<tr class="exec-folded-row"><td class="num">${label}</td><td class="align-right num">${targetSum}</td><td class="align-right">${dash}</td><td class="align-right">${dash}</td><td class="align-right">${dash}</td><td class="align-right">${dash}</td><td class="align-right">${dash}</td><td>${chip(`${pendingLabel} ${pending.length}구간`,"muted")}</td></tr>`;
  }

  function bucketTable(view,surface,options={}) {
    const compact=surface==="client";
    const pending=view.rows.filter(row=>row.status==="대기");
    const worked=view.rows.filter(row=>row.status!=="대기");
    const body=view.stateKey==="live"
      ?`${worked.map(row=>bucketRowMarkup(row,compact,options.stateLabels)).join("")}${pending.length?foldedRowMarkup(pending,compact,options.stateLabels):""}`
      :view.rows.map(row=>bucketRowMarkup(row,compact,options.stateLabels)).join("");
    const fixingLabel=view.stateKey==="print"?"픽싱 결과":view.stateKey==="live"?"예상 픽싱":"산출 전";
    const totalBpsCell=`<span class="${bpsTone(view.confirmedBps)}">${bpsText(view.confirmedBps)}</span>`;
    const started=view.filledQty>0;
    const totalDrift=started?qtyText(round4(view.filledQty-view.targetQty)):'<span class="muted-cell">-</span>';
    const totalPrice=Number.isFinite(view.averagePriceUsd)?formatTradePrice(view.averagePriceUsd):'<span class="muted-cell">-</span>';
    const totalFixing=Number.isFinite(view.fixingUsd)?formatTradePrice(view.fixingUsd):`<span class="muted-cell">${fixingLabel}</span>`;
    const foot=compact
      ?`<tfoot><tr class="exec-bucket-total"><td><strong>합계</strong></td><td class="align-right num">${qtyText(view.targetQty)}</td><td class="align-right num">${qtyText(view.filledQty)}</td><td class="align-right num">${totalPrice}</td><td class="align-right num">${totalFixing}</td><td class="align-right num">${totalBpsCell}</td></tr></tfoot>`
      :`<tfoot><tr class="exec-bucket-total"><td><strong>합계</strong></td><td class="align-right num">${qtyText(view.targetQty)}</td><td class="align-right num">${qtyText(view.filledQty)}</td><td class="align-right num">${totalDrift}</td><td class="align-right num">${totalPrice}</td><td class="align-right num">${totalFixing}</td><td class="align-right num">${totalBpsCell}</td><td></td></tr></tfoot>`;
    const head=compact
      ?`<thead><tr><th>구간</th><th class="align-right">목표</th><th class="align-right">체결</th><th class="align-right">구간 체결가</th><th class="align-right">구간 중앙값</th><th class="align-right">구간 이탈</th></tr></thead>`
      :`<thead><tr><th>구간</th><th class="align-right">Quantizer 목표</th><th class="align-right">체결</th><th class="align-right">수량 이탈</th><th class="align-right">구간 체결가</th><th class="align-right">구간 중앙값</th><th class="align-right">구간 이탈</th><th>상태</th></tr></thead>`;
    return `<div class="table-scroll execution-buckets"><table class="data-table exec-bucket-table">${head}<tbody>${body}</tbody>${foot}</table></div>`;
  }

  function bucketPanel(view,surface,options={}) {
    const actions=options.captions===false?"":chip("이탈 = 구간 체결가 대 구간 중앙값","info");
    return panel(options.title||"구간 진행과 구간별 이탈",bucketTable(view,surface,options),{actions,flush:true});
  }

  function fixingCountdownChip() {
    return `${chip(state.executionPaused?"중지":"집행중",state.executionPaused?"warning":"info")}<strong class="warning-text num" data-fixing-countdown>${countdownText(state.fixingSeconds)}</strong>`;
  }

  function statePanel(view,surface) {
    const actions=surface==="desk"?fixingCountdownChip():"";
    return panel("집행 성과",`${stateTabs(view.stateKey)}${metricGrid(view)}`,{actions,flush:true});
  }

  function renderExecutionMonitor(context={}) {
    const surface=["prime","client","desk"].includes(context.surface)?context.surface:"prime";
    const monitor=monitorContext(surface);
    const view=metricsFor(effectiveStateKey());
    if(surface==="client"){
      const body=`${stateTabs(view.stateKey)}${metricGrid(view)}${view.stateKey==="pre"?clientReferenceBlock():""}<div class="exec-client-section"><div class="section-owner-line">벤더 배분</div>${clientVendorPanel(monitor,view)}</div><div class="exec-client-section"><div class="section-owner-line">구간 진행과 구간별 이탈, 이탈 = 구간 체결가 대 구간 중앙값</div>${bucketTable(view,surface)}</div>`;
      const footer="복제 픽싱은 윈도우 구간 중앙값으로 실시간 산출되며 프린트 시점에 확정됨. 확정 이탈이 고객 수령 TCA 값";
      return panel("집행 모니터",body,{actions:chip("벤더 익명화 적용","violet"),flush:true,footer:`<span>${footer}</span>`});
    }
    const left=`<div class="stack">${runPanel(view)}${statePanel(view,surface)}${chartPanel(view,surface)}${bucketPanel(view,surface)}</div>`;
    const rightPanels=[
      surface==="prime"?paramPanel(monitor):"",
      overviewPanel(monitor),
      view.stateKey==="pre"?referencePanel():"",
      vendorRoutingPanel(monitor,view,surface)
    ].filter(Boolean).join("");
    return `<section class="view exec-monitor-view" data-view="${surface==="desk"?"ap-execution":"prime-execution"}">${monitorHeader(monitor,surface)}<div class="grid split-8-4">${left}<div class="stack">${rightPanels}</div></div></section>`;
  }

  function clientReferenceBlock() {
    const pair=MP.pairBySymbol?MP.pairBySymbol("BTC/USD"):null;
    const spreadUsd=pair?pair.halfSpread*2:0;
    const seconds=secondsBetween(stateTabDefs[0].time,windowOpenTime());
    return `<div class="exec-client-section"><div class="section-owner-line">참고값, 기준가 아님</div><div class="kv-grid"><div class="kv"><label>전일 확정 픽싱</label><strong class="num">${previousFixingText()}</strong></div><div class="kv"><label>현재 mid</label><strong class="num">${formatTradePrice(state.tradePrice)}</strong></div><div class="kv"><label>현재 스프레드</label><strong class="num">${formatTradePrice(spreadUsd)}</strong></div><div class="kv"><label>윈도우 개시까지</label><strong class="num warning-text">${countdownText(seconds)}</strong></div></div></div>`;
  }

  function renderPrimeExecution() {
    return renderExecutionMonitor({surface:"prime"});
  }

  function executionMonitorMetrics(stateKey) {
    return metricsFor(["pre","live","print"].includes(stateKey)?stateKey:effectiveStateKey());
  }

  function executionContextClientOrderId(surface) {
    const context=monitorContext(["prime","client","desk"].includes(surface)?surface:"prime");
    return context.clientOrder?context.clientOrder.id:null;
  }

  /* 집행 화면이 그대로 재사용하는 두 조각. 차트는 데스크 정지 버튼 없이 그려야 하므로
     `prime` 표면으로 부르고, 구간표는 전체 열이 필요하므로 `desk` 표면으로 부른다. */
  const executionChartPanel = (view,options) => chartPanel(view,"prime",options);
  const executionBucketPanel = (view,options) => bucketPanel(view,"desk",options);
  const executionMetricGrid = (view,options) => metricGrid(view,options);

  Object.assign(MP,{renderPrimeExecution,renderExecutionMonitor,executionMonitorMetrics,executionStateKey:effectiveStateKey,executionDerivedStateKey:derivedStateKey,executionStateAvailable:stateKeyAvailable,executionContextClientOrderId,executionViewRows:viewRows,executionBucketBps:bucketBps,withExecutionTapeContext,executionChartPanel,executionBucketPanel,executionMetricGrid,executionPreviousFixingText:previousFixingText});
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/prime-pnl.js">
(function (MP) {
  "use strict";

  const {state,metric,panel,chip,btn,formatMoneyFromKrw,formatMoneyFromUsd,getPrimePnlSummary} = MP;

  const modeTones={"RFQ 릴레이 마진":"t-relay","픽싱 알고 수수료":"t-algo","넷팅 이득":"t-netting"};
  const categoryTones=["t-relay","t-algo","t-netting","t-other"];

  function shareRow(label,valueText,share,toneClass) {
    const width=Math.max(0,Math.min(100,share));
    return `<div class="share-row"><b>${label}</b><div class="share-bar" role="img" aria-label="${label} ${share.toFixed(1)}%"><i class="${toneClass}" style="--share:${width}%"></i></div><span class="num">${valueText}</span><span class="num share-percent">${share.toFixed(1)}%</span></div>`;
  }

  function modeShare(summary) {
    const total=summary.totalKrw||1;
    const rows=[
      ["RFQ 릴레이 마진",summary.relayKrw],
      ["픽싱 알고 수수료",summary.algoKrw],
      ["넷팅 이득",summary.nettingKrw]
    ].map(([label,value])=>shareRow(label,formatMoneyFromKrw(value),value/total*100,modeTones[label])).join("");
    return `<div class="share-list">${rows}</div>`;
  }

  function categoryShare(summary) {
    const total=summary.totalKrw||1;
    const rows=summary.categories.map((entry,index)=>{
      const label=entry.name==="내부"?"내부 메리츠 증권":entry.name;
      return shareRow(label,formatMoneyFromKrw(entry.totalKrw),entry.totalKrw/total*100,categoryTones[index%categoryTones.length]);
    }).join("");
    return `<div class="share-list">${rows}</div>`;
  }

  function breakdownTable(summary) {
    const rows=summary.rows.map(row=>{
      const client=`${row.clientName}, ${row.orderId}${row.note?`, ${row.note}`:""}`;
      const account=row.primeAccountId?`<small class="subcell num">${MP.accountLabel(row.primeAccountId)}</small>`:"";
      return `<tr><td class="main-cell">${client}${account}</td><td>${chip(row.category,row.internal?"violet":"info")}</td><td>${row.mode}</td><td class="align-right num">${row.feeBps.toFixed(1)}bp</td><td class="align-right num">${formatMoneyFromKrw(row.notionalKrw)}</td><td class="align-right num ${row.relayKrw?"positive-text":""}">${row.relayKrw?formatMoneyFromKrw(row.relayKrw):"해당 없음"}</td><td class="align-right num ${row.algoKrw?"positive-text":""}">${row.algoKrw?formatMoneyFromKrw(row.algoKrw):"해당 없음"}</td><td class="align-right num positive-text">${formatMoneyFromKrw(row.nettingKrw)}</td><td class="align-right num positive-text">${formatMoneyFromKrw(row.totalKrw)}</td></tr>`;
    }).join("");
    return `<div class="table-scroll"><table class="data-table prime-pnl-table"><thead><tr><th>고객</th><th>카테고리</th><th>모드</th><th class="align-right">요율</th><th class="align-right">오늘 명목</th><th class="align-right">릴레이 마진</th><th class="align-right">알고 수수료</th><th class="align-right">넷팅 이득</th><th class="align-right">합계</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td class="main-cell">합계</td><td colspan="3"></td><td class="align-right num">${formatMoneyFromKrw(summary.notionalKrw)}</td><td class="align-right num positive-text">${formatMoneyFromKrw(summary.relayKrw)}</td><td class="align-right num positive-text">${formatMoneyFromKrw(summary.algoKrw)}</td><td class="align-right num positive-text">${formatMoneyFromKrw(summary.nettingKrw)}</td><td class="align-right num positive-text"><b>${formatMoneyFromKrw(summary.totalKrw)}</b></td></tr></tfoot></table></div>`;
  }

  function renderPrimePnl() {
    const summary=getPrimePnlSummary();
    const metrics=`<div class="metric-grid desk-pnl-metrics">${metric("RFQ 릴레이 마진",formatMoneyFromKrw(summary.relayKrw),"","positive",false)}${metric("알고 수수료",formatMoneyFromKrw(summary.algoKrw),"","positive",false)}${metric("넷팅 이득",formatMoneyFromKrw(summary.nettingKrw),"","positive",false)}${metric("오늘 합계",formatMoneyFromKrw(summary.totalKrw),"","positive",false)}</div>`;
    return `<section class="view prime-pnl-view" data-view="prime-pnl"><div class="pnl-section-heading"><h2>오늘</h2>${chip(state.eodReady?"EOD 확정":"장중 잠정",state.eodReady?"positive":"muted")}</div>${metrics}${panel("고객과 모드별 분해",breakdownTable(summary),{actions:`<span>${btn("XLSX","export","small","download")}</span>`,flush:true})}<div class="grid split-7-5">${panel("모드별 비중",modeShare(summary),{flush:true})}${panel("카테고리별 비중",categoryShare(summary),{flush:true})}</div></section>`;
  }

  MP.renderPrimePnl=renderPrimePnl;
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/prime-evidence.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,formatTradePrice,formatLiteralMoney,formatMoneyFromKrw} = MP;

  const evidenceTradingDate = "2026-09-08";
  const evidenceTabs = [
    {key:"rfq",mode:"RFQ",label:"RFQ 증빙"},
    {key:"algo",mode:"알고",label:"알고 증빙, TCA"}
  ];

  function round4(value) {
    return Math.round(Number(value)*10000)/10000;
  }

  function qtyText(value) {
    return Number(value).toFixed(4);
  }

  function bpsText(value) {
    if(!Number.isFinite(value))return "-";
    return `${value>=0?"+":""}${value.toFixed(2)}bp`;
  }

  function bpsTone(value) {
    if(!Number.isFinite(value))return "";
    return value<=0?"positive-text":"negative-text";
  }

  function percentText(value) {
    if(!Number.isFinite(value))return "-";
    return `${value>0?"+":value<0?"-":""}${Math.abs(value).toFixed(1)}%`;
  }

  function evidenceOrderIdsForRole(role=state.role) {
    if(role==="it-admin"||role==="biz-admin")return state.clientOrders.map(order=>order.id);
    if(MP.isDeskRole(role)){
      return state.clientOrders
        .filter(order=>Boolean(state.clients.find(client=>client.id===order.clientId)?.internal))
        .map(order=>order.id);
    }
    return [];
  }

  function evidenceSelectedOrderId(role=state.role) {
    const ids=evidenceOrderIdsForRole(role);
    if(!ids.length)return null;
    return ids.includes(state.evidenceOrderId)?state.evidenceOrderId:ids[0];
  }

  function evidenceOrderById(orderId) {
    return state.clientOrders.find(order=>order.id===orderId)||null;
  }

  function evidenceSelectedOrder(role=state.role) {
    const id=evidenceSelectedOrderId(role);
    return id?evidenceOrderById(id):null;
  }

  function evidenceAnonymised(role=state.role) {
    return role!=="it-admin"&&role!=="biz-admin"?true:state.vendorAnonymised;
  }

  function evidenceVendorName(vendor,role=state.role) {
    if(!vendor)return "";
    return evidenceAnonymised(role)?vendor.anonName:vendor.name;
  }

  function evidenceSourcingOrder(order) {
    if(!order)return null;
    return state.primeOrders.find(item=>item.id===String(order.id).replace(/^ORD-/,"PRM-"))||null;
  }

  function evidenceClient(order) {
    return state.clients.find(client=>client.id===order?.clientId)||null;
  }

  function evidenceCaptureRfq() {
    return state.activeRfqs.find(item=>item.mode==="RFQ 릴레이"&&Array.isArray(item.acceptances)&&item.acceptances.length)
      ||state.activeRfqs.find(item=>Array.isArray(item.acceptances)&&item.acceptances.length)
      ||null;
  }

  /* RFQ 주문의 증빙은 쿼트 스택 캡처와 그 주문의 체결 기록 두 벌로 구성된다. */
  function evidenceFillForOrder(order) {
    if(!order||!Array.isArray(state.rfqFills))return null;
    return state.rfqFills.find(item=>item.orderId===order.id)||null;
  }

  function evidenceRfqPack(order,role=state.role) {
    const base=MP.primeQuotePricing();
    const best=MP.bestVendorQuote();
    const bestAllInUsd=best?best.allIn:base.bestAllInUsd;
    const markupBps=Number.isFinite(order?.feeBps)?order.feeBps:0;
    const markupUsd=MP.roundCents(bestAllInUsd*markupBps/10000);
    const clientPriceUsd=MP.roundCents(bestAllInUsd+markupUsd);
    const fill=evidenceFillForOrder(order);
    const rfq=(fill&&state.activeRfqs.find(item=>item.id===fill.rfqId))||evidenceCaptureRfq();
    const acceptances=rfq&&Array.isArray(rfq.acceptances)?rfq.acceptances:[];
    const acceptedId=rfq?.acceptedVendorId||(best?best.id:null);
    const captured=acceptances.map(entry=>{
      const vendor=state.vendorQuotes.find(item=>item.id===entry.vendorId)||null;
      return {vendor,allIn:entry.allIn,at:entry.at,excluded:false};
    }).filter(row=>row.vendor);
    const excluded=state.vendorQuotes
      .filter(vendor=>!acceptances.some(entry=>entry.vendorId===vendor.id))
      .map(vendor=>({vendor,allIn:vendor.allIn,at:vendor.receivedAt,excluded:true}));
    const excludedNames=excluded.map(row=>evidenceVendorName(row.vendor,role)).join(", ");
    return {
      order,
      rfq,
      fill,
      acceptedId,
      bestAllInUsd,markupBps,markupUsd,clientPriceUsd,
      notionalKrw:Number.isFinite(order?.notionalKrw)?order.notionalKrw:0,
      quoteCount:state.vendorQuotes.length,
      captured,excluded,excludedNames,
      capturedAt:`${evidenceTradingDate} ${MP.latestVendorQuoteTime()}`,
      fileName:`RFQ-EVID-${String(order?.id||"").replace(/^ORD-/,"")}.txt`
    };
  }

  function evidenceAlgoPack(order,role=state.role) {
    const sourcing=evidenceSourcingOrder(order);
    const windowState=state.executionWindowState;
    const provisional=windowState!=="print";
    const view=MP.executionMonitorMetrics(provisional?windowState:"print");
    const rows=view.rows.filter(row=>row.status!=="대기");
    const drifts=rows.map(row=>({row,percent:row.targetQty>0?(row.fillQty-row.targetQty)/row.targetQty*100:0}));
    const maxDrift=drifts.slice().sort((a,b)=>b.percent-a.percent)[0]||null;
    const collarText=MP.orderModeParams().find(param=>param.key==="collar")?.value||"";
    const collarBps=Number(String(collarText).replace(/[^0-9.]/g,""))||0;
    const collarBreaches=rows.filter(row=>{
      const bps=MP.executionBucketBps(row);
      return Number.isFinite(bps)&&Math.abs(bps)>collarBps;
    }).length;
    const notionalKrw=Number.isFinite(order?.notionalKrw)?order.notionalKrw:0;
    const vendorFeeBps=Number.isFinite(sourcing?.vendorFeeBps)?sourcing.vendorFeeBps:0;
    const primeFeeBps=Number.isFinite(sourcing?.feeBps)?sourcing.feeBps:Number.isFinite(order?.feeBps)?order.feeBps:0;
    const routing=Array.isArray(sourcing?.vendorRouting)?sourcing.vendorRouting:[];
    const routedVendors=routing.map(entry=>state.vendorQuotes.find(item=>item.id===entry.vendorId)).filter(Boolean);
    const anonList=routedVendors.map((vendor,index)=>index?vendor.anonName.replace(/^벤더\s*/,""):vendor.anonName).join(", ");
    return {
      order,sourcing,view,rows,drifts,maxDrift,collarText,collarBps,collarBreaches,
      notionalKrw,
      vendorFeeBps,vendorFeeKrw:Math.round(notionalKrw*vendorFeeBps/10000),
      primeFeeBps,primeFeeKrw:Math.round(notionalKrw*primeFeeBps/10000),
      totalFeeBps:Math.round((vendorFeeBps+primeFeeBps)*10)/10,
      totalFeeKrw:Math.round(notionalKrw*(vendorFeeBps+primeFeeBps)/10000),
      routedVendors,anonList,
      windowState,provisional,
      fixingLabel:provisional?"예상 픽싱":"확정 픽싱",
      driftBps:provisional?view.weightedBps:view.confirmedBps,
      fileName:`ALG-TCA-${String(sourcing?sourcing.id:order?.id||"").replace(/^(PRM|ORD)-/,"")}.txt`
    };
  }

  function usdOrDash(value) {
    return Number.isFinite(value)?formatLiteralMoney(value,"USD"):"산출 전";
  }

  function priceText(value) {
    return Number.isFinite(value)?formatTradePrice(value):"산출 전";
  }

  function evidenceKindForOrder(order) {
    return order?.mode==="알고"?"algo":"rfq";
  }

  function evidenceFileBody(order,kind,role=state.role) {
    const client=evidenceClient(order);
    const anonymised=evidenceAnonymised(role);
    const head=`MERITZ PRIME EVIDENCE\r\nOrder: ${order.id}\r\nClient: ${client?client.name:order.clientId}\r\nAnonymised: ${anonymised?"ON":"OFF"}\r\n`;
    if(kind==="algo"){
      const pack=evidenceAlgoPack(order,role);
      const view=pack.view;
      const lines=pack.rows.map(row=>`${row.label}\t${qtyText(row.targetQty)}\t${qtyText(row.fillQty)}\t${usdOrDash(row.fillPriceUsd)}\t${usdOrDash(row.medianUsd)}\t${bpsText(MP.executionBucketBps(row))}`).join("\r\n");
      const stamp=pack.provisional?" (잠정)":"";
      const fixingLabel=pack.fixingLabel;
      const driftValue=pack.driftBps;
      return {
        name:pack.fileName,
        content:`${head}Kind: 알고 증빙, TCA${stamp}\r\n${fixingLabel}${stamp}: ${usdOrDash(view.fixingUsd)}\r\n평균 체결가: ${usdOrDash(view.averagePriceUsd)}\r\n${fixingLabel} 대비${stamp}: ${bpsText(driftValue)}\r\n구간 이탈 가중 평균: ${bpsText(view.weightedBps)}\r\n벤더 수수료: ${pack.vendorFeeBps.toFixed(1)}bp, ${formatLiteralMoney(pack.vendorFeeKrw,"KRW")}\r\n프라임 수수료: ${pack.primeFeeBps.toFixed(1)}bp, ${formatLiteralMoney(pack.primeFeeKrw,"KRW")}\r\n합계 비용: ${pack.totalFeeBps.toFixed(1)}bp, ${formatLiteralMoney(pack.totalFeeKrw,"KRW")}\r\n벤더 표기: ${pack.anonList}\r\n\r\n${lines}\r\n`
      };
    }
    const pack=evidenceRfqPack(order,role);
    const lines=[...pack.captured,...pack.excluded]
      .map(row=>`${evidenceVendorName(row.vendor,role)}\t${formatLiteralMoney(row.allIn,"USD")}\t${row.at}${row.excluded?"\t고객 제외 베뉴":""}`)
      .join("\r\n");
    const fillBody=pack.fill
      ?`체결 시각: ${evidenceTradingDate} ${pack.fill.at}\r\n체결 벤더: ${anonymised?pack.fill.vendorLabel:(state.vendorQuotes.find(item=>item.id===pack.fill.vendorId)?.name||pack.fill.vendorLabel)}\r\n체결 올인가: ${formatLiteralMoney(pack.fill.allInUsd,"USD")}\r\n체결 수량: ${pack.fill.side} ${pack.fill.quantity.toFixed(4)} ${pack.fill.asset}\r\n연결 RFQ: ${pack.fill.rfqId}\r\n정산 사이클: ${pack.fill.cycle}, ${pack.fill.settlementWalletId}\r\n`
      :"";
    return {
      name:pack.fileName,
      content:`${head}Kind: RFQ 증빙\r\n${fillBody}캡처 시각: ${pack.capturedAt}\r\n수집 호가: ${pack.quoteCount}건, 벤더 ${pack.quoteCount}곳\r\n선택 근거: 베스트 올인가 ${formatLiteralMoney(pack.bestAllInUsd,"USD")}\r\n마크업: ${pack.markupBps.toFixed(1)}bp, ${formatLiteralMoney(pack.markupUsd,"USD")}\r\n고객 제시가: ${formatLiteralMoney(pack.clientPriceUsd,"USD")}\r\n마크업 전 명목: ${formatLiteralMoney(pack.notionalKrw,"KRW")}\r\n제외 베뉴: ${pack.excludedNames}, 고객 지정\r\n\r\n${lines}\r\n`
    };
  }

  function evidenceContextOrderId() {
    const allowed=evidenceOrderIdsForRole();
    const scoped=id=>id&&allowed.includes(id)?id:null;
    if(state.current==="ap-execution")return scoped(typeof MP.executionContextClientOrderId==="function"?MP.executionContextClientOrderId("desk"):null);
    if(state.current==="prime-execution")return scoped(state.executionMonitorOrderId);
    if(state.current==="client-portal")return scoped(state.clientPortal.orderId);
    if(state.current==="portfolio"){
      const mapped=String(state.selectedPortfolioRow||"").replace(/^PRM-/,"ORD-");
      if(evidenceOrderById(mapped))return scoped(mapped);
    }
    return evidenceSelectedOrderId()||scoped(state.clientPortal.orderId);
  }

  function evidenceLine(label,value,note="",tone="") {
    return `<div class="evidence-line"><div><span>${label}</span>${note?`<small>${note}</small>`:""}</div><strong class="num ${tone}">${value}</strong></div>`;
  }

  function rfqPanel(order,role) {
    const pack=evidenceRfqPack(order,role);
    const lines=[
      evidenceLine("캡처 시각",pack.capturedAt),
      evidenceLine("수집 호가",`${pack.quoteCount}건, 벤더 ${pack.quoteCount}곳`),
      evidenceLine("선택 근거",`베스트 올인가 ${formatLiteralMoney(pack.bestAllInUsd,"USD")}`),
      evidenceLine("마크업",`${pack.markupBps.toFixed(1)}bp, ${formatLiteralMoney(pack.markupUsd,"USD")}`),
      evidenceLine("고객 제시가",formatLiteralMoney(pack.clientPriceUsd,"USD"),"","positive-text"),
      evidenceLine("마크업 전 명목",formatMoneyFromKrw(pack.notionalKrw)),
      evidenceLine("제외 베뉴",`${pack.excludedNames}, 고객 지정`)
    ].join("");
    const fill=pack.fill;
    const fillLines=fill?[
      evidenceLine("체결 시각",`${evidenceTradingDate} ${fill.at}`),
      evidenceLine("체결 벤더",evidenceAnonymised(role)?fill.vendorLabel:(state.vendorQuotes.find(item=>item.id===fill.vendorId)?.name||fill.vendorLabel)),
      evidenceLine("체결 올인가",formatLiteralMoney(fill.allInUsd,"USD"),"","positive-text"),
      evidenceLine("체결 수량",`${fill.side} ${fill.quantity.toFixed(4)} ${fill.asset}`),
      evidenceLine("연결 RFQ",fill.rfqId),
      evidenceLine("정산 사이클",`${fill.cycle}, ${fill.settlementWalletId}`)
    ].join(""):"";
    const fillBlock=fill
      ?`<div class="evidence-summary"><span class="status-dot positive"></span><p>RFQ 모드는 집행 레그가 없으므로 수락 올인가가 곧 체결가이며 아래 체결 기록이 캡처와 한 벌로 증빙이 됨</p></div><div class="evidence-lines">${fillLines}</div>`
      :"";
    const rows=[...pack.captured,...pack.excluded].map(row=>{
      const isBest=!row.excluded&&row.vendor.id===pack.acceptedId;
      return `<tr class="${isBest?"best-row":""}${row.excluded?" excluded-row":""}"><td class="main-cell vendor-cell"><strong>${evidenceVendorName(row.vendor,role)}${isBest?chip("BEST","positive"):""}${row.excluded?chip("고객 제외 베뉴","warning"):""}</strong></td><td class="align-right num">${formatLiteralMoney(row.allIn,"USD")}</td><td class="align-right num">${row.at}</td></tr>`;
    }).join("");
    const table=`<div class="table-scroll"><table class="data-table evidence-quote-table"><thead><tr><th>벤더</th><th class="align-right">올인가</th><th class="align-right">수신 시각</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    const note='<div class="evidence-summary"><span class="status-dot info"></span><p>쿼트 스택 전량이 원본 그대로 첨부되며 베스트 이외 호가와 수신 시각을 포함해 베스트엑스 근거로 사용</p></div>';
    const gate=MP.canControl("exec","prime");
    const actions=btn("고객 다운로드","prime-evidence-rfq","small","download",gate?"":"disabled");
    const anonHint=state.vendorQuotes.filter(vendor=>!vendor.excluded).map((vendor,index)=>index?vendor.anonName.replace(/^벤더\s*/,""):vendor.anonName).join(", ");
    const footer=`파일 ${pack.fileName}, 실물은 3면 PDF, 익명화 ON이면 ${anonHint} 표기`;
    return panel("RFQ 증빙",`${note}<div class="evidence-lines">${lines}</div>${table}${fillBlock}`,{actions,flush:true,footer:`<span>${footer}</span>`});
  }

  function algoPanel(order,role) {
    const pack=evidenceAlgoPack(order,role);
    const view=pack.view;
    const stamp=pack.provisional?", 잠정":"";
    const left=[
      evidenceLine(pack.fixingLabel,priceText(view.fixingUsd),`${pack.rows.length}구간 중앙값 평균${stamp}`,"violet-text"),
      evidenceLine("평균 체결가",priceText(view.averagePriceUsd)),
      evidenceLine(`${pack.fixingLabel} 대비`,bpsText(pack.driftBps),"",bpsTone(pack.driftBps)),
      evidenceLine("구간 이탈 가중 평균",bpsText(view.weightedBps),"",bpsTone(view.weightedBps)),
      evidenceLine("최대 수량 이탈",pack.maxDrift?`${percentText(pack.maxDrift.percent)}, ${pack.maxDrift.row.label}`:"해당 없음"),
      evidenceLine("칼라 위반",`${pack.collarBreaches}건`,`프라이스 칼라 ${pack.collarText}`,pack.collarBreaches?"negative-text":"positive-text")
    ].join("");
    const right=[
      evidenceLine("벤더 수수료",`${pack.vendorFeeBps.toFixed(1)}bp, ${formatMoneyFromKrw(pack.vendorFeeKrw)}`),
      evidenceLine("프라임 수수료",`${pack.primeFeeBps.toFixed(1)}bp, ${formatMoneyFromKrw(pack.primeFeeKrw)}`),
      evidenceLine("합계 비용",`${pack.totalFeeBps.toFixed(1)}bp, ${formatMoneyFromKrw(pack.totalFeeKrw)}`),
      `<div class="evidence-line"><div><span>귀속</span></div>${chip("고객","violet")}</div>`,
      `<div class="evidence-line"><div><span>벤더 표기</span></div><strong>${pack.anonList} 익명화</strong></div>`
    ].join("");
    const rows=pack.drifts.map(({row,percent})=>{
      const bps=MP.executionBucketBps(row);
      return `<tr><td class="num">${row.label}</td><td class="align-right num">${qtyText(row.targetQty)}</td><td class="align-right num">${qtyText(row.fillQty)}</td><td class="align-right num ${percent>=0?"positive-text":"negative-text"}">${percentText(percent)}</td><td class="align-right num">${priceText(row.fillPriceUsd)}</td><td class="align-right num">${priceText(row.medianUsd)}</td><td class="align-right num ${bpsTone(bps)}">${bpsText(bps)}</td></tr>`;
    }).join("");
    const footTargetQty=round4(pack.rows.reduce((sum,row)=>sum+row.targetQty,0));
    const footFillQty=round4(pack.rows.reduce((sum,row)=>sum+row.fillQty,0));
    const totalDrift=footTargetQty>0?(footFillQty-footTargetQty)/footTargetQty*100:0;
    const foot=`<tfoot><tr><td>${pack.rows.length}구간</td><td class="align-right num">${qtyText(footTargetQty)}</td><td class="align-right num">${qtyText(footFillQty)}</td><td class="align-right num">${percentText(totalDrift)}</td><td class="align-right num">${priceText(view.averagePriceUsd)}</td><td class="align-right num">${priceText(view.fixingUsd)}</td><td class="align-right num ${bpsTone(pack.driftBps)}">${bpsText(pack.driftBps)}</td></tr></tfoot>`;
    const head='<thead><tr><th>구간</th><th class="align-right">Quantizer 목표</th><th class="align-right">체결</th><th class="align-right">수량 이탈</th><th class="align-right">구간 체결가</th><th class="align-right">구간 중앙값</th><th class="align-right">구간 이탈</th></tr></thead>';
    const table=`<div class="table-scroll"><table class="data-table evidence-tca-table">${head}<tbody>${rows}</tbody>${foot}</table></div>`;
    const gate=MP.canControl("exec","prime");
    const stateChip=chip(pack.provisional?"잠정, 윈도 진행 중":"확정, 프린트 완료",pack.provisional?"warning":"positive");
    const actions=`${stateChip}${btn("고객 다운로드","prime-evidence-algo","small","download",gate?"":"disabled")}`;
    const footer=`파일 ${pack.fileName}, 실물은 5면 PDF, 윈도 종료 전에는 화면과 파일이 함께 잠정 표기이고 확정 픽싱 자리에 예상 픽싱이 들어감`;
    const body=`<div class="evidence-split"><div class="evidence-lines">${left}</div><div class="evidence-lines">${right}</div></div>${table}`;
    return panel("알고 증빙, TCA",body,{actions,flush:true,footer:`<span>${footer}</span>`});
  }

  function evidenceHeader(order,role) {
    const client=evidenceClient(order);
    const scope=MP.isDeskRole(role)?"내부 고객 주문만":"전 주문";
    return `<header class="prime-quote-header evidence-header"><div><h2>${order.id}</h2><p>${client?`${client.name}, ${client.category}`:order.clientId}</p></div><div class="prime-quote-header-right">${chip(order.mode,order.mode==="알고"?"violet":"info")}${chip(scope,"muted")}${chip(evidenceAnonymised(role)?"벤더 익명화 적용":"프라임 내부 실명",evidenceAnonymised(role)?"violet":"muted")}</div></header>`;
  }

  function evidenceSelect(order,role) {
    const ids=evidenceOrderIdsForRole(role);
    const options=ids.map(id=>{
      const row=evidenceOrderById(id);
      const client=evidenceClient(row);
      return `<option value="${id}" ${id===order.id?"selected":""}>${id}, ${client?client.name:row?.clientId||""}, ${row?row.mode:""}</option>`;
    }).join("");
    return `<div class="evidence-toolbar"><label class="evidence-order-select"><span>주문</span><span data-owned-panel><select class="select" data-evidence-order>${options}</select></span></label>${chip(`${ids.length}건 열람 범위`,"info")}</div>`;
  }

  function evidenceTabStrip(order) {
    const active=evidenceKindForOrder(order);
    const tabs=evidenceTabs.map(tab=>{
      const on=tab.key===active;
      return `<button type="button" class="${on?"active":""}" ${on?"":'disabled title="해당 모드 아님"'}>${tab.label}${on?"":' <span class="evidence-tab-off">해당 모드 아님</span>'}</button>`;
    }).join("");
    return `<div class="tabs compact evidence-tabs">${tabs}</div>`;
  }

  function renderPrimeEvidence() {
    const role=state.role;
    const order=evidenceSelectedOrder(role);
    if(!order){
      return '<section class="view prime-evidence-view" data-view="prime-evidence"><div class="empty-note">열람 가능한 주문 없음</div></section>';
    }
    const body=evidenceKindForOrder(order)==="algo"?algoPanel(order,role):rfqPanel(order,role);
    return `<section class="view prime-evidence-view" data-view="prime-evidence">${evidenceHeader(order,role)}${evidenceSelect(order,role)}${evidenceTabStrip(order)}${body}</section>`;
  }

  Object.assign(MP,{
    renderPrimeEvidence,
    evidenceOrderIdsForRole,
    evidenceSelectedOrderId,
    evidenceSelectedOrder,
    evidenceOrderById,
    evidenceKindForOrder,
    evidenceFileBody,
    evidenceContextOrderId,
    evidenceAnonymised
  });
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/admin-system.js">
(function (MP) {
  "use strict";
  const {state,chip,metric,panel}=MP;
  const tabs=[["connections","연결 상태"],["specs","시스템 사양"],["audit","감사로그"]];
  function systemTabs(){if(!tabs.some(([id])=>id===state.systemTab))state.systemTab="connections";return `<div class="tabs">${tabs.map(([id,label])=>`<button type="button" class="${state.systemTab===id?"active":""}" data-action="system-tab" data-tab="${id}">${label}</button>`).join("")}</div>`;}
  function clientSessions(){const rows=state.connectedClients.map(item=>`<tr><td class="main-cell">${item.company}<small class="subcell num">${item.companyId}</small></td><td>${item.user}</td><td>${item.role}</td><td class="num">${item.connectedAt}</td><td class="num">${item.lastActive}</td><td class="num">${item.ipRange}</td><td>${chip(item.status,item.status==="접속"?"positive":"warning")}</td></tr>`).join("");return panel("접속 클라이언트",`<div class="table-scroll"><table class="data-table"><thead><tr><th>고객사</th><th>사용자</th><th>역할</th><th>접속 시각</th><th>마지막 활동</th><th>IP 대역</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table></div>`,{flush:true});}
  function vendorConnections(){const rows=state.vendorConnectivity.map(item=>`<tr><td class="main-cell">${item.name}</td><td>${item.protocol}</td><td>${chip(item.status,item.status==="정상"?"positive":"warning")}</td><td class="align-right num">${item.latencyMs}</td><td class="num">${item.lastQuoteAt}</td><td class="align-right num">${item.dailyQuotes.toLocaleString("ko-KR")}</td></tr>`).join("");return panel("RFQ 벤더 연결",`<div class="table-scroll"><table class="data-table"><thead><tr><th>벤더</th><th>프로토콜</th><th>상태</th><th class="align-right">지연 ms</th><th>최근 호가 시각</th><th class="align-right">일일 호가 수</th></tr></thead><tbody>${rows}</tbody></table></div>`,{flush:true});}
  function custodyConnections(){const rows=state.custodyConnectivity.map(item=>`<tr><td class="main-cell">${item.name}</td><td>${chip(item.apiStatus,item.apiStatus==="정상"?"positive":"warning")}</td><td class="num">${item.lastSync}</td><td class="align-right num">${item.balanceDelaySec}초</td></tr>`).join("");return panel("커스터디 연결",`<div class="table-scroll"><table class="data-table"><thead><tr><th>커스터디</th><th>API 상태</th><th>최근 동기화</th><th class="align-right">잔고 동기화 지연</th></tr></thead><tbody>${rows}</tbody></table></div>`,{flush:true});}
  function connectionsTab(){return `<div class="system-connection-stack">${clientSessions()}${vendorConnections()}${custodyConnections()}</div>`;}
  function specsTab(){const rows=state.systemSpecs.map(([key,value])=>`<tr><th>${key}</th><td class="num">${value}</td></tr>`).join("");return panel("시스템 사양",`<div class="table-scroll"><table class="data-table system-spec-table"><tbody>${rows}</tbody></table></div>`,{flush:true});}
  function auditTab(){const rows=state.auditLogs.map(item=>`<tr><td class="num">${item.time}</td><td>${item.user}</td><td class="main-cell">${item.action}</td><td>${item.target}</td><td>${chip(item.result,item.tone)}</td></tr>`).join("");return panel("감사로그",`<div class="table-scroll"><table class="data-table"><thead><tr><th>시각</th><th>사용자</th><th>액션</th><th>대상</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table></div>`,{flush:true});}
  function renderSystemContent(){if(state.systemTab==="specs")return specsTab();if(state.systemTab==="audit")return auditTab();return connectionsTab();}
  function renderAdminSystem(){const normalVendors=state.vendorConnectivity.filter(item=>item.status==="정상").length,normalCustody=state.custodyConnectivity.filter(item=>item.apiStatus==="정상").length;return `<section class="view admin-system-view" data-view="admin-system"><div class="metric-grid">${metric("접속 세션",`${state.connectedClients.length}개`,"현재 연결","positive",false)}${metric("RFQ 벤더",`${normalVendors} / ${state.vendorConnectivity.length}`,"정상 연결","info",false)}${metric("커스터디",`${normalCustody} / ${state.custodyConnectivity.length}`,"API 정상","info",false)}${metric("업타임",state.systemSpecs.find(([key])=>key==="업타임")?.[1]||"없음","","positive",false)}</div>${systemTabs()}${renderSystemContent()}</section>`;}
  Object.assign(MP,{systemTabs,renderSystemContent,renderAdminSystem});
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/core/router.js">
(function (MP) {
  "use strict";

  const {state,btn,chip,formatTradePrice} = MP;
  const screens = {
    trade:{name:"Trade",render:MP.renderTrade,actions:[]},
    portfolio:{name:"Portfolio",render:MP.renderPortfolio,actions:[btn("내보내기","export","","download")]},
    /* D-0914: 집행은 정해진 스케줄을 따르므로 실행 정지 버튼을 두지 않는다. */
    "ap-execution":{name:"Execution",render:MP.renderApExecution,actions:[btn("중간 증빙","download-evidence","","download")]},

  /* USER_ACCOUNT_MODEL §3.2, 7 roles x 13 routes. E editable, R read only, X no access.
     D-0910-09는 프라임 2역할에서 `prime-queue`, `prime-quotes`, `prime-execution`,

  function accessFor(route,role=state.role){return routeAccess[route]?.[MP.resolveRole(role)]||"X";}

  const settingClasses=["contract","ops","exec"];
  /* v3.1 gate. `traderRoles` never control a [한] or a [운] setting; the master roles
     never control a [한] one. `ops` + owner "securities" opened to `desk-master`,
     `exec` + owner "securities" accepted for both desk keys, and an owner naming a role
     key ("desk-master", "biz-admin") stays that role's exclusive execution act. */
  const deskRoles=["desk-master","desk-trader"];
  const traderRoles=["desk-trader","client-trader","client-accounting"];
  const primeOpsRoles=["it-admin","biz-admin"];
  const execRoles=["desk-master","desk-trader","client-master","client-trader"];

  function canControl(settingClass,owner=null,role=state.role) {
    role=MP.resolveRole(role);
    if(!settingClasses.includes(settingClass))return false;
    if(settingClass!=="exec"&&traderRoles.includes(role))return false;
    if(settingClass==="contract")return role==="biz-admin";
    if(settingClass==="ops"){
      if(!owner||owner==="prime")return primeOpsRoles.includes(role);
      if(owner==="client")return role==="client-master";
      if(owner==="securities")return role==="desk-master";
      return role===owner;
    }
    if(!owner)return execRoles.includes(role);
    if(owner==="prime")return primeOpsRoles.includes(role);
    if(owner==="client")return role==="client-master"||role==="client-trader";
    if(owner==="securities")return deskRoles.includes(role);
    return role===owner;
  }

  function settingControl(settingClass,owner,editableMarkup,readonlyMarkup) {
    return canControl(settingClass,owner)?editableMarkup:readonlyMarkup;
  }

  function isRouteAllowed(route,role=state.role) {

  /* 헤지 체결 1건을 아직 짝이 없는 KRX 체결에 매칭한다. 매수 헤지는 ETF 매도 체결(잔량 양수),
     매도 헤지는 ETF 매수 체결(잔량 음수)과 짝을 이룬다. 마진 bp 는 그 방향의 제안 호가 폭,
     드래그 bp 는 헤지 범프에 테이커 가산을 더한 값, 손익은 캡처 bp 에 KRX 체결 금액을 곱한 값이다. */
  function addPairingRows(hedgeId,hedgeTime,quantity,linkedBusiness=`hedge:${hedgeId}`,rowId=null) {
    const pairedIds=new Set(state.pairingRows.map(item=>item.krx));
    const order=state.lpHedgeQueue.find(item=>item.id===hedgeId);
    const buyHedge=order?order.side==="BUY":true;
    const candidates=[...state.lpFills].reverse().filter(fill=>(buyHedge?fill.qty>0:fill.qty<0)&&!pairedIds.has(fill.id)&&(!rowId||fill.rowId===rowId));
    let remaining=quantity;
    candidates.forEach(fill=>{
      if(remaining<=0)return;
      const row=state.lpBookRows.find(item=>item.id===fill.rowId);
      const params=row?row.params:{};
      const sell=fill.side==="SELL";
      const margin=Number.isFinite(sell?params.askOffsetBp:params.bidOffsetBp)?(sell?params.askOffsetBp:params.bidOffsetBp):5;
      const bump=Number.isFinite(sell?params.hedgeBidOffsetBp:params.hedgeAskOffsetBp)?(sell?params.hedgeBidOffsetBp:params.hedgeAskOffsetBp):2;
      const drag=Math.round((bump+(params.hedgePriceType==="taker"?1:0))*10)/10;
      const capture=Math.round(fill.shares*fill.price*Math.max(0,margin-drag)/10000);
      state.pairingRows.unshift({rowId:fill.rowId,bookId:fill.bookId,krx:fill.id,krxTime:fill.time,shares:fill.shares,hedge:hedgeId,hedgeTime,margin,drag,capture,linkedBusiness});
      remaining-=Math.abs(fill.qty);
    });
  }

  function repaintLp() {

  /* 적용 버튼과 자동 헤지 ON 전환이 같이 쓰는 파라미터 반영. */
  function applyRowParams(row) {
    if(!row||!row.dirty)return false;
    const fields=[...row.dirtyFields];
    fields.forEach(field=>{if(field==="autohedge")row[field]=row.pendingParams[field];else row.params[field]=row.pendingParams[field];});
    row.pendingParams={};
    row.dirtyFields=[];
    row.dirty=false;
    /* 파라미터를 반영한 시점에 세이프티 기준값을 다시 잡는다. 변경 전 기준으로 잡힌
       iNAV 와 현물 때문에 적용 자체가 트립을 만드는 일을 막는다. */
    if(typeof MP.lpResetSafetyRefs==="function")MP.lpResetSafetyRefs(row);
    syncLpRiskMirror();
    addAudit("BOOKROW_PARAM_APPLY",`${row.id}, ${fields.join(", ")}`);
    return true;
  }

  function syncLpBookSelection() {
    const order=state.etfBooks.map(book=>book.id);
    state.lpBookSelection=order.filter(id=>state.lpBookSelection.includes(id));
    const visible=state.lpBookRows.filter(row=>state.lpBookSelection.includes(row.bookId));
    if(!visible.some(row=>row.id===state.lpRowSelected))state.lpRowSelected=visible[0]?.id||state.lpRowSelected;
  }

  function syncLpRiskMirror() {
    state.riskSettings.hedgeThresholdBtc=Math.max(...state.lpBookRows.filter(row=>row.underlying==="BTC").map(row=>row.params.netHedgeThresholdBtc));
  }

  function stageRowValue(row,field,value) {
    if(!row)return false;
    const topLevel=field==="autohedge";
    const current=topLevel?row[field]:row.params[field];
    if(current===undefined||value===current){delete row.pendingParams[field];}
    else row.pendingParams[field]=value;
    row.dirtyFields=Object.keys(row.pendingParams);
    row.dirty=row.dirtyFields.length>0;
    if(row.dirty&&row.engineStatus==="automatic"){
      row.autohedge=false;
      row.orderAction="RUN";
      row.engineStatus="manual";
      addAudit("AUTOHEDGE_OFF",`${row.id}, 파라미터 편집 자동 정지`);
    }
    return true;
  }

  function toggleRowAutohedge(row,enabled,{quiet=false}={}) {
    if(!row)return false;
    if(enabled){
      /* 미적용 파라미터가 있는 행도 ON 으로 넘길 수 있다. 적용을 먼저 수행하고 dirty 를 턴다. */
      applyRowParams(row);
      /* 세이프티 LOCK 상태에서 ON 을 누르는 것은 해제 의사로 본다. 한 번의 클릭으로
         해제하고 켠다. */
      if(row.safetyLock){
        row.safetyLock=null;
        row.safetyTrippedAt=null;
        row.cooldownUntilTick=null;
        if(typeof MP.lpResetSafetyRefs==="function")MP.lpResetSafetyRefs(row);
        addAudit("BOOKROW_SAFETY_UNLOCK",`${row.id}, 자동 헤지 ON 으로 해제`);
      }
      /* 차단 사유는 행 토글 옆 문구와 같은 판정을 쓴다. 계정은 북 기본값까지 본다. */
      const block=typeof MP.lpAutohedgeBlock==="function"?MP.lpAutohedgeBlock(row):null;
      if(block){if(!quiet)showToast("오토헤지 가동 차단",`${lpRowLabel(row)}, ${block.label}`,"danger");return false;}
    }
    row.autohedge=enabled;
    row.orderAction=enabled?"STOP":"RUN";
    row.engineStatus=enabled?"automatic":"manual";
    addAudit(enabled?"AUTOHEDGE_ON":"AUTOHEDGE_OFF",`${row.id}, ${lpRowLabel(row)}`);
    if(enabled)MP.applyLpHedgePolicy(row.id);
    return true;
  }

    renderNotifications();

    const connection=document.getElementById("connection-chip");

      const connected=state.connection==="connected", disconnected=state.connection==="disconnected";

      connection.querySelector("b").textContent=connected?"CONNECTED":disconnected?"DISCONNECTED":"CONNECTING";
      connection.querySelector(".status-dot").className=`status-dot ${connected?"positive":disconnected?"negative":"muted"}`;
    }

  function navigate(route,viewMode=null) {
    let toCard=false;
    if(orderCardAliases.includes(route)){route="trade";toCard=true;}
    if(route==="reports")route="settlement";
    if(route==="blotter"||route==="pnl"||route==="ap-pnl"||route==="lp-pnl")route="portfolio";
    if(route==="admin-pnl"||route==="desk-pnl")route="prime-pnl";
    if (!screens[route]) route = roleDefaults[state.role];
    if(route==="trade"){
      if(toCard)openOrderCard();
      else state.tradeView=viewMode||"watch";
    }
    if (location.hash.slice(1)===route) renderRoute(route);
    else location.hash = route;
  }

  function placeScreenActions(route,actions) {
    if(!actions.length)return;
    const markup=`<div class="screen-actions">${actions.join("")}</div>`;
    if(route==="portfolio"){
      host.querySelector(".portfolio-tab-filters")?.insertAdjacentHTML("beforeend",markup);
      return;
    }
    const slot=host.querySelector(".panel-header .panel-actions");
    if(slot)slot.insertAdjacentHTML("beforeend",markup);
  }

  function renderRoute(route=location.hash.slice(1),resetScroll=true) {
    if(windowScreens[route]){
      const popup=windowScreens[route];
      document.body.classList.add("window-mode");
      state.current=route;
      host.classList.remove("readonly-view");
      host.innerHTML=isRouteAllowed("lp-desk")?popup.render():`<section class="view lp-window"><div class="empty-note">${roleNames[state.role]} 역할은 이 창을 열 수 없습니다.</div></section>`;
      host.scrollTop=0;
      document.title=`${popup.title} · Meritz Prime`;
      syncGlobalState();
      return;
    }
    document.body.classList.remove("window-mode");
    host.classList.remove("readonly-view");
    if(orderCardAliases.includes(route)){route="trade";openOrderCard();history.replaceState(null,"","#trade");}
    if(route==="reports"){route="settlement";history.replaceState(null,"","#settlement");}
    if(route==="blotter"||route==="pnl"||route==="ap-pnl"||route==="lp-pnl"){route="portfolio";history.replaceState(null,"","#portfolio");}
    if(route==="admin-pnl"||route==="desk-pnl"){route="prime-pnl";history.replaceState(null,"","#prime-pnl");}
    if (!screens[route]) route=roleDefaults[state.role];
    state.current=route;
    const screen=screens[route];
    const allowed=isRouteAllowed(route);
    document.querySelectorAll(".nav-item").forEach(item=>{const active=allowed&&item.dataset.route===route;item.classList.toggle("active",active);if(active)item.setAttribute("aria-current","page");else item.removeAttribute("aria-current");});
    if(!allowed){
      host.innerHTML=`<section class="view"><div class="access-denied"><div class="access-denied-inner"><span class="access-denied-mark">!</span><h2>권한 없음</h2><p>${roleNames[state.role]} 역할은 ${screen.name} 화면에 접근할 수 없습니다.</p>${btn("기본 화면으로 이동","role-home","primary","arrow")}</div></div></section>`;
      host.scrollTop=0;
      document.title=`권한 없음 · Meritz Prime`;
      syncGlobalState();
      return;
    }
    const actions=typeof screen.actions==="function"?screen.actions():screen.actions;
    const scrollTop=host.scrollTop;
    host.innerHTML=screen.render();
    placeScreenActions(route,actions);
    const access=accessFor(route);
    if(access==="R"){
      host.classList.add("readonly-view");
      const ownedState=new Map([...host.querySelectorAll("[data-owned-panel] button,[data-owned-panel] input,[data-owned-panel] select,[data-owned-panel] textarea")].map(control=>[control,control.disabled]));
      host.querySelectorAll("button,input,select,textarea").forEach(control=>control.disabled=true);
      ownedState.forEach((disabled,control)=>{control.disabled=disabled;});
      if(route==="trade")host.querySelector(".trade-pair-header")?.insertAdjacentHTML("beforeend",chip("조회 전용","muted"));
      else{
        const firstHeader=[...host.querySelectorAll(".panel-header")].find(header=>!header.parentElement?.querySelector("[data-owned-panel]"));
        firstHeader?.querySelector(".panel-actions")?.insertAdjacentHTML("beforeend",chip("조회 전용","muted"));
      }
    }else host.classList.remove("readonly-view");
    host.scrollTop=resetScroll?0:scrollTop;
    document.title=`${routeDisplayName(route)} · Meritz Prime`;
    updateTTLDisplay();
    syncGlobalState();
    if(route==="trade"){
      MP.syncTradeOrderSummary();
      /* 차트 viewBox 는 패널의 실제 크기에서 나오므로 DOM 이 붙은 뒤 한 번 다시 그린다. */

  function showToast(title,message,type="info") {
    const toast=document.createElement("div");
    toast.className=`toast ${type}`;
    toast.innerHTML=`<span class="toast-icon">${type==="success"?"✓":type==="info"?"i":"!"}</span><div><strong>${title}</strong><small>${message}</small></div><button type="button" aria-label="알림 닫기">×</button>`;
    toast.querySelector("button").addEventListener("click",()=>toast.remove());
    toastRegion.appendChild(toast);
    setTimeout(()=>toast.remove(),4200);
  }

  function switchRole(nextRole) {
    nextRole=MP.resolveRole(nextRole);
    if(!roleNames[nextRole]||nextRole===state.role){closeRoleMenu();return;}
    const previous=state.role;
    state.role=nextRole;
    state.orderAccountId=null;
    MP.loadFavouritePairs();
    addAudit("ROLE_SWITCH",`${roleNames[previous]} -> ${roleNames[nextRole]}`);
    closeRoleMenu();
    syncGlobalState();

    if(location.hash.slice(1)===nextRoute)renderRoute(nextRoute);

  function downloadFile(name,content,mime="text/csv;charset=utf-8") {
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const anchor=document.createElement("a");
    anchor.href=url;anchor.download=name;document.body.appendChild(anchor);anchor.click();anchor.remove();URL.revokeObjectURL(url);
  }

    const order=typeof MP.evidenceOrderById==="function"?MP.evidenceOrderById(orderId):null;

    showToast(toastTitle,`${order.id}, ${toastBody}`,"success");

  }
  function ksdEvidenceDownload(instruction) {
    if(!MP.canControl("exec","securities")){showToast("증빙 권한 없음","KSD 지시 증빙은 증권 데스크 소관","warning");return false;}
    const pdf=state.pdfUploads[instruction.etfId];
    const etf=state.etfs.find(item=>item.id===instruction.etfId);
    const underlyingKrw=instruction.underlyingQty*state.constants.btcFixingUsd*state.constants.usdKrw;
    const cashKrw=instruction.cu*pdf.cashPerCuKrw;
    const lines=instruction.moves.map(move=>`${move.accountId}\t${move.asset}\t${move.reason}\t${move.delta}`).join("\r\n");
    const fileName=`KSD-${instruction.id}.txt`;
    const body=`Meritz Prime KSD 지시 증빙\r\n지시번호: ${instruction.id}\r\n청구 구분: ${instruction.kind} (in-kind)\r\nETF: ${etf.name}\r\n단위: ${instruction.cu} CU, ${instruction.shares}주\r\n기초자산: BTC ${instruction.underlyingQty.toFixed(4)}\r\n현금 정산분: ${cashKrw}\r\n청구 총액: ${underlyingKrw+cashKrw}\r\n접수 시각: 2026-09-08 ${instruction.receivedAt}\r\n결제 예정: ${instruction.settlementDate} (T+1)\r\n\r\n지갑 또는 계좌\t자산\t사유\t변동\r\n${lines}\r\n`;
    downloadFile(fileName,body,"text/plain;charset=utf-8");

  const riskOwnedFields={"biz-admin":["dailyNotionalKrw","rfqLimitKrw","netExposureBtc","unsettledLimitKrw","clientPerTradeBtcCapDefault"]};

  function readRiskSettings() {
    const values={};
    const fields=["dailyNotionalKrw","rfqLimitKrw","netExposureBtc","unsettledLimitKrw","clientPerTradeBtcCapDefault"];
    for(const field of fields){
      const input=document.querySelector(`[data-risk-field="${field}"]`);
      if(!input)continue;
      const value=Number(input.value);
      if(!Number.isFinite(value)||value<0)return null;
      values[field]=value;
    }
    return values;
  }

  function restoreRiskDefaults() {
    const ownedFields=riskOwnedFields[state.role];
    if(!ownedFields)return;
    Object.entries(riskDefaults).forEach(([field,value])=>{
      if(!ownedFields.includes(field))return;
      const input=document.querySelector(`[data-risk-field="${field}"]`);
      if(input)input.value=String(value);
    });
  }
