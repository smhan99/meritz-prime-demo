  <style data-source="css/tokens.css">

.role-menu { position: absolute; z-index: 60; top: calc(100% + 3px); right: 3px; width: 270px; max-height: calc(100vh - 64px); overflow-y: auto; padding: 4px; background: #151922; border: 1px solid var(--border-strong); border-radius: 3px; box-shadow: 0 8px 24px rgba(0,0,0,.34); }
.role-menu[hidden] { display: none; }
.role-menu-label { display: block; padding: 5px 7px; color: var(--text-disabled); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.role-menu button { width: 100%; display: block; padding: 7px 8px; color: var(--text-secondary); text-align: left; background: transparent; border: 1px solid transparent; border-radius: 2px; cursor: pointer; }
.role-menu button:hover { color: var(--text-primary); background: var(--bg-control-hover); }

.role-menu button strong, .role-menu button small { display: block; }
.role-menu button strong { font-size: 11px; }.role-menu button small { margin-top: 2px; color: var(--text-muted); font-size: 11px; }
.role-menu-group { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border-default); letter-spacing: .02em; }
.readonly-view button:disabled, .readonly-view input:disabled, .readonly-view select:disabled, .readonly-view textarea:disabled { cursor: not-allowed; opacity: .5; }

.app-frame { height: calc(100% - var(--topbar-height)); }

  <style data-source="css/components.css">
/* Controls */
.button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 12px; color: var(--text-secondary); background: var(--bg-control); border: 1px solid var(--border-default); border-radius: 3px; cursor: pointer; transition: background 120ms, border-color 120ms, color 120ms; }
.button:hover:not(:disabled) { color: var(--text-primary); background: var(--bg-control-hover); border-color: var(--border-strong); }
.button:disabled { color: var(--text-disabled); cursor: not-allowed; opacity: .65; }
.button svg { width: 13px; height: 13px; }
.button.primary { color: #fff4f5; background: #b8000e; border-color: var(--brand-primary); }
.button.primary:hover { background: #d00010; }
.button.success { color: #ddf3ea; background: #1f6b52; border-color: #2f8566; }
.button.danger { color: #ffdce2; background: #6d2938; border-color: #984055; }
.button.warning { color: #f4dc76; background: rgba(214,184,74,.08); border-color: rgba(214,184,74,.35); }
.button.ghost { background: transparent; }
.button.small { min-height: 29px; padding: 4px 9px; font-size: 12px; }
.button.block { width: 100%; }
.field { min-width: 0; display: grid; gap: 4px; }
.field > label, .field-label { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
.input, .select, .field input, .field select { width: 100%; min-width: 0; height: 34px; padding: 0 9px; color: var(--text-primary); background: #10131a; border: 1px solid var(--border-default); border-radius: 2px; outline: 0; }
.field input:focus, .field select:focus, .input:focus, .select:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 1px rgba(42,120,214,.18); }
.input::placeholder { color: var(--text-disabled); }
.field-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
.field-grid.three { grid-template-columns: repeat(3,minmax(0,1fr)); }
.input-suffix { position: relative; }
.input-suffix input { padding-right: 44px; text-align: right; }
.input-suffix span { position: absolute; top: 50%; right: 8px; color: var(--text-muted); font-size: 11px; transform: translateY(-50%); pointer-events: none; }
.segmented { display: inline-flex; padding: 2px; background: #10131a; border: 1px solid var(--border-default); border-radius: 3px; }
.segmented button { min-height: 24px; padding: 3px 9px; color: var(--text-muted); background: transparent; border-radius: 2px; cursor: pointer; }
.segmented button.active { color: var(--text-primary); background: var(--bg-selected); }
.switch { position: relative; width: 30px; height: 16px; display: inline-flex; padding: 0; background: #303641; border: 1px solid #414854; border-radius: 10px; cursor: pointer; vertical-align: middle; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: #8d929c; border-radius: 50%; transition: transform 140ms, background 140ms; }
.switch.on { background: rgba(67,165,127,.28); border-color: #2f8566; }
.switch.on::after { background: #6fcfa8; transform: translateX(14px); }
.switch.danger.on { background: rgba(230,0,18,.25); border-color: #9a4154; }
.switch.danger.on::after { background: var(--accent-red); }
.toolbar { min-height: 40px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 8px; background: var(--bg-panel-raised); border-bottom: 1px solid var(--border-default); }
.toolbar .field { min-width: 118px; }
.toolbar .field.wide { min-width: 190px; }
.toolbar-spacer { flex: 1; }
.search-field { position: relative; min-width: 190px; }
.search-field svg { position: absolute; top: 8px; left: 8px; width: 13px; height: 13px; color: var(--text-muted); }
.search-field input { height: 30px; padding: 0 8px 0 28px; background: #10131a; border: 1px solid var(--border-default); border-radius: 2px; }

/* Panels and layout */
.grid { display: grid; gap: 8px; min-width: 0; }
.grid.cols-2 { grid-template-columns: repeat(2,minmax(0,1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3,minmax(0,1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4,minmax(0,1fr)); }
.grid.split-8-4 { grid-template-columns: minmax(0,2fr) minmax(300px,1fr); }
.grid.split-7-5 { grid-template-columns: minmax(0,1.4fr) minmax(340px,1fr); }
.grid.split-5-7 { grid-template-columns: minmax(330px,.8fr) minmax(0,1.2fr); }
.stack { display: grid; gap: 8px; align-content: start; }
.panel { min-width: 0; overflow: hidden; background: var(--bg-panel); border: 1px solid var(--border-default); border-radius: 3px; }
.panel-header { min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--bg-panel-raised); border-bottom: 1px solid var(--border-default); }
.panel-header h2, .panel-header h3 { margin: 0; color: var(--text-primary); font-size: 14px; font-weight: 600; }
.panel-actions { display: flex; align-items: center; gap: 5px; margin-left: auto; }
.panel-body { padding: 12px; }
.panel-body.flush { padding: 0; }
.panel-footer { min-height: 32px; display: flex; align-items: center; gap: 7px; padding: 5px 10px; color: var(--text-muted); background: #13161e; border-top: 1px solid var(--border-default); font-size: 11px; }
.panel-footer .push { margin-left: auto; }
.section-label { margin: 0 0 8px; color: var(--text-muted); font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.divider { height: 1px; margin: 10px 0; background: var(--border-default); }
.metric-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 1px; margin-bottom: 8px; background: var(--border-default); border: 1px solid var(--border-default); border-radius: 3px; overflow: hidden; }
.metric { min-width: 0; padding: 12px 14px; background: var(--bg-panel); }
.metric-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.metric-label { color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.metric-value { display: block; margin-top: 5px; color: var(--text-primary); font-size: 22px; font-weight: 400; line-height: 1; white-space: nowrap; }
.metric-value small { margin-left: 3px; color: var(--text-muted); font-size: 11px; }
.metric-bottom { min-height: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--text-muted); font-size: 11px; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; }
.mini-spark { width: 72px; height: 20px; }
.mini-spark polyline { vector-effect: non-scaling-stroke; stroke-width: 1.4; }
.mini-spark.positive polyline { stroke: var(--market-up); }.mini-spark.negative polyline { stroke: var(--market-down); }.mini-spark.info polyline { stroke: var(--accent-blue); }

/* Table */
.table-scroll { width: 100%; overflow: auto; scrollbar-color: #3a404c #14171f; scrollbar-width: thin; }
.data-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
.data-table th { height: 34px; padding: 7px 10px; color: var(--text-muted); background: #11141b; border-bottom: 1px solid var(--border-default); font-size: 12px; font-weight: 600; letter-spacing: .035em; text-align: left; text-transform: uppercase; }
.data-table td { height: 38px; padding: 7px 10px; color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle); font-size: 13px; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr { transition: background 100ms; }
.data-table tbody tr:hover { background: rgba(42,120,214,.08); }
.data-table tbody tr.selected { background: rgba(230,0,18,.07); }
.data-table tbody tr.clickable { cursor: pointer; }
.data-table .main-cell { color: var(--text-primary); font-weight: 500; }
.data-table .subcell { display: block; margin-top: 2px; color: var(--text-muted); font-size: 11px; }
.data-table .cell-fill { margin: -4px -8px; padding: 7px 8px; background: var(--data-blue-fill); }
.dual-value { min-width: 0; display: inline-grid; justify-items: end; gap: 3px; color: var(--text-primary); font-variant-numeric: tabular-nums; text-align: right; }
.dual-cost-line { display: grid; justify-items: end; gap: 1px; color: var(--text-primary); font-size: 12px; font-weight: 700; line-height: 1.25; }
.dual-mark-line { display: block; color: var(--text-muted); font-size: 10px; font-weight: 400; line-height: 1.25; white-space: nowrap; }
.dual-mark-line > span { margin-left: 5px; }
.dual-value--kpi { display: grid; justify-items: start; text-align: left; }
.dual-value--kpi .dual-cost-line { justify-items: start; font-size: 16px; }
.dual-value--kpi .dual-mark-line { margin-top: 2px; font-size: 11px; }
.dual-value--kv .dual-cost-line { font-size: 13px; }
.metric-value > .dual-value { display: grid; }
.status-chip { display: inline-flex; align-items: center; gap: 4px; min-height: 18px; padding: 2px 6px; color: var(--text-secondary); background: #242934; border: 1px solid #353b47; border-radius: 9px; font-size: 11px; font-weight: 600; }
.status-chip::before { content: ""; width: 5px; height: 5px; background: currentColor; border-radius: 50%; }
.status-chip.positive { color: #6fcfa8; background: rgba(67,165,127,.1); border-color: rgba(67,165,127,.34); }
.status-chip.negative { color: #f46b83; background: rgba(230,0,18,.08); border-color: rgba(230,0,18,.28); }
.status-chip.warning { color: #e8cc57; background: rgba(214,184,74,.07); border-color: rgba(214,184,74,.27); }
.status-chip.info { color: #6db2eb; background: rgba(42,120,214,.08); border-color: rgba(42,120,214,.28); }
.status-chip.violet { color: #c47aed; background: rgba(166,80,223,.08); border-color: rgba(166,80,223,.28); }
.status-chip.muted { color: #858b96; }
.status-chip.square { border-radius: 2px; }
.tag { display: inline-flex; align-items: center; min-height: 17px; padding: 1px 5px; color: var(--text-muted); background: #1c2029; border: 1px solid var(--border-default); border-radius: 2px; font-size: 11px; }
.tag + .tag { margin-left: 3px; }
.coin { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: 5px; color: #15171c; background: #cfd2d8; border-radius: 50%; font-size: 11px; font-weight: 800; }
.coin.btc { background: #e9ae50; }.coin.eth { background: #9ba7d6; }.coin.usdt { background: #7ebbe8; }

/* Common detailed UI */
.list { margin: 0; padding: 0; list-style: none; }
.list-item { min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--border-subtle); }
.list-item:last-child { border-bottom: 0; }
.list-item-main { min-width: 0; flex: 1; }

.route-tier { display: grid; grid-template-columns: 66px minmax(0,1fr); align-items: stretch; border-bottom: 1px solid var(--border-default); }
.route-tier:last-child { border-bottom: 0; }
.route-tier-label { display: flex; align-items: center; justify-content: center; padding: 8px; color: var(--text-muted); background: #10131a; border-right: 1px solid var(--border-default); font-size: 11px; letter-spacing: .04em; }
.route-nodes { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); }
.route-node { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border-subtle); }
.route-node:last-child { border-right: 0; }
.route-node > header { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); }
.route-node > header strong { color: var(--text-primary); font-size: 12px; font-weight: 500; }
.route-node-step { padding: 1px 5px; color: var(--text-muted); background: var(--bg-control); border-radius: 2px; font-size: 10px; }
.route-node-body { flex: 1; padding: 0; }
.route-node > footer { padding: 7px 10px; color: var(--text-muted); background: #10131a; border-top: 1px solid var(--border-subtle); font-size: 10px; line-height: 1.5; }
.route-node.emphasis { background: rgba(166,80,223,.05); }
.route-node.emphasis > header { border-bottom-color: rgba(166,80,223,.28); }
.route-node.emphasis > header strong { color: #d3a4f0; }
.route-node.gate { background: rgba(214,184,74,.05); }
.route-node.gate > header strong { color: var(--accent-yellow); }
.route-line-list { display: grid; margin: 0; padding: 0; list-style: none; }
.route-line-list li { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 11px; }
.route-line-list li:last-child { border-bottom: 0; }
.route-line-list li > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route-line-list li > b { color: var(--text-primary); font-weight: 500; }
.route-intake-list li { grid-template-columns: minmax(0,1fr) auto auto; }
.route-line-list li.route-excluded { color: var(--text-muted); }
.route-line-list li.route-excluded > b { color: var(--text-muted); font-weight: 400; }
.route-principle-list li, .route-branch-list li { line-height: 1.5; }
.route-principle-list li { grid-template-columns: minmax(0,1fr); }
.route-gain { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; padding: 8px 10px; background: rgba(230,0,18,.06); border-top: 1px solid var(--border-subtle); }
.route-gain span { color: var(--text-muted); font-size: 11px; }
.route-gain strong { font-size: 14px; }
.route-gain small { grid-column: 1 / -1; color: var(--text-muted); font-size: 10px; }
.route-node-pointer { margin: 0; padding: 7px 10px; color: var(--text-muted); border-top: 1px solid var(--border-subtle); font-size: 10px; }
.route-custody-table { min-width: 0; }
.route-custody-table th, .route-custody-table td { padding: 5px 8px; font-size: 11px; }

/* prime-evidence, 증빙 */
.prime-evidence-view { display: grid; gap: 8px; }
.evidence-header { border-left-color: var(--accent-violet); background: #191323; border-color: #3a2c4c; }
.evidence-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg-panel); border: 1px solid var(--border-default); border-radius: 3px; }
.evidence-order-select { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 11px; }
.evidence-order-select .select { min-width: 320px; }
.evidence-tabs button .evidence-tab-off { margin-left: 6px; color: var(--text-disabled); font-size: 10px; }
.exec-state-tabs button.unavailable { color: var(--text-disabled); }
.exec-state-tabs button .exec-tab-off { margin-left: 6px; color: var(--text-disabled); font-size: 10px; }
.evidence-lines { display: grid; align-content: start; }
.evidence-split { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); border-bottom: 1px solid var(--border-default); }
.evidence-split .evidence-lines:first-child { border-right: 1px solid var(--border-subtle); }
.evidence-line { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px; min-height: 40px; padding: 7px 12px; border-bottom: 1px solid var(--border-subtle); }
.evidence-line:last-child { border-bottom: 0; }
.evidence-line > div span { color: var(--text-muted); font-size: 11px; }
.evidence-line > div small { display: block; margin-top: 2px; color: var(--text-disabled); font-size: 10px; }
.evidence-line strong { color: var(--text-primary); font-size: 13px; font-weight: 500; }
.evidence-quote-table, .evidence-tca-table { border-top: 1px solid var(--border-default); }
.evidence-tca-table { min-width: 880px; }
.evidence-tca-table tfoot td { background: #11151c; border-top: 1px solid var(--border-default); }

@media (max-width: 1180px) {
  .route-nodes { grid-template-columns: 1fr; }
  .route-node { border-right: 0; border-bottom: 1px solid var(--border-subtle); }
  .route-node:last-child { border-bottom: 0; }
  .evidence-split { grid-template-columns: 1fr; }
  .evidence-split .evidence-lines:first-child { border-right: 0; border-bottom: 1px solid var(--border-subtle); }
  .evidence-order-select .select { min-width: 0; }
}

/* 고객사 및 데스크 스코프 (트레이드 고객 판, Prime 계정, 데스크 커스터디/정산) */
.client-scope-bar, .desk-scope-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 8px; padding: 6px 10px; color: var(--text-muted); background: var(--bg-panel-raised); border: 1px solid var(--border-default); border-radius: 2px; font-size: 11.5px; }
.client-scope-bar b, .desk-scope-bar b { color: var(--text-primary); font-size: 12.5px; }
.client-scope-bar-push, .desk-scope-bar-push { margin-left: auto; }
.client-account-view, .desk-account-view { display: grid; gap: 8px; align-content: start; }
.client-account-view .balance-trio, .desk-account-view .balance-trio { margin-bottom: 0; }
.client-account-field .field-note { color: var(--text-disabled); }
.client-risk-view, .client-pnl-view { display: grid; gap: 8px; align-content: start; }
.client-pnl-table { min-width: 980px; }
.client-pnl-metrics { grid-template-columns: repeat(4,minmax(0,1fr)); }

@media (max-width: 980px) {
  .client-pnl-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
}

/* ---------- 트레이드 화면 조정 (D-0914) ---------- */

/* 호가와 체결 열이 좁아진 만큼 행 높이와 좌우 여백을 줄여 호가 22행, 체결 20행이 들어간다. */
.trade-market-panel .book-head, .trade-market-panel .tape-head { height: 23px; padding: 0 5px; }
.trade-market-panel .order-book { padding: 1px 0; }
.trade-market-panel .book-row { min-height: 19px; padding: 0 5px; }
.trade-market-panel .book-row span { font-size: 10px; }
.trade-market-panel .book-mid { min-height: 28px; padding: 2px 5px; }
.trade-market-panel .book-mid strong { font-size: 12px; }
.trade-market-panel .book-mid span { font-size: 10px; }
.trade-market-panel .trade-tape { min-height: 0; padding: 1px 0; }
.trade-market-panel .tape-row { min-height: 19px; padding: 0 5px; font-size: 10px; }

/* 시간축: 눈금선은 옅게, 라벨은 muted. */
.candle-chart .chart-axis-tick line { stroke: rgba(120,130,150,.16); stroke-width: 1; vector-effect: non-scaling-stroke; }
.candle-chart .chart-axis-tick text { fill: var(--text-muted); font-size: 10px; }
.candle-chart .chart-axis-base { stroke: var(--border-default); stroke-width: 1; vector-effect: non-scaling-stroke; }
.candle-chart [data-candle-chart] { inset: 34px 44px 4px 8px; }

/* 수량 슬라이더: 앱 토큰 기반 트랙, 채움, 썸. 드래그 가능한 실제 range 요소. */
.trade-range { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 5px 0 0; background: transparent; cursor: pointer; }
.trade-range::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--accent-blue) 0, var(--accent-blue) var(--range-fill,0%), var(--bg-control) var(--range-fill,0%), var(--bg-control) 100%); border: 1px solid var(--border-default); border-radius: 2px; }
.trade-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; margin-top: -5px; background: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 2px; }
.trade-range:hover::-webkit-slider-thumb { background: #fff; }
.trade-range::-moz-range-track { height: 4px; background: var(--bg-control); border: 1px solid var(--border-default); border-radius: 2px; }
.trade-range::-moz-range-progress { height: 4px; background: var(--accent-blue); border-radius: 2px; }
.trade-range::-moz-range-thumb { width: 12px; height: 12px; background: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 2px; }
.trade-range:focus-visible { outline: 1px solid var(--accent-blue); outline-offset: 2px; }

/* 벤더 선택 조밀 목록: 한 행 24px, 좌측 체크박스, 이름, 커스터디언. */
.vendor-pick-list { display: grid; gap: 1px; background: var(--border-subtle); border: 1px solid var(--border-subtle); }
.vendor-pick-row { min-height: 24px; display: grid; grid-template-columns: 14px minmax(0,1fr) auto; align-items: center; gap: 7px; padding: 0 7px; background: #12151c; cursor: pointer; }
.vendor-pick-row:hover { background: var(--bg-control); }
.vendor-pick-row input { width: 12px; height: 12px; margin: 0; accent-color: var(--accent-green); }
.vendor-pick-row b { overflow: hidden; color: var(--text-primary); font-weight: 500; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.vendor-pick-row span { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
.vendor-pick-row.all { background: #171b24; }
.vendor-pick-row.all b { color: var(--text-secondary); }

/* 기준과 TTL 행과 요청 버튼 사이 간격. */
.rfq-basis-row { margin-bottom: 10px; }

/* ================= LP 데스크 컴팩트 프레임 (그리드 단일 UI) =================
   그리드 위는 북 선택 툴바 한 줄, 아래는 피드 상태 한 줄. 행 높이 28px 단일 행. */
.lp-desk { display: block; }
.lp-desk .lp-toolbar { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 5px 9px; background: var(--bg-panel); border: 1px solid var(--border-default); border-bottom: 0; }
.lp-desk .lp-toolbar .lab { color: var(--text-muted); font-size: 10px; letter-spacing: .06em; }
.lp-desk .lp-toolbar .push { margin-left: auto; display: flex; gap: 5px; }
.lp-desk .lp-grid-wrap { background: var(--bg-panel); border: 1px solid var(--border-default); }
.lp-desk .lp-feed-footer { border: 1px solid var(--border-default); border-top: 0; }

.lp-desk .book-row-grid th { height: auto; padding: 4px 8px; vertical-align: middle; }
.lp-desk .book-row-grid td { height: 28px; padding: 1px 8px; vertical-align: middle; white-space: nowrap; }
.lp-desk .book-row-grid td.f0 { padding-left: 8px; padding-right: 4px; }
.lp-desk .book-row-grid .tgl { min-width: 38px; height: 20px; padding: 0 7px; font-size: 10px; }
.lp-desk .book-row-grid .lp-cellin { height: 21px; }
.lp-desk .book-row-grid .lp-rsel { height: 21px; font-size: 11px; }
.lp-desk .book-row-grid .status-chip { height: 19px; }
.lp-desk .book-row-grid .subcell { display: inline; margin: 0 0 0 5px; }
.lp-desk .book-row-grid .lp-subbtn { display: inline; margin: 0 0 0 6px; }
.lp-desk .book-row-grid .row-account-cell { display: flex; align-items: center; gap: 5px; }
.lp-desk .book-row-grid .row-carry-cell { display: flex; align-items: center; gap: 6px; min-width: 108px; }
.lp-desk .book-row-grid .row-carry-cell .progress { flex: 1 1 auto; min-width: 40px; }


/* ---------- 집행 화면 (D-0914 재구성) ----------
   1440 x 900 한 화면에 3열이 들어가고 페이지 스크롤이 생기지 않는다. 넘치는 것은 좌측 티켓
   목록과 우측 구간표가 각자 안에서 스크롤한다. 실행 정지 버튼은 없다. */
.ap-exec-view { height: 100%; min-height: 0; display: grid; overflow: hidden; }
.ap-exec-grid { min-height: 0; height: 100%; display: grid; gap: 8px; grid-template-columns: 300px minmax(280px,.8fr) minmax(520px,1.6fr); align-items: stretch; }
.ap-exec-col { min-width: 0; min-height: 0; display: grid; gap: 8px; }
.ap-exec-left { grid-template-rows: minmax(0,1fr); }
.ap-exec-mid { grid-template-rows: auto auto auto; align-content: start; }
.ap-exec-right { grid-template-rows: auto minmax(0,1fr); }
.ap-exec-col > .panel { min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
.ap-exec-col > .panel > .panel-body { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3a404c #11141b; }
.ap-exec-mid > .panel { grid-template-rows: auto auto auto; }
.ap-exec-mid > .panel > .panel-body { overflow: visible; }
.ap-exec-right .execution-buckets { max-height: 100%; }
.ap-exec-right .exec-chart { height: 178px; }

.exec-ticket-list { display: grid; gap: 1px; background: var(--border-default); }
.exec-ticket { display: grid; gap: 3px; width: 100%; padding: 9px 10px; text-align: left; color: var(--text-primary); background: var(--bg-panel); border: 0; border-left: 2px solid transparent; cursor: pointer; font: inherit; }
.exec-ticket:hover { background: var(--bg-panel-raised); }
.exec-ticket.selected { background: var(--bg-panel-raised); border-left-color: var(--accent-violet); }
.exec-ticket.done { opacity: .45; }
.exec-ticket.done.selected { opacity: .75; }
.exec-ticket-id { color: var(--text-muted); font-size: 10px; letter-spacing: .02em; }
.exec-ticket-head { display: flex; align-items: center; gap: 6px; }
.exec-ticket-head b { font-size: 13px; font-weight: 600; }
.exec-ticket-side { padding: 0 5px; border-radius: 2px; font-size: 10px; font-weight: 700; line-height: 16px; }
.exec-ticket-side.buy { color: #7fc4a6; background: rgba(67,165,127,.13); }
.exec-ticket-side.sell { color: #f08a90; background: rgba(230,0,18,.13); }
.exec-ticket-qty { font-size: 14px; font-weight: 500; }
.exec-ticket-window { color: var(--text-secondary); font-size: 11px; }
.exec-ticket-foot { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.exec-ticket-foot small { margin-left: auto; color: var(--text-muted); font-size: 10px; }

.ap-exec-mid .exec-overview-grid .kv, .ap-exec-mid .exec-reference-grid .kv { min-height: 56px; }
.ap-exec-mid .exec-overview-grid .kv strong, .ap-exec-mid .exec-reference-grid .kv strong { font-size: 15px; }
.ap-exec-mid .exec-overview-grid .kv:last-child { grid-column: span 2; }
.ap-exec-mid .execution-progress { grid-template-columns: repeat(2,minmax(0,1fr)); }
.exec-countdown { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-top: 1px solid var(--border-subtle); }
.exec-countdown small { color: var(--text-muted); font-size: 11px; }

@media (max-width: 1360px) {
  .ap-exec-grid { grid-template-columns: 260px minmax(240px,.8fr) minmax(420px,1.6fr); }
}

/* 집행 완료 티켓 */
.exec-ticket-complete-chip { display: inline-flex; align-items: center; min-height: 15px; padding: 0 5px; color: #6fcfa8; background: rgba(67,165,127,.1); border: 1px solid rgba(67,165,127,.34); border-radius: 8px; font-size: 9px; font-weight: 600; line-height: 13px; }

/* ================= LP 데스크 북 다중 선택과 선택 행 상세 (D-0914) =================
   상단 툴바는 북 체크 드롭다운과 선택 행 일괄 버튼, 그리드 아래 절반은 선택 행의
   주문 내역, 체결 내역, 헤지 손익 3개 탭이 차지하고 각 표는 패널 안에서 스크롤한다. */
.lp-desk { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(96px,1.25fr) minmax(140px,1fr) auto; overflow: hidden; }
.lp-desk .lp-grid-wrap { min-height: 0; overflow: hidden; }
.lp-desk .lp-grid-wrap > .table-scroll { height: 100%; }

.lp-desk .lp-bookmenu-wrap { position: relative; display: inline-flex; }
.lp-desk .lp-bookbtn { display: inline-flex; align-items: center; gap: 6px; min-width: 116px; height: 24px; padding: 0 8px; color: var(--text-primary); background: var(--bg-control); border: 1px solid var(--border-default); border-radius: 2px; font: inherit; font-size: 11.5px; cursor: pointer; }
.lp-desk .lp-bookbtn:hover { border-color: var(--accent-red); }
.lp-desk .lp-bookbtn i { margin-left: auto; color: var(--text-muted); font-size: 9px; font-style: normal; }
.lp-desk .lp-bookmenu { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 150px; display: grid; padding: 4px; background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 3px; box-shadow: 0 14px 34px rgba(0,0,0,.5); }
.lp-desk .lp-bookopt { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 7px; color: var(--text-secondary); background: transparent; border: 0; border-radius: 2px; font: inherit; font-size: 11.5px; text-align: left; cursor: pointer; }
.lp-desk .lp-bookopt:hover { background: var(--bg-panel-raised); }
.lp-desk .lp-bookopt.on { color: var(--text-primary); }
.lp-desk .lp-bulkbtn { height: 24px; padding: 0 10px; color: var(--text-primary); background: var(--bg-control); border: 1px solid var(--border-default); border-radius: 2px; font: inherit; font-size: 11.5px; cursor: pointer; }
.lp-desk .lp-bulkbtn:hover:not(:disabled) { border-color: var(--accent-red); }
.lp-desk .lp-bulkbtn:disabled { color: var(--text-disabled); cursor: default; }
.lp-desk .lp-bulkbtn .num { margin-left: 6px; color: var(--text-muted); font-size: 10.5px; }

.lp-desk .lp-detail { min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr); background: var(--bg-panel); border: 1px solid var(--border-default); border-top: 0; }
.lp-desk .lp-detail-head { display: flex; align-items: center; gap: 2px; min-height: 28px; padding: 3px 8px; border-bottom: 1px solid var(--border-subtle); }
.lp-desk .lp-detail-head .sub { margin-left: auto; color: var(--text-muted); font-size: 11px; }
.lp-desk .lp-dtab { height: 22px; padding: 0 11px; color: var(--text-muted); background: transparent; border: 1px solid transparent; border-radius: 2px; font: inherit; font-size: 11.5px; cursor: pointer; }
.lp-desk .lp-dtab:hover { color: var(--text-primary); }
.lp-desk .lp-dtab.on { color: var(--text-primary); background: var(--bg-selected); border-color: rgba(230,0,18,.55); }
.lp-desk .lp-detail-body { min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #3a404c #14171f; }
.lp-desk .lp-dtable th { position: sticky; top: 0; z-index: 2; height: 24px; padding: 3px 10px; background: #11141b; }
.lp-desk .lp-dtable td { height: 28px; padding: 1px 10px; vertical-align: middle; white-space: nowrap; }
.lp-desk .lp-dtable .status-chip { height: 19px; }
.lp-desk .lp-dtable tfoot td { height: 26px; color: var(--text-secondary); background: #11141b; border-top: 1px solid var(--border-strong); }

/* 집행 차트 bp 이탈 축과 막대 */
.exec-chart { padding-right: 46px; }
.exec-chart .chart-label.bp1 { right: 6px; top: 10px; }
.exec-chart .chart-label.bp2 { right: 6px; top: 81px; }
.exec-chart .chart-label.bp3 { right: 6px; bottom: 23px; }
.exec-chart .chart-label.x3 { right: 46px; }
.exec-chart .exec-bp-zero { stroke: rgba(255,255,255,.2); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.exec-chart .exec-bp-bar.positive { fill: rgba(230,0,18,.68); }
.exec-chart .exec-bp-bar.negative { fill: rgba(42,120,214,.72); }
.exec-chart .exec-bp-value { font-size: 9px; text-anchor: middle; }
.exec-chart .exec-bp-value.positive { fill: #f08a90; }
.exec-chart .exec-bp-value.negative { fill: #70aef5; }
.legend i.exec-bp-legend { width: 8px; height: 8px; background: linear-gradient(90deg,#2a78d6 50%,#e60012 50%); }

/* 집행 완료 결과 비교표 */
.exec-result-comparison { min-width: 0; }
.exec-result-table { table-layout: fixed; }
.exec-result-table th:nth-child(1) { width: 39%; }
.exec-result-table th:nth-child(2) { width: 25%; }
.exec-result-table th:nth-child(3) { width: 36%; }
.exec-result-table th, .exec-result-table td { height: auto; padding: 7px 10px; }
.exec-result-table td { white-space: normal; vertical-align: middle; }
.exec-result-table td > strong { color: var(--text-primary); font-weight: 600; }
.exec-result-table td > small { display: block; margin-top: 2px; color: var(--text-muted); font-size: 10px; }
.exec-result-table .status-chip { margin-left: 6px; vertical-align: middle; }

.risk-admin-layout { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 16px; align-items: start; }
.risk-company-list { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--border-default); border-radius: 10px; background: var(--bg-panel); position: sticky; top: 12px; }
.risk-company-row { width: 100%; min-height: 64px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 9px 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text-primary); text-align: left; cursor: pointer; }

/* D-0916: 계정 화면 자산 잔고 표 머리글. 커스터디 이름 여섯 개가 붙어 머리글이 눌려 있었다.
   머리글 글자는 11px, 두 단어 이름은 <br> 로 두 줄, 열마다 최소 너비를 줘 단어 중간에서
   접히지 않게 하고, 폭 합계가 패널을 넘으면 표가 패널 안에서 가로로 스크롤된다.
   자산 열은 왼쪽에 고정되어 가로로 밀어도 어느 자산의 줄인지 읽힌다. 머리글 행 28px 유지. */
.settlement-main-grid .table-scroll { overflow-x: auto; overflow-y: auto; }

.settlement-assets-table th:nth-child(1), .settlement-assets-table td:nth-child(1) { min-width: 148px; }
.settlement-assets-table th:nth-child(2), .settlement-assets-table td:nth-child(2) { min-width: 118px; }

.settlement-assets-table tbody tr:hover td:first-child { background: #171b24; }

/* D-0921: 계정 화면 덧셈이 보이게 하는 두 조각.
   1. 헤드라인 아래 한 줄은 PRIME_A + PRIME_B + PRIME_C 가 거래 잔고로 합쳐지는 식이다.
   2. 단일 서브계정 보기에서는 커스터디 카드 자리에 한 줄 안내만 남는다. 풀은 보유 주체의
      것이라 서브계정 하나에 붙일 수 없다.
   자산 잔고 표 바닥의 합계 행은 수량이 아니라 가치를 찍으므로 본문과 구분되게 세운다. */
.settlement-headline-breakdown { margin: 6px 0 0; padding: 7px 10px; border: 1px solid var(--border-subtle); background: var(--bg-panel); color: var(--text-muted); font-size: 11px; line-height: 1.5; }
/* D-0921: 이체 요청서 수량 아래 출처 서브계정 줄. 보유 줄보다 한 단계 더 죽인 톤이다. */

</head>

  <script data-source="js/core/state.js">
(function (MP) {
  "use strict";

  const vendorQuoteSeed = [
    {id:"coinbase-prime", name:"Coinbase Prime", custodian:"Coinbase Custody", anonName:"벤더 A", anonCustodian:"커스터디 A", raw:69988.00, feeBps:1.2, receivedAt:"10:30:51.882", excluded:false},
    {id:"ripple-prime", name:"Ripple Prime", custodian:"Ripple Custody", anonName:"벤더 B", anonCustodian:"커스터디 B", raw:69992.00, feeBps:1.8, receivedAt:"10:30:51.940", excluded:false},
    {id:"falconx-prime", name:"FalconX", custodian:"Meritz Custody", anonName:"벤더 C", anonCustodian:"커스터디 C", raw:69995.00, feeBps:2.5, receivedAt:"10:30:52.018", excluded:false},
    {id:"galaxy-prime", name:"Galaxy", custodian:"Meritz Custody", anonName:"벤더 D", anonCustodian:"커스터디 D", raw:69990.50, feeBps:1.5, receivedAt:"10:30:51.996", excluded:false},
    {id:"edx-markets", name:"EDX Markets", custodian:"Meritz Custody", anonName:"벤더 E", anonCustodian:"커스터디 E", raw:69997.00, feeBps:2.2, receivedAt:"10:30:52.061", excluded:false},
    {id:"b2c2", name:"B2C2", custodian:"Meritz Custody", anonName:"벤더 F", anonCustodian:"커스터디 C", raw:69991.25, feeBps:1.4, receivedAt:"10:30:52.104", excluded:false},
    {id:"cumberland", name:"Cumberland", custodian:"Meritz Custody", anonName:"벤더 G", anonCustodian:"커스터디 C", raw:69989.75, feeBps:1.7, receivedAt:"10:30:52.126", excluded:false},
    {id:"wintermute", name:"Wintermute", custodian:"Meritz Custody", anonName:"벤더 H", anonCustodian:"커스터디 C", raw:69993.40, feeBps:1.1, receivedAt:"10:30:52.149", excluded:false},
    {id:"kraken", name:"Kraken", custodian:"Meritz Custody", anonName:"벤더 I", anonCustodian:"커스터디 C", raw:69996.20, feeBps:1.6, receivedAt:"10:30:52.173", excluded:false}
  ];
  const vendorQuotes = vendorQuoteSeed.map(row=>({...row, allIn:roundCents(row.raw*(1+row.feeBps/10000))}));

  function roundCents(value) {
    return Math.round(value*100)/100;
  }

  function rankVendorQuotes(rows=state.vendorQuotes) {
    return rows.filter(row=>!row.excluded).slice().sort((a,b)=>a.allIn-b.allIn);
  }

  function bestVendorQuote(rows=state.vendorQuotes) {
    return rankVendorQuotes(rows)[0]||null;
  }

  function vendorDisplayName(vendor) {
    if(!vendor)return "";
    return state.vendorAnonymised?vendor.anonName:vendor.name;
  }

  function vendorDisplayCustodian(vendor) {
    if(!vendor)return "";
    return state.vendorAnonymised?vendor.anonCustodian:vendor.custodian;
  }

  function vendorDisplay(vendor) {
    if(!vendor)return null;
    return {...vendor, name:vendorDisplayName(vendor), custodian:vendorDisplayCustodian(vendor)};
  }

  function latestVendorQuoteTime(rows=state.vendorQuotes) {
    return rows.map(row=>row.receivedAt).sort().pop()||"";
  }

  function requestableVendorIds(rows=vendorQuotes) {
    return rows.filter(row=>!row.excluded).map(row=>row.id);
  }

  function seedAcceptances(ids,rows=vendorQuotes) {
    return rows.filter(row=>ids.includes(row.id)).slice()
      .sort((a,b)=>b.allIn-a.allIn)
      .map(row=>({vendorId:row.id,allIn:row.allIn,at:row.receivedAt}));
  }

  const constants = {
    btcFixingUsd: 70000,
    usdKrw: 1400,
    ownInavKrw: 9814,
    krxInavKrw: 9812,
    quoteBidKrw: 9809,
    quoteAskKrw: 9819,
    cuShares: 50000,
    btcPerCu: 5,
    creationKrw: 9800000000,
    creationCu: 20,
    creationBtc: 100,
    aumKrw: 2000000000000,
    lpNetCaptureBps: 2,
    ownExecutionCostBps: .8,
    vendorBestAllInUsd: bestVendorQuote(vendorQuotes).allIn
  };

  const initialPrice = 69984.2;
  const pdfCashPerCuKrw = constants.ownInavKrw*constants.cuShares-constants.btcFixingUsd*constants.usdKrw*constants.btcPerCu;
  const etfs = [
    {id:"kodex-btc", name:"KODEX 비트코인현물", code:"A999001", underlying:"BTC", bookId:"ETF_A"},
    {id:"tiger-btc", name:"TIGER 비트코인현물", code:"A999002", underlying:"BTC", bookId:"ETF_A"},
    {id:"sol-btc", name:"SOL 비트코인현물", code:"A999003", underlying:"BTC", bookId:"ETF_B"},
    {id:"rise-btc", name:"RISE 비트코인현물", code:"A999004", underlying:"BTC", bookId:"ETF_C"},
    {id:"kodex-eth", name:"KODEX 이더리움현물", code:"A999005", underlying:"ETH", bookId:"ETF_B"}
  ];

  const custodians = ["Meritz Custody","Coinbase Custody","Ripple Custody","KDAC","BDACS","KODA"];

  function walletId(seed) {
    let value="";
    for(let salt=0;salt<4;salt+=1){
      let hash=(2166136261^(salt*2654435761))>>>0;
      for(const char of String(seed)){hash^=char.charCodeAt(0);hash=Math.imul(hash,16777619)>>>0;}
      value+=hash.toString(16).padStart(8,"0");
    }
    return value;
  }

  /* D-0915 Prime 서브계정. 계정 보유 주체(데스크와 각 고객사)마다 PRIME_A, PRIME_B, PRIME_C
     세 개를 갖는다. 화면에 찍히는 이름은 라벨(PRIME_A)이고 내부 id는 `<보유주체>/PRIME_X`로
     보유 주체 사이에서 유일하다. 출력은 모두 `MP.accountLabel(id)`를 거친다. */
  const primeAccounts = [

        planFillQty=Math.round(target*(seed.fillQty/executionSeedFillTotal)*(seedLength/count)*10000)/10000;
        allocated=Math.round((allocated+planFillQty)*10000)/10000;
      }
      return {
        index,
        label:executionBucketLabel(index,params),
        targetQty:schedule[index],
        planFillQty,
        fillQty:planFillQty,
        fillPriceUsd:seed.fillPriceUsd,
        medianUsd:seed.medianUsd,
        status:index<openIndex?"완료":index===openIndex?"진행":"대기"
      };
    });
  }

  function resetExecutionTape() {
    state.executionTape=buildExecutionTape().map(row=>({...row,fillQty:0,status:"대기"}));

    state.executionBuckets=Array(state.executionTape.length).fill(0);

  /* ---------- 집행 런, 티켓 하나가 런 하나 ----------
     D-0914. 집행 화면은 오늘의 픽싱 주문 티켓 목록이 되었고 티켓마다 자기 테이프를 갖는다.
     데스크 자기 주문 PRM-260908-0018 의 런만 `global:true`로 전역 테이프를 그대로 쓴다.
     손익과 포트폴리오와 정산과 증빙이 전역 테이프를 읽으므로 그 시드를 흔들지 않기 위한
     선택이다. 나머지 런은 자기 `tape` / `tapeWindow` / `params`를 들고 있고 화면은
     `MP.withExecutionTapeContext`로 그 런을 끼워 그린다. */

  function executionSeedRun(id,params,target,filled) {
    const tape=buildExecutionTape(params,target).map(row=>filled?{...row,status:"완료"}:{...row,fillQty:0,status:"대기"});
    return {
      id,countdown:0,started:filled===true,params:{...params},tape,
      tapeWindow:{index:filled?tape.length:0,prices:[],fillQty:0},
      completedAt:filled===true?params.endMinutes:null
    };
  }

  function executionRunContext(run) {
    if(!run||run.global)return {tape:state.executionTape,tapeWindow:state.executionTapeWindow,params:state.executionWindowParams};
    return {tape:run.tape,tapeWindow:run.tapeWindow,params:run.params};
  }

  function executionRunById(id) {
    return state.executionOrderRuns[id]||null;
  }

  function executionRunFor(ticket) {
    if(!ticket)return null;
    const existing=state.executionOrderRuns[ticket.id];
    if(existing)return existing;
    const run=executionSeedRun(ticket.id,ticket.window,ticket.quantityBtc,false);
    state.executionOrderRuns[ticket.id]=run;
    return run;
  }

  function executionRunStatus(run) {
    if(!run)return "대기";
    if(run.countdown>0)return "카운트다운";
    const context=executionRunContext(run);
    const completed=context.tape.filter(row=>row.status==="완료").length;
    if(completed>=context.tape.length)return "완료";
    if(completed===0&&context.tapeWindow.index===0&&!run.started)return "대기";
    return "진행";
  }

    return state.executionWindowState!=="pre";

      {time:"10:31:08.992",user:"System",action:"FEED_FAILOVER",target:"집계 Market Data",result:"경고",tone:"warning"}
    ]
  };

  function ksdMovesFor(record) {
    const etf=state.etfs.find(item=>item.id===record.etfId);
    const book=state.etfBooks.find(item=>item.id===etf?.bookId);
    const shares=record.quantity*state.pdfUploads[record.etfId].cuShares;
    if(record.type==="ETF 환매")return [
      {accountId:book.tradfiAccountId,asset:etf.name,reason:"환매 인도",delta:-shares,unit:"주"},
      {accountId:"1321cd2cfa95e585270da972f2d3b493",asset:etf.underlying,reason:"환매 기초자산 수취",delta:record.underlyingQty,unit:etf.underlying}
    ];
    const moves=[{accountId:"1321cd2cfa95e585270da972f2d3b493",asset:etf.underlying,reason:"설정 인도",delta:-record.underlyingQty,unit:etf.underlying}];
    const primeOrder=state.primeOrders.find(item=>item.id===record.linkedPrimeOrderId);
    if(primeOrder){
      const repaid=primeOrder.quantityBtc*primeOrder.progressPercent/100;
      moves.push({accountId:"1321cd2cfa95e585270da972f2d3b493",asset:etf.underlying,reason:`${primeOrder.id} 소싱 상환, 진행 ${primeOrder.progressPercent.toFixed(1)}%`,delta:repaid,unit:etf.underlying});
    }
    moves.push({accountId:book.tradfiAccountId,asset:etf.name,reason:record.owner==="프라임"?"설정 수취":"설정 수취, 자기 재고 보유",delta:shares,unit:"주"});
    if(record.owner==="프라임")moves.push({accountId:book.tradfiAccountId,asset:etf.name,reason:`${record.linkedOrderId} 고객 인도`,delta:-shares,unit:"주"});
    return moves;
  }

  Object.defineProperty(state,"ksdInstructions",{
    enumerable:true,
    get(){
      return state.orderRecords.filter(record=>record.type==="ETF 설정"||record.type==="ETF 환매").map(record=>{
        const pdf=state.pdfUploads[record.etfId];
        return {
          id:record.id,etfId:record.etfId,kind:record.type==="ETF 환매"?"환매":"설정",owner:record.owner,
          cu:record.quantity,shares:record.quantity*pdf.cuShares,underlyingQty:record.underlyingQty,
          receivedAt:record.time,settlementDate:record.settlementDate,linkedOrderId:record.linkedOrderId,
          linkedPrimeOrderId:record.linkedPrimeOrderId,reason:record.reason,claimConfirmedAt:record.claimConfirmedAt,
          moves:ksdMovesFor(record)
        };
      });
    }
  });

  const FAVOURITE_STORAGE_PREFIX = "meritz-prime.favourite-pairs.";

  function favouriteStorageKey() {
    const meta = state.roleMeta[state.role];
    return `${FAVOURITE_STORAGE_PREFIX}${meta ? meta.auditUser : state.role}`;
  }

  function knownPairSymbol(symbol) {
    return state.pairs.some(pair => pair.symbol === symbol);
  }

  function applyFavouritePairs(symbols) {
    const list = symbols.filter((symbol, index) => knownPairSymbol(symbol) && symbols.indexOf(symbol) === index);
    state.favouritePairs = list;
    state.pairs.forEach(pair => {pair.starred = list.includes(pair.symbol);});
    return list;
  }

  function readStoredFavouritePairs() {
    try {
      const raw = window.localStorage.getItem(favouriteStorageKey());
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(item => typeof item === "string") : null;
    } catch (error) {
      return null;
    }
  }

  function writeStoredFavouritePairs() {
    try {
      window.localStorage.setItem(favouriteStorageKey(), JSON.stringify(state.favouritePairs));
    } catch (error) {
      /* storage unavailable, the list stays for this session only */
    }
  }

  function loadFavouritePairs() {
    return applyFavouritePairs(readStoredFavouritePairs() || seededFavouritePairs);
  }

  function isFavouritePair(symbol) {
    return state.favouritePairs.includes(symbol);
  }

  function toggleFavouritePair(symbol) {
    if (!knownPairSymbol(symbol)) return state.favouritePairs;
    applyFavouritePairs(isFavouritePair(symbol)
      ? state.favouritePairs.filter(item => item !== symbol)
      : [...state.favouritePairs, symbol]);
    writeStoredFavouritePairs();
    return state.favouritePairs;
  }

  function pairLabel(pair) {
    return pair.label || pair.symbol;
  }

  loadFavouritePairs();

  Object.assign(MP,{state,resolveRole,roleMetaFor,isDeskRole,deskRoleKeys:DESK_ROLE_KEYS,pairLabel,loadFavouritePairs,isFavouritePair,toggleFavouritePair,resetExecutionTape,primeAccountIdForBook,primeAccountIdForEtf,bookIdForEtf,clientPerTradeBtcCap,accountLabel,accountLabelWithHolder,accountHolderLabel,accountPathLabel,tradePositionRows,tradePositionFor,roundCents,rankVendorQuotes,bestVendorQuote,vendorDisplayName,vendorDisplayCustodian,vendorDisplay,latestVendorQuoteTime,executionBucketLabel,executionTargetSchedule,executionSliceCount,executionSliceLabel,executionWindowLabel,executionWindowOpenTime,executionWindowCloseLabel,executionWindowMidLabel,executionClockLabel,executionSliceMinuteOptions,executionMaxSlices,executionParamsLocked,executionParamsLockReason,executionSimClockLabel,buildExecutionTape,executionSeedRun,executionRunContext,executionRunById,executionRunFor,executionRunStatus,executionDeskRunOrderId,tradeCandleVolume});
})(window.MP = window.MP || {});

  <script data-source="js/core/format.js">
(function (MP) {
  "use strict";

  function displayCurrency() {
    return MP.state?.displayCurrency === "USD" ? "USD" : "KRW";
  }

  function formatMoney(value, sourceCurrency = "USD", options = {}) {
    const source = sourceCurrency === "KRW" ? "KRW" : "USD";
    const target = displayCurrency();
    const rate = MP.state.constants.usdKrw;
    const converted = source === target ? Number(value) : source === "USD" ? Number(value) * rate : Number(value) / rate;
    const signed = Number.isFinite(converted) ? converted : 0;
    const absolute = Math.abs(signed);
    const sign = signed < 0 ? "-" : options.showPlus && signed > 0 ? "+" : "";
    const digits = target === "KRW" ? 0 : 2;
    const number = absolute.toLocaleString(target === "KRW" ? "ko-KR" : "en-US", {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    });
    return `${sign}${target === "KRW" ? "₩" : "$"}${number}`;
  }

  const formatMoneyFromUsd = (value, options) => formatMoney(value, "USD", options);
  const formatMoneyFromKrw = (value, options) => formatMoney(value, "KRW", options);
  function formatLiteralMoney(value, currency = "USD", options = {}) {
    const target=currency==="KRW"?"KRW":"USD";
    const signed=Number.isFinite(Number(value))?Number(value):0;
    const absolute=Math.abs(signed);
    const sign=signed<0?"-":options.showPlus&&signed>0?"+":"";
    const digits=target==="KRW"?0:2;
    const number=absolute.toLocaleString(target==="KRW"?"ko-KR":"en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits});
    return `${sign}${target==="KRW"?"₩":"$"}${number}`;
  }
  const displayValueFromUsd = (value) => {
    const converted = displayCurrency() === "KRW" ? Number(value) * MP.state.constants.usdKrw : Number(value);
    return converted.toLocaleString("en-US", displayCurrency() === "KRW"
      ? {maximumFractionDigits:0}
      : {minimumFractionDigits:2,maximumFractionDigits:2});
  };
  const usdValueFromDisplay = (value) => {
    const parsed = Number(String(value).replace(/[^0-9.-]/g,""));
    return displayCurrency() === "KRW" ? parsed / MP.state.constants.usdKrw : parsed;
  };
  const formatTradePrice = (value, options) => formatLiteralMoney(value, "USD", options);
  const formatTradeSize = (value) => Number(value).toLocaleString("en-US", {minimumFractionDigits:4, maximumFractionDigits:4});

  function explicitMoney(value, sourceCurrency, targetCurrency, options = {}) {
    const source=sourceCurrency==="KRW"?"KRW":"USD";
    const target=targetCurrency==="USD"?"USD":"KRW";
    const rate=MP.state.constants.usdKrw;
    const converted=source===target?Number(value):source==="USD"?Number(value)*rate:Number(value)/rate;
    const safe=Number.isFinite(converted)?converted:0;
    const sign=safe<0?"-":options.showPlus?"+":"";
    const digits=target==="KRW"?0:2;
    return `${sign}${target==="KRW"?"₩":"$"}${Math.abs(safe).toLocaleString(target==="KRW"?"ko-KR":"en-US",{minimumFractionDigits:digits,maximumFractionDigits:digits})}`;
  }

  function quantityText(quantity, unit, showSign=false) {
    const value=Number(quantity);
    const absolute=Math.abs(Number.isFinite(value)?value:0);
    const digits={BTC:4,ETH:4,USD:2,KRW:0,USDT:2,"주":0}[unit]??4;
    const sign=value<0?"-":showSign&&value>0?"+":"";
    return `${sign}${absolute.toLocaleString("ko-KR",{minimumFractionDigits:digits,maximumFractionDigits:digits})} ${unit}`;
  }

  function dualValue({quantity,unit,costPrice,markPrice,currency,variant="cell",sourceCurrency="USD",costAmount,markAmount,quantityLabel,showUnitPrice=true,showQuantitySign=false,markKey="",markMultiplier=1,markBaseAmount=0}) {
    const allowedVariant=["cell","kpi","kv"].includes(variant)?variant:"cell";
    const resolvedCostAmount=Number.isFinite(Number(costAmount))?Number(costAmount):Number(quantity)*Number(costPrice);
    const resolvedMarkAmount=Number.isFinite(Number(markAmount))?Number(markAmount):Number(quantity)*Number(markPrice);
    const evaluationPnl=resolvedMarkAmount-resolvedCostAmount;
    const primaryQuantity=quantityLabel||quantityText(quantity,unit,showQuantitySign);
    const unitPrice=showUnitPrice?` @ ${explicitMoney(costPrice,sourceCurrency,currency)}`:"";
    const attributes=markKey?` data-dual-quantity="${Number(quantity)}" data-dual-cost-amount="${resolvedCostAmount}" data-dual-source="${sourceCurrency}" data-dual-currency="${currency}" data-dual-mark-key="${markKey}" data-dual-mark-multiplier="${Number(markMultiplier)}" data-dual-mark-base="${Number(markBaseAmount)}"`:"";
    return `<span class="dual-value dual-value--${allowedVariant} num"${attributes}><strong class="dual-cost-line"><span>${primaryQuantity}</span><span>원가 ${explicitMoney(resolvedCostAmount,sourceCurrency,currency)}${unitPrice}</span></strong><small class="dual-mark-line">평가 ${explicitMoney(resolvedMarkAmount,sourceCurrency,currency)} <span class="${evaluationPnl>=0?"positive-text":"negative-text"}">평가손익 ${explicitMoney(evaluationPnl,sourceCurrency,currency,{showPlus:true})}</span></small></span>`;
  }

  function refreshDualValueOverlays() {
    document.querySelectorAll("[data-dual-mark-key]").forEach(node=>{
      const key=node.dataset.dualMarkKey;
      const markPrice=key==="usdtUsd"?MP.state.usdtKrw/MP.state.constants.usdKrw:key.startsWith("pair:")&&typeof MP.pairMarkBySymbol==="function"?MP.pairMarkBySymbol(key.slice(5)):Number(MP.state[key]);
      const quantity=Number(node.dataset.dualQuantity);
      const costAmount=Number(node.dataset.dualCostAmount);
      if(!Number.isFinite(markPrice)||!Number.isFinite(quantity)||!Number.isFinite(costAmount))return;
      const markAmount=Number(node.dataset.dualMarkBase||0)+quantity*markPrice*Number(node.dataset.dualMarkMultiplier||1);
      const pnl=markAmount-costAmount;
      const line=node.querySelector(".dual-mark-line");
      if(line)line.innerHTML=`평가 ${explicitMoney(markAmount,node.dataset.dualSource,node.dataset.dualCurrency)} <span class="${pnl>=0?"positive-text":"negative-text"}">평가손익 ${explicitMoney(pnl,node.dataset.dualSource,node.dataset.dualCurrency,{showPlus:true})}</span>`;
    });
  }

  Object.assign(MP, { displayCurrency, formatMoney, formatMoneyFromUsd, formatMoneyFromKrw, formatLiteralMoney, displayValueFromUsd, usdValueFromDisplay, formatTradePrice, formatTradeSize, dualValue, refreshDualValueOverlays });
})(window.MP = window.MP || {});

  const orderModeDefs = [
    {id:"rfq",label:"RFQ 릴레이",mode:"RFQ"},

  const orderModeFreezeNote = "파라미터는 접수 시점에 동결되며 변경은 신규 주문으로만 가능";

  const windowClockStartMinutes = 540;
  const windowClockEndMinutes = 960;
  const windowClockStepMinutes = 30;

  function windowClockOptions() {
    const list=[];
    for(let minutes=windowClockStartMinutes;minutes<=windowClockEndMinutes;minutes+=windowClockStepMinutes){
      list.push({value:minutes,label:MP.executionClockLabel(minutes)});
    }
    return list;
  }

  function windowSliceOptions() {
    return MP.executionSliceMinuteOptions.map(minutes=>({value:minutes,label:`${minutes}분`}));
  }

  function orderModeParams(options={}) {
    const draft=options.draft||null;
    const window=draft?.executionWindow||MP.state.executionWindowParams;
    const locked=draft?false:MP.executionParamsLocked();
    return [
      {key:"fixing",label:"기준 픽싱",value:"당일 복제 픽싱 (기본값)",rawValue:draft?.fixingBasis||"daily-replication",options:draft?[{value:"daily-replication",label:"당일 복제 픽싱 (기본값)"},{value:"window-average",label:"윈도우 평균"}]:undefined,note:`전일 확정 ${MP.formatLiteralMoney(MP.state.constants.btcFixingUsd,"USD")}`},
      {key:"windowStart",label:"윈도 시작",value:MP.executionClockLabel(window.startMinutes),note:"",field:"start",rawValue:window.startMinutes,options:windowClockOptions(),locked},
      {key:"windowEnd",label:"윈도 종료",value:MP.executionClockLabel(window.endMinutes),note:"",field:"end",rawValue:window.endMinutes,options:windowClockOptions(),locked},
      {key:"windowSlice",label:"슬라이스 길이",value:`${window.sliceMinutes}분`,note:MP.executionSliceLabel(),field:"slice",rawValue:window.sliceMinutes,options:windowSliceOptions(),locked},
      {key:"participation",label:"최대 참여율 (%)",value:draft?.participationPct??18,control:"number",placeholder:"슬라이스 시장 거래량 대비 상한",min:1,max:100,step:1,note:""},
      {key:"collar",label:"가격 밴드 (bp)",value:draft?.priceBandBp??25,control:"number",placeholder:"기준가 대비 허용 폭",min:0,step:1,note:""},
      {key:"venueExclusion",label:"제외 베뉴",value:draft?.excludedVenueIds||[],control:"venue-multi",note:""}
    ];

  function orderModeParticipationCapPct() {
    const raw=orderModeParams().find(param=>param.key==="participation")?.value||"0";
    const value=parseFloat(String(raw).replace(/[^0-9.]/g,""));
    return Number.isFinite(value)?value:0;

  function renderOrderModeTabs(context = {}) {
    const {

      action = "order-mode",

      surface = "client",
      rfqBody = "",
      algoBody = "",
      rfqNotes = [],
      algoNotes = [],
      params = orderModeParams()
    } = context;
    const allowed = orderModeDefs.filter(def=>!modes||modes.includes(def.mode));
    const defs = allowed.length?allowed:orderModeDefs;
    const active = defs.find(def=>def.id===mode)||defs[0];
    const tabs = defs.map(def=>`<button type="button" class="${def.id===active.id?"active":""}" data-action="${action}" data-mode="${def.id}"${attrs?` ${attrs}`:""}${editable?"":" disabled"}>${def.label}</button>`).join("");
    const windowLocked = params.some(param=>param.locked===true);
    const lockReason = windowLocked?MP.executionParamsLockReason():"";
    const paramRows = params.map(param=>{
      const locked = param.locked===true;
      const disabled = (!editable||locked)?" disabled":"";
      const guard = locked?` title="${lockReason}"`:"";
      const control = Array.isArray(param.options)
        ?`<select data-order-param="${param.key}" data-execution-window="${param.field}"${disabled}${guard}>${param.options.map(option=>`<option value="${option.value}"${String(option.value)===String(param.rawValue)?" selected":""}>${option.label}</option>`).join("")}</select>`
        :`<select data-order-param="${param.key}"${editable?"":" disabled"}><option>${param.value}</option></select>`;
      return `<div class="field order-param"><label>${param.label}</label>${control}${param.note?`<small class="field-note">${param.note}</small>`:""}</div>`;
    }).join("");
    const windowLockNote = windowLocked?`윈도 파라미터 잠김, ${lockReason}`:"";
    const notes = (active.id==="rfq"?rfqNotes:[...algoNotes,windowLockNote,orderModeFreezeNote])
      .filter(Boolean)
      .map(note=>`<p class="order-mode-note">${note}</p>`).join("");
    const body = active.id==="rfq"?rfqBody:`<div class="order-param-grid">${paramRows}</div>${algoBody}`;
    return `<div class="order-mode-tabs order-mode-${surface}" data-order-mode-active="${active.id}"><div class="tabs compact">${tabs}</div><div class="order-mode-panel">${body}</div>${notes}</div>`;
  }

  Object.assign(MP, { svg, icons, chip, spark, metric, panel, btn, progress, coin, searchBox, orderModeDefs, orderModeParams, orderModeParticipationCapPct, orderModeFreezeNote, renderOrderModeTabs });
})(window.MP = window.MP || {});
