  }

  function renderPairLadderRows(pair) {
    const rows=pairDepth(pair).slice(0,11);
    const priceMode=pair.ladderMode==="price";
    const maxSize=Math.max(...rows.map(row=>Math.max(row.bidSize,row.askSize)));
    let bidRunning=0;
    let askRunning=0;
    return rows.map(row=>{
      bidRunning+=row.bidSize*row.bidPrice;
      askRunning+=row.askSize*row.askPrice;
      const bidText=priceMode?formatPairQuoteMoney(pair,bidRunning):formatPairSize(pair,row.bidSize);
      const askText=priceMode?formatPairQuoteMoney(pair,askRunning):formatPairSize(pair,row.askSize);
      const bidHeat=Math.max(8,row.bidSize/maxSize*100).toFixed(0);
      const askHeat=Math.max(8,row.askSize/maxSize*100).toFixed(0);
      return `<div class="ladder-row"><span class="ladder-qty bid num">${bidText}</span><span class="ladder-px bid num"><i style="width:${bidHeat}%"></i><b>${formatPairPrice(pair,row.bidPrice)}</b></span><span class="ladder-spread num">${row.spreadBps.toFixed(2)}</span><span class="ladder-px ask num"><i style="width:${askHeat}%"></i><b>${formatPairPrice(pair,row.askPrice)}</b></span><span class="ladder-qty ask num">${askText}</span></div>`;
    }).join("");
  }

  function renderPairCard(pair) {
    const priceMode=pair.ladderMode==="price";
    const quantityHead=priceMode?"누적명목":"수량";
    const change=pairChangePercent(pair);
    return `<article class="pair-card${state.watchSelected===pair.symbol?" focused":""}" data-pair-card="${pair.symbol}"><button class="pair-card-body" type="button" data-action="pair-open" data-pair="${pair.symbol}" aria-label="${MP.pairLabel(pair)} 집행 화면 열기"><span class="pair-card-head"><span class="status-dot positive"></span><b>${MP.pairLabel(pair)}</b>${pair.starred?'<span class="pair-pin">★</span>':""}</span><span class="pair-quote-row"><span class="pair-quote"><small>Bid</small><strong class="num positive-text" data-pair-bid="${pair.symbol}">${formatPairPrice(pair,pairBid(pair))}</strong></span><span class="pair-spread"><small>스프레드</small><b class="num" data-pair-spread="${pair.symbol}">${pairSpreadBps(pair).toFixed(2)}bp</b></span><span class="pair-quote align-right"><small>Offer</small><strong class="num negative-text" data-pair-offer="${pair.symbol}">${formatPairPrice(pair,pairOffer(pair))}</strong></span></span></button><div class="pair-card-actions"><button class="pair-action bid" type="button" data-action="pair-bid" data-pair="${pair.symbol}">Bid</button><button class="pair-action rfq" type="button" data-action="pair-rfq" data-pair="${pair.symbol}">RFQ</button><button class="pair-action offer" type="button" data-action="pair-offer" data-pair="${pair.symbol}">Offer</button></div><div class="pair-ladder"><div class="pair-ladder-head"><span>${quantityHead}</span><span>매수호가</span><span>스프레드(bp)</span><span>매도호가</span><span>${quantityHead}</span></div><div class="pair-ladder-rows" data-pair-ladder="${pair.symbol}">${renderPairLadderRows(pair)}</div></div><footer class="pair-card-foot"><span class="num ${change>=0?"positive-text":"negative-text"}" data-card-change="${pair.symbol}">24H ${change>=0?"+":""}${change.toFixed(2)}%</span><span class="segmented compact pair-ladder-toggle"><button type="button" class="${priceMode?"":"active"}" data-action="pair-ladder-mode" data-pair="${pair.symbol}" data-mode="size">수량</button><button type="button" class="${priceMode?"active":""}" data-action="pair-ladder-mode" data-pair="${pair.symbol}" data-mode="price">가격</button></span></footer></article>`;
  }

  function renderMarketWatch() {
    const scoped=new Set(MP.pairsInScope().map(pair=>pair.symbol));
    const cards=state.favouritePairs.map(pairBySymbol).filter(pair=>scoped.has(pair.symbol)).map(renderPairCard).join("")||'<div class="empty-note">별표한 종목이 없음. 목록의 별을 눌러 추가.</div>';
    return `<section class="view trade-view trade-watch-view" data-view="trade"><div class="watch-workspace">${renderWatchRail()}<div class="pair-card-grid" id="pair-card-grid">${cards}</div></div></section>`;

  /* ---------- execution view ---------- */

  /* 호가와 체결은 패널 높이에 맞춰 행 수를 계산한다 (행 19px, 스프레드 행 28px).
     빈 공간과 스크롤바 없이 마지막 행이 패널 바닥에 닿게 하는 것이 목적이다. */
  const BOOK_ROW_HEIGHT = 19;
  const BOOK_SPREAD_HEIGHT = 28;
  const BOOK_MIN_LEVELS = 11;
  const TAPE_MIN_ROWS = 20;
  const TAPE_MAX_ROWS = 40;

  function marketFillHeight(node) {
    const host=node||document.querySelector(".trade-market-panel .market-panel-fill");
    return host&&host.clientHeight?host.clientHeight:0;
  }

  function bookLevelCount(height) {
    const usable=(height||marketFillHeight())-BOOK_SPREAD_HEIGHT-2;
    if(!(usable>0))return BOOK_MIN_LEVELS;
    return Math.max(BOOK_MIN_LEVELS,Math.floor(usable/(BOOK_ROW_HEIGHT*2)));
  }

  function tapeRowCount(height) {
    const usable=(height||marketFillHeight())-2;
    if(!(usable>0))return TAPE_MIN_ROWS;
    return Math.max(TAPE_MIN_ROWS,Math.min(TAPE_MAX_ROWS,Math.floor(usable/BOOK_ROW_HEIGHT)));
  }

  /* 렌더 직후와 resize 때 실제 높이를 다시 재고, 행 수가 달라졌을 때만 채워 넣는다. */
  function refreshMarketPanelFill() {
    const pair=currentPair();
    const book=document.getElementById("live-order-book");
    if(book){
      const count=String(bookLevelCount(book.clientHeight));
      if(book.dataset.levels!==count){book.dataset.levels=count;book.innerHTML=renderOrderBookRows(pair,Number(count));}
    }
    const tape=document.getElementById("live-trade-tape");
    if(tape){
      const count=String(tapeRowCount(tape.clientHeight));
      if(tape.dataset.rows!==count){tape.dataset.rows=count;tape.innerHTML=renderRecentTrades(pair,Number(count));}
    }
  }

  function scheduleMarketPanelFill() {
    window.requestAnimationFrame(refreshMarketPanelFill);
  }

  function renderOrderBookRows(pair=currentPair(),levels=bookLevelCount()) {
    const mid=pairMark(pair);
    const buildSide = side => {
      let cumulative=0;
      const rows=Array.from({length:levels}, (_,index) => {
        const level = index+1;
        const proximity=(levels-level)/Math.max(1,levels-1);
        const size=pair.bookBase+pair.bookAmp*((side==="ask"?.35:.32)+proximity*(side==="ask"?.65:.68));
        cumulative+=size;
        const direction=side==="ask"?1:-1;
        return {price:mid+direction*(pair.halfSpread+level*pair.levelStep),size,total:cumulative};
      });
      return side==="ask"?rows.reverse():rows;
    };
    const asks=buildSide("ask");
    const bids=buildSide("bid");
    const maxTotal = Math.max(...asks.map(item=>item.total),...bids.map(item=>item.total));
    const row = (item,side) => `<button class="book-row ${side}" type="button" data-action="book-price" data-price="${item.price.toFixed(6)}"><i style="width:${Math.max(6,item.total/maxTotal*94).toFixed(1)}%"></i><span class="book-price num">${formatPairPrice(pair,item.price)}</span><span class="num">${formatPairSize(pair,item.size)}</span><span class="num">${formatPairSize(pair,item.total)}</span></button>`;
    return `<div class="book-side asks">${asks.map(item=>row(item,"ask")).join("")}</div><div class="book-mid"><strong>스프레드</strong><span class="num">${formatPairQuoteMoney(pair,pair.halfSpread*2)} &nbsp; ${pairSpreadBps(pair).toFixed(2)} bps</span></div><div class="book-side bids">${bids.map(item=>row(item,"bid")).join("")}</div>`;
  }

  function renderRecentTrades(pair=currentPair(),count=tapeRowCount()) {
    return pairTape(pair).slice(0,count).map(trade => `<div class="tape-row anonymous"><span class="num ${trade.side==="buy"?"positive-text":"negative-text"}">${formatPairPrice(pair,trade.price)}</span><span class="num">${formatPairSize(pair,trade.size)}</span><time>${String(trade.time).slice(0,8)}</time></div>`).join("");
  }

  function routePreview() {
    const pair=currentPair();
    return `<details class="routing-preview" ${state.routingOpen?"open":""}><summary data-action="toggle-routing">라우팅 정보</summary><div class="route-preview-body"><div class="route-preview-bar"><i style="width:58%"></i><i style="width:42%"></i></div><div class="route-preview-row"><span>Venue 1</span><b class="num">58%, ${formatPairSize(pair,pair.defaultSize*.58)} ${pair.base}</b><small>Credit PASS</small></div><div class="route-preview-row"><span>Venue 2</span><b class="num">42%, ${formatPairSize(pair,pair.defaultSize*.42)} ${pair.base}</b><small>Balance PASS</small></div><p>예상 평균 <b class="num">${formatPairPrice(pair,pairMark(pair)+pair.halfSpread*1.51)}</b>, 충족률 100%</p></div></details>`;
  }

  function orderTypeTabs() {
    return `<div class="tabs compact">${[["market","Market"],["limit","Limit"],["twap","TWAP"],["rfq","RFQ/알고"]]
      .map(([id,label])=>`<button type="button" class="${state.tradeType===id?"active":""}" data-action="trade-type" data-type="${id}">${label}</button>`).join("")}</div>`;
  }

  function sideToggle() {
    return `<div class="trade-side-toggle"><button class="buy ${state.tradeSide==="buy"?"active":""}" type="button" data-action="trade-side" data-side="buy">매수 / BUY</button><button class="sell ${state.tradeSide==="sell"?"active":""}" type="button" data-action="trade-side" data-side="sell">매도 / SELL</button></div>`;
  }

  function orderTicket(pair) {
    const mark=pairMark(pair);
    const size=pair.defaultSize;
    const feeRate=state.tradeType==="limit"?.0001:.0002;
    const linkedField=clientScope()
      ?clientAccountField()
      :pair.symbol==="BTC/USD"
        ?`<div class="field linked-business-field"><label for="trade-inventory-tag">업무 태그</label><select id="trade-inventory-tag" data-linked-business>${linkedBusinessOptions()}</select></div>`
        :`<div class="field linked-business-field"><label>업무 태그</label><input value="자기 재고 / ${pair.base} 인벤토리" readonly></div>`;
    return `<div class="trade-ticket-controls">${orderTypeTabs()}${sideToggle()}${linkedField}<div class="field-grid"><div class="field"><label>${state.tradeType==="market"?"예상 체결가":"지정 가격"}</label><div class="input-suffix"><input id="trade-order-price" class="num" value="${pairInputValue(pair,mark)}" ${state.tradeType==="market"?"readonly":""}><span>${pair.quote}</span></div></div><div class="field"><label>주문 수량</label><div class="input-suffix"><input id="trade-order-size" class="num" value="${pair.sizeText}"><span>${pair.base}</span></div></div></div><input id="trade-order-notional" type="hidden" value="${(mark*size).toFixed(2)}"><div class="ticket-summary trade-order-summary"><div><span>예상 수수료</span><strong class="num" data-estimated-fee>${formatPairMoney(pair,mark*size*feeRate)}</strong></div><div class="align-right"><span>예상 명목</span><strong class="num" data-estimated-notional>${formatPairMoney(pair,mark*size)}</strong></div></div>${routePreview()}<button class="trade-submit ${state.tradeSide}" type="button" data-action="review-trade">${pair.base} ${state.tradeSide==="buy"?"매수":"매도"} 주문 검토</button></div>`;
  }

  function buildTradeRfqQuotes(request) {
    const pair=pairBySymbol(request.symbol);
    const mark=pairMark(pair);
    const direction=request.side==="buy"?1:-1;
    const quotes=state.vendorQuotes.map((vendor,index)=>{
      const skewBps=(index%2?1:-1)*(index+1)*.32+vendor.feeBps*.45;
      const raw=mark*(1+direction*skewBps/10000);
      return {id:vendor.id,name:vendor.name,receivedAt:vendor.receivedAt,feeBps:vendor.feeBps,raw,allIn:raw*(1+direction*vendor.feeBps/10000),best:false};
    });
    const ordered=[...quotes].sort((a,b)=>request.side==="buy"?a.allIn-b.allIn:b.allIn-a.allIn);
    ordered[0].best=true;
    return ordered.slice(0,1);
  }

  function pdfTabAvailable() {
    return !clientScope()&&state.orderCardMode==="etf";
  }

  function renderMarketData(pair) {
    const pdfTab=pdfTabAvailable();
    if(!pdfTab&&state.tradeMarketTab==="pdf")state.tradeMarketTab="book";
    const definitions=pdfTab?[["book","호가"],["trades","체결"],["pdf","PDF"]]:[["book","호가"],["trades","체결"]];
    const tabs=definitions.map(([id,label])=>`<button type="button" class="${state.tradeMarketTab===id?"active":""}" data-action="trade-market-tab" data-tab="${id}">${label}</button>`).join("");
    const levels=bookLevelCount();
    const tapeRows=tapeRowCount();
    const body=state.tradeMarketTab==="pdf"
      ?MP.renderPdfPanel()
      :state.tradeMarketTab==="trades"
        ?`<div class="tape-head anonymous"><span>가격 ${pair.quote}</span><span>수량 ${pair.base}</span><span>시각</span></div><div class="trade-tape market-panel-fill" id="live-trade-tape" data-rows="${tapeRows}">${renderRecentTrades(pair,tapeRows)}</div>`
        :`<div class="book-head"><span>가격 ${pair.quote}</span><span>수량 ${pair.base}</span><span>누적</span></div><div class="order-book market-panel-fill" id="live-order-book" data-levels="${levels}">${renderOrderBookRows(pair,levels)}</div>`;
    if(state.tradeMarketTab!=="pdf")scheduleMarketPanelFill();
    return `<section class="panel trade-market-panel"><header class="panel-header"><div class="tabs trade-market-tabs">${tabs}</div><div class="panel-actions">${state.tradeMarketTab==="trades"?chip("STREAM","positive"):""}</div></header><div class="panel-body flush">${body}</div></section>`;
  }

  function renderExecution() {
    const pair=currentPair();
    ensurePairTape(pair);
    const candles=pairCandles(pair);
    const last=candles[candles.length-1];
    const timeframes=["1m","5m","15m","1h"].map(value=>`<button type="button" class="${state.tradeTimeframe===value?"active":""}" data-action="trade-timeframe" data-timeframe="${value}" aria-pressed="${state.tradeTimeframe===value}">${value}</button>`).join("");
    const selector=`<div class="market-dropdown-wrap"><button class="icon-button back-watch" type="button" data-action="back-market-watch" aria-label="마켓 워치">←</button>${renderMarketSelectorButton(pair)}</div>`;
    const chartPanel=panel("",`<div class="trade-pair-header">${selector}<div class="market-stats"><span class="market-stat"><span class="k">시가</span><span class="v num">${formatPairPrice(pair,last.open)}</span></span><span class="market-stat"><span class="k">고가</span><span class="v num positive-text">${formatPairPrice(pair,last.high)}</span></span><span class="market-stat"><span class="k">저가</span><span class="v num negative-text">${formatPairPrice(pair,last.low)}</span></span><span class="market-stat"><span class="k">종가</span><span class="v num">${formatPairPrice(pair,last.close)}</span></span><span class="market-stat"><span class="k">24h 변동</span><span class="v num ${pairChangeClass(pair)}">${pairChangeText(pair)}</span></span><span class="market-stat"><span class="k">24h 거래량</span><span class="v num">${pairVolumeCell(pair)}</span></span></div></div><div class="trade-chart-toolbar"><div class="segmented">${timeframes}</div></div><div class="live-chart candle-chart"><div class="chart-ohlc"><span>O <b class="num" data-ohlc-open>${formatPairPrice(pair,last.open)}</b></span><span>H <b class="num positive-text" data-ohlc-high>${formatPairPrice(pair,last.high)}</b></span><span>L <b class="num negative-text" data-ohlc-low>${formatPairPrice(pair,last.low)}</b></span><span>C <b class="num" data-live-price>${formatPairPrice(pair,last.close)}</b></span></div><div data-candle-chart>${candleChartSvg(pair)}</div></div>`,{flush:true,className:"trade-chart-panel"});
    return `<section class="view trade-view" data-view="trade"><div class="trade-layout">${chartPanel}${renderMarketData(pair)}<aside class="trade-ticket-column order-card-column">${MP.renderOrderCard()}</aside></div></section>`;
  }

  function renderTrade() {
    return state.tradeView==="execution"?renderExecution():renderMarketWatch();
  }

  Object.assign(MP,{
    pairBySymbol,pairMark,pairMarkBySymbol,currentPair,pairBid,pairOffer,pairSpreadBps,pairChangePercent,pairCrossGap,
    fixedNumber,formatPairPrice,pairInputValue,pairValueFromInput,formatPairMoney,formatPairQuoteMoney,pairNotionalKrw,formatPairSize,compactQuantity,
    pairDepth,pairCandles,pairTape,ensurePairTape,sortedPairs,candleChartSvg,linkedBusinessLabel,orderTypeTabs,
    renderOrderBookRows,renderRecentTrades,renderWatchRows,renderPairLadderRows,renderPairCard,refreshMarketPanelFill,
    selectorPairs,renderMarketSelector,renderMarketSelectorRows,renderMarketSelectorButton,renderMarketStats,pdfTabAvailable,
    buildTradeRfqQuotes,renderTrade,clientAccountLabel,clientCapText,clientAccountField
  });
})(window.MP = window.MP || {});
  </script>
  <script data-source="js/screens/order-card.js">
(function (MP) {
  "use strict";

  const {state,chip,panel,btn,progress,formatTradePrice,formatMoneyFromUsd,formatMoneyFromKrw} = MP;

  const sectionTitles = {ticket:"주문 티켓",relay:"릴레이 상태",vendors:"요청 벤더"};
  const acceptDelays = [900,1800,2600];
  const acceptStep = 900;

  /* ---------- shared readers ---------- */

  function selectedEtf() {
    return state.etfs.find(item=>item.id===state.apOrderDraft.etfId)||state.etfs[0];
  }

  function pdfRecord(etf=selectedEtf()) {
    return state.pdfUploads[etf.id]||null;
  }

  function pdfFacts(received=pdfRecord()) {
    return {
      cuShares:received&&received.cuShares?received.cuShares:state.constants.cuShares,
      unitPerCu:received&&received.btcPerCu?received.btcPerCu:state.constants.btcPerCu
    };
  }

  function underlyingOf(etf=selectedEtf(),received=pdfRecord(etf)) {
    return etf.underlying||(received&&received.underlying)||"BTC";
  }

  function numberValue(value,digits=4) {
    return Number(value).toLocaleString("en-US",{maximumFractionDigits:digits});
  }

  function deskVendorLabel(vendor) {
    if(!vendor)return "";
    return vendor.anonName||MP.vendorDisplayName(vendor);
  }

  function clientScope() {
    return typeof MP.clientScopeActive==="function"&&MP.clientScopeActive();
  }

  function ticketEditable() {
    return clientScope()?MP.canControl("exec","client"):MP.canControl("exec","securities");
  }

  /* 단일가 수락 (프라임 제시가) is a master only execution act, USER_ACCOUNT_MODEL §4.1.
     The desk trader keeps RFQ creation and the algo instruction and reads the acceptance. */
  const QUOTE_ACCEPT_REASON="단일가 수락은 데스크 마스터 소관, 데스크 트레이더는 열람";

  function quoteAcceptEditable() {
    return clientScope()?state.role==="client-master":MP.canControl("exec","desk-master");
  }

  function quoteAcceptAttrs() {
    return quoteAcceptEditable()?"":` disabled title="${QUOTE_ACCEPT_REASON}"`;
  }

  function cardPrimeAccountId(etfId) {
    const row=state.lpBookRows.find(item=>item.etfId===etfId);
    const override=row&&state.primeAccounts.some(account=>account.id===row.primeAccountId)?row.primeAccountId:null;
    return MP.primeAccountIdForEtf(etfId,override);
  }

  function cardAccounts(etf=selectedEtf()) {
    const bookId=MP.bookIdForEtf(etf.id);
    const primeAccountId=cardPrimeAccountId(etf.id);
    return {
      bookId,
      primeAccountId,
      book:state.etfBooks.find(item=>item.id===bookId)||null,
      account:state.primeAccounts.find(item=>item.id===primeAccountId)||null
    };
  }

  /* ---------- quantity derivation ---------- */

  function deriveFrom(source,value) {
    const draft=state.apOrderDraft;
    const facts=pdfFacts();
    const next=Math.max(0,Number(String(value).replace(/,/g,""))||0);
    if(source==="shares"){
      draft.shares=next;
      draft.cu=next/facts.cuShares;
      draft.btc=draft.cu*facts.unitPerCu;
    }else if(source==="cu"){
      draft.cu=next;
      draft.shares=next*facts.cuShares;
      draft.btc=next*facts.unitPerCu;
    }else{
      draft.btc=next;
      draft.cu=next/facts.unitPerCu;
      draft.shares=draft.cu*facts.cuShares;
    }
  }

  function isWholeCu() {
    const facts=pdfFacts();
    const remainder=state.apOrderDraft.shares%facts.cuShares;
    return Math.abs(remainder)<.000001||Math.abs(remainder-facts.cuShares)<.000001;
  }

  function conversionChainText() {
    const draft=state.apOrderDraft;
    const usd=draft.btc*state.constants.btcFixingUsd;
    return `${numberValue(draft.shares,0)}주 = ${numberValue(draft.cu,4)} CU = ${numberValue(draft.btc,4)} ${underlyingOf()} = ${formatMoneyFromUsd(usd)}`;
  }

  function syncApOrderDom(source) {
    const draft=state.apOrderDraft;
    document.querySelectorAll("[data-order-quantity]").forEach(input=>{
      const field=input.dataset.orderQuantity;
      if(field===source)return;
      input.value=field==="shares"?numberValue(draft.shares,0):numberValue(draft[field],4);
    });
    const usd=draft.btc*state.constants.btcFixingUsd;
    document.querySelectorAll("[data-order-notional]").forEach(node=>node.textContent=formatMoneyFromUsd(usd));
    document.querySelectorAll("[data-order-chain]").forEach(node=>node.textContent=conversionChainText());
    const warning=document.querySelector("[data-cu-warning]");
    if(warning)warning.hidden=isWholeCu();
    const submit=document.querySelector('[data-action="create-ap-rfq"],[data-action="instruct-ap-algo"]');
    if(submit)submit.disabled=!canCreateRfq();
  }

  function updateApOrderQuantity(source,value) {
    deriveFrom(source,value);
    syncApOrderDom(source);
  }

  function canCreateRfq() {
    const draft=state.apOrderDraft;
    const received=state.pdfUploads[draft.etfId];
    return Boolean(received&&received.validationStep>=4&&draft.vendorIds.length&&draft.btc>0&&isWholeCu()&&!state.killSwitchActive);
  }

  /* ---------- relay state ---------- */

  function requestedVendors(rfq) {
    return state.vendorQuotes.filter(item=>rfq.vendorIds.includes(item.id));
  }

  function acceptanceOrder(rfq) {
    return requestedVendors(rfq).slice().sort((a,b)=>rfq.side==="SELL"?a.allIn-b.allIn:b.allIn-a.allIn);
  }

  function acceptedEntries(rfq) {
    return (rfq.acceptances||[]).map(entry=>({...entry,vendor:state.vendorQuotes.find(item=>item.id===entry.vendorId)})).filter(entry=>entry.vendor);
  }

  function bestAcceptedEntry(rfq) {
    const entries=acceptedEntries(rfq);
    if(!entries.length)return null;
    return entries.slice().sort((a,b)=>rfq.side==="SELL"?b.allIn-a.allIn:a.allIn-b.allIn)[0];
  }

  function clientPriceUsd(rfq,allIn) {
    const rate=Number.isFinite(rfq.feeBps)?rfq.feeBps:state.apOrderDraft.feeBps;
    return MP.roundCents(allIn*(1+rate/10000));
  }

  function scheduleRfqAcceptances(rfq) {
    rfq.acceptances=[];
    rfq.rejections=[];
    const order=acceptanceOrder(rfq);
    /* ETF 릴레이는 코인 RFQ 카드와 같은 방식으로 한 곳이 거절로 정착한다. 고객 RFQ 는 종전대로 전 벤더 수락. */
    const rejectId=rfq.etfId&&order.length>2?order[1].id:null;
    order.forEach((vendor,index)=>{
      const delay=index<acceptDelays.length?acceptDelays[index]:acceptDelays[acceptDelays.length-1]+(index-acceptDelays.length+1)*acceptStep;
      MP.simulationTimeout(()=>{
        if(!state.activeRfqs.includes(rfq)||rfq.status!=="견적 수신")return;
        if(vendor.id===rejectId){
          if(rfq.rejections.some(entry=>entry.vendorId===vendor.id))return;
          rfq.rejections.push({vendorId:vendor.id,at:MP.currentTimestamp().slice(0,12)});
          MP.addAudit("RFQ_VENDOR_REJECT",`${rfq.id}, ${vendor.name}, 거절`);
        }else{
          if(rfq.acceptances.some(entry=>entry.vendorId===vendor.id))return;
          rfq.acceptances.push({vendorId:vendor.id,allIn:vendor.allIn,at:MP.currentTimestamp().slice(0,12)});
          MP.addAudit("RFQ_VENDOR_ACCEPT",`${rfq.id}, ${vendor.name}, All-in ${vendor.allIn.toFixed(2)}`);
        }
        if(state.current==="trade"&&state.tradeView==="execution"&&state.tradeType==="rfq")MP.renderRoute("trade",false);
      },delay);
    });
  }

  /* ---------- card sections ---------- */

  function sectionShell(key,body,options={}) {
    const open=state.orderCardSections[key]!==false;
    const title=options.title||sectionTitles[key];
    const meta=options.meta?`<span class="order-card-meta"${options.metaKey?` data-${options.metaKey}`:""}>${options.meta}</span>`:"";
    const sub=options.sub?" sub":"";
    return `<section class="order-card-section${sub} ${open?"open":"collapsed"}" data-card-section="${key}"><button type="button" class="order-card-summary" data-action="toggle-card-section" data-section="${key}" aria-expanded="${open}"><span class="order-card-caret" aria-hidden="true">${open?"▾":"▸"}</span><strong>${title}</strong>${meta}</button><div class="order-card-body" ${open?"":"hidden"}>${body}</div></section>`;
  }

  /* 고객 카드의 대상은 코인 현물과 ETF 블록 2종이다. ETF 블록은 D-0910-10에서 보류된
     주문 접수 화면의 접수부를 그대로 옮겨 온 주문 종류이며 상태는 `clientTradeTicket.target`. */
  function clientTarget() {
    return state.clientTradeTicket.target==="etf"?"etf":"coin";
  }

  function targetSegment() {
    const editable=ticketEditable();
    if(clientScope()){
      const options=[["coin","코인 현물"],["etf","ETF 블록"]];
      return `<div class="segmented order-card-target">${options.map(([id,label])=>`<button type="button" class="${clientTarget()===id?"active":""}" data-action="client-card-target" data-target="${id}"${editable?"":" disabled"}>${label}</button>`).join("")}</div>`;
    }
    const options=[["etf","ETF 설정/환매"],["coin","코인 현물"]];
    return `<div class="segmented order-card-target">${options.map(([id,label])=>`<button type="button" class="${state.orderCardTarget===id?"active":""}" data-action="card-target" data-target="${id}"${editable?"":" disabled"}>${label}</button>`).join("")}</div>`;
  }

  function fulfilmentChip() {
    if(state.apOrderDraft.source!=="client-portal")return "";
    const order=state.clientOrders.find(item=>item.clientId===state.clientPortal.clientId)||state.clientOrders[0];
    return chip(`소유 프라임, ${order?order.id:state.clientPortal.orderId}`,"positive");
  }

  function accountChips() {
    if(clientScope()){
      const account=MP.clientScopeAccount();
      return `<span class="account-chip-pair">${chip(account?account.id:"계정 미배정","info")}</span>`;
    }
    const {book,account}=cardAccounts();
    return `<span class="account-chip-pair">${fulfilmentChip()}${chip(`ETF 북 ${book?book.name.replace("ETF 북 ",""):"미배정"}`,"violet")}${chip(account?MP.accountLabel(account.id):"미배정","info")}</span>`;
  }

  function etfOptions(selectedId) {
    return state.etfs.map(etf=>`<option value="${etf.id}" ${etf.id===selectedId?"selected":""}>${etf.name}</option>`).join("");
  }

  function ttlLabel(seconds) {
    return seconds===300?"5m":`${seconds}s`;
  }

  function fixingSummaryText(draft=state.apOrderDraft) {
    return `당일 복제 픽싱, TTL ${ttlLabel(draft.ttl)}, 정산 17:00`;
  }

  function vendorSummaryText(draft=state.apOrderDraft) {
    const names=state.vendorQuotes.filter(item=>draft.vendorIds.includes(item.id)).map(deskVendorLabel).join(" ");
    return draft.vendorIds.length?`${draft.vendorIds.length}곳, ${names}`:"0곳";
  }

  /* 벤더 선택은 한 줄 24px 의 조밀한 목록이며 맨 위 전체 선택 행이 전부를 토글한다.
     행은 체크박스와 벤더명만 둔다 (커스터디언 보조 문구 없음). */
  function vendorPickList(vendors,selectedIds,hook,editable=true) {
    const selected=new Set(selectedIds);
    const disabled=editable?"":" disabled";
    const all=vendors.length>0&&vendors.every(vendor=>selected.has(vendor.id));
    const head=`<label class="vendor-pick-row all"><input type="checkbox" data-${hook}-all${all?" checked":""}${disabled}><b>전체 선택</b><span data-${hook}-count>${selected.size}/${vendors.length}</span></label>`;
    const rows=vendors.map(vendor=>`<label class="vendor-pick-row"><input type="checkbox" data-${hook} value="${vendor.id}"${selected.has(vendor.id)?" checked":""}${disabled}><b>${MP.vendorDisplayName(vendor)}</b></label>`).join("");
    return `<div class="vendor-pick-list">${head}${rows}</div>`;
  }

  function syncVendorPick(hook) {
    const boxes=[...document.querySelectorAll(`[data-${hook}]`)];
    const checked=boxes.filter(box=>box.checked);
    const all=document.querySelector(`[data-${hook}-all]`);
    if(all)all.checked=boxes.length>0&&checked.length===boxes.length;
    document.querySelectorAll(`[data-${hook}-count]`).forEach(node=>{node.textContent=`${checked.length}/${boxes.length}`;});
  }

  function vendorRows() {
    return vendorPickList(state.vendorQuotes,state.apOrderDraft.vendorIds,"order-vendor",ticketEditable());
  }

  /* ---------- ETF 설정/환매 카드 ----------
     코인 RFQ 카드와 같은 구조를 쓴다. 방향 토글, 연결 수량 블록, 벤더 목록, 기준과 TTL,
     요청 버튼, 그리고 요청 뒤에는 코인 카드와 같은 요청 카드 하나. */

  function etfSideToggle(disabled) {
    const draft=state.apOrderDraft;
    return `<div class="trade-side-toggle"><button class="buy ${draft.side==="creation"?"active":""}" type="button" data-action="order-side" data-side="creation"${disabled}>설정</button><button class="sell ${draft.side==="redemption"?"active":""}" type="button" data-action="order-side" data-side="redemption"${disabled}>환매</button></div>`;
  }

  /* 주수, CU, 기초자산은 서로 묶인 값이므로 한 줄에 세 상자로 두고 하나를 고치면 나머지가 따라간다. */
  function etfQuantityBlock(facts,underlying,disabled) {
    const draft=state.apOrderDraft;
    const glyph='<span class="etf-quantity-glyph" aria-hidden="true">⇄</span>';
    const cell=(label,field,value)=>`<div class="field"><label>${label}</label><input class="num" inputmode="decimal" value="${value}" data-order-quantity="${field}"${disabled}></div>`;
    return `<div class="etf-quantity-link">${cell("주수","shares",numberValue(draft.shares,0))}${glyph}${cell("CU","cu",numberValue(draft.cu,4))}${glyph}${cell(`기초자산 ${underlying}`,"btc",numberValue(draft.btc,4))}</div><small class="etf-quantity-caption">1 CU = ${facts.cuShares.toLocaleString("ko-KR")}주 = ${facts.unitPerCu} ${underlying}</small>`;
  }

  function etfBasisRow(disabled) {
    return `<div class="field-grid rfq-basis-row"><div class="field"><label>기준</label><select data-rfq-basis${disabled}><option>BRRNY</option><option${state.rfqBasis==="현재가"?" selected":""}>현재가</option></select></div><div class="field"><label>TTL</label><select data-rfq-ttl${disabled}><option value="30">30s</option><option value="60"${state.rfqTtl===60?" selected":""}>1m</option></select></div></div>`;
  }

  function etfCardRequest() {
    return state.etfCardRequestId?state.activeRfqs.find(item=>item.id===state.etfCardRequestId)||null:null;
  }

  /* 코인 카드와 같은 요청 카드. 수락과 취소만 ETF 경로의 액션으로 바꿔 넘긴다. */
  function etfRequestCard(rfq) {
    if(rfq.fill){
      const actions=`<div class="rfq-card-actions">${btn("새 요청","reset-rfq-ticket","ghost","",'data-target="etf"')}${btn("Portfolio로","go-blotter","primary","arrow")}</div>`;
      return fillSummary(rfq.fill,actions);
    }
    const accepted=new Map((rfq.acceptances||[]).map(entry=>[entry.vendorId,entry]));
    const rejected=new Map((rfq.rejections||[]).map(entry=>[entry.vendorId,entry]));
    const responses=rfq.vendorIds.map(vendorId=>{
      const entry=accepted.get(vendorId)||rejected.get(vendorId)||null;
      return {
        vendorId,
        status:accepted.has(vendorId)?"수락":rejected.has(vendorId)?"거절":"대기",
        price:accepted.has(vendorId)?accepted.get(vendorId).allIn:null,
        at:entry?entry.at:null
      };
    });
    const request={id:rfq.id,side:rfq.side,responses,ttlLabel:ttlLabel(rfq.initialTtl||rfq.ttl||30)};
    return rfqRequestCard(request,{
      priceText:value=>formatTradePrice(value),
      acceptAction:"accept-ap-quote",
      cancelAction:"cancel-ap-rfq",
      extraAttrs:` data-rfq="${rfq.id}"`,
      countdown:`<time class="countdown num" data-rfq-ttl="${rfq.id}">${rfq.ttl!==null?`00:${String(Math.max(0,rfq.ttl)).padStart(2,"0")}`:"--:--"}</time>`
    });
  }

  function etfRfqBody(facts,underlying,editable,disabled) {
    const draft=state.apOrderDraft;
    const request=etfCardRequest();
    if(request)return etfRequestCard(request);
    const ready=canCreateRfq()&&editable;
    const submit=`<button class="trade-submit ${draft.side==="creation"?"buy":"sell"}" type="button" data-action="create-ap-rfq"${ready?"":" disabled"}>요청</button>`;
    return `${orderAccountField()}${etfSideToggle(disabled)}${etfQuantityBlock(facts,underlying,disabled)}<div class="cu-warning" data-cu-warning ${isWholeCu()?"hidden":""}><span>주의</span><div><strong>CU 비배수 주수</strong><small>${facts.cuShares.toLocaleString("ko-KR")}주 단위 정렬 필요</small></div>${btn("CU로 반올림","round-order-cu","small warning","",editable?"":"disabled")}</div><div class="field"><label>벤더</label>${vendorPickList(state.vendorQuotes,draft.vendorIds,"order-vendor",editable)}</div>${etfBasisRow(disabled)}${submit}`;
  }

  /* 자체 탭은 요청 벤더 없이 파라미터 한 열과 집행 버튼만 둔다. */
  function excludedVenueLabel(ids=state.apOrderDraft.excludedVenueIds||[]) {
    const labels=ids.map(id=>state.vendorQuotes.find(vendor=>vendor.id===id))
      .filter(Boolean).map(vendor=>vendor.name.replace(/ Prime$/,""));
    return labels.join(", ")||"없음";
  }

  function venueExclusionControl(param,editable) {
    const excluded=new Set(param.value||[]);
    const rows=state.vendorQuotes.map(vendor=>{
      const name=vendor.name.replace(/ Prime$/,"");
      return `<label class="venue-exclusion-option"><input type="checkbox" data-order-venue-exclusion value="${vendor.id}"${excluded.has(vendor.id)?" checked":""}${editable?"":" disabled"}><span class="lpsq ${excluded.has(vendor.id)?"ck":""}"></span>${name}</label>`;
    }).join("");
    return `<details class="venue-exclusion-menu"><summary><span data-excluded-venue-label>${excludedVenueLabel([...excluded])}</span><i aria-hidden="true">▾</i></summary><div class="venue-exclusion-list">${rows}</div></details>`;
  }

  function etfAlgoBody(facts,underlying,editable,disabled) {
    const lockReason=typeof MP.executionParamsLockReason==="function"?MP.executionParamsLockReason():"";
    const rows=MP.orderModeParams({draft:state.apOrderDraft}).map(param=>{
      const disabled=editable?"":" disabled";
      let control;
      if(Array.isArray(param.options))control=`<select data-order-param="${param.key}" ${param.field?`data-ticket-execution-window="${param.field}"`:`data-ticket-order-param="${param.key}"`}${disabled}>${param.options.map(option=>`<option value="${option.value}"${String(option.value)===String(param.rawValue)?" selected":""}>${option.label}</option>`).join("")}</select>`;
      else if(param.control==="number")control=`<input class="num" type="number" value="${param.value}" min="${param.min}"${param.max?` max="${param.max}"`:""} step="${param.step}" placeholder="${param.placeholder}" data-ticket-order-param="${param.key}"${disabled}>`;
      else if(param.control==="venue-multi")control=venueExclusionControl(param,editable);
      else control=`<input value="${param.value}" readonly>`;
      return `<div class="field order-param"><label>${param.label}</label>${control}</div>`;
    }).join("");
    return `${orderAccountField()}${etfSideToggle(disabled)}${etfQuantityBlock(facts,underlying,disabled)}<div class="etf-param-list">${rows}</div>${btn("집행","instruct-ap-algo","block primary","arrow",canCreateRfq()&&editable?"":"disabled")}`;
  }

  function etfModeTabs(active,editable) {
    return `<div class="tabs compact etf-mode-tabs">${[["rfq","RFQ 릴레이"],["algo","자체"]]
      .map(([id,label])=>`<button type="button" class="${active===id?"active":""}" data-action="order-mode" data-mode="${id}"${editable?"":" disabled"}>${label}</button>`).join("")}</div>`;
  }

  function etfTicketSection() {
    const draft=state.apOrderDraft;
    const etf=selectedEtf();
    const received=pdfRecord(etf);
    const facts=pdfFacts(received);
    const underlying=underlyingOf(etf,received);
    const editable=ticketEditable();
    const disabled=editable?"":" disabled";
    const mode=draft.orderMode==="algo"?"algo":"rfq";
    const source=draft.source==="client-portal"?`<div class="source-badge-line">${chip("고객사 블록 주문 연동","violet")}</div>`:"";
    const missing=received?"":`<div class="inline-warning"><span>주의</span><div><strong>PDF 수신 확인 필요</strong><small>${etf.name} 기준일 납입 내역 없음, 등록본 관리는 시스템 관리 소관</small></div></div>`;
    const body=mode==="algo"?etfAlgoBody(facts,underlying,editable,disabled):etfRfqBody(facts,underlying,editable,disabled);
    return `${source}<div class="field"><label>ETF</label><select data-order-etf${disabled}>${etfOptions(etf.id)}</select></div>${missing}${etfModeTabs(mode,editable)}<div class="order-mode-panel">${body}</div>`;
  }

  function coinTicketSection(pair) {
    const request=state.tradeRfq&&state.tradeRfq.symbol===pair.symbol?state.tradeRfq:null;
    const mark=MP.pairMark(pair);
    const editable=ticketEditable();
    if(request)return `<div class="rfq-inline-head"><strong>${request.id}</strong><span>${request.side==="buy"?"매수":"매도"} ${MP.formatPairSize(pair,request.size)} ${pair.base}</span>${chip(request.status==="quoted"?"최우선가":request.status==="expired"?"만료":"응답 대기",request.status==="quoted"?"positive":"warning")}</div><div class="ticket-summary trade-order-summary"><div><span>기준 마크</span><strong class="num">${MP.formatPairPrice(pair,mark)}</strong></div><div class="align-right"><span>요청 벤더</span><strong class="num">${state.vendorQuotes.length}곳</strong></div></div>${btn("취소","cancel-trade-rfq","block ghost","",editable?"":"disabled")}`;
    return `<div class="trade-side-toggle"><button class="buy ${state.tradeSide==="buy"?"active":""}" type="button" data-action="trade-side" data-side="buy"${editable?"":" disabled"}>매수 / BUY</button><button class="sell ${state.tradeSide==="sell"?"active":""}" type="button" data-action="trade-side" data-side="sell"${editable?"":" disabled"}>매도 / SELL</button></div><div class="field"><label>수량</label><div class="input-suffix"><input id="trade-rfq-size" class="num" value="${pair.sizeText}"${editable?"":" disabled"}><span>${pair.base}</span></div></div><div class="ticket-summary trade-order-summary"><div><span>기준 마크</span><strong class="num">${MP.formatPairPrice(pair,mark)}</strong></div><div class="align-right"><span>요청 벤더</span><strong class="num">${state.vendorQuotes.length}곳</strong></div></div><button class="trade-submit ${state.tradeSide}" type="button" data-action="request-trade-rfq"${editable?"":" disabled"}>RFQ 요청</button>`;
  }

  /* ---------- receipt (PDF facts) ---------- */

  function componentTable(received,underlying) {
    const unitValueKrw=state.constants.btcFixingUsd*state.constants.usdKrw*received.btcPerCu;
    const totalValue=unitValueKrw+received.cashPerCuKrw;
    const rows=[
      {asset:`${underlying} 납입수량`,quantity:`${received.btcPerCu.toFixed(0)} ${underlying}`,value:unitValueKrw},
      {asset:"원화예금",quantity:"0원",value:0},
      {asset:"추정현금",quantity:`${received.cashPerCuKrw.toLocaleString("ko-KR")}원`,value:received.cashPerCuKrw}
    ];
    return `<div class="table-scroll"><table class="data-table pdf-component-table"><thead><tr><th>자산</th><th class="align-right">CU당 수량</th><th class="align-right">평가액</th><th class="align-right">비중</th></tr></thead><tbody>${rows.map(row=>`<tr><td class="main-cell">${row.asset}</td><td class="align-right num">${row.quantity}</td><td class="align-right num">${formatMoneyFromKrw(row.value)}</td><td class="align-right num" data-component-weight>${(row.value/totalValue*100).toFixed(2)}%</td></tr>`).join("")}</tbody><tfoot><tr><td class="main-cell">합계</td><td class="align-right"></td><td class="align-right num">${formatMoneyFromKrw(totalValue)}</td><td class="align-right num" data-component-total>100.00%</td></tr></tfoot></table></div>`;
  }

  function renderPdfPanel() {
    const draft=state.apOrderDraft;
    const etf=selectedEtf();
    const received=pdfRecord(etf);
    if(!received)return `<div class="pdf-tab-body"><div class="empty-note"><strong>PDF 수신 확인 필요</strong>자동 채움 기준 없음</div></div>`;
    const underlying=underlyingOf(etf,received);
    return `<div class="pdf-tab-body"><div class="pdf-summary-head"><div><span>펀드명 / 종목코드</span><strong>${etf.name}</strong><small>${etf.code}, 기준일 ${received.asofDate}</small></div>${chip(received.validationResult,"positive")}</div><div class="kv-grid pdf-kv"><div class="kv"><label>CU 단위</label><strong class="num">${received.cuShares.toLocaleString("ko-KR")}주</strong></div><div class="kv"><label>기초자산 / CU</label><strong class="num">${received.btcPerCu} ${underlying}</strong></div><div class="kv"><label>현금 / CU</label><strong class="num">${formatMoneyFromKrw(received.cashPerCuKrw)}</strong></div><div class="kv"><label>NAV / 주</label><strong class="num">${formatMoneyFromKrw(received.navPerShareKrw)}</strong></div><div class="kv"><label>발행좌수</label><strong class="num">${received.issuedShares.toLocaleString("ko-KR")}좌</strong></div><div class="kv"><label>선택 벤더</label><strong class="num"><b data-selected-vendors>${draft.vendorIds.length}</b>곳</strong></div></div><div class="pdf-detail-section"><p class="section-label">구성내역, CU 1단위</p>${componentTable(received,underlying)}</div><div class="conversion-chain"><span>환산 사슬</span><strong class="num" data-order-chain>${conversionChainText()}</strong><small>픽싱 ${formatMoneyFromUsd(state.constants.btcFixingUsd)}, USD/KRW ${state.constants.usdKrw.toLocaleString("ko-KR")}</small></div><div class="pdf-source-row"><span>출처 운용사 배포본</span><span class="num">${received.fileName}</span><span class="num">수신 ${received.receivedAt}</span><span class="pdf-source-link">시스템 &gt; ETF 등록</span></div><p class="order-card-note">원화예금은 이번 단계에서 미모델이며 항상 0으로 표기됨.</p></div>`;
  }

  /* ---------- relay section ---------- */

  function rfqSelect(selectedId) {
    const rows=MP.deskScopeRfqs();
    if(!rows.length)return `<div class="empty-note"><strong>생성된 RFQ 없음</strong></div>`;
    const options=rows.map(rfq=>`<option value="${rfq.id}" ${rfq.id===selectedId?"selected":""}>${rfq.id}, ${rfq.status}, ${rfq.side} ${numberValue(rfq.quantity,4)}</option>`).join("");
    return `<div class="field relay-rfq-field"><label>진행 중 RFQ</label><select data-ap-rfq>${options}</select></div>`;
  }

  /* 체결 근거 한 벌: 익명 벤더 표기, 체결가, 수량, 시각, RFQ 식별자, 주문번호, 정산 사이클. */
  function fillSummary(fill,link="") {
    const priceLabel=Number.isFinite(fill.clientPriceUsd)?"고객 제시가 체결":"All-in 체결";
    const headline=Number.isFinite(fill.clientPriceUsd)?"고객 제시가 체결":`${fill.vendorLabel} 견적 체결`;
    return `<div class="accepted-quote filled"><strong class="positive-text">${headline}</strong><span class="num">${priceLabel} ${formatTradePrice(fill.priceUsd)}</span><div class="fill-facts"><small>${fill.side} ${numberValue(fill.quantity,4)} ${fill.asset}, 체결 ${fill.at}</small><small class="num">${fill.rfqId}, ${fill.orderId}</small><small>벤더 ${fill.vendorLabel}, 올인가 ${formatTradePrice(fill.allInUsd)}</small><small>정산 ${fill.cycle}</small></div>${link}</div>`;
  }

  function relayStatusChip(rfq,accepted,requested) {
    if(rfq.status==="체결 완료")return chip("체결 완료","positive");
    if(rfq.status==="픽싱 대기")return chip("수락 완료","positive");
    if(rfq.status==="만료")return chip("만료","muted");
    if(rfq.status==="취소")return chip("취소","muted");
    return accepted>=requested?chip("전 벤더 수락","positive"):chip("수신 중","info");
  }

  function algoProgressBody(rfq) {
    const target=state.executionTarget;
    const filled=state.executionFilled;
    const percent=target>0?Math.min(100,filled/target*100):0;
    return `<div class="execution-progress"><div class="execution-stat"><label>목표 수량</label><strong class="num">${target.toFixed(4)} ${underlyingOf()}</strong></div><div class="execution-stat"><label>체결 수량</label><strong class="num positive-text" data-execution-filled>${filled.toFixed(4)} ${underlyingOf()}</strong></div><div class="execution-stat"><label>진행률</label><strong class="num" data-execution-percent>${percent.toFixed(1)}%</strong>${progress(percent,"info")}</div></div><p class="order-card-note">${rfq?`${rfq.id}, ${rfq.mode}`:"집행 지시 대기"}</p>${btn("집행 모니터","go-execution","primary","arrow")}`;
  }

  function coinRelayBody(pair) {
    const request=state.tradeRfq&&state.tradeRfq.symbol===pair.symbol?state.tradeRfq:null;
    const requested=state.vendorQuotes.length;
    if(!request)return `<div class="empty-note"><strong>RFQ 요청 대기</strong>라이브 릴레이 없음</div>`;
    if(request.status==="expired")return `<div class="relay-head"><div class="relay-summary"><strong class="num">0/${requested}</strong><span>벤더 수락</span></div>${chip("만료","muted")}</div><p class="order-card-note">Firm 유효시간 종료. 자동 재요청 없음.</p>`;
    if(request.status!=="quoted")return `<div class="relay-head"><div class="relay-summary"><strong class="num">0/${requested}</strong><span>벤더 수락</span></div>${chip("수신 중","info")}</div><div class="empty-note"><strong>벤더 응답 대기</strong>${requested}곳 요청, ${request.requestedAt} 전송</div>`;
    const best=request.quotes[0];
    const seconds=Math.max(0,Math.ceil((request.expiresAt-Date.now())/1000));
    return `<div class="relay-head"><div class="relay-summary"><strong class="num">${request.quotes.length}/${requested}</strong><span>벤더 수락</span></div>${chip("최우선가","positive")}<strong class="countdown num" data-trade-rfq-countdown>${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}</strong></div><div class="relay-price-grid"><div class="kv"><label>익명 Firm 올인가</label><strong class="num">${MP.formatPairPrice(pair,best.allIn)}</strong></div><div class="kv"><label>예상 명목</label><strong class="num">${MP.formatPairMoney(pair,best.allIn*request.size)}</strong></div></div><div class="relay-rows"><article class="relay-row best"><strong>익명 최우선 ${chip("BEST","positive")}</strong><span class="num">${MP.formatPairPrice(pair,best.allIn)}</span><small class="num">${request.requestedAt}</small><div class="align-right">${btn("수락","accept-trade-rfq","small","check",`data-vendor="${best.id}"${quoteAcceptAttrs()}`)}</div></article></div>${quoteAcceptEditable()?"":`<p class="order-card-note">${QUOTE_ACCEPT_REASON}</p>`}`;
  }

  /* ---------- client coin ticket and relay ---------- */

  function clientTicketNotionalKrw(pair,size) {
    return MP.pairNotionalKrw(pair,MP.pairMark(pair),size);
  }

  function clientCoinTicketSection(pair) {
    const ticket=state.clientTradeTicket;
    const editable=ticketEditable();
    const disabled=editable?"":" disabled";
    const company=MP.clientScopeCompany();
    const account=MP.clientScopeAccount();
    const mark=MP.pairMark(pair);
    const feeBps=MP.clientScopeFeeBps();
    const notionalKrw=clientTicketNotionalKrw(pair,ticket.size);
    const vendorCount=MP.clientScopeVendorIds().length;
    const cap=MP.clientScopeCapBtc();
    const ttlOptions=[[30,"30s"],[60,"60s"],[300,"5m"]]
      .map(([value,label])=>`<option value="${value}" ${ticket.ttl===value?"selected":""}>${label}</option>`).join("");
    const side=`<div class="field"><label>방향</label><div class="trade-side-toggle"><button class="buy ${state.tradeSide==="buy"?"active":""}" type="button" data-action="trade-side" data-side="buy"${disabled}>매수 / BUY</button><button class="sell ${state.tradeSide==="sell"?"active":""}" type="button" data-action="trade-side" data-side="sell"${disabled}>매도 / SELL</button></div></div>`;
    const rows=`${side}
      <div class="field"><label>집행 계정</label><input value="${account?MP.accountLabel(account.id):"미배정"}" readonly></div>
      <div class="field"><label>수량</label><div class="input-suffix"><input id="client-rfq-size" class="num" value="${MP.formatPairSize(pair,ticket.size)}"${disabled}><span>${pair.base}</span></div></div>
      <div class="field"><label>기준 마크</label><input class="num" value="${MP.pairInputValue(pair,mark)}" readonly><small class="field-note">${pair.quote}</small></div>
      <div class="field"><label>거래당 상한</label><input class="num" value="${MP.formatPairSize(pair,cap)}" readonly><small class="field-note">${pair.base}, 조회 전용</small></div>
      <div class="field"><label>요청 벤더</label><input value="${vendorCount}곳" readonly><small class="field-note">익명 표기, 고객 선택 없음</small></div>
      <div class="field"><label>계약 요율</label><input class="num" value="${feeBps} bp" readonly><small class="field-note">명목 ${formatMoneyFromKrw(notionalKrw)} 기준 ${formatMoneyFromKrw(Math.round(notionalKrw*feeBps/10000))}</small></div>
      <div class="field"><label>TTL</label><select data-client-ttl${disabled}>${ttlOptions}</select></div>
      <div class="field"><label>결제</label><input value="일일 정산 사이클(17:00)" readonly></div>`;
    const modeTabs=MP.renderOrderModeTabs({
      mode:ticket.mode==="algo"?"algo":"rfq",
      modes:company?company.modes:["RFQ","알고"],
      action:"client-trade-mode",
      editable,
      surface:"client",
      rfqBody:"",
      algoBody:"",
      rfqNotes:[],
      algoNotes:[],
      params:MP.orderModeParams()
    });
    const notional=`<div class="ticket-summary order-notional"><div><span>명목, 마크업 전</span><strong class="num">${formatMoneyFromKrw(notionalKrw)}</strong></div></div>`;
    const submit=ticket.mode==="algo"
      ?btn("알고 집행 지시","instruct-client-algo","block primary","arrow",editable?"":"disabled")
      :btn("RFQ 생성","create-client-rfq","block primary","arrow",editable?"":"disabled");
    return `${rows}${notional}<p class="section-label">집행 모드</p>${modeTabs}${submit}`;
  }

  function clientRelayBody() {
    const rfq=MP.clientLatestRfq();
    if(!rfq)return '<div class="empty-note"><strong>RFQ 생성 대기</strong>라이브 릴레이 없음</div>';
    const requested=rfq.vendorIds.length;
    const entries=acceptedEntries(rfq);
    const best=bestAcceptedEntry(rfq);
    const accepted=entries.length;
    const editable=ticketEditable();
    const head=`<div class="relay-head"><div class="relay-summary"><strong class="num"><b data-relay-count>${accepted}</b>/${requested}</strong><span>벤더 수락</span></div>${chip("벤더 익명화 적용","muted")}${relayStatusChip(rfq,accepted,requested)}<strong class="countdown num" data-rfq-ttl="${rfq.id}">${rfq.ttl!==null?`00:${String(Math.max(0,rfq.ttl)).padStart(2,"0")}`:"--:--"}</strong></div>`;
    if(rfq.fill)return `${head}${fillSummary(rfq.fill,btn("Portfolio로","go-blotter","primary","arrow"))}`;
    const summary=best
      ?`<div class="relay-price-grid"><div class="kv"><label>베스트 올인가</label><strong class="num" data-relay-best>${formatTradePrice(best.allIn)}</strong></div><div class="kv"><label>고객 제시가</label><strong class="num" data-relay-client>${formatTradePrice(clientPriceUsd(rfq,best.allIn))}</strong></div><div class="kv"><label>최종 수신</label><strong class="num">${entries[entries.length-1].at}</strong></div></div>`
      :`<div class="empty-note"><strong>벤더 응답 대기</strong>${requested}곳 요청, 수락 도착 대기</div>`;
    const accept=best&&rfq.status==="견적 수신"
      ?btn(`고객 제시가 수락, ${formatTradePrice(clientPriceUsd(rfq,best.allIn))}`,"accept-client-quote","block primary","check",`data-rfq="${rfq.id}"${editable?"":" disabled"}`)
      :"";
    const expired=rfq.status==="만료"?'<p class="order-card-note">TTL 만료로 종결됨. 자동 재요청 없음, 신규 RFQ 생성 필요.</p>':"";
    const rule='<p class="order-card-note">고객이 수락하는 값은 벤더 올인가가 아니라 마크업이 실린 고객 제시가임.</p>';
    return `${head}${summary}${accept}${expired}${rule}`;
  }

  /* ---------- client ETF block ticket (D-0910-10) ----------
     보류된 `client-portal`이 단독으로 갖고 있던 접수부, CU 제시가, 알고 비용을 고객 트레이드
     티켓의 주문 종류 하나로 옮긴 것이다. CU 산출식과 수락 경로는 포털이 쓰던 것을 그대로 쓴다. */

  function blockCompany() {
    return (clientScope()?MP.clientScopeCompany():null)||MP.portalClient()||state.clients[0];
  }

  function blockEtf() {
    return state.etfs.find(item=>item.id===state.clientPortal.etfId)||state.etfs[0];
  }

  function blockFeeBps() {
    return clientScope()?MP.clientScopeFeeBps():MP.portalFeeBps();
  }

  const priceBasisOptions=[["nav","NAV + bp"],["inav","iNAV + 스프레드"]];

  function priceBasisLabel(basis=state.clientPortal.priceBasis) {
    return (priceBasisOptions.find(([key])=>key===basis)||priceBasisOptions[0])[1];
  }

  function priceBasisNote() {
    const received=state.pdfUploads[blockEtf().id];
    const feeBps=blockFeeBps();
    return state.clientPortal.priceBasis==="inav"
      ? `자체 iNAV ${formatMoneyFromKrw(state.constants.ownInavKrw)} / 주 대비 스프레드 ${feeBps}bp`
      : `PDF NAV ${formatMoneyFromKrw(received?received.navPerShareKrw:0)} / 주 대비 ${feeBps}bp`;
  }

  function clientBlockTicketBody() {
    const portal=state.clientPortal;
    const company=blockCompany();
    const etf=blockEtf();
    const editable=ticketEditable();
    const open=editable?"":" disabled";
    const submitLock=editable?"":"disabled";
    const custodian=(company.custodyVendors||[])[0]||"미지정";
    const side=`<div class="field"><label>방향</label><div class="portal-side-toggle"><button type="button" class="${portal.side==="creation"?"active creation":""}" data-action="client-side" data-side="creation"${open}>매수</button><button type="button" class="${portal.side==="redemption"?"active redemption":""}" data-action="client-side" data-side="redemption"${open}>매도</button></div></div>`;
    const etfField=`<div class="field"><label>ETF</label><select data-client-order-etf${open}>${etfOptions(etf.id)}</select><small class="field-note">${etf.code}, 1 CU = ${state.constants.cuShares.toLocaleString("ko-KR")}주</small></div>`;
    const quantity=`<div class="field-grid"><div class="field"><label>CU</label><input class="num" inputmode="decimal" value="${numberValue(portal.cu,4)}" data-client-block-quantity="cu"${open}></div><div class="field"><label>주수</label><div class="input-suffix"><input class="num" inputmode="decimal" value="${numberValue(portal.shares,0)}" data-client-block-quantity="shares"${open}><span>주</span></div></div></div>`;
    const basis=`<div class="field"><label>가격 기준</label><select data-client-price-basis${open}>${priceBasisOptions.map(([key,label])=>`<option value="${key}" ${portal.priceBasis===key?"selected":""}>${label}</option>`).join("")}</select><small class="field-note">${priceBasisNote()}</small></div>`;
    const rest=`<div class="field-grid"><div class="field"><label>명목, 마크업 전</label><input class="num" value="${formatMoneyFromKrw(portal.amountKrw)}" readonly></div><div class="field"><label>결제</label><input value="KSD 계좌 대체 인도" readonly><small class="field-note">코인 레그 화이트리스트 ${custodian}</small></div></div>`;
    const note=`<p class="order-card-note">ETF 블록 주문의 인도는 ETF 좌수의 KSD 계좌 대체이며 코인 인도가 아님. 기초자산 ${portal.btc.toFixed(4)} ${etf.underlying||"BTC"} 분해는 프라임 내부 레그.</p>`;

  /* ---------- card ---------- */

  function cardEditable() {
    return MP.accessFor&&MP.accessFor("trade")==="E";
  }

  /* ---------- 계정 선택 ----------
     주문 티켓 5종이 `state.orderAccountId` 한 값을 함께 쓴다. 목록은 행위 주체의 세 서브계정,
     즉 데스크 역할이면 메리츠 증권의 것, 고객 역할이면 그 고객사의 것이다. 값이 지금 목록에
     없으면 기본값으로 풀리므로 역할이나 보유 주체가 바뀌면 자동으로 되돌아간다. */

  function orderAccountHolder() {
    return clientScope()?MP.clientScopeCompany():MP.internalClient();
  }

  function orderAccountOptions() {
    const holder=orderAccountHolder();
    const ids=holder&&Array.isArray(holder.primeAccountIds)?holder.primeAccountIds:[];
    return ids.map(id=>state.primeAccounts.find(item=>item.id===id)).filter(Boolean);
  }

  /* ETF 설정/환매 티켓의 기본값은 종전대로 북에 걸린 Prime 계정이며, 그 계정이 행위 주체의
     것이 아니면(타사 북) 주체의 PRIME_A 로 내려간다. 나머지 티켓의 기본값은 PRIME_A. */
  function orderAccountDefaultId() {
    const options=orderAccountOptions();
    if(!options.length)return null;
    if(!clientScope()&&state.orderCardMode==="etf"){
      const bookAccountId=cardPrimeAccountId(state.apOrderDraft.etfId);
      if(bookAccountId&&options.some(account=>account.id===bookAccountId))return bookAccountId;
    }
    return (options.find(account=>account.label==="PRIME_A")||options[0]).id;
  }

  function orderAccountId() {
    const options=orderAccountOptions();
    if(!options.length){state.orderAccountId=null;return null;}
    if(!state.orderAccountId||!options.some(account=>account.id===state.orderAccountId))state.orderAccountId=orderAccountDefaultId();
    return state.orderAccountId;
  }

  function orderAccountField() {
    const options=orderAccountOptions();
    if(!options.length)return `<div class="field order-account-field"><label>계정</label><input value="미배정" readonly></div>`;
    const selected=orderAccountId();
    const disabled=ticketEditable()?"":" disabled";
    const rows=options.map(account=>`<option value="${account.id}"${account.id===selected?" selected":""}>${MP.accountLabel(account.id)}</option>`).join("");
    return `<div class="field order-account-field"><label>계정</label><select data-order-account${disabled}>${rows}</select></div>`;
  }

  function tradingAccount() {
    const selected=state.primeAccounts.find(item=>item.id===orderAccountId());
    if(selected)return selected;
    if(clientScope())return MP.clientScopeAccount();
    const id=MP.deskExecuteAccountIds()[0]||MP.primeAccountIdForBook(state.deskSourcingBookId);
    return state.primeAccounts.find(item=>item.id===id)||null;
  }

  function liveBalance(asset) {
    const account=tradingAccount();
    return account?.liveBalances.find(item=>item.asset===asset)?.quantity||0;
  }

  /* 포지션은 계정별로 시드된 `state.tradePositions` 에서 읽는다. 시드가 없는 계정은 0. */
  function cardPosition(pair) {
    /* D-0915: tradePositions 는 계정/페어 2단 맵이라 MP.tradePositionFor 로 읽는다.
       예전 배열 가정은 항상 거짓이라 카드가 포트폴리오와 다른 수량을 보여줬다. */
    return MP.tradePositionFor(pair.symbol,orderAccountId())?.size||0;
  }

  function orderCardTabs() {
    const mode=state.orderCardMode;
    const pro=["twap","rfq","etf"].includes(mode);
    const proLabel=pro?`${mode==="twap"?"TWAP":mode==="rfq"?"RFQ":"ETF 설정/환매"} ▾`:"Pro ▾";
    const options=[["twap","TWAP"],["rfq","RFQ"]];
    if(MP.isDeskRole())options.push(["etf","ETF 설정/환매"]);
    return `<div class="order-card-tabs"><button type="button" class="${mode==="market"?"active":""}" data-action="order-card-mode" data-mode="market">Market</button><button type="button" class="${mode==="limit"?"active":""}" data-action="order-card-mode" data-mode="limit">Limit</button><div class="pro-tab-wrap"><button type="button" class="${pro?"active":""}" data-action="open-pro-menu" aria-expanded="${state.orderCardProOpen}">${proLabel}</button>${state.orderCardProOpen?`<div class="pro-menu">${options.map(([id,label])=>`<button type="button" data-action="order-card-mode" data-mode="${id}">${label}</button>`).join("")}</div>`:""}</div></div>`;
  }

  function sideButtons() {
    return `<div class="trade-side-toggle"><button class="buy ${state.tradeSide==="buy"?"active":""}" type="button" data-action="trade-side" data-side="buy">매수</button><button class="sell ${state.tradeSide==="sell"?"active":""}" type="button" data-action="trade-side" data-side="sell">매도</button></div>`;
  }

  function unitSelect(pair) {
    return `<select class="order-unit-select" data-order-unit><option value="base"${state.orderUnit==="base"?" selected":""}>${pair.base}</option><option value="quote"${state.orderUnit==="quote"?" selected":""}>${pair.quote}</option></select>`;
  }

  function quantityBase(pair) {
    const raw=Number(state.orderSize)||0;
    return state.orderUnit==="quote"?raw/MP.pairMark(pair):raw;
  }

  function availableBalanceText(pair) {
    return `${MP.fixedNumber(liveBalance(pair.base),pair.sizeDigits)} ${pair.base}`;
  }

  function positionText(pair) {

  function commonBalances(pair) {

  /* 계정을 바꾸면 전체 재렌더 없이 잔고와 포지션 두 줄만 다시 읽고, 슬라이더 100% 기준이
     새 잔고를 따르도록 현재 수량의 비율을 다시 계산한다. */
  function syncOrderAccountRows() {
    const pair=MP.currentPair();
    document.querySelectorAll("[data-order-available]").forEach(node=>{node.textContent=availableBalanceText(pair);});
    document.querySelectorAll("[data-order-position]").forEach(node=>{node.textContent=positionText(pair);});
    state.orderPercent=orderPercentFromSize(state.orderSize);
    syncOrderSlider();
  }

  function defaultOrderTradeCap(pair,holder) {
    const btcCap=holder?.perTradeBtcCap;
    if(pair.base==="BTC")return Number.isFinite(btcCap)?btcCap:(state.riskSettings.clientPerTradeBtcCapDefault||50);
    if(pair.base==="ETH")return (Number.isFinite(btcCap)?btcCap:50)*15;
    if(pair.base==="SOL")return 5000;
    if(pair.base==="XRP")return 500000;
    if(pair.base==="USDT")return 1000000;
    if(pair.category==="tk-Stock")return 10000;
    if(pair.category==="tk-Bond")return 50000;
    return 100000;
  }

  function orderTradeCap(pair=MP.currentPair()) {
    const holder=orderAccountHolder();
    const pairCap=holder?.perTradeCaps?.[pair.symbol];
    return Number.isFinite(pairCap)?pairCap:defaultOrderTradeCap(pair,holder);
  }

  /* 매수는 행위 주체의 페어별 거래 상한, 매도는 선택 계정의 기준 자산 잔고를 100%로 삼는다.
     드래그는 input 이벤트로 수량을 바로 갱신하고, 직접 입력은 같은 환산식으로 역산한다. */
  function orderAvailableBalance() {
    const pair=MP.currentPair();
    return state.tradeSide==="buy"?orderTradeCap(pair):liveBalance(pair.base);
  }

  function orderSizeFromPercent(percent) {
    const pair=MP.currentPair();
    const mark=MP.pairMark(pair)||1;
    let size=orderAvailableBalance()*(Number(percent)||0)/100;
    if(state.orderUnit==="quote")size*=mark;
    return Number(size.toFixed(pair.sizeDigits));
  }

  function orderPercentFromSize(size) {
    const pair=MP.currentPair();
    const mark=MP.pairMark(pair)||1;
    const available=orderAvailableBalance();
    if(!(available>0))return 0;
    let baseSize=Number(size)||0;
    if(state.orderUnit==="quote")baseSize/=mark;
    return Math.max(0,Math.min(100,Math.round(baseSize/available*100)));
  }

  function amountField(pair,label="수량",options={}) {
    const capNote=state.tradeSide==="buy"?`<small class="field-note">거래 상한 ${MP.formatPairSize(pair,orderTradeCap(pair))} ${pair.base}</small>`:"";
    const slider=options.slider===false
      ?""
      :`<div class="order-slider"><input class="trade-range" type="range" min="0" max="100" step="1" value="${state.orderPercent}" data-order-percent style="--range-fill:${state.orderPercent}%"><output class="num" data-order-percent-label>${state.orderPercent}%</output></div>`;
    return `<div class="field"><label>${label}</label><div class="input-suffix order-amount"><input id="trade-order-size" class="num" inputmode="decimal" value="${state.orderSize}">${unitSelect(pair)}</div>${capNote}</div>${slider}`;
  }

  }

  function syncOrderSizeInput() {

    if(input)input.value=state.orderSize;

  function orderSummary(pair) {

    const price=state.orderCardMode==="limit"?(state.orderLimitPrice||MP.pairMark(pair)):MP.pairMark(pair);
    return `<div class="ticket-summary trade-order-summary"><div><span>주문 금액</span><strong class="num" data-estimated-notional>${MP.formatPairMoney(pair,base*price)}</strong></div><div class="align-right"><span>수수료</span><strong class="num">0.0150%</strong></div></div>`;

  function submitButton(pair,action="submit-trade-order",label=null) {

    return `${orderAccountField()}${sideButtons()}${commonBalances(pair)}${priceField}${amountField(pair)}${submitButton(pair)}${orderSummary(pair)}`;
